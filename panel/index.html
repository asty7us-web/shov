var k=JSON.parse(localStorage.getItem('pan.dk')||'null');if(k&&k.r==='fin'){document.documentElement.dataset.role='fin';document.getElementById('mf').href='manifest-fin.webmanifest'}}catch(e){}})()</script>
<style>
/* «Панель» — дашборд панелей ВБ / Озон / ЯМ (Андрей 12.11.2026: «идеально всё видеть, с мобильного не хуже десктопа, всё плавное, уровень Эпл»).
   Данные — panel_sayt\sbor.py (расчёт по сырым листам панелей, сверка с листом SKU). Шапка сервисов — servisy\svc.py. */
:root{
  --bg:#f2f2f7;--card:#ffffff;--card2:#f7f7fa;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.08);
  --ink:#0b0b0f;--ink2:#55555e;--ink3:#8e8e96;--line:rgba(60,60,67,.12);--line2:rgba(60,60,67,.07);
  --hdr:rgba(246,246,250,.88);--acc:#0a6cff;--acc-soft:rgba(10,108,255,.11);--on-acc:#fff;
  --good:#16904a;--warn:#c26a00;--bad:#d92d3a;--good-soft:rgba(31,157,85,.13);--warn-soft:rgba(217,119,6,.14);--bad-soft:rgba(229,56,59,.11);
  --bar:#d3d3da;--bar2:#b9b9c2;--thumb:#fff;
  --oz:#005bff;--wb:#b434e8;--ym:#f0a000;
  --c1:#8e9aaf;--c2:#a78bfa;--c3:#60a5fa;--c4:#f59e0b;--c5:#f472b6;--c6:#34d399;--c7:#94a3b8;
  --sh1:0 1px 1px rgba(0,0,0,.03),0 2px 8px rgba(0,0,0,.04);--sh2:0 2px 4px rgba(0,0,0,.04),0 18px 44px -12px rgba(0,0,0,.2);
  --r:20px;--ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tabh:56px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  --bg:#000000;--card:#1c1c1e;--card2:#242426;--fill:rgba(120,120,128,.26);--fill2:rgba(120,120,128,.17);
  --ink:#f5f5f7;--ink2:#b9b9c0;--ink3:#8e8e93;--line:rgba(255,255,255,.11);--line2:rgba(255,255,255,.07);
  --hdr:rgba(16,16,18,.78);--acc:#3d8bff;--acc-soft:rgba(61,139,255,.2);--on-acc:#fff;
  --good:#32d74b;--warn:#ff9f0a;--bad:#ff5a5f;--good-soft:rgba(50,215,75,.16);--warn-soft:rgba(255,159,10,.17);--bad-soft:rgba(255,90,95,.17);
  --bar:#3a3a3f;--bar2:#55555c;--thumb:#636366;--oz:#4d8dff;--wb:#cf7bff;--ym:#ffc23d;
  --sh1:0 1px 1px rgba(0,0,0,.3);--sh2:0 2px 6px rgba(0,0,0,.35),0 22px 54px -16px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1c1c1e;--card2:#242426;--fill:rgba(120,120,128,.26);--fill2:rgba(120,120,128,.17);
  --ink:#f5f5f7;--ink2:#b9b9c0;--ink3:#8e8e93;--line:rgba(255,255,255,.11);--line2:rgba(255,255,255,.07);
  --hdr:rgba(16,16,18,.78);--acc:#3d8bff;--acc-soft:rgba(61,139,255,.2);--on-acc:#fff;
  --good:#32d74b;--warn:#ff9f0a;--bad:#ff5a5f;--good-soft:rgba(50,215,75,.16);--warn-soft:rgba(255,159,10,.17);--bad-soft:rgba(255,90,95,.17);
  --bar:#3a3a3f;--bar2:#55555c;--thumb:#636366;--oz:#4d8dff;--wb:#cf7bff;--ym:#ffc23d;
  --sh1:0 1px 1px rgba(0,0,0,.3);--sh2:0 2px 6px rgba(0,0,0,.35),0 22px 54px -16px rgba(0,0,0,.7);color-scheme:dark}
/* «Космос» — свой вариант «Панели»: ночная орбита, звёзды рисует страница, музыку играет страница (без файлов) */
:root[data-theme="space"]{
  --bg:#04061a;--card:rgba(24,27,66,.62);--card2:rgba(34,38,88,.7);--fill:rgba(150,160,255,.17);--fill2:rgba(150,160,255,.1);
  --ink:#f1f2ff;--ink2:#b9bdea;--ink3:#8a8fc4;--line:rgba(170,180,255,.18);--line2:rgba(170,180,255,.1);
  --hdr:rgba(8,10,34,.66);--acc:#a996ff;--acc-soft:rgba(169,150,255,.2);--on-acc:#0b0a26;
  --good:#5ef2b0;--warn:#ffcf70;--bad:#ff8696;--good-soft:rgba(94,242,176,.15);--warn-soft:rgba(255,207,112,.16);--bad-soft:rgba(255,134,150,.16);
  --bar:rgba(160,170,255,.22);--bar2:rgba(160,170,255,.4);--thumb:rgba(169,150,255,.42);--oz:#7fa8ff;--wb:#e19bff;--ym:#ffd36b;
  --sh1:0 1px 0 rgba(255,255,255,.04) inset,0 8px 30px -14px rgba(0,0,0,.6);--sh2:0 24px 70px -18px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
html{scroll-padding-top:150px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;overflow-x:hidden;
  transition:background-color .4s var(--ease),color .4s var(--ease)}
html.noscroll,html.noscroll body{overflow:hidden}
a{color:var(--acc);text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num,td,.v{font-variant-numeric:tabular-nums}
.press{transition:transform .35s var(--spring),background-color .25s var(--ease),filter .25s,box-shadow .3s var(--ease)}
.press:active{transform:scale(.97);transition-duration:.12s}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:12px}
.mut{color:var(--ink2)}.mut3{color:var(--ink3)}
.up{color:var(--good)}.dn{color:var(--bad)}

/* шапка */
.top{position:relative;z-index:42;background:var(--hdr);backdrop-filter:saturate(1.8) blur(22px);-webkit-backdrop-filter:saturate(1.8) blur(22px);padding-top:env(safe-area-inset-top,0px)}
.bar{max-width:1320px;margin:0 auto;height:54px;padding:0 14px;display:flex;align-items:center;gap:8px}
.bar .sp{flex:1}
:root{--svc-card:var(--card);--svc-ink:var(--ink);--svc-ink2:var(--ink2);--svc-ink3:var(--ink3);--svc-line:var(--line);--svc-hover:var(--fill2);--svc-acc:var(--acc);--svc-acc-soft:var(--acc-soft)}
:root[data-theme="space"]{--svc-card:#171a44}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--svc-card:#2c2c2e}}
:root[data-theme="dark"]{--svc-card:#2c2c2e}
/*SVC:CSS*/
/* выбор сервиса (servisy\svc.py — править там): кнопка «значок + название ⌄», под ней список трёх сервисов */
.svc{position:relative;flex:none;min-width:0}
/* шрифт задаю обёртке, кнопка его наследует (button{font:inherit} страниц) — так темы Юнитки (.brand) и Склеек (.brand b) по-прежнему перекрашивают название */
:where(.svc){font:700 18px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em}
.svc-btn{display:inline-flex;align-items:center;gap:9px;height:40px;margin:0 0 0 -6px;padding:0 9px 0 5px;border:0;border-radius:13px;background:transparent;color:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;transition:background-color .2s ease,transform .4s cubic-bezier(.34,1.56,.64,1)}
.svc-btn .svc-nm{font:inherit;letter-spacing:inherit}
/* подложка — в цвет текста шапки (в игровых темах шапка цветная, а название белое) */
@media (hover:hover){.svc-btn:hover{background:var(--svc-hover);background:color-mix(in srgb,currentColor 13%,transparent)}}
.svc-btn:active{transform:scale(.95);transition-duration:.12s}
.svc-btn[aria-expanded="true"]{background:var(--svc-hover);background:color-mix(in srgb,currentColor 13%,transparent)}
.svc-btn .svc-ic{width:30px;height:30px;border-radius:9px}
.svc-chev{width:16px;height:16px;flex:none;opacity:.55;margin-left:-3px;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.svc-btn[aria-expanded="true"] .svc-chev{transform:rotate(180deg)}
/* значок (12.11, Андрей: «значок панели крутой, сделай для остальных свои»): тёмная плитка своего оттенка, яркая линия своего цвета,
   жёлтая точка; блик сверху, цветное свечение; при наведении и открытии — лёгкий наклон */
.svc-ic{display:grid;place-items:center;flex:none;position:relative;overflow:hidden;color:#fff;font-style:normal;line-height:1;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),inset 0 -2px 4px rgba(0,0,0,.14),0 3px 9px -2px var(--svc-glow,rgba(0,0,0,.3));
  transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.svc-ic::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 75% at 28% 6%,rgba(255,255,255,.55),rgba(255,255,255,0) 58%)}
.svc-ic svg{position:relative;width:66%;height:66%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.svc-ic.u{--svc-glow:rgba(110,235,130,.5);background:linear-gradient(145deg,#4a6b55 0%,#1e3226 52%,#0a130d 100%)}
.svc-ic.s{--svc-glow:rgba(190,140,255,.5);background:linear-gradient(145deg,#655690 0%,#2b2247 52%,#100c1d 100%)}
.svc-ic.k{--svc-glow:rgba(255,160,70,.5);background:linear-gradient(145deg,#80603f 0%,#3b2b1c 52%,#170f08 100%)}
.svc-ic.z{--svc-glow:rgba(100,185,255,.5);background:linear-gradient(145deg,#456690 0%,#1d2d47 52%,#0a111d 100%)}
.svc-ic.p{--svc-glow:rgba(30,34,48,.6);background:linear-gradient(145deg,#5b6275 0%,#262a36 52%,#0c0d12 100%)}
@media (hover:hover){.svc-btn:hover .svc-ic,.svc-it:hover .svc-ic{transform:rotate(-8deg) scale(1.06)}}
.svc-btn[aria-expanded="true"] .svc-ic{transform:rotate(-8deg) scale(1.06)}
.svc-menu.on .svc-it .svc-ic{animation:svc-ico .6s cubic-bezier(.34,1.56,.64,1) both}
.svc-menu.on .svc-it:nth-child(3) .svc-ic{animation-delay:.05s}.svc-menu.on .svc-it:nth-child(4) .svc-ic{animation-delay:.1s}.svc-menu.on .svc-it:nth-child(5) .svc-ic{animation-delay:.15s}.svc-menu.on .svc-it:nth-child(6) .svc-ic{animation-delay:.2s}
@keyframes svc-ico{from{transform:scale(.6) rotate(-20deg);opacity:0}}
.svc-menu{position:absolute;z-index:300;top:calc(100% + 8px);left:-6px;width:min(318px,calc(100vw - 20px));padding:6px;border-radius:20px;
  background:var(--svc-card);color:var(--svc-ink);box-shadow:0 0 0 .5px var(--svc-line),0 18px 50px -12px rgba(0,0,0,.34),0 4px 12px -4px rgba(0,0,0,.12);
  transform-origin:24px -6px;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.92);pointer-events:none;
  transition:opacity .16s ease,transform .26s cubic-bezier(.4,0,.6,1),visibility 0s linear .26s}
.svc-menu.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .2s ease,transform .5s cubic-bezier(.22,1.3,.36,1),visibility 0s}
.svc-menu.gone{transition:none!important;opacity:0!important;visibility:hidden!important}
.svc-cap{padding:9px 12px 6px;font:700 11px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--svc-ink3)}
.svc-it{position:relative;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;color:inherit;text-decoration:none;
  -webkit-tap-highlight-color:transparent;transition:background-color .2s ease,transform .35s cubic-bezier(.34,1.56,.64,1)}
.svc-it .svc-ic{width:42px;height:42px;border-radius:12px}
.svc-tx{min-width:0;flex:1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.svc-tx b{display:block;font-size:15.5px;font-weight:650;line-height:1.2;letter-spacing:-.005em}
.svc-tx small{display:block;margin-top:2px;font-size:12.5px;line-height:1.3;color:var(--svc-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.svc-it:hover{background:var(--svc-hover)}}
.svc-it:active{transform:scale(.97);background:var(--svc-hover);transition-duration:.1s}
.svc-it[aria-current]{background:var(--svc-acc-soft)}
.svc-it[aria-current] b{color:var(--svc-acc)}
.svc-ok{width:20px;height:20px;flex:none;color:var(--svc-acc)}
.svc-sp{width:18px;height:18px;flex:none;border-radius:50%;border:2.2px solid var(--svc-line);border-top-color:var(--svc-acc);opacity:0;transition:opacity .2s}
.svc-it.go .svc-sp{opacity:1;animation:svc-spin .7s linear infinite}
@keyframes svc-spin{to{transform:rotate(360deg)}}
.svc-menu.on .svc-it{animation:svc-row .5s cubic-bezier(.22,1.2,.36,1) both}
.svc-menu.on .svc-it:nth-child(3){animation-delay:.035s}.svc-menu.on .svc-it:nth-child(4){animation-delay:.07s}.svc-menu.on .svc-it:nth-child(5){animation-delay:.105s}.svc-menu.on .svc-it:nth-child(6){animation-delay:.14s}
@keyframes svc-row{from{opacity:0;transform:translateY(-6px)}}
/* выбор темы — как в Юнитке (Андрей 29.10: «как в юнитке выбор везде тем формат»): кнопка «значок + название темы», под ней список
   с кружками и группами «Весёлые» / «Спокойные». Юнитка рисует свой (он образец), Склейки и Конкуренты — svcPicker() отсюда */
.svt{position:relative;flex:none}
.svt-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border:1px solid var(--svc-line);border-radius:10px;
  background:var(--svc-card);color:var(--svc-ink2);font:600 13.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;white-space:nowrap;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.svt-btn:active{transform:scale(.94)}
.svt-btn svg{width:18px;height:18px;flex:none;display:block}
@media (max-width:860px){.svt-btn span{display:none}}
.svt-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:300;min-width:220px;max-height:calc(100vh - 100px);overflow:auto;padding:6px;border-radius:12px;
  background:var(--svc-card);color:var(--svc-ink);border:1px solid var(--svc-line);box-shadow:0 8px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;
  font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transform-origin:top right;animation:svt-in .24s cubic-bezier(.22,1,.36,1)}
.svt-menu[hidden]{display:none}
@keyframes svt-in{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.svt-menu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;font:inherit;display:flex;align-items:center;gap:10px;color:inherit;cursor:pointer;white-space:nowrap}
@media (hover:hover){.svt-menu button:hover{background:var(--svc-hover)}}
.svt-menu button[aria-checked="true"]{background:var(--svc-acc-soft);color:var(--svc-acc)}
.svt-menu .sw{width:20px;height:20px;flex:none;display:block}
.svt-menu .tgrp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--svc-ink3);padding:8px 10px 2px;border-top:1px solid var(--svc-line);margin-top:4px}
/* переход между сервисами: шапка и кнопка сервиса остаются на месте, остальное мягко проявляется */
@view-transition{navigation:auto}
.svc-hdr{view-transition-name:svc-hdr}
#svcBtn{view-transition-name:svc-btn}
::view-transition-group(svc-hdr),::view-transition-group(svc-btn){animation-duration:.42s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
::view-transition-group(svc-hdr){overflow:clip}
::view-transition-old(svc-hdr),::view-transition-new(svc-hdr){animation-duration:.3s}
::view-transition-old(svc-btn),::view-transition-new(svc-btn){animation-duration:.32s;width:auto;height:auto}   /* название не растягивается, просто сменяется */
::view-transition-old(root){animation:svc-out .2s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:svc-in .42s cubic-bezier(.16,1,.3,1) both}
@keyframes svc-out{to{opacity:0}}
@keyframes svc-in{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){@keyframes svc-in{from{opacity:0}}}
/*/SVC:CSS*/
:root[data-role="fin"] .svc-chev{display:none}
:root[data-role="fin"] .svc-btn{cursor:default;pointer-events:none}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:none}
.ico svg{width:21px;height:21px}
@media (hover:hover){.ico:hover{background:var(--fill2)}}
#sndBtn .off{display:none}#sndBtn[aria-pressed="false"] .on{display:none}#sndBtn[aria-pressed="false"] .off{display:block}
.svt-btn{border-radius:12px!important;height:38px!important}

/* полоса выбора: площадка, срок, период — прилипает к верху */
.ctx{position:sticky;top:0;z-index:40;background:var(--hdr);backdrop-filter:saturate(1.8) blur(22px);-webkit-backdrop-filter:saturate(1.8) blur(22px);border-bottom:.5px solid var(--line)}
.ctx.stuck{padding-top:env(safe-area-inset-top,0px)}
.ctxin{max-width:1320px;margin:0 auto;padding:6px 12px 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{position:relative;display:flex;background:var(--fill);border-radius:11px;padding:2px;min-width:0;flex:1 1 100%}
.seg button{position:relative;z-index:1;flex:1;height:32px;padding:0 10px;border-radius:9px;font:600 13.5px/1 var(--f);color:var(--ink2);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;transition:color .25s var(--ease)}
.seg button.on{color:var(--ink)}
.seg button:disabled{opacity:.34;cursor:default}
.seg .th{position:absolute;top:2px;bottom:2px;left:0;width:0;border-radius:9px;background:var(--thumb);box-shadow:0 1px 2px rgba(0,0,0,.1),0 3px 8px -2px rgba(0,0,0,.12);pointer-events:none}
.seg.rdy .th{transition:transform .42s var(--out),width .42s var(--out)}
#segG{flex:1 1 0}
.stp{display:flex;align-items:center;background:var(--fill);border-radius:11px;height:36px;flex:0 1 auto;min-width:0}
.stp button{height:36px;display:grid;place-items:center;color:var(--ink)}
.stp .ar{width:34px;color:var(--acc)}.stp .ar:disabled{color:var(--ink3);opacity:.5;cursor:default}
.stp .ar svg{width:18px;height:18px}
.stp #pLab{font:650 14px/1 var(--f);padding:0 2px;min-width:92px;white-space:nowrap}
#segK{flex:1 1 100%}
.dtabs{display:none}
.mpd{width:8px;height:8px;border-radius:50%;flex:none}
.mpd.wb{background:var(--wb)}.mpd.ozon{background:var(--oz)}.mpd.ym{background:var(--ym)}

/* по какой день данные площадок: сразу под выбором площадки и срока, в каждом разделе; строка не прилипает (шапку не раздувает) */
.dfr{max-width:1320px;margin:0 auto;padding:9px 14px 0;display:flex;flex-wrap:wrap;gap:3px 12px;align-items:center;font:500 12.5px/1.35 var(--f);color:var(--ink2)}
.dfr.wide{max-width:1900px}
.dfr:empty{display:none}
.dfr .i{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dfr b{font-weight:650;color:var(--ink)}
.dfr .m{color:var(--ink3)}
.dfr .w{color:var(--warn)}

main.wide{max-width:1900px}
main{max-width:1320px;margin:0 auto;padding:12px 12px calc(var(--tabh) + 34px + env(safe-area-inset-bottom,0px))}
.fresh{font-size:12.5px;color:var(--ink3);padding:2px 4px 10px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.fresh b{font-weight:600;color:var(--ink2)}
.fresh .wn{color:var(--warn);font-weight:600}
.vin{animation:vin .5s var(--out) both}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}

/* карточки и сетки */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh1);padding:16px;min-width:0}
:root[data-theme="space"] .card{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--sh1),0 0 0 .5px var(--line)}
.g{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.g>*{min-width:0}
.sg{grid-template-areas:"hero" "kpi" "side"}.sg>.hero{grid-area:hero}.sg>.kp{grid-area:kpi}.sg>.side{grid-area:side;display:grid;gap:12px;align-content:start;grid-template-columns:minmax(0,1fr)}
.ct{font:650 17px/1.25 var(--fd);letter-spacing:-.01em;margin:0 0 2px;display:flex;align-items:baseline;gap:8px}
.ct small{font:500 13px/1.3 var(--f);color:var(--ink3);letter-spacing:0}
.ct .more{margin-left:auto;font:600 13.5px/1 var(--f);color:var(--acc);white-space:nowrap}
.lbl{font-size:13px;color:var(--ink2);line-height:1.3}
.hero .big{font:700 38px/1.05 var(--fd);letter-spacing:-.025em;margin:4px 0 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.hero .sub{font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 14px}
.hero .sub b{color:var(--ink);font-weight:600}
/* три главных числа рядом с продажами: прибыль до ДРР, ДРР, итоговая маржа (Андрей 12.11: «до ДРР и итоговая маржа руб и проц не видна среди всего») */
.h3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 11px}
.hk{background:var(--fill2);border-radius:15px;padding:10px 10px 9px;text-align:left;min-width:0;display:flex;flex-direction:column;gap:3px}
.hk>span{font-size:12.5px;line-height:1.2;color:var(--ink2);white-space:nowrap}
.hk>b{font:700 19px/1.15 var(--fd);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk small{font-size:12.5px;line-height:1.2;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 5px;align-items:center;min-height:24px}
.hk small b{color:var(--ink);font-weight:650}
.hk .chip{height:21px;padding:0 6px;font-size:11.5px}
@media (hover:hover){.hk:hover{background:var(--fill)}}
.chip{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 8px;border-radius:8px;font:650 12.5px/1 var(--f);letter-spacing:0;white-space:nowrap;background:var(--fill2);color:var(--ink2);vertical-align:middle}
.chip.up{background:var(--good-soft);color:var(--good)}.chip.dn{background:var(--bad-soft);color:var(--bad)}
.chip svg{width:10px;height:10px}
.kp{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.k{background:var(--card);border-radius:18px;box-shadow:var(--sh1);padding:13px 14px 12px;min-width:0;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;height:100%}
:root[data-theme="space"] .k{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--sh1),0 0 0 .5px var(--line)}
.k .kv{font:680 22px/1.15 var(--fd);letter-spacing:-.02em;margin:5px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .ks{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;min-height:24px}
.k.bad .kv{color:var(--bad)}

/* столбики динамики */
.chh{display:flex;align-items:baseline;gap:8px;min-height:22px;margin:8px 0 6px;font-size:13.5px;color:var(--ink2)}
.chh b{color:var(--ink);font:650 15px/1.2 var(--fd)}
.bars{position:relative;display:flex;gap:3px;height:132px;align-items:stretch}
.bars .c{position:relative;flex:1;min-width:0;border-radius:6px;cursor:pointer}
.bars .c i{position:absolute;left:0;right:0;border-radius:5px 5px 2px 2px;background:var(--bar);transition:height .6s var(--out),top .6s var(--out),bottom .6s var(--out),background-color .25s}
.bars .c.neg i{border-radius:2px 2px 5px 5px;background:var(--bad-soft)}
.bars .c.cur i{background:var(--acc)}.bars .c.cur.neg i{background:var(--bad)}
.bars .c.part i{background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(255,255,255,.34) 4px 7px)}
@media (hover:hover){.bars .c:hover i{background:var(--bar2)}.bars .c.cur:hover i{background:var(--acc)}}
.bars .c.sel i{background:var(--bar2)}.bars .c.cur.sel i{background:var(--acc)}
.bars .zero{position:absolute;left:0;right:0;height:1px;background:var(--line);pointer-events:none}
.bxl{display:flex;gap:3px;margin-top:5px;font-size:10.5px;color:var(--ink3);height:14px}
.bxl span{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:visible}
.bxl span.cur{color:var(--acc);font-weight:650}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.pills::-webkit-scrollbar{display:none}
.pill{height:32px;padding:0 12px;border-radius:16px;background:var(--fill2);color:var(--ink2);font:600 13px/1 var(--f);white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:5px;transition:background-color .25s var(--ease),color .25s var(--ease),transform .35s var(--spring)}
.pill.on{background:var(--acc);color:var(--on-acc)}
.pill:active{transform:scale(.95)}
.pill svg{width:13px;height:13px}
#sorts,#gsorts{margin:0 -12px;padding:2px 12px}

/* куда уходит рубль */
.rub{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:10px 0 12px;background:var(--fill)}
.rub i{display:block;height:100%;min-width:0;transition:width .7s var(--out)}
.leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 14px;font-size:13.5px}
.leg div{display:flex;align-items:center;gap:7px;min-width:0}
.leg em{width:9px;height:9px;border-radius:3px;flex:none}
.leg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.leg b{font-weight:600}

/* списки */
.rows{margin:6px -16px -8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;width:100%;text-align:left;position:relative;transition:background-color .2s}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--line)}
.row:active{background:var(--fill2)}
@media (hover:hover){.row:hover{background:var(--fill2)}}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;font-size:15px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .nm small{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rv{text-align:right;flex:none;max-width:52%}
.row .rv b{display:block;font:650 15px/1.25 var(--f);white-space:nowrap}
.row .rv small{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px;white-space:nowrap}
.row .shr{position:absolute;left:16px;bottom:0;height:2px;border-radius:2px;background:var(--acc);opacity:.5}
.mpi{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:5px;font:800 9px/1 var(--f);color:#fff;flex:none;vertical-align:-3px;margin-right:6px;letter-spacing:-.02em}
.mpi.wb{background:linear-gradient(135deg,#cb11ab,#7b2ff7)}.mpi.ozon{background:#005bff}.mpi.ym{background:#ffcc00;color:#231f00}
.mpi+.mpi{margin-left:-3px}
.row.sum{cursor:default}.row.sum:active{background:none}
@media (hover:hover){.row.sum:hover{background:none}}
.row.in{padding-left:30px}
.chev{width:16px;height:16px;color:var(--ink3);flex:none;transition:transform .35s var(--out)}
.acc.open>.row .chev{transform:rotate(90deg)}
.accb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--out)}
.acc.open>.accb{grid-template-rows:1fr}
.accb>div{overflow:hidden;min-height:0}
.subl .row{padding-left:28px}.subl .row+.row::before,.subl .row:first-child::before{left:28px}
.subl{background:var(--fill2)}

/* товары */
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.srch{flex:1 1 220px;position:relative;min-width:0}
.srch input{width:100%;height:38px;border:0;border-radius:12px;background:var(--fill);padding:0 34px 0 36px;font-size:16px;outline:none;transition:box-shadow .2s}
.srch input:focus{box-shadow:0 0 0 2px var(--acc)}
.srch>svg{position:absolute;left:11px;top:10px;width:18px;height:18px;color:var(--ink3);pointer-events:none}
.srch .cl{position:absolute;right:4px;top:4px;width:30px;height:30px;display:none;place-items:center;color:var(--ink3)}
.srch.has .cl{display:grid}.srch .cl svg{width:16px;height:16px}
.tbtn{height:38px;padding:0 12px;border-radius:12px;background:var(--fill);font:600 13.5px/1 var(--f);color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;max-width:100%}
.tbtn svg{width:16px;height:16px;color:var(--ink2);flex:none}
.tbtn.on{background:var(--acc-soft);color:var(--acc)}.tbtn.on svg{color:var(--acc)}
.tbtn span{overflow:hidden;text-overflow:ellipsis}
#catBtn span,#sklBtn span{max-width:min(46vw,260px)}
.tbtn .sm{display:none}
.tfl{display:flex;gap:8px;min-width:0;flex-wrap:wrap}
@media (max-width:899px){   /* телефон: поиск и вид — одной строкой, отборы — второй, она листается вбок */
  .tpr .srch{order:1;flex:1 1 0}
  .tpr #viewBtn{order:2}.tpr #csvBtn{order:3}
  .tpr #viewBtn,.tpr #csvBtn{width:38px;padding:0;justify-content:center;flex:none}
  .tpr #viewBtn span,.tpr #csvBtn span{display:none}
  .tpr .tfl{order:4;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
  .tpr .tfl::-webkit-scrollbar{display:none}
  .tpr .tfl .tbtn{flex:none;max-width:none}
  .tpr .tfl .lg{display:none}.tpr .tfl .sm{display:inline}
}
.cnt{font-size:12.5px;color:var(--ink3);margin:10px 4px 8px}
.pc{background:var(--card);border-radius:18px;box-shadow:var(--sh1);padding:13px 14px;display:block;width:100%;text-align:left;margin-bottom:8px}
:root[data-theme="space"] .pc{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh1),0 0 0 .5px var(--line)}
.pc .h{display:flex;gap:10px;align-items:flex-start}
.pc .h .n{flex:1;min-width:0}
.pc .h .n b{font:600 15px/1.25 var(--f);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc .h .n small{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .h .s{text-align:right;flex:none}
.pc .h .s b{display:block;font:680 17px/1.2 var(--fd);letter-spacing:-.01em;white-space:nowrap}
.pc .h .s small{display:block;margin-top:4px}
.pc .m{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:11px;padding-top:10px;border-top:.5px solid var(--line)}
.pc .m div{min-width:0}
.pc .m span{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .m b{display:block;font:650 14px/1.3 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}

/* таблица как лист SKU */
.tw{background:var(--card);border-radius:var(--r);box-shadow:var(--sh1);overflow:auto;max-height:calc(100dvh - 190px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain auto}
:root[data-theme="space"] .tw{background:#12153a;box-shadow:var(--sh1),0 0 0 .5px var(--line)}
.tb{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
.tb th,.tb td{padding:9px 11px;text-align:right;white-space:nowrap;border-bottom:.5px solid var(--line)}
.tb th{position:sticky;top:0;z-index:3;background:var(--card2);font:600 12px/1.25 var(--f);color:var(--ink2);white-space:normal;min-width:92px;max-width:120px;vertical-align:bottom;cursor:pointer;user-select:none}
:root[data-theme="space"] .tb th{background:#1b1f52}
.tb th.on{color:var(--acc)}
.tb th .a{display:inline-block;margin-left:2px;font-size:10px}
.tb td:first-child,.tb th:first-child{position:sticky;left:0;z-index:2;text-align:left;background:var(--card);max-width:46vw;min-width:150px;box-shadow:.5px 0 0 var(--line)}
:root[data-theme="space"] .tb td:first-child{background:#12153a}
.tb th:first-child{z-index:4;background:var(--card2);max-width:46vw}
:root[data-theme="space"] .tb th:first-child{background:#1b1f52}
.tb td:first-child{white-space:normal;font-weight:600;line-height:1.25;cursor:pointer}
.tb td:first-child small{display:block;font-weight:400;font-size:11.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb tr.tot td{position:sticky;top:var(--thh,46px);z-index:2;background:var(--card2);font-weight:700;border-bottom:1px solid var(--line)}
:root[data-theme="space"] .tb tr.tot td{background:#1b1f52}
.tb tr.tot td:first-child{z-index:4;background:var(--card2)}
:root[data-theme="space"] .tb tr.tot td:first-child{background:#1b1f52}
.tb tbody tr:not(.tot):active td{background:var(--fill2)}
@media (hover:hover){.tb tbody tr:not(.tot):hover td{background:var(--card2)}:root[data-theme="space"] .tb tbody tr:not(.tot):hover td{background:#1b1f52}}
.tb td.g1{color:var(--good)}.tb td.b1{color:var(--bad)}.tb td.w1{color:var(--warn);font-weight:600}
.tb td i.gr{font-style:normal;font-size:9px;color:var(--bad);margin-left:2px;vertical-align:1px}
.tb td .nm2{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tb td:first-child small.why,.pc small.why{color:var(--bad);white-space:normal;line-height:1.25;font-weight:500}
.pc small.why{display:block;font-size:12.5px;margin-top:3px}
.tb tr.neg td:first-child{box-shadow:inset 3px 0 0 var(--bad),.5px 0 0 var(--line)}
.dl .li .sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:0}
.dl .li b .chip{height:20px;padding:0 6px;font-size:11.5px;vertical-align:1px}
/* телефон: плотная таблица «как лист SKU» — пять главных столбцов видны сразу, остальные листаются вбок */
.tb.m{font-size:12.5px}
.tb.m th,.tb.m td{padding:8px 4px}
.tb.m th{font-size:10.5px;line-height:1.2;min-width:40px;max-width:60px}
.tb.m td:first-child,.tb.m th:first-child{min-width:106px;max-width:106px;width:106px;padding-left:10px;padding-right:6px;font-size:12.5px}
.tb.m td:first-child small{font-size:10.5px;white-space:normal}
.tb.m .nm2{overflow-wrap:anywhere}
.tb.m .mpi{width:12px;height:12px;border-radius:3.5px;font-size:6.5px;margin-right:4px;vertical-align:-1.5px}
.tb.m .mpi+.mpi{margin-left:-2px}
.tb.m td i.gr{margin-left:1px;font-size:8px}
.tb.m tr.tot td{font-size:12px}
.tb th.tl,.tb td.tl{text-align:left}.tb th.tl{cursor:default}.tb td.tl{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.tb td.sep,.tb th.sep{border-left:.5px solid var(--line)}
@media (max-width:899px){.tb{font-size:13px}.tb th,.tb td{padding:8px 9px}.tb th{min-width:78px}.tb td:first-child,.tb th:first-child{max-width:40vw;min-width:128px}
  .yt th{min-width:62px}.yt th:first-child,.yt td:first-child{min-width:138px;max-width:40vw}.yt tr.p td:first-child{padding-left:16px}}

/* год */
.yt th:first-child,.yt td:first-child{min-width:176px;max-width:52vw}
.yt td:first-child{cursor:default;font-weight:500}
.yt tr.b td{font-weight:700}.yt tr.b td:first-child{font-weight:700}
.yt tr.p td{color:var(--ink2);font-size:12.5px;padding-top:4px;padding-bottom:8px}
.yt tr.p td:first-child{font-weight:400;padding-left:22px}
.yt tr.s td{border-bottom-color:transparent}
.yt th{cursor:default;min-width:84px}
.yt td.cur,.yt th.cur{background:var(--acc-soft)}
.yt td:last-child,.yt th:last-child{font-weight:700;border-left:.5px solid var(--line)}

/* нижние вкладки */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;background:var(--hdr);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px);border-top:.5px solid var(--line);padding:0 4px env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font:600 10.5px/1 var(--f);transition:color .25s var(--ease),transform .35s var(--spring)}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--acc);font-weight:700}
/* выбранный раздел — на подложке: видно с первого взгляда (Андрей 12.11: «не видно раздел какой выбран») */
.tabbar button{position:relative}
.tabbar button svg{position:relative;z-index:1}
.tabbar button::before{content:"";position:absolute;top:5px;left:50%;width:54px;height:31px;margin-left:-27px;border-radius:16px;background:var(--acc-soft);opacity:0;transform:scale(.55);transition:opacity .25s var(--ease),transform .45s var(--spring)}
.tabbar button.on::before{opacity:1;transform:none}
.tabbar button:active{transform:scale(.92)}

/* листы: снизу на телефоне, справа на компьютере */
.shw{position:fixed;inset:0;z-index:60;visibility:hidden;pointer-events:none}
.shw.on{visibility:visible;pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .35s var(--ease)}
.shw.on .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;max-height:min(92dvh,calc(100dvh - 30px));background:var(--bg);border-radius:22px 22px 0 0;box-shadow:var(--sh2);
  transform:translateY(102%);transition:transform .5s var(--out);display:flex;flex-direction:column;overflow:hidden}
:root[data-theme="space"] .sheet{background:#0a0d2c}
.shw.on .sheet{transform:none}
.sheet.drag{transition:none}
.grab{flex:none;height:24px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:38px;height:5px;border-radius:3px;background:var(--ink3);opacity:.5}
.shh{flex:none;padding:0 16px 10px;display:flex;align-items:flex-start;gap:10px;touch-action:none}
.shh h2{flex:1;margin:0;font:700 20px/1.2 var(--fd);letter-spacing:-.015em;min-width:0}
.shh h2 small{display:block;font:500 13px/1.35 var(--f);color:var(--ink2);margin-top:4px;letter-spacing:0}
.shx{width:32px;height:32px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink2);flex:none}
.shx svg{width:15px;height:15px}
.sbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 12px calc(20px + env(safe-area-inset-bottom,0px))}
.sbody .card{margin-bottom:10px}

/* «Космос» в 3D: сцена — отдельный файл kosmos/scene.js, её холст #kosmos3d лежит под страницей. Пока сцена не готова или WebGL нет — прежние звёзды #stars */

}
@keyframes k3in{from{transform:translateY(44vh) scale(.965)}}

#k3ov{position:fixed;inset:0;z-index:65;touch-action:none;cursor:grab;color:#f1f2ff;opacity:0;transition:opacity .55s var(--ease);user-select:none;-webkit-user-select:none}

/* «назад» на телефоне не выкидывает с сайта (Андрей 29.10: «назад сначала закрывает всплывающее, потом в начало раздела, потом на главную,
   а на главной — наверх; с сайта не выкидывать, и так везде надо»). Над страницей — запас записей-«стражей» {svg:1…20}; каждое «назад»
   тратит одну и делает один шаг. Записи ставим только из касания (отпустил палец, клик, клавиша): добавленные без него Chrome кнопкой
   «назад» пропускает — поэтому не «поставить стража заново после назад», а запас, который доливается при следующем касании.
   svcBack({pop:[шаги страницы: вернуть true, если что-то закрыли], main: перейти в главный раздел (true, если перешли), home: «это главная»}) */
window.svcBack=o=>{
  const q=s=>document.querySelector(s),rs=history.replaceState.bind(history),ps=history.pushState.bind(history),N=20;
  const n=()=>{const s=history.state;return s&&s.svg||0};   // номер стража; 0 — не страж (основа страницы или своя запись страницы)
  let last=n(),gu=location.href;   // gu — адрес текущей записи: страницы меняют в нём раздел (#skleyki) — после «назад» оставляем его
  history.replaceState=function(s,t,u){const k=n();if(k&&!(s&&s.svg))s=Object.assign({},s,{svg:k});rs(s,t,u);if(n())gu=location.href};
  const fill=()=>{try{let k=n();const s=history.state;
    if(!k){if(s&&!s.svb&&Object.keys(s).length)return;rs(Object.assign({},s,{svb:1}),'')}   // своя запись страницы (карточка Юнитки) — не доливаем
    for(k++;k<=N;k++)ps({svg:k},'',location.href);last=n();gu=location.href}catch(e){}};
  ['click','touchend','keydown'].forEach(k=>document.addEventListener(k,fill,{capture:true,passive:true}));
  const step=()=>{
    for(const f of o.pop||[])if(f())return;                                   // всплывающее страницы: фишки, листы, окна
    if(m.classList.contains('on')){open(false);return}                       // выбор сервиса
    const t=q('.svt-btn[aria-expanded="true"]');if(t){t.click();return}       // выбор темы
    const big=q('#sxCard.big [data-sx="big"],#ptCard.big [data-pt="big"],#abCard.big [data-ab="big"],#spCard.big [data-sp="big"]');if(big){big.click();return}
    const g=q('#sxCard.flip [data-sx="back"],#ptCard.flip [data-pt="back"],#abCard.flip [data-ab="back"]');if(g){g.click();return}   // игра — обратно на баннер
    if(scrollY>40){scrollTo({top:0,behavior:'smooth'});return}              // в начало раздела
    if(o.main&&o.main())return;                                               // на главный раздел
    if(o.home)o.home();                                                       // уже на главной, наверху
  };
  addEventListener('popstate',()=>{const k=n(),s=history.state;
    // «назад» — номер стража стал меньше (с записи страницы на стража того же номера — это её собственный «назад», не наш);
    // основа страницы — запас кончился, шаг всё равно делаем
    if(k?k<last:!!(s&&s.svb)){const was=location.href;step();if(location.href===was)try{rs(history.state,'',gu)}catch(x){}}   // шаг не сменил раздел — адрес оставляем прежний
    last=k;gu=location.href});
};

/* «Данные в космосе» (тема «Космос» в 3D): в «Сводке» площадки — планеты на орбитах, в срезе одной площадки — её склейки. Размер — продажи,
   цвет — маржа (зелёная от 12% продаж, жёлтая около нуля, красная в минусе); у самой большой — кольцо. Планеты рисует сцена (KOSMOS.system),
   подписи — кнопки страницы: площадка — data-mp (выбрать её), склейка — data-skl (открыть лист). */
function sysDraw(){
  if(!K3.live)return;const el=$('#sysw');if(!el||S.tab!=='sum'){KOSMOS.system(null);return}
  const g=S.g,k=curK(),its=items(g,k),all=S.mp==='all'&&MPS.length>1;
  let ls=all?MPS.map(mp=>({t:MPN[mp],m:met(vsum(its.filter(x=>x.mp===mp).map(x=>x.v))),a:`data-mp="${mp}"`}))
    :sklsC(g,k).filter(x=>x.key!=='-').map(x=>({t:x.t,m:x.m,a:`data-skl="${esc(x.key)}"`}));
  ls=ls.filter(x=>x.m.sales>0).sort((a,b)=>b.m.sales-a.m.sales).slice(0,7);
  el.hidden=!ls.length;if(!ls.length){KOSMOS.system(null);return}
  const mx=ls[0].m.sales,G=[.37,.95,.69],Y=[1,.81,.44],B=[1,.53,.59];
  const colr=q=>{const t=Math.max(-1,Math.min(1,q/.12)),a=t>=0?Y:B,b=t>=0?G:Y,u=t>=0?t:t+1;return a.map((v,i)=>v+(b[i]-v)*u)};
  const sp=ls.map((x,i)=>{const r=Math.sqrt(x.m.sales/mx),q=x.m.profit/x.m.sales;return {r,q,col:colr(q),ring:i===0&&ls.length>1,d:Math.round(26+54*r)}});
  $('#sysc').textContent=(all?'площадки':'склейки · '+MPN[S.mp])+' · размер — продажи, цвет — маржа';
  $('#sysl').innerHTML=ls.map((x,i)=>`<button ${x.a} class="press" aria-label="${esc(x.t)}"><i style="width:${sp[i].d}px;height:${sp[i].d}px"></i><b>${esc(x.t.length>18?x.t.slice(0,17)+'…':x.t)}</b><small class="num">${fm(x.m.sales)} · ${(sp[i].q*100).toFixed(1).replace('.',',')}%</small></button>`).join('');
  KOSMOS.system({el,items:sp,labels:$$('#sysl button')});
}

/* по какой день данные каждой площадки: ВБ грузится неделями, Озон — днями, ЯМ — месяцами. Строка под выбором площадки и срока, в каждом разделе */
const KINDN={wm:'неделями',w:'неделями',d:'по дням',m:'по месяцам'};
const uptoS=(mp,long)=>{const B=D.mp[mp];if(!B.upto)return '';const d=pd(B.upto);return B.kind==='m'?MONN[d.getUTCMonth()].toLowerCase():(long?DOW[d.getUTCDay()]+', ':'')+dstr(d)};
const atS=t=>new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'});
function fresh(){
  const el=$('#dfr');if(!el||!D)return;const g=S.g,k=curK(),days=c=>c.n?c.n+' из '+c.full+' дн':'нет';
  const it=(mp,long)=>`<span class="i" data-mp="${mp}"><i class="mpd ${mp}"></i>${MPN[mp]} по <b>${uptoS(mp,long)}</b></span>`;
  let h='';
  if(S.mp==='all'){const ms=MPS.filter(mp=>D.mp[mp].upto);h=ms.map(mp=>it(mp)).join('');
    const cs=ms.map(mp=>cover(mp,g,k));
    if(g!=='d'&&cs.some(c=>c.n!==cs[0].n))h+=`<span class="i w" data-dif="1">в периоде: ${ms.map((mp,j)=>MPN[mp]+' '+days(cs[j])).join(' · ')}</span>`}   // период закрыт у площадок на разную глубину
  else if(D.mp[S.mp]&&D.mp[S.mp].upto){const B=D.mp[S.mp],c=cover(S.mp,g,k);
    h=it(S.mp,true)+`<span class="i m">грузится ${KINDN[B.kind]||''}</span><span class="i m">обновлено ${atS(B.at||D.at)} МСК</span>`;
    if(c.n&&c.n<c.full)h+=`<span class="i w" data-dif="1">в периоде ${days(c)}</span>`}
  el.innerHTML=h}

function foot(){
  const w=[];for(const mp of MPS){const B=D.mp[mp],c=B.check||{};if(B.stale)w.push(`${MPN[mp]}: свежие данные не собрались, показаны прошлые`);
    else if(c.bad||(c.week&&c.week.bad))w.push(`${MPN[mp]}: расчёт расходится с листом SKU у ${(c.bad||0)+((c.week&&c.week.bad)||0)} товаров`)}
  const u=MPS.map(mp=>{const B=D.mp[mp];return B.upto?`${MPN[mp]} по ${B.kind==='m'?MONN[pd(B.upto).getUTCMonth()].toLowerCase():dstr(pd(B.upto))}`:''}).filter(Boolean).join(' · ');
  const at=new Date(D.at),ats=at.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'});
  return `<div class="fresh" style="margin-top:14px"><span>Данные панелей: <b>${u}</b></span><span>обновлено ${ats} МСК</span>${w.length?`<span class="wn">⚠ ${w.join('; ')}</span>`:'<span>сверено с листом SKU до рубля</span>'}<button class="more" style="color:var(--acc);font:600 12.5px/1 var(--f)" data-refresh="1">Обновить</button></div>`;
}

/* ───────── Склейки: склейка → товары внутри, итог по склейке; в срезе площадки — как в её кабинете, в «Все» — общие.
   Два вида, как у «Товаров»: карточки и таблица с теми же столбцами, что лист SKU (строка — склейка, сверху итог). ───────── */
const GSORT=[['sales','Продажи'],['mProfit','Маржа %'],['profit','Маржа ₽'],['mNodrr','До ДРР %'],['drr','ДРР'],['pComm','Комиссия'],['ads','Реклама']];
const sklNote=()=>`Склейка — карточки, которые площадка показывает одной: на ВБ общая карточка, на Озоне одна модель, на Маркете группа вариантов. Состав берётся из сервиса «Склейки»${D.skl_at?' (собран '+dstr(pd(D.skl_at))+')':''}.${joined()?' Когда площадки вместе, товары попадают в одну склейку, если их карточки склеены хотя бы на одной площадке.':''}`;
function sklSort(arr){const key=S.gs,dir=S.gd;
  return arr.slice().sort((a,b)=>{const x=gv(a,key),y=gv(b,key);if(!ok(x)&&!ok(y))return b.m.sales-a.m.sales;if(!ok(x))return 1;if(!ok(y))return -1;return (x-y)*dir||b.m.sales-a.m.sales})}
function sklRows(g,k){   // склейки периода в выбранном порядке, «Без склейки» — последней
  const live=sklsC(g,k).filter(sklLive);return sklSort(live.filter(s=>s.key!=='-')).concat(live.filter(s=>s.key==='-'))}
function sklTable(rows,g,k,T){
  const pk=prevK(g,k),pl=pk!=null?GP[g]:'',cols=colsNow(pl),tm=met(T.v),tp=met(T.p),mb=mob();
  const tv=key=>key==='salesP'?tp.sales:key==='avgP'?tp.avg:key==='drrP'?tp.drr:tm[key];
  return `<div class="tw" id="tw"><table class="tb sk${mb?' m':''}"><thead><tr><th>Склейка</th>${cols.map(c=>`<th data-gs="${c[0]}" class="${S.gs===c[0]?'on':''}">${c[1].replace('#',pl)}${S.gs===c[0]?`<span class="a">${S.gd<0?'▼':'▲'}</span>`:''}</th>`).join('')}</tr></thead>
<tbody><tr class="tot"><td>Итого · ${plr(rows.filter(s=>s.key!=='-').length,W_SKL)}</td>${cols.map(c=>tcell(tv(c[0]),c)).join('')}</tr>
${rows.map(s=>{const why=s.key==='-'?'':reason(s,g,k,mb),ic=S.mp==='all'&&s.key!=='-'?s.mps.map(mpi).join(''):'';return `<tr data-skl="${esc(s.key)}"${s.m.profit<0?' class="neg"':''}><td><span class="nm2">${mb?'':ic}${esc(s.t)}</span><small>${mb?ic:''}${[nTov(s),s.k?'Каб '+s.k:''].filter(Boolean).join(' · ')}</small>${why?`<small class="why">${esc(why)}</small>`:''}</td>${cols.map(c=>tcell(gv(s,c[0]),c,s)).join('')}</tr>`}).join('')}</tbody></table></div>${TNOTE}`;
}
function vSkl(){
  const g=S.g,k=curK(),all=sklsC(g,k),T=totals(g,k),tm=met(T.v),tbl=tblOn();
  if(!(D.skl&&D.skl.length)&&!MPS.some(mp=>(D.mp[mp].skl||[]).length))return `<div class="empty"><b>Состав склеек ещё не загружен</b>Он берётся из сервиса «Склейки» и появится с ближайшим обновлением данных.</div>`+foot();
  const rows=sklRows(g,k);
  if(!rows.length)return empty();
  const gs=rows.filter(s=>s.key!=='-'),no=rows.find(s=>s.key==='-');
  const tot=all.reduce((a,s)=>a+Math.max(0,s.m.sales),0)||1,inS=gs.reduce((a,s)=>a+Math.max(0,s.m.sales),0),nAct=gs.reduce((a,s)=>a+s.act,0);
  const card=s=>{const m=s.m;
    return `<button class="pc press" data-skl="${esc(s.key)}"><div class="h"><div class="n"><b>${S.mp==='all'&&s.key!=='-'?s.mps.map(mpi).join(''):''}${esc(s.t)}</b><small class="num">${[nTov(s),s.k?'Каб '+s.k:'',fp(Math.max(0,m.sales)/tot)+' продаж'].filter(Boolean).join(' · ')}</small></div><div class="s"><b class="num">${fr(m.sales)}</b><small>${chip(setDelta(s.its,g,k,fS))}</small></div></div>
<div class="m"><div><span>Маржа</span><b class="num ${m.profit<0?'dn':''}">${fm(m.profit)}</b></div><div><span>Маржа %</span><b class="num ${m.mProfit<0?'dn':m.mProfit>=.2?'up':''}">${fp(m.mProfit)}</b></div><div><span>До ДРР</span><b class="num">${fp(m.mNodrr)}</b></div><div><span>ДРР</span><b class="num">${fp(m.drr)}</b></div></div></button>`};
  return `<div class="fresh"><span>${plabel(g,k,true)} · продажи <b class="num">${fm(tm.sales)}</b> · валовая прибыль <b class="num">${fm(tm.profit)}</b> (${fp(tm.mProfit)}) · ДРР <b class="num">${fp(tm.drr)}</b></span></div>
<div class="tools">${joinBtn()}${viewBtnH(tbl)}${CSVB}</div>
${tbl?'':`<div class="pills" id="gsorts">${GSORT.map(([x,t])=>`<button class="pill${S.gs===x?' on':''}" data-gs="${x}">${t}${S.gs===x?(S.gd<0?' ↓':' ↑'):''}</button>`).join('')}</div>`}
<div class="cnt">${plr(gs.length,W_SKL)} · в них ${plr(nAct,W_TOV)} и ${fp(inS/tot)} продаж${no&&no.act?' · без склейки '+plr(no.act,W_TOV):''}</div>
${tbl?sklTable(rows,g,k,T):`<div class="pcs">${rows.map(card).join('')}</div>`}
<div class="note">${sklNote()}</div>${foot()}`;
}

  ['nodrr','До ДРР<br>₽','k',1],['ads','Реклама<br>₽','k'],['units','Штук','n'],['avg','Ср. чек<br>₽','k'],['cost1','Себест.<br>1 ед.','k'],['roi','ROI<br>%','q'],['salesP','Продажи<br>#','k'],['drrP','ДРР %<br>#','q'],['ff','ФФ<br>₽','k'],['dop','Доукомпл.<br>₽','k'],['cost','Себест.<br>₽','k']];

const SHN=[['cost','себестоимость','Себестоимость','--c1'],['comm','комиссия','Комиссия','--c2'],['logi','логистика','Логистика','--c3'],['ads','ДРР','Реклама (ДРР)','--c4'],
  ['tax','налог','Налог','--c5'],['ffd','ФФ','ФФ и доукомплектовка','--c7'],['oth','хранение','Эквайринг, хранение','--bar2']];

function avgSh(g,k){const key='av|'+S.mp+'|'+S.kab+'|'+g+'|'+k;if(C[key])return C[key];const m=met(totals(g,k).v),o=shares(m)||{};o.mar=m.mProfit;return C[key]=o}

function sppIdx(mp){if(SP[mp])return SP[mp];const X=(D.spp||{})[mp]||{s:[],v:[]},by={};
  for(const r of X.s)(by[r[0]]||(by[r[0]]={s:[],v:[]})).s.push(r);for(const r of X.v)(by[r[0]]||(by[r[0]]={s:[],v:[]})).v.push(r);return SP[mp]=by}
const dayIn=(g,k,ds)=>{if(g==='y')return true;const d=pd(ds);return g==='m'?d.getUTCMonth()+1===k:g==='w'?isoW(d)===k:ds===k};
function sppOf(mp,i,g,k){const b=sppIdx(mp)[i];if(!b)return null;let p=0,s=0,q=0,vs=0,vn=0;
  for(const r of b.s)if(dayIn(g,k,r[1])){p+=r[2];s+=r[3];q+=r[4]}
  if(p>0)return {pct:s/p,src:1,p,s,q};
  for(const r of b.v)if(dayIn(g,k,r[1])){vs+=r[2];vn++}
  return vn?{pct:vs/vn,src:0,p:0,s:0,q:0}:null}
function sppDays(mp,i,n){   // последние n дней: [дата, %, по продажам?]
  const b=sppIdx(mp)[i];if(!b)return [];const by={};
  for(const r of b.v)by[r[1]]=[r[1],r[2],0];
  const ag={};for(const r of b.s){const a=ag[r[1]]||(ag[r[1]]=[0,0]);a[0]+=r[2];a[1]+=r[3]}
  for(const d in ag)if(ag[d][0]>0)by[d]=[d,ag[d][1]/ag[d][0],1];
  return Object.values(by).sort((a,b)=>a[0]<b[0]?-1:1).slice(-n);
}

function rubCard(m,pm,g,k,pk){   // куда уходит рубль у товара или склейки: доля в продажах, изменение к прошлому периоду, рядом — среднее по срезу

    sky(cx,cv.width,cv.height,{x,y,s},t,d,Math.max(0,Math.min(1,1-Math.log(s/sC())/Math.log(14))),false,P);
    if(s>cover()*1.6)for(const im of cw.querySelectorAll('.cdt:not([src])')){const n=P.det.find(q=>q[0]===im.dataset.n);   // подлетели близко — подгружается этот участок снимка крупно
      if(n&&Math.abs(n[1]-x)<n[3]+w/s/2&&Math.abs(n[2]-y)<n[3]+h/s/2){im.onload=()=>im.classList.add('on');im.src='kosmos/'+P.img+'-'+n[0]+'.webp'}}
  }
  function build(){
    box=document.createElement('div');box.className='cosmo';box.id='cosmo';box.hidden=true;
    box.innerHTML=`<div class="cz" id="cz"><div class="cw" id="cw"><img class="cb0" id="cimg" alt="" draggable="false"></div><canvas id="ccv"></canvas></div>
<div class="ctop"><div><b id="ctt"></b><small id="cts"></small></div><button class="shx press" id="cxx" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div class="cbot"><div class="pills pls" id="cpl" hidden></div><p id="cft"></p><div class="pills" id="cgo"></div><small id="ccr"></small></div>`;
    document.body.appendChild(box);cz=box.querySelector('#cz');cw=box.querySelector('#cw');cv=box.querySelector('#ccv');cx=cv.getContext('2d');
    box.addEventListener('click',e=>{const b=e.target.closest('[data-ori]');if(b){fly(b.dataset.ori);return}const q=e.target.closest('[data-pl]');if(q){go(q.dataset.pl);return}if(e.target.closest('#cxx'))close()});
    cz.addEventListener('pointerdown',e=>{try{cz.setPointerCapture(e.pointerId)}catch(q){}ptrs.set(e.pointerId,[e.clientX,e.clientY]);anim=null;cz.classList.add('drag');down={x:e.clientX,y:e.clientY,t:Date.now(),m:0};
      if(ptrs.size===2){const [p,q]=[...ptrs.values()];pinch={d:Math.hypot(p[0]-q[0],p[1]-q[1])||1,s:cam.s}}});
    cz.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;if(down)down.m+=Math.abs(dx)+Math.abs(dy);
      if(ptrs.size===1){cam.x-=dx/cam.s;cam.y-=dy/cam.s}
      else if(pinch){const [a,b]=[...ptrs.values()];zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,pinch.s*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d)}
      clamp();if(down&&down.m>8&&cur){cur='';ui()}});
    const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size)return;cz.classList.remove('drag');
      if(down&&down.m<8&&Date.now()-down.t<320){const now=Date.now();   // двойное касание — приблизить это место
        if(now-lastTap<340){const s=Math.min(smax(),cam.s*2.3);fly('',900,{x:cam.x+(e.clientX-w/2)/cam.s,y:cam.y+(e.clientY-h/2)/cam.s,s});cur='';ui();lastTap=0}else lastTap=now}};
    cz.addEventListener('pointerup',up);cz.addEventListener('pointercancel',up);
    cz.addEventListener('wheel',e=>{e.preventDefault();anim=null;zoomAt(e.clientX,e.clientY,cam.s*Math.exp(-e.deltaY*.0016));clamp();if(cur){cur='';ui()}},{passive:false});
    addEventListener('resize',()=>{if(isOpen){size();clamp()}});
    document.addEventListener('visibilitychange',()=>{if(!isOpen)return;cancelAnimationFrame(raf);if(!document.hidden)raf=requestAnimationFrame(frame)});
  }
  const pick=id=>places.find(p=>p.id===id)||places[0];
  /* секунду смотрим на созвездие — и летим к месту; чем мельче место, тем дольше полёт */
  const arm=()=>{clearTimeout(autoT);autoT=setTimeout(()=>{if(isOpen&&cur==='const'&&!ptrs.size&&!anim)fly('neb',3600+Math.min(1600,Math.max(0,(Math.log(cover()/sC())-4.2)*520)))},1100)};
  function show(id){P=pick(id);cur='const';fill();meas();Object.assign(cam,tgt('const'));anim=null;ui();arm()}
  function open(id){if(isOpen)return;if(!box)build();isOpen=true;box.hidden=false;size();show(id||'ori');document.documentElement.classList.add('noscroll');
    requestAnimationFrame(()=>box.classList.add('on'));raf=requestAnimationFrame(frame);load()}
  function go(id){if(!isOpen||P.id===id)return;box.classList.add('sw');clearTimeout(autoT);setTimeout(()=>{if(!isOpen)return;show(id);box.classList.remove('sw')},230)}   // другое созвездие, не закрывая слой
  function close(){if(!isOpen)return false;isOpen=false;box.classList.remove('on','sw');cancelAnimationFrame(raf);clearTimeout(autoT);anim=null;ptrs.clear();document.documentElement.classList.remove('noscroll');
    setTimeout(()=>{if(!isOpen)box.hidden=true},520);return true}

    turn(i){if(!pinned)cp=places[i%places.length]},pin(id){pinned=!!id;if(id)cp=pick(id);affDraw()},cardId:()=>cp.id,goText:()=>cp.go,   // созвездие в карточке меняется вместе с посылом; pin — для проверки
    state:()=>({pl:P.id,cur,x:cam.x,y:cam.y,s:cam.s,cover:cover(),anim:!!anim,img:!!(box&&box.querySelector('#cimg').naturalWidth),det:box?[...box.querySelectorAll('.cdt.on')].map(i=>i.dataset.n):[]})};
})();

/* «Космос»: посылы — свои, в духе тех, что в Юнитке; порядок раз в два дня один у всех */
const AFF=['Я вижу всю картину и выбираю лучшее','Мои цифры растут спокойно и уверенно','Каждое решение сегодня приближает меня к цели','Порядок в цифрах — порядок в делах',
 'Я благодарю каждого покупателя за доверие','Деньги приходят ко мне легко и вовремя','Моё дело крепнет с каждым днём','Я замечаю возможности раньше, чем они становятся очевидны',
 'Спокойный ум принимает точные решения','Я вкладываю туда, где растёт, и отпускаю то, что тянет вниз','Моя команда сильная, вместе мы можем больше','Всё, что мне нужно для роста, уже идёт ко мне',
 'Я доверяю своему опыту и проверяю цифрами','Сегодняшний шаг окупится многократно','Я создаю ценность, и она возвращается прибылью','У меня достаточно времени, сил и средств на главное'];
const aff=(()=>{let i=0,tm=0,on=false,ord=[];
  const mix=()=>{let s=Math.floor(Date.now()/1728e5)%2147483647||7;const r=()=>(s=s*48271%2147483647)/2147483647;ord=AFF.map((_,j)=>j);for(let j=ord.length-1;j>0;j--){const q=Math.floor(r()*(j+1));[ord[j],ord[q]]=[ord[q],ord[j]]}};
  const draw=()=>{const el=$('#aff');if(!el||!on)return;ORI.turn(i);const t=AFF[ord[i%ord.length]];
    el.innerHTML=`<canvas class="cst" aria-hidden="true"></canvas><div class="cap">Орбита дня</div><div class="q">${t.split(' ').map((w,j)=>`<span style="animation-delay:${j*70}ms">${esc(w)}</span>`).join(' ')}</div><div class="dots">${ord.slice(0,6).map((_,j)=>`<i class="${j===i%6?'on':''}"></i>`).join('')}</div><span class="go">${esc(ORI.goText())}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>`;
    el.onclick=e=>{if(e.target.closest('.dots')){next();return}ORI.open(ORI.cardId())};ORI.card()};
  const next=()=>{i=(i+1)%ord.length;draw();arm()},arm=()=>{clearTimeout(tm);if(on)tm=setTimeout(next,9000)};
  return {start(){if(!ord.length)mix();on=true;draw();arm()},stop(){on=false;clearTimeout(tm)},draw(){if(on)draw()}}})();
const affDraw=()=>aff.draw();

/* «Космос»: музыка — её играет сама страница (ни одного файла): медленные аккорды, редкие колокольчики, далёкий гул */
const AMB=(()=>{let ac=null,master=null,rev=null,tm=[],on=false,liked=PS.get('snd',true),step=0;
  const CH=[[146.83,220,261.63,329.63,440],[116.54,174.61,233.08,293.66,349.23],[174.61,261.63,329.63,392,523.25],[130.81,196,246.94,329.63,392]],BELL=[587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
  const mk=()=>{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0;
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;master.connect(comp);comp.connect(ac.destination);
    const len=ac.sampleRate*5,buf=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let j=0;j<len;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/len,2.6)}
    rev=ac.createConvolver();rev.buffer=buf;const rg=ac.createGain();rg.gain.value=.85;rev.connect(rg);rg.connect(master);
    const sub=ac.createOscillator(),sg=ac.createGain();sub.type='sine';sub.frequency.value=55;sg.gain.value=.05;sub.connect(sg);sg.connect(master);sub.start()};
  const pad=()=>{if(!on)return;const t=ac.currentTime,ch=CH[step++%CH.length],dur=17;
    ch.forEach((f,j)=>{for(const det of [-5,6]){const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();o.type=j<2?'triangle':'sine';o.frequency.value=f;o.detune.value=det+Math.random()*3;
      lp.type='lowpass';lp.frequency.setValueAtTime(420,t);lp.frequency.linearRampToValueAtTime(1150,t+dur*.5);lp.frequency.linearRampToValueAtTime(380,t+dur+7);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(j?.032:.046,t+6);g.gain.setValueAtTime(j?.032:.046,t+dur-3);g.gain.linearRampToValueAtTime(0,t+dur+7);
      o.connect(lp);lp.connect(g);g.connect(master);g.connect(rev);o.start(t);o.stop(t+dur+7.2);o.onended=()=>{try{g.disconnect();lp.disconnect()}catch(e){}}}});
    tm.push(setTimeout(pad,dur*1000))};
  const bell=()=>{if(!on)return;const t=ac.currentTime,f=BELL[Math.floor(Math.random()*BELL.length)],o=ac.createOscillator(),g=ac.createGain(),dl=ac.createDelay(1),fb=ac.createGain();
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.03);g.gain.exponentialRampToValueAtTime(.0004,t+4.5);
    dl.delayTime.value=.46;fb.gain.value=.34;o.connect(g);g.connect(rev);g.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(rev);o.start(t);o.stop(t+4.7);
    o.onended=()=>setTimeout(()=>{try{g.disconnect();dl.disconnect();fb.disconnect()}catch(e){}},4000);
    tm.push(setTimeout(bell,3500+Math.random()*7000))};
  const play=()=>{if(on||!liked)return;try{if(!ac)mk();ac.resume();on=true;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(.7,ac.currentTime,1.6);pad();tm.push(setTimeout(bell,5000))}catch(e){on=false}};
  const stop=()=>{if(!on)return;on=false;tm.forEach(clearTimeout);tm=[];try{master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(0,ac.currentTime,.25);setTimeout(()=>{if(!on&&ac)ac.suspend()},1500)}catch(e){}};
  const btn=$('#sndBtn');btn.setAttribute('aria-pressed',liked);
  btn.onclick=()=>{liked=!liked;PS.set('snd',liked);btn.setAttribute('aria-pressed',liked);if(liked)play();else stop()};
  // браузер разрешает звук только после касания: музыка «Космоса» начинается с первого нажатия на странице
  const first=()=>{if(document.documentElement.dataset.theme==='space'&&liked&&!on)play()};
  ['pointerdown','keydown'].forEach(k=>document.addEventListener(k,first,{passive:true}));
  document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden){if(on){try{ac.suspend()}catch(e){}}}else if(on)try{ac.resume()}catch(e){}});
  return {want(){play()},stop,get ac(){return ac},get out(){return master},get on(){return on}}})();

function finRole(){   // пароль «только Панель»: других сервисов в шапке нет
  document.documentElement.dataset.role=ROLE;
  if(ROLE!=='fin')return;
  const b=$('#svcBtn'),m=$('#svcMenu');if(b){const c=b.cloneNode(true);c.removeAttribute('aria-haspopup');c.removeAttribute('aria-controls');c.removeAttribute('title');c.tabIndex=-1;b.replaceWith(c)}if(m)m.remove();

}
async function boot(pass){
  try{D=await load(pass)}catch(e){
    if(e.message==='NEED_PASS'||e.message==='BAD_PASS'){const L=$('#lock');if(!$('#pwf'))L.innerHTML=LOCKF;L.hidden=false;$('#pwerr').textContent=pass?'Пароль не подошёл':'';$('#pwgo').disabled=false;setTimeout(()=>$('#pw').focus(),60);return}
    $('#view').innerHTML=`<div class="empty"><b>Не открылось</b>${e.message==='NO_GZ'?'Этот браузер слишком старый. Обновите его или откройте в другом.':esc(e.message)}<br><br><button class="tbtn press" onclick="location.reload()">Повторить</button></div>`;return}
  $('#lock').hidden=true;$('#lock').innerHTML='';finRole();prep();
  const h=location.hash.match(/p=(wb|ozon|ym):(\d+)/);
  sync();render();if(h)openProd(h[1]+':'+h[2]);
  K3.boot();
  loadSpp();
}
/* 12.11 Андрей: «выскакивает в поиске пароль постоянно» — поле пароля лежало на странице всегда (спрятанное), и браузер считал поля поиска логином к нему:
   при тапе в них предлагал сохранённый пароль. Теперь окно пароля — отдельная форма со своим «логином» и есть на странице, только пока спрашиваем пароль
   (как в «Конкурентах» и «Закупках»); вход — событие submit формы: и кнопка, и Enter */
const LOCKF="<form class=\"card\" id=\"pwf\"><div class=\"lg\"><svg viewBox=\"0 0 32 32\" fill=\"none\"><path d=\"M6 21l5.5-6 4.5 3.5L25 9\" stroke=\"#5ef2c4\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"25\" cy=\"9\" r=\"2.6\" fill=\"#fff59d\"/></svg></div><h1>Панель</h1><div class=\"lbl\">Продажи, прибыль и реклама по товарам.<br>Введите пароль.</div><input type=\"text\" name=\"username\" autocomplete=\"username\" value=\"Сервисы\" readonly tabindex=\"-1\" aria-hidden=\"true\" style=\"position:absolute;left:-9999px;top:0;width:1px;height:1px;min-height:0;padding:0;margin:0;border:0;opacity:0;pointer-events:none\"><input id=\"pw\" name=\"password\" type=\"password\" autocomplete=\"current-password\" aria-label=\"Пароль\"><button class=\"btn press\" id=\"pwgo\" type=\"submit\">Открыть</button><div id=\"pwerr\"></div></form>";
$('#lock').addEventListener('submit',e=>{e.preventDefault();const p=$('#pw').value.trim();if(!p)return;$('#pwgo').disabled=true;$('#pwerr').textContent='';boot(p)});
themeInit();

if(window.svcBack)svcBack({pop:[()=>K3.see(false),()=>ORI.close(),()=>{if(shw.classList.contains('on')&&SHB.length&&openSh(SHB.pop()))return true;return closeSheet()}],main:()=>{if(S.tab!=='sum'){go('sum');return true}return false},home:()=>{}});
window.PANEL={get D(){return D},K3,fresh,sysDraw,S,go,met,totals,items,curK,plist,aggr,cover,AMB,ORI,get role(){return ROLE},
  prods,skls:sklsC,joined,filt,render,get TOV(){return TOV},clear(){C={}},same:(g,k)=>paces(items(g,k),g,k,fS)};
boot();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/shov/sw.js').catch(()=>{});
