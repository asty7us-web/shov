<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Конкуренты Озон</title>
<meta name="theme-color" content="#f2f2f7" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Конкуренты">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/shov/manifest.webmanifest">
<link rel="apple-touch-icon" href="/shov/pwa/apple-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23005bff'/%3E%3Crect x='7' y='16' width='4' height='9' rx='2' fill='white'/%3E%3Crect x='14' y='11' width='4' height='14' rx='2' fill='white'/%3E%3Crect x='21' y='7' width='4' height='18' rx='2' fill='white'/%3E%3C/svg%3E">
<script>(function(){try{var t=JSON.parse(localStorage.getItem('konk.theme')||'"auto"');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}})()</script>
<style>
/* «Конкуренты Озон». Телефон в первую очередь: закреплённая шапка с переключателем «Склейки | Конкуренты» и выбором товара,
   нижняя панель разделов, листы снизу. Темы: светлая, тёмно-серая, авто. Методика — видео Вовы 21.10.2026. */
:root{
  --bg:#f2f2f7;--card:#ffffff;--card2:#f7f7fa;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.08);
  --ink:#0b0b0f;--ink2:#55555e;--ink3:#8e8e96;--line:rgba(60,60,67,.12);--line2:rgba(60,60,67,.07);
  --hdr:rgba(246,246,250,.78);--acc:#005bff;--acc2:#3d7bff;--acc-soft:rgba(0,91,255,.11);--on-acc:#fff;
  --good:#1f9d55;--warn:#d97706;--bad:#e5383b;--good-soft:rgba(31,157,85,.12);--warn-soft:rgba(217,119,6,.13);--bad-soft:rgba(229,56,59,.11);
  --bar:#c7c7cf;--bar-us:var(--acc);
  --sh1:0 1px 1px rgba(0,0,0,.03),0 2px 8px rgba(0,0,0,.04);--sh2:0 2px 4px rgba(0,0,0,.04),0 16px 40px -12px rgba(0,0,0,.18);
  --r:20px;--ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  --bg:#1c1c1e;--card:#2c2c2e;--card2:#323235;--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.16);
  --ink:#f5f5f7;--ink2:#c3c3c8;--ink3:#8e8e93;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.06);
  --hdr:rgba(28,28,30,.78);--acc:#4d8dff;--acc2:#6aa0ff;--acc-soft:rgba(77,141,255,.18);--on-acc:#0a1430;
  --good:#32d74b;--warn:#ff9f0a;--bad:#ff5a5f;--good-soft:rgba(50,215,75,.15);--warn-soft:rgba(255,159,10,.16);--bad-soft:rgba(255,90,95,.16);
  --bar:#5a5a60;--sh1:0 1px 1px rgba(0,0,0,.2);--sh2:0 2px 6px rgba(0,0,0,.3),0 20px 50px -16px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1c1e;--card:#2c2c2e;--card2:#323235;--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.16);
  --ink:#f5f5f7;--ink2:#c3c3c8;--ink3:#8e8e93;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.06);
  --hdr:rgba(28,28,30,.78);--acc:#4d8dff;--acc2:#6aa0ff;--acc-soft:rgba(77,141,255,.18);--on-acc:#0a1430;
  --good:#32d74b;--warn:#ff9f0a;--bad:#ff5a5f;--good-soft:rgba(50,215,75,.15);--warn-soft:rgba(255,159,10,.16);--bad-soft:rgba(255,90,95,.16);
  --bar:#5a5a60;--sh1:0 1px 1px rgba(0,0,0,.2);--sh2:0 2px 6px rgba(0,0,0,.3),0 20px 50px -16px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  transition:background-color .35s var(--ease),color .35s var(--ease)}
a{color:var(--acc);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
.press{transition:transform .35s var(--spring),box-shadow .3s var(--ease),background-color .25s var(--ease)}
.press:active{transform:scale(.97);transition-duration:.12s}
@media (hover:hover){.lift:hover{transform:translateY(-2px);box-shadow:var(--sh2)}}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:12px}

/* шапка */
.top{position:sticky;top:0;z-index:40;background:var(--hdr);backdrop-filter:saturate(1.8) blur(22px);-webkit-backdrop-filter:saturate(1.8) blur(22px);
  border-bottom:.5px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{max-width:1240px;margin:0 auto;height:52px;padding:0 14px;display:flex;align-items:center;gap:10px}
.apps{display:flex;padding:2px;border-radius:11px;background:var(--fill);flex:none}
.apps>a,.apps>span{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.apps>.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.apps svg{width:15px;height:15px}
.ctx{flex:1;min-width:0;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(6px);transition:opacity .3s var(--ease),transform .4s var(--out);pointer-events:none}
.top.mini .ctx{opacity:1;transform:none;pointer-events:auto}
.ctx img{width:28px;height:28px;border-radius:8px;object-fit:cover;background:var(--fill);flex:none}
.ctx b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx i{font-style:normal;color:var(--ink3);font-size:12.5px;white-space:nowrap}
.ctx svg{width:14px;height:14px;color:var(--ink3);flex:none}
.ctx b{flex:0 1 auto;min-width:0}
@media (max-width:959px){
  .apps>a,.apps>span{transition:padding .35s var(--out)}
  .apps .lbl{display:inline-block;max-width:120px;overflow:hidden;transition:max-width .4s var(--out),opacity .25s}
  .top.mini .apps .lbl{max-width:0;opacity:0}
  .top.mini .apps>a,.top.mini .apps>span{padding:6px 9px;gap:0}
  .ctx i{display:none}
}
.top:not(.mini) .ctx{position:absolute;visibility:hidden}
.top.mini .sp{display:none}
.sp{flex:1}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--fill);color:var(--ink2);flex:none}
.inst{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:11px;background:var(--acc);color:#fff;font-size:13.5px;font-weight:650;flex:none;animation:pop .6s var(--spring) both}
.inst[hidden]{display:none}
.inst svg{width:17px;height:17px}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@media (max-width:420px){.inst span{display:none}.inst{padding:0 10px}}
.top.mini .inst span{display:none}
.ico svg{width:19px;height:19px}
.dtabs{display:none}
.picker{max-width:1240px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;scrollbar-width:none;scroll-snap-type:x proximity;
  max-height:70px;transition:max-height .45s var(--out),opacity .3s var(--ease),padding .45s var(--out)}
.picker::-webkit-scrollbar{display:none}
.top.mini .picker{max-height:0;opacity:0;padding-bottom:0}
.chip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border-radius:15px;background:var(--card);box-shadow:var(--sh1);text-align:left;max-width:240px;position:relative}
.chip img{width:40px;height:40px;border-radius:11px;object-fit:cover;background:var(--fill);flex:none}
.chip b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.chip span{display:block;font-size:12px;color:var(--ink3);white-space:nowrap}
.chip.on{box-shadow:0 0 0 2px var(--acc),var(--sh1)}
.dot{position:absolute;top:5px;left:5px;width:10px;height:10px;border-radius:50%;border:2px solid var(--card)}
.dot.r{background:var(--bad)}.dot.o{background:var(--warn);left:auto;right:6px}

/* нижняя панель разделов */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--hdr);backdrop-filter:saturate(1.8) blur(22px);-webkit-backdrop-filter:saturate(1.8) blur(22px);
  border-top:.5px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tb{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--ink3);font-size:11px;font-weight:600;position:relative}
.tb svg{width:25px;height:25px;transition:transform .45s var(--spring)}
.tb.on{color:var(--acc)}
.tb.on svg{transform:scale(1.08)}
.badge{position:absolute;top:0;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
main{max-width:1240px;margin:0 auto;padding:6px 14px calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:960px){
  .tabbar{display:none}
  main{padding-bottom:60px}
  .dtabs{display:flex;padding:2px;border-radius:11px;background:var(--fill);margin-left:auto}
  .dtabs button{padding:6px 16px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);position:relative}
  .dtabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .dtabs .badge{top:-6px;left:auto;right:-6px}
  .sp{display:none}
}

/* типографика и блоки */
.lt{font:700 30px/1.1 var(--fd);letter-spacing:-.022em;margin:14px 2px 2px}
.sub{color:var(--ink2);font-size:14px;margin:2px 2px 14px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 2px 10px}
.sec h2{font:700 21px/1.15 var(--fd);letter-spacing:-.018em;margin:0}
.sec span{color:var(--ink3);font-size:13px;text-align:right}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh1)}
.pad{padding:16px}
.mut{color:var(--ink3)}.up{color:var(--good)}.dn{color:var(--bad)}
.reveal{opacity:0;transform:translateY(14px) scale(.985);transition:opacity .6s var(--out),transform .7s var(--out)}
.reveal.in{opacity:1;transform:none}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--warn-soft);color:var(--ink);margin:10px 0 2px;font-size:14px}
.banner svg{width:22px;height:22px;color:var(--warn);flex:none}
.banner.bad{background:var(--bad-soft)}.banner.bad svg{color:var(--bad)}

/* герой товара */
.hero{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:14px;align-items:center}
.hero img{width:96px;height:96px;border-radius:16px;object-fit:cover;background:var(--fill)}
.hero h1{font:700 22px/1.15 var(--fd);letter-spacing:-.02em;margin:0}
.hero p{margin:4px 0 0;color:var(--ink2);font-size:13.5px}
.hero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--good-soft);color:var(--good)}.tag.wait{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.acc{background:var(--acc-soft);color:var(--acc)}
.tag svg{width:13px;height:13px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{padding:13px 14px 14px;min-width:0}
.tile .l{font-size:12.5px;color:var(--ink2);font-weight:500}
.tile .v{font:700 26px/1.1 var(--fd);letter-spacing:-.025em;margin-top:5px;white-space:nowrap}
.tile .v small{font-size:15px;font-weight:600;letter-spacing:0;margin-left:2px;color:var(--ink2)}
.tile .s{font-size:12.5px;color:var(--ink2);margin-top:4px}
.meter{position:relative;height:6px;border-radius:3px;background:var(--fill);margin-top:10px;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--acc);width:0;transition:width 1.1s var(--out)}
.meter b{position:absolute;top:-4px;width:2px;height:14px;border-radius:1px;background:var(--ink2);opacity:.6}
.in .meter i{width:var(--w)}

/* карусель конкурентов */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 14px 14px;margin:0 -14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.cc{flex:none;width:min(60vw,236px);scroll-snap-align:start;scroll-margin-left:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.cc .ph{position:relative;aspect-ratio:1/1;background:var(--fill2)}
.cc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.cc .ph .tag{position:absolute;left:10px;top:10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.cc .ph .tag.ok{background:rgba(31,157,85,.88);color:#fff}.cc .ph .tag.wait{background:rgba(217,119,6,.9);color:#fff}
.cc .ph .n{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;backdrop-filter:blur(10px)}
.cc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.cc .se{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .pr{display:flex;align-items:baseline;gap:8px}
.cc .pr b{font:700 20px/1 var(--fd);letter-spacing:-.02em}
.cc .pr span{font-size:12.5px;font-weight:600}
.cc .ln{font-size:13px;color:var(--ink2)}
.cc .vd{font-size:12.5px;color:var(--ink2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc.us{box-shadow:0 0 0 2px var(--acc),var(--sh1)}
@media (min-width:960px){.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));overflow:visible;margin:0;padding:4px 0 10px}.cc{width:auto}}

/* сравнение полосками */
.seg{display:flex;gap:2px;padding:2px;border-radius:11px;background:var(--fill);overflow-x:auto;scrollbar-width:none;margin:0 0 12px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:background-color .3s var(--ease),color .3s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mgrid{display:grid;gap:10px}
@media (min-width:760px){.mgrid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mc{padding:14px 14px 10px}
.mc h3{margin:0;font-size:15px;font-weight:650;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mc h3 em{font-style:normal;font-weight:500;font-size:12px;color:var(--ink3);white-space:nowrap}
.mc .verdict{font-size:12.5px;margin:3px 0 8px;color:var(--ink2)}
.br{display:grid;grid-template-columns:22px minmax(0,96px) 1fr auto;align-items:center;gap:8px;padding:5px 0;border-radius:8px;cursor:default}
.br img{width:22px;height:22px;border-radius:7px;object-fit:cover;background:var(--fill)}
.br .nm{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .tr{height:10px;border-radius:5px;background:var(--fill2);position:relative;overflow:hidden}
.br .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--bar);width:0;transition:width 1s var(--out)}
.in .br .tr i{width:var(--w)}
.br .vl{font-size:13px;font-weight:600;min-width:58px;text-align:right}
.br.us .nm{color:var(--ink);font-weight:700}.br.us .tr i{background:var(--acc)}
.br.pend img{outline:2px dashed var(--warn);outline-offset:1px}
.cc .ph .vt{position:absolute;left:10px;bottom:10px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.br.best .vl::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-left:5px;vertical-align:middle}
@media (hover:hover){.br:hover{background:var(--fill2)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:10px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--bar)}.legend i.a{background:var(--acc)}.legend i.g{border-radius:50%;width:7px;height:7px;background:var(--good)}

/* советы */
.adv{display:flex;flex-direction:column;gap:10px}
.ad{padding:14px 16px;text-align:left;width:100%}
.ad .h{display:flex;gap:12px;align-items:flex-start}
.ad .k{flex:none;width:28px;height:28px;border-radius:9px;background:var(--acc-soft);color:var(--acc);font-weight:700;display:grid;place-items:center;font-size:14px}
.ad b{font-size:15px;font-weight:650;display:block;line-height:1.3}
.ad .w{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.45}
.ad .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--out)}
.ad .more>div{overflow:hidden}
.ad.open .more{grid-template-rows:1fr}
.ad .do{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--fill2);font-size:13.5px;line-height:1.45}
.ad .chev{margin-left:auto;width:18px;height:18px;color:var(--ink3);transition:transform .4s var(--spring);flex:none}
.ad.open .chev{transform:rotate(90deg)}

/* ключи */
.kc{padding:14px 14px 12px;margin-bottom:12px}
.kc .hd{display:flex;gap:12px;align-items:flex-start}
.kc .q{font-size:16px;font-weight:650;line-height:1.3}
.kc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.kc .now{margin-left:auto;text-align:right;flex:none}
.kc .now b{font:700 28px/1 var(--fd);letter-spacing:-.03em;display:block}
.kc .now span{font-size:11.5px;color:var(--ink3)}
.chart{position:relative;margin-top:10px}
.chart svg{display:block;width:100%;overflow:visible}
.lane{position:relative;height:56px;margin:12px 4px 2px}
.lane .ax{position:absolute;left:0;right:0;top:27px;height:2px;border-radius:1px;background:var(--fill)}
.lane .tk{position:absolute;top:33px;font-size:10.5px;color:var(--ink3);transform:translateX(-50%)}
.lane .pt{position:absolute;top:28px;transform:translate(-50%,-50%);transition:left 1s var(--out)}
.lane .pt img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.2);display:block;background:var(--fill)}
.lane .pt.us{z-index:2}
.lane .pt.us i{display:block;width:16px;height:16px;border-radius:50%;background:var(--acc);border:3px solid var(--card);box-shadow:0 0 0 4px var(--acc-soft)}
.lane .pt.us em{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;color:var(--acc);white-space:nowrap}
.lane .lb{position:absolute;top:0;font-size:11px;color:var(--ink3)}
.top3{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* склады */
.cl{display:grid;gap:10px}

/* лист снизу, подсказка, замок */
.shw{position:fixed;inset:0;z-index:60;pointer-events:none}

.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;background:var(--card);border-radius:24px 24px 0 0;transform:translateY(105%);visibility:hidden;
  transition:transform .55s var(--out),visibility 0s linear .55s;display:flex;flex-direction:column;box-shadow:var(--sh2);padding-bottom:env(safe-area-inset-bottom,0px)}

@media (min-width:760px){.sheet{left:50%;width:620px;margin-left:-310px;bottom:auto;top:50%;border-radius:24px;transform:translateY(-46%) scale(.96);opacity:0;transition:transform .5s var(--out),opacity .3s}
  .shw.on .sheet{transform:translateY(-50%) scale(1);opacity:1}}
.grab{padding:8px 0 4px;display:grid;place-items:center;touch-action:none;cursor:grab}

  max-width:240px;box-shadow:var(--sh2);opacity:0;transform:translateY(4px) scale(.98);transition:opacity .18s,transform .25s var(--out)}

.btn.ghost{background:var(--fill);color:var(--ink)}
.skel{height:120px;border-radius:var(--r);margin:12px 0;background:linear-gradient(90deg,var(--fill2),var(--fill),var(--fill2));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
.view-in{animation:vin .45s var(--out) both}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

<body>
<header class="top" id="top">

      <span class="on" title="Конкуренты"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4.5" height="9" rx="1.5"/><rect x="9.75" y="7" width="4.5" height="14" rx="1.5"/><rect x="16.5" y="3" width="4.5" height="18" rx="1.5"/></svg><span class="lbl">Конкуренты</span></span>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LS={get(k,d){try{const v=localStorage.getItem('shov.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('shov.'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('shov.'+k)}catch(e){}}};
const KS={get(k,d){try{const v=localStorage.getItem('konk.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('konk.'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null,SALT=null,D=null,P=null;
const S={t:KS.get('tab','konk'),sku:KS.get('sku',null),grp:KS.get('grp','sales')};

/* ---------- данные: ключ общий со Склейками (пароль Юнитки) ---------- */
async function deriveKey(pass,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64u8(salt),iterations:iter},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function load(pass){
  const res=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw new Error('Данные не загрузились ('+res.status+')');
  const enc=await res.json();
  if(!KEY||SALT!==enc.salt){
    const kc=LS.get('kc',null);
    if(!pass&&kc&&kc.salt===enc.salt)KEY=await crypto.subtle.importKey('raw',b64u8(kc.k),'AES-GCM',false,['decrypt']);
    else{let p=pass||LS.get('pass','');if(!p){try{p=JSON.parse(localStorage.getItem('unitka.pass')||'""')}catch(e){p=''}}if(!p)throw new Error('NEED_PASS');KEY=await deriveKey(p,enc.salt,enc.iter);pass=p}
    SALT=enc.salt;
  }
  let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(enc.iv)},KEY,b64u8(enc.ct))}catch(e){KEY=null;LS.del('kc');throw new Error('BAD_PASS')}
  if(pass){LS.set('pass',pass);try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',KEY));let bin='';raw.forEach(x=>bin+=String.fromCharCode(x));LS.set('kc',{salt:enc.salt,k:btoa(bin)})}catch(e){}}
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ---------- формат ---------- */
const NF=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}),N1=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}),N2=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const ok=v=>v!=null&&!isNaN(v);
const fi=v=>ok(v)?NF.format(v):'—';
const fr=v=>ok(v)?NF.format(v)+' ₽':'—';
const fk=v=>!ok(v)?'—':Math.abs(v)>=1e6?N1.format(v/1e6)+' млн ₽':Math.abs(v)>=1e4?NF.format(v/1e3)+' тыс ₽':NF.format(v)+' ₽';
const fp=v=>ok(v)?(Math.abs(v)<1&&v!==0?N2:N1).format(v)+'%':'—';
const fd=v=>ok(v)?`<span class="${v>=0?'up':'dn'}">${v>0?'+':''}${NF.format(v)}%</span>`:'';
const med=a=>{a=a.filter(ok).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const ddmm=s=>s?s.slice(8,10)+'.'+s.slice(5,7):'';
const plur=(n,a,b,c)=>{const m=Math.abs(n)%100,k=m%10;return m>10&&m<20?c:k===1?a:k>=2&&k<=4?b:c};
const dlv=s=>{const m=(s||'').match(/\d+/g);return m?+m[m.length-1]:null};
const short=s=>(s||'').replace(/[«»"]/g,'').replace(/^(ООО|ИП|АО|ТД)\s*/,'').trim().slice(0,22)||'—';
const img=(src,cls)=>`<img src="${esc(src||'')}" alt="" loading="lazy" decoding="async"${cls?` class="${cls}"`:''} onerror="this.style.visibility='hidden'">`;
const IC={
 konk:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4.5" height="9" rx="1.5"/><rect x="9.75" y="7" width="4.5" height="14" rx="1.5"/><rect x="16.5" y="3" width="4.5" height="18" rx="1.5"/></svg>',
 keys:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/><path d="M7.5 11.5 9.6 9.4l1.8 1.8 2.3-2.4"/></svg>',
 sklad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5V20H3z"/><path d="M7.5 20v-6h9v6M7.5 16.5h9"/></svg>',
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>',
 auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor" stroke="none"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
 down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
 warn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8 1.6 20.5h20.8zM11 9h2v6h-2zm0 7.6h2v2h-2z"/></svg>',
 ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
};
const TABS=[['konk','Конкуренты'],['keys','Ключи'],['sklad','Склады']];

/* ---------- тема ---------- */
const THEMES=['auto','light','dark'],TNAME={auto:'Авто',light:'Светлая',dark:'Тёмно-серая'};
function applyTheme(t,anim){
  const r=document.documentElement;if(t==='auto')delete r.dataset.theme;else r.dataset.theme=t;
  $('#themeBtn').innerHTML=t==='light'?IC.sun:t==='dark'?IC.moon:IC.auto;$('#themeBtn').title='Тема: '+TNAME[t];
  const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);$('#tc').content=dark?'#1c1c1e':'#f2f2f7';
  if(anim)toast('Тема: '+TNAME[t]);
}
$('#themeBtn').onclick=()=>{const t=THEMES[(THEMES.indexOf(KS.get('theme','auto'))+1)%3];KS.set('theme',t);applyTheme(t,true)};
applyTheme(KS.get('theme','auto'));

/* ---------- подсказка ---------- */
const tip=$('#tip');let tipT=0;
function showTip(html,x,y){tip.innerHTML=html;tip.classList.add('on');const r=tip.getBoundingClientRect();let L=Math.min(Math.max(8,x-r.width/2),innerWidth-r.width-8),T=y-r.height-14;if(T<8)T=y+18;tip.style.left=L+'px';tip.style.top=T+'px';clearTimeout(tipT)}
function hideTip(d){clearTimeout(tipT);tipT=setTimeout(()=>tip.classList.remove('on'),d||0)}
function toast(t){showTip(t,innerWidth/2,innerHeight-110);hideTip(1400)}
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(el&&e.pointerType==='mouse'){const r=el.getBoundingClientRect();showTip(el.dataset.tip,r.left+r.width/2,r.top)}});
document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]'))hideTip(80)});
document.addEventListener('click',e=>{const el=e.target.closest('[data-tip]');if(el&&!el.closest('button,a')){const r=el.getBoundingClientRect();showTip(el.dataset.tip,r.left+r.width/2,r.top);hideTip(2600)}});

/* ---------- лист снизу ---------- */
const shw=$('#shw'),sheet=$('#sheet');
function openSheet(html){$('#sbody').innerHTML=html;shw.classList.add('on');document.body.style.overflow='hidden';$('#sbody').scrollTop=0;reveal($('#sbody'))}
function closeSheet(){shw.classList.remove('on');document.body.style.overflow='';sheet.style.transform=''}
$('#scrim').onclick=closeSheet;$('#sx').onclick=closeSheet;addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
(()=>{let y0=null,dy=0;const g=$('#grab');
  g.addEventListener('pointerdown',e=>{if(innerWidth>=760)return;y0=e.clientY;dy=0;sheet.style.transition='none';g.setPointerCapture(e.pointerId)});
  g.addEventListener('pointermove',e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sheet.style.transform=`translateY(${dy}px)`});
  g.addEventListener('pointerup',()=>{if(y0==null)return;sheet.style.transition='';if(dy>110)closeSheet();else sheet.style.transform='';y0=null});})();

/* ---------- приложение: установка на рабочий стол / главный экран (Андрей 25.10) ---------- */
let BIP=null;const STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/shov/sw.js',{scope:'/shov/'}).catch(()=>{});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();BIP=e;if(!STANDALONE)$('#instBtn').hidden=false});
addEventListener('appinstalled',()=>{$('#instBtn').hidden=true;BIP=null;toast('Приложение установлено')});
if(IOS&&!STANDALONE)$('#instBtn').hidden=false;
$('#instBtn').onclick=async()=>{

let IO=null;
function reveal(root){
  const els=[...(root||document).querySelectorAll('.reveal:not(.in)')];

  if(!IO)IO=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const el=en.target;el.classList.add('in');IO.unobserve(el);countUp(el)}}),{rootMargin:'0px 0px -6% 0px'});
  els.forEach((e,i)=>{e.style.transitionDelay=Math.min(i%8,7)*45+'ms';IO.observe(e)});
}

  ${adv.length?`<div class="sec"><h2>Что доделать до топа</h2><span>разбор ${esc((p.advice||{}).at||'')}</span></div><div class="adv">${adv.map((x,i)=>`<button class="card ad press reveal${i===0?' open':''}"><div class="h"><span class="k">${i+1}</span><div style="min-width:0;flex:1"><b>${esc(x.title)}</b><div class="w">${esc(x.why||'')}</div></div>${IC.chev}</div><div class="more"><div>${x.do?`<div class="do"><b style="font-size:13px;display:inline">Что сделать: </b>${esc(x.do)}</div>`:''}</div></div></button>`).join('')}</div>`:''}
  <div class="sec"><h2>Закупка и рынок</h2><span></span></div><div class="mgrid">${zakup(p)}${others(p)}</div>
  ${(p.rejected||[]).length?`<div style="margin-top:16px"><button class="btn ghost press" id="rej">Почему не взяли других · ${p.rejected.length}</button></div>`:''}`;
}

/* ---------- раздел «Ключи» ---------- */
const pc=v=>!ok(v)?'p0':v<=10?'p1':v<=30?'p2':'p3';
function lineChart(p,k){
  const days=Object.keys((p.hist||{}).day||{}).sort().slice(-14);
  const pts=days.map(d=>{const v=((p.hist.day[d]||{})[k.q])||null;return {d,v:v&&v.pos?v.pos:null,o:v&&v.orders}});
  const live=((p.hist||{}).live||{})[k.q]||[];
  const now=(snapRow(p,p.sku,k.q)||{}).pos;
  const vs=pts.map(x=>x.v).filter(ok).concat(ok(now)?[now]:[]);
  if(vs.length<2)return '<div class="note">Истории позиций пока мало — точки появятся с каждым днём.</div>';
  const W=Math.max(280,Math.min(1180,(($('#view')||{}).clientWidth||360)-(innerWidth>=760?60:30))),H=130,pl=6,pr=30,pt=10,pb=22,mx=Math.max(...vs)*1.08,mn=1;
  const X=i=>pl+(W-pl-pr)*(days.length>1?i/(days.length-1):0),Y=v=>pt+(H-pt-pb)*((Math.log(v)-Math.log(mn))/(Math.log(mx)-Math.log(mn)||1));
  let d='',started=false;pts.forEach((x,i)=>{if(!ok(x.v)){started=false;return}d+=(started?'L':'M')+X(i).toFixed(1)+' '+Y(x.v).toFixed(1);started=true});
  const grid=[1,10,30,100,300].filter(v=>v<=mx).map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line2)" stroke-width="1"/><text x="${W-pr+6}" y="${Y(v)+4}" font-size="11" fill="var(--ink3)">${v}</text>`).join('');
  const area=pts.some(x=>ok(x.v))?`<path d="${d.replace(/M/g,'M')}" fill="none"/>`:'';
  const dots=pts.map((x,i)=>ok(x.v)?`<circle cx="${X(i)}" cy="${Y(x.v)}" r="4" fill="var(--acc)" stroke="var(--card)" stroke-width="2"/>`:'').join('');
  const hits=pts.map((x,i)=>`<rect x="${X(i)-(W/days.length)/2}" y="0" width="${W/days.length}" height="${H}" fill="transparent" data-tip="<b>${ddmm(x.d)}</b>${ok(x.v)?'Средняя позиция '+NF.format(x.v)+(x.o?' · заказов '+x.o:''):'По запросу не показывали'}"/>`).join('');
  const stp=Math.ceil(days.length/5),lbl=days.map((x,i)=>(i%stp===0&&days.length-1-i>=stp/2)||i===days.length-1?`<text x="${X(i)}" y="${H-4}" font-size="11" fill="var(--ink3)" text-anchor="middle">${ddmm(x)}</text>`:'').join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" style="height:auto;max-height:${H}px">${grid}<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" class="ln" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:${RM?0:1};transition:stroke-dashoffset 1.4s var(--out)"/>${dots}${lbl}${hits}</svg></div>`;
}
function lane(p,k){
  const sk=((p.snap||{}).keys||{})[k.q]||{},rows=sk.rows||{};const us=rows[p.sku];
  const cs=(p.comps||[]).map(c=>({c,r:rows[c.sku]})).filter(x=>x.r&&x.r.pos);
  const ps=cs.map(x=>x.r.pos).concat(us&&us.pos?[us.pos]:[]);if(!ps.length)return '';
  const mx=Math.max(50,...ps)*1.05,L=v=>(Math.log(v)/Math.log(mx))*100;
  const ticks=[1,10,30,100,300].filter(v=>v<mx);
  cs.sort((a,b)=>a.r.pos-b.r.pos);let last=-99,flip=0;cs.forEach(x=>{const l=L(x.r.pos);if(l-last<6){flip++;x.dy=(flip%2?-14:14)}else{flip=0;x.dy=0}last=l});   // близкие позиции — разводим вверх/вниз
  return `<div class="lane" aria-label="Позиции в выдаче сейчас"><span class="lb">сейчас в выдаче, Москва · ${fi(sk.total)} товаров</span><div class="ax"></div>${ticks.map(v=>`<span class="tk" style="left:${L(v)}%">${v}</span>`).join('')}
   ${cs.map(x=>`<span class="pt" style="left:${L(x.r.pos)}%;margin-top:${x.dy}px" data-tip="<b>${esc(short(x.c.seller))} — ${x.r.pos}-е место</b>${x.r.cpc?'ставка '+N1.format(x.r.cpc)+' ₽ за клик':'без рекламы'}${x.r.price?' · '+fr(x.r.price):''}">${img(x.c.photo)}</span>`).join('')}
   ${us&&us.pos?`<span class="pt us" style="left:${L(us.pos)}%" data-tip="<b>Мы — ${us.pos}-е место</b>${us.cpc?'ставка '+N1.format(us.cpc)+' ₽ за клик':'без рекламы'}"><i></i><em>мы ${us.pos}</em></span>`:''}</div>`;
}
function vKeys(p){
  const ks=p.keys||[];if(!ks.length)return '<div class="empty">Ключей пока нет.</div>';
  const nowAvg=med(ks.map(k=>(snapRow(p,p.sku,k.q)||{}).pos));
  const junk=p.junk||[],jmx=Math.max(...junk.map(j=>j.seen||0),1);
  return `<h1 class="lt reveal">Ключи</h1><p class="sub reveal">${ks.length} главных запросов по заказам за 28 дней — как Sellium у Вовы. Позиция — чем меньше, тем выше в выдаче.</p>
  <div class="tiles" style="grid-template-columns:repeat(2,1fr)"><div class="card tile reveal"><div class="l">Средняя позиция сейчас</div><div class="v">${ok(nowAvg)?`<span data-count="${Math.round(nowAvg)}">${fi(nowAvg)}</span>`:'—'}</div><div class="s">по ${ks.length} ключам, Москва</div></div>
  <div class="card tile reveal"><div class="l">Замер</div><div class="v" style="font-size:20px">${esc(((p.snap||{}).at||'').slice(11))}</div><div class="s">${esc(ddmm((p.snap||{}).at||''))}, обновляется 4 раза в день</div></div></div>
  <div class="sec"><h2>По каждому ключу</h2><span>за 14 дней</span></div>
  ${ks.map(k=>{const now=(snapRow(p,p.sku,k.q)||{}).pos;const sk=((p.snap||{}).keys||{})[k.q]||{};
   return `<div class="card kc reveal"><div class="hd"><div style="min-width:0"><div class="q">${esc(k.q)}</div><div class="meta"><span class="tag">искали ${fi(k.searched)}</span><span class="tag">заказов ${fi(k.orders)}</span>${k.pinned?'<span class="tag acc">закреплён</span>':''}</div></div>
    <div class="now"><b style="color:${!ok(now)?'var(--ink3)':now<=10?'var(--good)':now<=30?'var(--warn)':'var(--bad)'}">${ok(now)?now:'—'}</b><span class="pc ${pc(now)}" style="height:20px;min-width:0;font-size:11px;margin-top:4px">${!ok(now)?'нет в выдаче':now<=10?'топ-10':now<=30?'до 30':'ниже 30'}</span></div></div>
    ${lineChart(p,k)}${lane(p,k)}
    ${(sk.top3||[]).length?`<div class="top3">${sk.top3.map(t=>`<span class="tag" data-tip="<b>${esc(short(t.seller))}</b>${t.cpc?'ставка '+N1.format(t.cpc)+' ₽':'без рекламы'}${t.price?' · '+fr(t.price):''}">${t.pos}. ${esc(short(t.seller))}${t.mine?' (мы)':''}</span>`).join('')}</div>`:''}</div>`}).join('')}
  ${junk.length?`<div class="sec"><h2>Показы есть, заказов нет</h2><span>топ-${junk.length} за 28 дней</span></div>
   <div class="card pad reveal"><div class="note" style="margin:0 0 6px">Чужие запросы (как «унитаз» у сиденья) — убрать из названия и описания. Свои — поднимать позицию.</div>
   ${junk.map(j=>`<div class="jr" data-tip="<b>${esc(j.q)}</b>Увидели ${fi(j.seen)} · позиция ${fi(j.pos28)} · в карточку ${fp(j.ctr)}"><div class="q">${esc(j.q)}<small>увидели ${fi(j.seen)} · в карточку ${fp(j.ctr)}</small></div><span class="tr"><i style="--w:${Math.max(3,(j.seen||0)/jmx*100)}%"></i></span><span class="pc ${pc(j.pos28)}">${j.pos28?fi(j.pos28):'—'}</span></div>`).join('')}</div>`:''}`;
}

/* ---------- раздел «Склады» ---------- */
function stState(c){const a=c.ads||0,s=c.stock||0;if(a>=0.05&&s===0)return ['bad','Пусто','var(--bad)'];if(c.idc!=null&&a>=0.05){if(c.idc<=4)return ['bad','Кончается','var(--bad)'];if(c.idc<=10)return ['warn','Скоро','var(--warn)'];if(c.idc>60)return ['ok','Избыток','var(--good)'];return ['ok','Норма','var(--good)']}return ['mut','Без продаж','var(--bar)']}
function vSklad(p){
  const cl=(p.clusters||[]).filter(c=>c.stock||c.ads||c.transit);
  const tot=cl.reduce((s,c)=>s+(c.stock||0),0),ads=cl.reduce((s,c)=>s+(c.ads||0),0),days=ads>0?tot/ads:null;
  const urg=c=>{const s=stState(c)[1];return {'Пусто':0,'Кончается':1,'Скоро':2,'Норма':3,'Избыток':4,'Без продаж':5}[s]};
  cl.sort((a,b)=>urg(a)-urg(b)||(b.ads||0)-(a.ads||0));
  const bad=cl.filter(c=>urg(c)<=1);const need=cl.reduce((s,c)=>s+Math.max(0,Math.ceil((c.ads||0)*10-(c.stock||0)-(c.transit||0))),0);
  const R=54,Cn=2*Math.PI*R,frac=days==null?0:Math.min(1,days/30),rc=days==null?'var(--bar)':(days<=4||bad.length)?'var(--bad)':days<=10?'var(--warn)':'var(--good)';
  const reg=(p.regions||{}).by||{},cs=p.comps||[];
  const cities=cs.some(c=>Object.values(reg).some(v=>v[c.sku]))?Object.keys(reg):[];   // ни одного конкурента в выдаче городов — блок не показываем
  const rcol=v=>{const d=dlv(v);return d==null?'var(--fill)':d<=1?'var(--good)':d<=3?'var(--warn)':'var(--bad)'};
  return `<h1 class="lt reveal">Склады</h1><p class="sub reveal">Остатки FBO по кластерам. Вова: везти на 7–10 дней, Москву — в начале недели, подсвечивать за 3–4 дня до нуля.</p>
  <div class="card sh reveal"><div class="ring"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" stroke="var(--fill)"/><circle cx="66" cy="66" r="${R}" stroke="${rc}" stroke-dasharray="${Cn}" stroke-dashoffset="${Cn}" class="rg" data-off="${Cn*(1-frac)}" style="transition:stroke-dashoffset 1.3s var(--out)"/></svg><div class="rv"><b>${days==null?'—':`<span data-count="${Math.round(days)}">${fi(days)}</span>`}</b><span>дней в среднем</span></div></div>
   <div class="tx"><b style="font-size:17px">${bad.length?`${bad.length} ${plur(bad.length,'кластер пустеет','кластера пустеют','кластеров пустеют')}, а там продажи`:`${fi(tot)} шт на складах Озона`}</b><p>${bad.length?`Всего ${fi(tot)} шт. `:''}Продаём ${N1.format(ads)} шт в день.${need?` Чтобы хватило на 10 дней в каждом кластере, довезти <b>${fi(need)} шт</b>.`:' На 10 дней хватает везде.'}</p>
   ${bad.length?`<div class="tags" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${bad.map(c=>`<span class="tag bad">${IC.warn}${esc(c.cluster.replace(', МО и Дальние регионы',''))}</span>`).join('')}</div>`:''}</div></div>
  <div class="sec"><h2>Наши кластеры</h2><span>${cl.length}</span></div>
  ${cl.length?`<div class="cl">${cl.map(c=>{const [k,lab,col]=stState(c);const n10=Math.max(1,(c.ads||0)*10),have=Math.min(c.stock||0,n10),tr=Math.min(c.transit||0,Math.max(0,n10-have));const nd=Math.max(0,Math.ceil((c.ads||0)*10-(c.stock||0)-(c.transit||0)));
    return `<div class="card ck reveal"><div class="t"><div><b>${esc(c.cluster)}</b><div class="mut" style="font-size:12.5px;margin-top:3px">продаём ${ok(c.ads)?N1.format(c.ads):'0'} шт в день</div></div><div class="big" style="color:${col}">${lab==='Пусто'?'0':c.idc!=null?c.idc:'—'}<small>${lab==='Пусто'?'шт · пусто':(c.idc!=null?'дней · ':'')+lab.toLowerCase()}</small></div></div>
     <div class="stk" data-tip="Есть ${fi(c.stock)} шт · в пути ${fi(c.transit)} · на 10 дней нужно ${fi(Math.ceil((c.ads||0)*10))}" style="--c:${col}"><i class="h" style="--w:${have/n10*100}%"></i><i class="t" style="--w:${tr/n10*100}%"></i></div>
     <div class="row"><span>есть ${fi(c.stock)} шт${c.transit?` · в пути ${fi(c.transit)}`:''}</span><span>нужно на 10 дней: ${fi(Math.ceil((c.ads||0)*10))}</span></div>
     ${nd?`<div class="need"><span class="pc p3" style="min-width:0">+${fi(nd)} шт</span>довезти</div>`:''}</div>`}).join('')}</div>`:'<div class="card pad mut reveal">Остатков на складах Озона нет.</div>'}
  ${cities.length?`<div class="sec"><h2>Где лежат конкуренты</h2><span>срок доставки по городам</span></div><div class="cl">${cities.map(ct=>{const ours=reg[ct][p.sku];return `<div class="card city reveal"><div class="t"><span>${esc(ct)}</span><span class="pc ${dlv(ours)==null?'p0':dlv(ours)<=1?'p1':dlv(ours)<=3?'p2':'p3'}" style="font-size:12px">мы ${ours?esc(ours.replace(/\s*(день|дня|дней)/,' дн')):'нет'}</span></div><div class="av">${cs.map(c=>{const v=reg[ct][c.sku];return `<span data-tip="<b>${esc(short(c.seller))}</b>${v?'доставка '+esc(v):'не найден в выдаче города'}" style="--rc:${rcol(v)}">${img(c.photo)}${v?`<em>${dlv(v)}</em>`:''}</span>`}).join('')}</div></div>`}).join('')}</div>
   <div class="legend"><span><i style="background:var(--good)"></i>0–1 день — товар лежит в кластере</span><span><i style="background:var(--warn)"></i>2–3 дня</span><span><i style="background:var(--bad)"></i>4+ дней</span><span><i style="background:var(--fill)"></i>не нашли в выдаче</span></div>`:''}`;
}

/* ---------- отрисовка ---------- */
function after(){
  reveal($('#view'));
  requestAnimationFrame(()=>{ $$('.ln').forEach(l=>setTimeout(()=>l.style.strokeDashoffset=0,200)); $$('.rg').forEach(r=>setTimeout(()=>r.style.strokeDashoffset=r.dataset.off,250)); });
  const grp=$('#grp');if(grp)grp.onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;S.grp=b.dataset.g;KS.set('grp',S.grp);$$('#grp button').forEach(x=>x.classList.toggle('on',x===b));const g=GROUPS.find(x=>x[0]===S.grp);const m=$('#mgrid');m.innerHTML=g[2].map(x=>mcard(P,x)).join('');m.classList.remove('view-in');void m.offsetWidth;m.classList.add('view-in');reveal(m)};
  const rj=$('#rej');if(rj)rj.onclick=()=>openSheet(`<div class="sec" style="margin-top:4px"><h2>Почему не взяли</h2><span>${P.rejected.length}</span></div><div class="note" style="margin:0 0 12px">Проверены по фото и характеристикам: не тот товар или сильно отличается.</div><div class="gal">${P.rejected.map(r=>`<div>${img(r.photo)}<p><b>${esc(short(r.seller))}</b><br>${esc((r.why||'').slice(0,90))}</p></div>`).join('')}</div>`);
}
document.addEventListener('click',e=>{const c=e.target.closest('[data-comp]');if(c){compSheet(P,c.dataset.comp);return}const a=e.target.closest('.ad');if(a&&!a.dataset.pick)a.classList.toggle('open')});
function render(anim){
  P=prod();S.sku=P.sku;KS.set('sku',S.sku);KS.set('tab',S.t);
  renderTabs();renderPicker();
  const v=$('#view');const html=S.t==='keys'?vKeys(P):S.t==='sklad'?vSklad(P):vKonk(P);
  const swap=()=>{v.innerHTML=html;if(anim){v.classList.remove('view-in');void v.offsetWidth;v.classList.add('view-in');window.scrollTo({top:0})}after()};
  if(anim&&document.startViewTransition&&!RM)document.startViewTransition(swap);else swap();
}
function start(d){D=d;if(!D.products||!D.products.length){$('#view').innerHTML='<div class="empty">Данных пока нет.</div>';return}render(false)}
function lock(msg){const l=$('#lock');l.hidden=false;$('#pwerr').textContent=msg==='BAD_PASS'?'Пароль не подошёл':'';const go=async()=>{const p=$('#pw').value.trim();if(!p)return;$('#pwerr').textContent='Открываю…';try{const d=await load(p);l.hidden=true;start(d)}catch(e){$('#pwerr').textContent=e.message==='BAD_PASS'?'Пароль не подошёл':e.message}};$('#pwgo').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>$('#pw').focus(),50)}
(async()=>{try{start(await load())}catch(e){if(e.message==='NEED_PASS'||e.message==='BAD_PASS')lock(e.message);else $('#view').innerHTML='<div class="empty">Не удалось открыть данные: '+esc(e.message)+'</div>'}})();
})();
</script>
</body>
