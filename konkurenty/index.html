<style>
/* «Конкуренты Озон». Телефон в первую очередь: закреплённая шапка с переключателем «Склейки | Конкуренты» и выбором товара,
   нижняя панель разделов, листы снизу. Темы: светлая, тёмно-серая, авто. Методика — видео Вовы 21.10.2026. */
:root{
  --bg:#f2f2f7;--card:#ffffff;--card2:#f7f7fa;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.08);
  --ink:#0b0b0f;--ink2:#55555e;--ink3:#8e8e96;--line:rgba(60,60,67,.12);--line2:rgba(60,60,67,.07);
  --hdr:rgba(246,246,250,.78);--acc:#005bff;--acc2:#3d7bff;--acc-soft:rgba(0,91,255,.11);--on-acc:#fff;
  --good:#1f9d55;--warn:#d97706;--bad:#e5383b;--good-soft:rgba(31,157,85,.12);--warn-soft:rgba(217,119,6,.13);--bad-soft:rgba(229,56,59,.11);
  --bar:#c7c7cf;--bar-us:var(--acc);
  --sh1:0 1px 1px rgba(0,0,0,.03),0 2px 8px rgba(0,0,0,.04);--sh2:0 2px 4px rgba(0,0,0,.04),0 16px 40px -12px rgba(0,0,0,.18);
  --r:20px;--ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  --bg:#1c1c1e;--card:#2c2c2e;--card2:#323235;--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.16);
  --ink:#f5f5f7;--ink2:#c3c3c8;--ink3:#8e8e93;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.06);
  --hdr:rgba(28,28,30,.78);--acc:#4d8dff;--acc2:#6aa0ff;--acc-soft:rgba(77,141,255,.18);--on-acc:#0a1430;
  --good:#32d74b;--warn:#ff9f0a;--bad:#ff5a5f;--good-soft:rgba(50,215,75,.15);--warn-soft:rgba(255,159,10,.16);--bad-soft:rgba(255,90,95,.16);
  --bar:#5a5a60;--sh1:0 1px 1px rgba(0,0,0,.2);--sh2:0 2px 6px rgba(0,0,0,.3),0 20px 50px -16px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1c1e;--card:#2c2c2e;--card2:#323235;--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.16);
  --ink:#f5f5f7;--ink2:#c3c3c8;--ink3:#8e8e93;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.06);
  --hdr:rgba(28,28,30,.78);--acc:#4d8dff;--acc2:#6aa0ff;--acc-soft:rgba(77,141,255,.18);--on-acc:#0a1430;
  --good:#32d74b;--warn:#ff9f0a;--bad:#ff5a5f;--good-soft:rgba(50,215,75,.15);--warn-soft:rgba(255,159,10,.16);--bad-soft:rgba(255,90,95,.16);
  --bar:#5a5a60;--sh1:0 1px 1px rgba(0,0,0,.2);--sh2:0 2px 6px rgba(0,0,0,.3),0 20px 50px -16px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  transition:background-color .35s var(--ease),color .35s var(--ease)}
a{color:var(--acc);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
.press{transition:transform .35s var(--spring),box-shadow .3s var(--ease),background-color .25s var(--ease)}
.press:active{transform:scale(.97);transition-duration:.12s}
/* 26.10 Андрей: «квадратик кликабельный — чтобы при нажатии и касании было видно» — карточки-кнопки темнеют и сжимаются при касании, на компе приподнимаются под мышью */
.card.press:active{transform:scale(.96);filter:brightness(.94)}
@media (hover:hover){.card.press:hover{box-shadow:0 6px 18px rgba(0,0,0,.12)}}
.cm.more{grid-template-columns:50px minmax(0,1fr)}
.cm.more .ph{display:grid;place-items:center;border-radius:12px;background:var(--acc-soft);color:var(--acc);font:700 16px/1 var(--fd)}
.cm.more b{color:var(--acc)}
@media (hover:hover){.lift:hover{transform:translateY(-2px);box-shadow:var(--sh2)}}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:12px}

/* шапка */
/* шапка поверх страницы + постоянная прокладка под ней: сворачивание не двигает страницу (Андрей 25.10 «глючит шапка при вниз-вверх») */
.topsp{height:calc(124px + env(safe-area-inset-top,0px))}
.top{position:fixed;left:0;right:0;top:0;z-index:40;background:var(--hdr);backdrop-filter:saturate(1.8) blur(22px);-webkit-backdrop-filter:saturate(1.8) blur(22px);
  border-bottom:.5px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{max-width:1240px;margin:0 auto;height:52px;padding:0 14px;display:flex;align-items:center;gap:10px}
/* выбор сервиса — общий с Юниткой и Склейками (servisy\svc.py): название «Конкуренты» = кнопка, под ней список сервисов */
:root{--svc-card:var(--card2);--svc-ink:var(--ink);--svc-ink2:var(--ink2);--svc-ink3:var(--ink3);--svc-line:var(--line);--svc-hover:var(--fill2);--svc-acc:var(--acc);--svc-acc-soft:var(--acc-soft)}
/*SVC:CSS*/
/* выбор сервиса (servisy\svc.py — править там): кнопка «значок + название ⌄», под ней список трёх сервисов */
.svc{position:relative;flex:none;min-width:0}
/* шрифт задаю обёртке, кнопка его наследует (button{font:inherit} страниц) — так темы Юнитки (.brand) и Склеек (.brand b) по-прежнему перекрашивают название */
:where(.svc){font:700 18px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em}
.svc-btn{display:inline-flex;align-items:center;gap:9px;height:40px;margin:0 0 0 -6px;padding:0 9px 0 5px;border:0;border-radius:13px;background:transparent;color:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;transition:background-color .2s ease,transform .4s cubic-bezier(.34,1.56,.64,1)}
.svc-btn .svc-nm{font:inherit;letter-spacing:inherit}
/* подложка — в цвет текста шапки (в игровых темах шапка цветная, а название белое) */
@media (hover:hover){.svc-btn:hover{background:var(--svc-hover);background:color-mix(in srgb,currentColor 13%,transparent)}}
.svc-btn:active{transform:scale(.95);transition-duration:.12s}
.svc-btn[aria-expanded="true"]{background:var(--svc-hover);background:color-mix(in srgb,currentColor 13%,transparent)}
.svc-btn .svc-ic{width:30px;height:30px;border-radius:9px}
.svc-chev{width:16px;height:16px;flex:none;opacity:.55;margin-left:-3px;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.svc-btn[aria-expanded="true"] .svc-chev{transform:rotate(180deg)}
/* значок: свой цвет у сервиса, блик сверху, цветное свечение; при наведении и открытии — лёгкий наклон */
.svc-ic{display:grid;place-items:center;flex:none;position:relative;overflow:hidden;color:#fff;font-style:normal;line-height:1;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),inset 0 -2px 4px rgba(0,0,0,.14),0 3px 9px -2px var(--svc-glow,rgba(0,0,0,.3));
  transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.svc-ic::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 75% at 28% 6%,rgba(255,255,255,.55),rgba(255,255,255,0) 58%)}
.svc-ic svg{position:relative;width:66%;height:66%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.svc-ic.u{--svc-glow:rgba(16,185,129,.55);background:linear-gradient(145deg,#4ff0b4 0%,#10b981 48%,#0a7d70 100%)}
.svc-ic.s{--svc-glow:rgba(168,85,247,.55);background:linear-gradient(145deg,#d8a4ff 0%,#a855f7 46%,#e0338f 100%)}
.svc-ic.k{--svc-glow:rgba(255,112,48,.55);background:linear-gradient(145deg,#ffd166 0%,#ff8a2b 46%,#ee3a52 100%)}
@media (hover:hover){.svc-btn:hover .svc-ic,.svc-it:hover .svc-ic{transform:rotate(-8deg) scale(1.06)}}
.svc-btn[aria-expanded="true"] .svc-ic{transform:rotate(-8deg) scale(1.06)}
.svc-menu.on .svc-it .svc-ic{animation:svc-ico .6s cubic-bezier(.34,1.56,.64,1) both}
.svc-menu.on .svc-it:nth-child(3) .svc-ic{animation-delay:.05s}.svc-menu.on .svc-it:nth-child(4) .svc-ic{animation-delay:.1s}
@keyframes svc-ico{from{transform:scale(.6) rotate(-20deg);opacity:0}}
.svc-menu{position:absolute;z-index:300;top:calc(100% + 8px);left:-6px;width:min(318px,calc(100vw - 20px));padding:6px;border-radius:20px;
  background:var(--svc-card);color:var(--svc-ink);box-shadow:0 0 0 .5px var(--svc-line),0 18px 50px -12px rgba(0,0,0,.34),0 4px 12px -4px rgba(0,0,0,.12);
  transform-origin:24px -6px;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.92);pointer-events:none;
  transition:opacity .16s ease,transform .26s cubic-bezier(.4,0,.6,1),visibility 0s linear .26s}
.svc-menu.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .2s ease,transform .5s cubic-bezier(.22,1.3,.36,1),visibility 0s}
.svc-menu.gone{transition:none!important;opacity:0!important;visibility:hidden!important}
.svc-cap{padding:9px 12px 6px;font:700 11px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--svc-ink3)}
.svc-it{position:relative;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;color:inherit;text-decoration:none;
  -webkit-tap-highlight-color:transparent;transition:background-color .2s ease,transform .35s cubic-bezier(.34,1.56,.64,1)}
.svc-it .svc-ic{width:42px;height:42px;border-radius:12px}
.svc-tx{min-width:0;flex:1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.svc-tx b{display:block;font-size:15.5px;font-weight:650;line-height:1.2;letter-spacing:-.005em}
.svc-tx small{display:block;margin-top:2px;font-size:12.5px;line-height:1.3;color:var(--svc-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.svc-it:hover{background:var(--svc-hover)}}
.svc-it:active{transform:scale(.97);background:var(--svc-hover);transition-duration:.1s}
.svc-it[aria-current]{background:var(--svc-acc-soft)}
.svc-it[aria-current] b{color:var(--svc-acc)}
.svc-ok{width:20px;height:20px;flex:none;color:var(--svc-acc)}
.svc-sp{width:18px;height:18px;flex:none;border-radius:50%;border:2.2px solid var(--svc-line);border-top-color:var(--svc-acc);opacity:0;transition:opacity .2s}
.svc-it.go .svc-sp{opacity:1;animation:svc-spin .7s linear infinite}
@keyframes svc-spin{to{transform:rotate(360deg)}}
.svc-menu.on .svc-it{animation:svc-row .5s cubic-bezier(.22,1.2,.36,1) both}
.svc-menu.on .svc-it:nth-child(3){animation-delay:.035s}.svc-menu.on .svc-it:nth-child(4){animation-delay:.07s}
@keyframes svc-row{from{opacity:0;transform:translateY(-6px)}}
/* выбор темы — как в Юнитке (Андрей 29.10: «как в юнитке выбор везде тем формат»): кнопка «значок + название темы», под ней список
   с кружками и группами «Весёлые» / «Спокойные». Юнитка рисует свой (он образец), Склейки и Конкуренты — svcPicker() отсюда */
.svt{position:relative;flex:none}
.svt-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border:1px solid var(--svc-line);border-radius:10px;
  background:var(--svc-card);color:var(--svc-ink2);font:600 13.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;white-space:nowrap;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.svt-btn:active{transform:scale(.94)}
.svt-btn svg{width:18px;height:18px;flex:none;display:block}
@media (max-width:860px){.svt-btn span{display:none}}
.svt-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:300;min-width:220px;max-height:calc(100vh - 100px);overflow:auto;padding:6px;border-radius:12px;
  background:var(--svc-card);color:var(--svc-ink);border:1px solid var(--svc-line);box-shadow:0 8px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;
  font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transform-origin:top right;animation:svt-in .24s cubic-bezier(.22,1,.36,1)}
.svt-menu[hidden]{display:none}
@keyframes svt-in{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.svt-menu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;font:inherit;display:flex;align-items:center;gap:10px;color:inherit;cursor:pointer;white-space:nowrap}
@media (hover:hover){.svt-menu button:hover{background:var(--svc-hover)}}
.svt-menu button[aria-checked="true"]{background:var(--svc-acc-soft);color:var(--svc-acc)}
.svt-menu .sw{width:20px;height:20px;flex:none;display:block}
.svt-menu .tgrp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--svc-ink3);padding:8px 10px 2px;border-top:1px solid var(--svc-line);margin-top:4px}
/* переход между сервисами: шапка и кнопка сервиса остаются на месте, остальное мягко проявляется */
@view-transition{navigation:auto}
.svc-hdr{view-transition-name:svc-hdr}
#svcBtn{view-transition-name:svc-btn}
::view-transition-group(svc-hdr),::view-transition-group(svc-btn){animation-duration:.42s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
::view-transition-group(svc-hdr){overflow:clip}
::view-transition-old(svc-hdr),::view-transition-new(svc-hdr){animation-duration:.3s}
::view-transition-old(svc-btn),::view-transition-new(svc-btn){animation-duration:.32s;width:auto;height:auto}   /* название не растягивается, просто сменяется */
::view-transition-old(root){animation:svc-out .2s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:svc-in .42s cubic-bezier(.16,1,.3,1) both}
@keyframes svc-out{to{opacity:0}}
@keyframes svc-in{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){@keyframes svc-in{from{opacity:0}}}
/*/SVC:CSS*/
.ctx{flex:1;min-width:0;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(6px);transition:opacity .3s var(--ease),transform .4s var(--out);pointer-events:none}
.top.mini .ctx{opacity:1;transform:none;pointer-events:auto}
.ctx img{width:28px;height:28px;border-radius:8px;object-fit:cover;background:var(--fill);flex:none}
.ctx b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx i{font-style:normal;color:var(--ink3);font-size:12.5px;white-space:nowrap}
.ctx svg{width:14px;height:14px;color:var(--ink3);flex:none}
.ctx b{flex:0 1 auto;min-width:0}
@media (max-width:959px){
  /* пролистали вниз — в шапке встаёт товар, название сервиса сворачивается до значка */
  .svc-btn .svc-nm{display:inline-block;max-width:130px;overflow:hidden;transition:max-width .4s var(--out),opacity .25s}
  .top.mini .svc-btn .svc-nm{max-width:0;opacity:0}
  .top.mini .svc-btn{gap:5px}
  .ctx i{display:none}
}
.top:not(.mini) .ctx{position:absolute;visibility:hidden}
.top.mini .sp{display:none}
.sp{flex:1}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--fill);color:var(--ink2);flex:none}
.inst{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:11px;background:var(--acc);color:#fff;font-size:13.5px;font-weight:650;flex:none;animation:pop .6s var(--spring) both}
.inst[hidden]{display:none}
.inst svg{width:17px;height:17px}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@media (max-width:420px){.inst span{display:none}.inst{padding:0 10px}}
.top.mini .inst span{display:none}
.ico svg{width:19px;height:19px}
.dtabs{display:none}
.picker{max-width:1240px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;scrollbar-width:none;scroll-snap-type:x proximity;
  max-height:70px;transition:max-height .45s var(--out),opacity .3s var(--ease),padding .45s var(--out)}
.picker::-webkit-scrollbar{display:none}
.top.mini .picker{max-height:0;opacity:0;padding-bottom:0}
.chip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border-radius:15px;background:var(--card);box-shadow:var(--sh1);text-align:left;max-width:240px;position:relative}
.chip img{width:40px;height:40px;border-radius:11px;object-fit:cover;background:var(--fill);flex:none}
.chip b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.chip span{display:block;font-size:12px;color:var(--ink3);white-space:nowrap}
.chip.on{box-shadow:0 0 0 2px var(--acc),var(--sh1)}
.dot{position:absolute;top:5px;left:5px;width:10px;height:10px;border-radius:50%;border:2px solid var(--card)}
.dot.r{background:var(--bad)}.dot.o{background:var(--warn);left:auto;right:6px}

/* нижняя панель разделов */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--hdr);backdrop-filter:saturate(1.8) blur(22px);-webkit-backdrop-filter:saturate(1.8) blur(22px);
  border-top:.5px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tb{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--ink3);font-size:11px;font-weight:600;position:relative}
.tb svg{width:25px;height:25px;transition:transform .45s var(--spring)}
.tb.on{color:var(--acc)}
.tb.on svg{transform:scale(1.08)}
.badge{position:absolute;top:0;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
main{max-width:1240px;margin:0 auto;padding:6px 14px calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:960px){
  .tabbar{display:none}
  main{padding-bottom:60px}

:root[data-theme="space"]{

#spDeco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}

@keyframes sp-tw{0%,100%{opacity:.12;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}
#spDeco .met{position:absolute;left:0;top:0;width:190px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(214,206,255,.7) 70%,#fff);box-shadow:0 0 8px rgba(190,180,255,.7);opacity:0}
#spWrap{max-width:1240px;margin:0 auto;padding:8px 14px 0}
#spWrap:empty{display:none}
#spCard{position:relative;height:var(--sbh);margin:0 0 6px;border-radius:22px;overflow:hidden;isolation:isolate;background:#050716;outline:none;
  box-shadow:0 0 0 1px rgba(190,180,255,.3),0 0 42px rgba(120,100,255,.24),0 18px 50px rgba(0,0,0,.55);-webkit-user-select:none;user-select:none}
#spCard .spimg{position:absolute;inset:-7%;background:var(--sph) 50% 50%/cover;transition:transform 2.6s cubic-bezier(.2,.7,.2,1);will-change:transform}
#spCard .spsh{position:absolute;inset:0;background:radial-gradient(ellipse 62% 60% at 50% 48%,rgba(4,6,20,.58),rgba(4,6,20,.18) 72%,transparent),linear-gradient(180deg,rgba(4,6,20,.6),transparent 26%,transparent 72%,rgba(4,6,20,.6))}
#spCard canvas.spst{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#spCard .spfl{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 30%,rgba(220,214,255,.16) 45%,rgba(255,255,255,.28) 50%,rgba(220,214,255,.16) 55%,transparent 70%)}
#spCard .sphud{position:absolute;z-index:2;inset:10px;pointer-events:none;border-radius:16px;border:1px solid rgba(200,190,255,.16)}
#spCard .sphud i{position:absolute;width:24px;height:24px;border:2px solid #d3cbff;filter:drop-shadow(0 0 5px rgba(164,147,255,.95))}
#spCard .sphud i:nth-child(1){left:-1px;top:-1px;border-right:0;border-bottom:0;border-top-left-radius:16px}
#spCard .sphud i:nth-child(2){right:-1px;top:-1px;border-left:0;border-bottom:0;border-top-right-radius:16px}
#spCard .sphud i:nth-child(3){left:-1px;bottom:-1px;border-right:0;border-top:0;border-bottom-left-radius:16px}
#spCard .sphud i:nth-child(4){right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:16px}
#spCard .sptop{position:absolute;z-index:3;left:26px;right:26px;top:22px;display:flex;align-items:center;gap:10px;pointer-events:none;font:700 11px/1 var(--f);letter-spacing:.16em;text-transform:uppercase;color:rgba(232,229,255,.85)}
#spCard .splogo{font:700 13px/1 var(--fd);letter-spacing:.2em;color:#fff;text-shadow:0 0 12px rgba(164,147,255,.95)}
#spCard .spch{padding:5px 10px;border-radius:999px;background:rgba(164,147,255,.16);border:1px solid rgba(200,190,255,.32)}
#spCard .spnum{margin-left:auto;font-variant-numeric:tabular-nums}
#spCard .spstage{position:absolute;z-index:2;inset:58px 78px 56px;display:grid;place-items:center;text-align:center;cursor:grab;touch-action:pan-y}
#spCard .spq{grid-area:1/1;margin:0;max-width:21ch;font:800 clamp(24px,3.3vw,46px)/1.16 var(--f);letter-spacing:-.022em;color:#fff;text-wrap:balance;text-shadow:0 2px 22px rgba(5,6,25,.85),0 0 40px rgba(130,110,255,.35)}
#spCard .spq span{display:inline-block}
#spCard .spq.drag{transition:none}
#spCard .spq.back{transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
#spCard .spnav{position:absolute;z-index:3;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:1px solid rgba(220,215,255,.36);background:rgba(10,12,36,.42);color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .2s,background .2s}

#spCard:focus-visible{box-shadow:0 0 0 2px #cfc6ff,0 0 42px rgba(120,100,255,.4)}
/* 28.10 — как в Отклике: «во весь экран» и кнопка звука в шапке (одна настройка konk.mute) */

<script>/*SVC:JS*/
(()=>{   // выбор сервиса (servisy\svc.py — править там)
const b=document.getElementById('svcBtn'),m=document.getElementById('svcMenu');if(!b||!m)return;
let pre=false;
const prerender=()=>{   // пока выбирают — соседние сервисы уже открываются в фоне (Chrome), переход мгновенный
  if(pre)return;pre=true;
  try{if(!(HTMLScriptElement.supports&&HTMLScriptElement.supports('speculationrules')))return;
    const s=document.createElement('script');s.type='speculationrules';
    s.textContent=JSON.stringify({prerender:[{source:'list',urls:[...m.querySelectorAll('a.svc-it:not([aria-current])')].map(a=>a.href),eagerness:'immediate'}]});
    document.head.appendChild(s)}catch(e){}};
const open=on=>{m.classList.toggle('on',on);m.classList.remove('gone');b.setAttribute('aria-expanded',on?'true':'false');if(on)prerender()};
b.addEventListener('pointerdown',prerender,{passive:true});
b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();open(!m.classList.contains('on'))});
document.addEventListener('pointerdown',e=>{if(m.classList.contains('on')&&!e.target.closest('.svc'))open(false)},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&m.classList.contains('on')){open(false);b.focus()}});
m.addEventListener('click',e=>{const a=e.target.closest('a.svc-it');if(!a)return;e.stopPropagation();
  if(a.hasAttribute('aria-current')){e.preventDefault();open(false);return}
  a.classList.add('go');if(!('onpageswap' in window))setTimeout(()=>m.classList.add('gone'),60)});
addEventListener('pageswap',()=>m.classList.add('gone'));   // снимок для перехода — без открытого списка
addEventListener('pageshow',e=>{if(!e.persisted)return;open(false);m.querySelectorAll('.go').forEach(x=>x.classList.remove('go'))});

const TH=[['auto','auto','auto'],['light',null,'light'],['dark','graphite','dark'],['space','space','space'],['jim','jim',null],
  ['farcry','farcry','farcry'],['sonic','sonic','sonic'],['solitaire','solitaire','solitaire'],['birds','birds','birds']],
  KEYS=['unitka.theme','shov.skin','konk.theme'];
window.svcTheme=(i,v)=>{const r=TH.find(x=>x[i]===v);if(!r)return;r.forEach((t,j)=>{if(j!==i&&t)try{localStorage.setItem(KEYS[j],JSON.stringify(t))}catch(e){}})};

function swapIn(el,html){   // мягкая смена: короткое растворение старого, новое проявляется из лёгкого размытия

   ${bad.length?`<div class="tags" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${bad.map(c=>`<span class="tag bad">${IC.warn}${esc(c.cluster.replace(', МО и Дальние регионы',''))}</span>`).join('')}</div>`:''}</div></div>

let TR=null;
const tVis=el=>el&&el.getClientRects().length>0&&el.offsetParent!==null;
function tourStart(){
  tourEnd();const i0=Math.max(0,TORD.indexOf(S.t)),ord=TORD.slice(i0).concat(TORD.slice(0,i0));
  TR={seq:ord.flatMap(t=>TOUR[t].map(s=>Object.assign({tab:t},s))),i:-1};
  const dim=document.createElement('div');dim.className='tour-dim';const spot=document.createElement('div');spot.className='tour-spot';
  const tip=document.createElement('div');tip.className='tour-tip';tip.setAttribute('role','dialog');
  document.body.append(dim,spot,tip);TR.n={dim,spot,tip};
  tip.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!TR)return;const a=b.dataset.tour||(b.classList.contains('tour-x')?'end':'');
    if(a==='next')tourGo(TR.i+1,1);if(a==='prev')tourGo(TR.i-1,-1);if(a==='end')tourEnd()});
  tourGo(0,1);
}
function tourGo(i,dir){
  if(!TR)return;const seq=TR.seq;
  while(i>=0&&i<seq.length){const s=seq[i];
    if(s.tab!==S.t){S.t=s.tab;closeSheet();render(false);window.scrollTo(0,0);setTimeout(()=>tourGo(i,dir),260);return}
    const el=$$(s.sel).find(tVis);if(el){TR.i=i;TR.el=el;tourShow(s);return}i+=dir}
  if(i<0)return tourGo(0,1);
  tourMark(1);tourEnd();toast('Все фишки пройдены. Открыть снова — кнопка «Фишки»');
}
function tourShow(s){
  const n=TR.seq.length,i=TR.i,last=i===n-1;
  TR.n.tip.innerHTML=`<button class="tour-x" aria-label="Закрыть">✕</button><div class="tn">Фишки · ${TN[s.tab]} · ${i+1} из ${n}</div><h4>${esc(s.t)}</h4><p>${esc(s.d)}</p>
   <div class="tbar"><i style="width:${((i+1)/n*100).toFixed(1)}%"></i></div><div class="tf"><span style="margin-right:auto"></span>${i>0?'<button class="btn ghost press" data-tour="prev">Назад</button>':''}<button class="btn press" data-tour="next">${last?'Готово':'Далее'}</button></div>`;
  tourMark((i+1)/n);
  const r=TR.el.getBoundingClientRect(),hh=$('#top').offsetHeight;
  if(r.top<hh+10||r.bottom>innerHeight-180)window.scrollTo({top:Math.max(0,scrollY+r.top-hh-24),behavior:'auto'});
  tourPlace();setTimeout(tourPlace,120);setTimeout(tourPlace,420);
}
function tourPlace(){
  if(!TR||!TR.n||!TR.el)return;const {spot,tip}=TR.n,vw=innerWidth,vh=innerHeight,w=tip.offsetWidth,h=tip.offsetHeight;
  const nav=innerWidth<960?($('#tabbar').offsetHeight||64):0,hdr=$('#top').offsetHeight;
  const r=TR.el.getBoundingClientRect(),p=6,top=Math.max(0,r.top-p),left=Math.max(4,r.left-p),bottom=Math.min(vh,r.bottom+p),right=Math.min(vw-4,r.right+p);
  spot.style.cssText=`top:${top}px;left:${left}px;width:${right-left}px;height:${Math.max(0,bottom-top)}px`;
  let ty=bottom+12;if(ty+h>vh-nav-8){ty=top-12-h;if(ty<hdr+8)ty=Math.max(hdr+8,vh-nav-h-12)}
  tip.style.top=Math.round(ty)+'px';tip.style.left=Math.round(Math.min(Math.max(12,(left+right)/2-w/2),vw-w-12))+'px';
}
function tourEnd(){if(!TR)return;Object.values(TR.n||{}).forEach(x=>x.remove());TR=null}
function tourMark(p){if(p>KS.get('tourMax',0)){KS.set('tourMax',p);tourPaint()}}
function tourPaint(){const left=1-Math.min(1,KS.get('tourMax',0)),b=$('#tourBtn');b.style.setProperty('--tg',left.toFixed(3));b.classList.toggle('fresh',left>0.001);b.classList.toggle('full',left>=0.5);
  b.title=left>0.001?`Подсказки пройдены на ${Math.round((1-left)*100)}% — цвет уходит по мере прохождения`:'Пошаговые подсказки'}
$('#tourBtn').onclick=()=>tourStart();
addEventListener('resize',()=>TR&&tourPlace());addEventListener('scroll',()=>TR&&tourPlace(),{passive:true});
addEventListener('keydown',e=>{if(!TR)return;if(e.key==='Escape')tourEnd();else if(e.key==='ArrowRight')tourGo(TR.i+1,1);else if(e.key==='ArrowLeft')tourGo(TR.i-1,-1)});
tourPaint();

/* ---------- отрисовка ---------- */
function after(){
  reveal($('#view'));
  requestAnimationFrame(()=>{ $$('.ln').forEach(l=>setTimeout(()=>l.style.strokeDashoffset=0,200)); $$('.rg').forEach(r=>setTimeout(()=>r.style.strokeDashoffset=r.dataset.off,250)); });
  const box=$('#cmpbox'),body=()=>swapIn($('#cmptab'),cmpBody(P));
  if(box)box.onclick=e=>{const b=e.target.closest('[data-g]'),pr=e.target.closest('[data-per]');
    if(pr){const v=+pr.dataset.per;if(v!==S.per){S.per=v;KS.set('per',v);segPick($('#per'),pr);$('#pertxt').textContent=perTxt();body()}return}
    if(!b||b.dataset.g===S.grp)return;S.grp=b.dataset.g;KS.set('grp',S.grp);segPick($('#grp'),b);body()};
  thumbs($('#view'));
  const pg=$('#pendgo');if(pg)pg.onclick=()=>pendSheet(P);
  const rv=$('#rv');if(rv)rv.onclick=e=>{const b=e.target.closest('[data-rv]');if(!b||b.dataset.rv===S.rv)return;S.rv=b.dataset.rv;KS.set('rv',S.rv);segPick(rv,b);swapIn($('#rgbox'),regView(P))};
  // переход из «Сводки» или с плитки: подсветить, куда смотреть (Андрей 25.10)
  if(S.focus){const f=S.focus;S.focus=null;setTimeout(()=>{const els=$$(`#view [data-f="${f}"]`).filter(x=>x.offsetParent);if(!els.length)return;
    els.forEach(x=>{x.classList.remove('hl');void x.offsetWidth;x.classList.add('hl')});
    const r=els[0].getBoundingClientRect();window.scrollTo({top:scrollY+r.top-($('#top').offsetHeight+18),behavior:RM?'auto':'smooth'})},RM?0:380)}
  const cv=$('#cv');if(cv)cv.onclick=e=>{const b=e.target.closest('[data-cv]');if(!b||b.dataset.cv===S.cv)return;S.cv=b.dataset.cv;KS.set('cv',S.cv);segPick(cv,b);
    $('#grp').classList.toggle('only-m',S.cv==='tab');thumbs(box);body()};
  const ha=$('#howadv');if(ha)ha.onclick=()=>openSheet(`<div class="sec" style="margin-top:4px"><h2>Как получаются советы</h2><span></span></div><div class="adv">${[
   ['Кого сравниваем','Наш товар и до 7 конкурентов: тот же или почти такой же товар по фото и характеристикам, цена 70–150% нашей, больше всех заказов за 7 дней. Согласованные в «К» и ждущие ✅ — модель видит, кто есть кто.'],
   ['Где слабое место','Сравниваем все цифры из таблицы «Мы против топа»: продажи, цену, воронку, рекламу, места по ключам, склады. Где мы хуже середины топа больше чем на 10% — там и чинить.'],
   ['Порядок по методу Вовы','Склады → реклама → цена → карточка → закупка. Нет товара в кластере — реклама бессмысленна. Из рекламы не выходить. Ставку лидера не перебить — догонять ценой и складами. Демперов в минус не догоняем.'],
   ['Как сортируем','Первым — шаг, где разрыв в рублях больше. Метка над шагом — о чём он: склады, реклама, цена, карточка, ключи, закупка.'],
   ['Реклама на Озоне','Ставка за клик ставится на товар целиком, не на запрос. Поднять место по отдельному запросу — ставкой на товар, словами запроса в названии и описании, ценой, складами рядом с покупателем.'],
   ['Кто пишет','Opus 5.5 на максимальном разборе, только по цифрам со страницы. Сам ничего не меняет: цены, ставки и рекламу — только по вашему «да».']
  ].map(([h,t],i)=>`<div class="card ad" style="box-shadow:none;background:var(--fill2)"><div class="h"><span class="k">${i+1}</span><div><b>${h}</b><div class="w">${t}</div></div></div></div>`).join('')}</div>`);
  const rj=$('#rej');if(rj)rj.onclick=()=>otherSheet(P);
}
function resheet(){   // перерисовать открытый лист после решения, не теряя прокрутку
  const sb=$('#sbody'),y=sb.scrollTop,d=Object.assign({},sb.dataset);
  if(d.comp)compSheet(P,d.comp);else if(d.pend)pendSheet(P);else if(d.other)otherSheet(P);
  sb.scrollTop=y;
}
document.addEventListener('click',e=>{
  const qb=e.target.closest('[data-q]');if(qb){const s=qb.dataset.qc,c=allC(P).find(x=>x.sku===s)||(P.rejected||[]).find(x=>x.sku===s);if(c){qSet(P,c,qb.dataset.q);resheet()}return}
  if(e.target.closest('#qall')){allC(P).filter(c=>c.status==='pending').forEach(c=>{const q=qOf(P,c.sku);if(!q||q.d!=='y')qSet(P,c,'y')});resheet();return}
  if(e.target.closest('#qsend')){qSend();return}
  if(e.target.closest('#qclr')){Q=[];KS.set('q',Q);qbar();if(shw.classList.contains('on'))resheet();return}
  const c=e.target.closest('[data-comp]');if(c){compSheet(P,c.dataset.comp);return}
  const g=e.target.closest('[data-go]');if(g){S.sku=g.dataset.go;S.t=g.dataset.gt||'konk';if(g.dataset.gg){S.grp=g.dataset.gg;KS.set('grp',S.grp)}S.focus=g.dataset.gf||null;closeSheet();render(true);return}
  const kw=e.target.closest('[data-kw]');if(kw){if(kw.dataset.kw===S.kw)return;S.kw=kw.dataset.kw;const y=scrollY;render(false);window.scrollTo(0,y);
    const hm=$$('#view [data-f="heat"]').find(x=>x.offsetParent);if(hm){hm.classList.remove('hl');void hm.offsetWidth;hm.classList.add('hl')}
    toast(S.kw==='us'?'Наши места':'Места: '+short(((P.comps||[]).find(c=>c.sku===S.kw)||{}).seller));return}
  const kc=e.target.closest('[data-kc]');if(kc){kcToggle(P,kc.dataset.kc);const y=scrollY;render(false);window.scrollTo(0,y);return}
  const hk=e.target.closest('[data-key]');if(hk){const el=$('#k'+hk.dataset.key);if(el){el.classList.add('open');el.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})}return}
  const a=e.target.closest('.ad');if(a&&!a.dataset.pick)a.classList.toggle('open')});
function render(anim){
  P=prod();S.sku=P.sku;KS.set('sku',S.sku);KS.set('tab',S.t);
  const tu=$('#toUnitka');if(tu)tu.href='../../unitka/#spp=ozon:'+encodeURIComponent(P.offer_id||'');   // в Юнитку — СПП этого же товара
  renderTabs();renderPicker();if(anim)mini=false,$('#top').classList.remove('mini');sizeTop();
  const v=$('#view');const html=S.t==='all'?vAll():S.t==='keys'?vKeys(P):S.t==='sklad'?vSklad(P):vKonk(P);
  const swap=()=>{v.innerHTML=html;if(anim){v.classList.remove('view-in');void v.offsetWidth;v.classList.add('view-in');window.scrollTo({top:0})}after()};
  if(anim&&document.startViewTransition&&!RM){const vt=document.startViewTransition(swap);vt.ready.catch(()=>{});vt.finished.catch(()=>{})}else swap();   // поворот экрана обрывает переход — не ошибка
}
function start(d){D=d;if(!D.products||!D.products.length){$('#view').innerHTML='<div class="empty">Данных пока нет.</div>';return}qClean();qbar();
  // ссылка из «К»: #pend — сразу товар с ждущими решения и лист «Ждут решения»; #sku=<sku> — этот товар;
  // из Юнитки (красная «Топ не добавлен», 26.10): #sku=<sku>&pick — этот товар и сразу выбор: «Ждут решения», а если ждущих нет — «Другие из топа»
  const hs=location.hash.slice(1);let pend=false,pick=false;
  if(hs.startsWith('sku=')){const [s,...f]=hs.slice(4).split('&');S.sku=s;S.t='konk';pick=f.includes('pick')}else if(hs==='pend'){const p=D.products.find(x=>pendN(x));if(p){S.sku=p.sku;S.t='konk';pend=true}}
  if(hs==='pend'||hs.startsWith('sku='))history.replaceState(null,'',location.pathname+location.search);
  render(false);if(pend)setTimeout(()=>pendSheet(P),500);
  if(pick&&P.sku===S.sku)setTimeout(()=>pendN(P)?pendSheet(P):otherSheet(P),500);
  // 26.10 Андрей: «обновление возвращает на главную» — страница строится после расшифровки данных, браузер не успевал вернуть прокрутку: возвращаем сами
  if(!hs){let y=null;try{y=JSON.parse(sessionStorage.getItem('konk.y')||'null')}catch(e){}
    if(y&&y.t===S.t&&y.s===S.sku&&y.y>0)requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,y.y)))}}
try{history.scrollRestoration='manual'}catch(e){}
document.addEventListener('touchstart',()=>{},{passive:true});   // без этого Safari на iPhone не показывает нажатие (:active)
const saveY=()=>{try{sessionStorage.setItem('konk.y',JSON.stringify({y:Math.round(scrollY),t:S.t,s:S.sku}))}catch(e){}};
addEventListener('pagehide',saveY);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveY()});
function lock(msg){const l=$('#lock');l.hidden=false;$('#pwerr').textContent=msg==='BAD_PASS'?'Пароль не подошёл':'';const go=async()=>{const p=$('#pw').value.trim();if(!p)return;$('#pwerr').textContent='Открываю…';try{const d=await load(p);l.hidden=true;start(d)}catch(e){$('#pwerr').textContent=e.message==='BAD_PASS'?'Пароль не подошёл':e.message}};$('#pwgo').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>$('#pw').focus(),50)}
(async()=>{try{start(await load())}catch(e){if(e.message==='NEED_PASS'||e.message==='BAD_PASS')lock(e.message);else $('#view').innerHTML='<div class="empty">Не удалось открыть данные: '+esc(e.message)+'</div>'}})();
})();
</script>
