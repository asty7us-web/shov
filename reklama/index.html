.bdh small{display:block;font-size:12.5px;line-height:1.35;color:var(--ink3);margin-top:2px}
/* цвета — как у плиток настроек в листе кампании: наш работает — зелёный, ведёт Марпла — синий; кампания не идёт или биддер выключен — серый.
   .on — кампания идёт; свечение и живая точка — у того, кто правда меняет ставку (наш «Сам», Марпла); «Совет» — ровная зелёная точка */
.bdc.on.sov{box-shadow:inset 0 0 0 1px var(--good-soft)}
.bdc.on.sov .bdh i{background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
.bdc.on.sam{box-shadow:inset 0 0 0 1.5px var(--good),0 0 22px -8px var(--good)}
.bdc.on.sam .bdh i{background:var(--good);box-shadow:0 0 0 4px var(--good-soft);animation:bdPulse 2s ease-in-out infinite}
.bdc.on.sam .bdh b{color:var(--good)}
.bdc.on.mar{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 22px -8px var(--acc)}
.bdc.on.mar .bdh i{background:var(--acc);box-shadow:0 0 0 4px var(--acc-soft);animation:bdPulse 2s ease-in-out infinite}
.bdc.on.mar .bdh b{color:var(--acc)}
@keyframes bdPulse{50%{box-shadow:0 0 0 7px transparent}}
.bdq{display:flex;align-items:baseline;gap:8px;min-width:0}
.bdq small,.bdg small{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);flex:none}
.bdq b{font-size:15.5px;font-weight:700;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.bdg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bdg>div{background:var(--fill2);border-radius:12px;padding:8px 10px 9px;min-width:0}
.bdg small{display:block}
.bdg b{display:block;font:700 19px/1.2 var(--fd);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.bdg b.no{font-size:15px;line-height:1.5;color:var(--ink2);letter-spacing:0}
.bdg em{display:block;font-style:normal;font-size:11.5px;line-height:1.3;color:var(--ink3);margin-top:2px}
.bdg .lnk{display:block;padding:5px 0 0;font-size:13px}.bdg .lnk:disabled{opacity:.6;cursor:default}
.bdg .g{background:var(--good-soft)}.bdg .g b{color:var(--good)}
.bdg .r{background:var(--bad-soft)}.bdg .r b{color:var(--bad)}
.bdr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:14px}
.bdr span{color:var(--ink2)}.bdr b{font-weight:700;white-space:nowrap}
.bdw{font-size:12.5px;line-height:1.38;color:var(--ink3)}
.bdw.w{color:var(--warn)}
@media (min-width:560px){.bdg{grid-template-columns:repeat(4,minmax(0,1fr))}}
:root[data-lite="1"] .bdc.on.sam{box-shadow:inset 0 0 0 1.5px var(--good)}:root[data-lite="1"] .bdc.on.mar{box-shadow:inset 0 0 0 1.5px var(--acc)}

/* ── график показа. 14.11 Андрей: «график каждый день одинаково не очень, а по дням поуже сделать высоту».
   «Каждый день одинаково» — та же полоса, одна высокая строка «все дни» (34 px под палец); «по дням недели» — строки ниже (21 px вместо 30).
   .gbg осталась пустой обёрткой вокруг полосы — прежние клетки с цифрами (.gbc) больше не рисуются ── */
#gred .gbg{display:block;border-radius:0;overflow:visible;margin-top:0}
.gst.ed .gsc{height:21px}
.gst.ed button.gsd{height:21px}
.gst.ed .gsr+.gsr{margin-top:2px}
.gst.ed .gsh button{height:20px;line-height:20px}
.gst.ed.one .gsr{grid-template-columns:26px repeat(24,minmax(0,1fr))}
.gst.ed.one .gsc{height:34px}
.gst.ed.one .gsr .gsc:nth-child(2){border-radius:7px 0 0 7px}.gst.ed.one .gsr .gsc:last-child{border-radius:0 7px 7px 0}
.gst.ed.one button.gsd{height:34px;white-space:normal;font-size:10.5px;line-height:1.1;letter-spacing:-.02em}

/* ── сообщения о ходе команды. 14.11 Андрей: «нажал несколько запросов обновить вручную — долго крутится ещё, надо понятный поушн».
   В листе подтверждения — что делается, сколько обычно и сколько прошло; команды без своего листа видны плашкой внизу экрана, итог приходит туда же ── */
.prog{align-items:flex-start}
.prog .sp{margin-top:1px}
.prog .pgt{min-width:0;flex:1}
.prog .pgt b{display:block;font-weight:650;line-height:1.3}
.prog .pgt small{display:block;font-size:12.5px;font-weight:500;line-height:1.35;color:var(--ink3);margin-top:3px}
.runp{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,14px);z-index:190;display:flex;align-items:center;gap:9px;width:max-content;max-width:92vw;
  border:0;border-radius:999px;padding:9px 15px 9px 11px;background:var(--ink);color:var(--bg);font:600 13px/1.25 var(--f);text-align:left;cursor:pointer;
  box-shadow:var(--sh2);opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .28s var(--out)}
.runp.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.runp .sp{width:14px;height:14px;border-radius:50%;border:2px solid transparent;border-top-color:currentColor;border-right-color:currentColor;animation:rot .7s linear infinite;flex:none;opacity:.85}
.runp #runpt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.hasrunp .toast{bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 64px)}
/* сообщение внизу экрана занимало полширины и ломалось на три строки — пусть берёт ширину по тексту (до 92% экрана) */
.toast{width:max-content}
/* 14.11 (четвёртый заход) Андрей: «Пуши чтобы смахнуть мог надо» — показанное сообщение внизу ловит палец: нажатие или смахивание убирает (swOff, c_core.js) */
.toast.on{pointer-events:auto;cursor:pointer}
/* блок «График показа» в листе кампании: длинное «шаблон … · каждый день одинаково» на телефоне уезжало за край — переносим */
.kv.grk b{white-space:normal;min-width:0;overflow-wrap:anywhere}
.kv.grk{grid-template-columns:auto minmax(0,1fr)}

/* ── 14.11 Андрей (06:40): «ставку если не поставил… назад — выкидывает все товары». Лист действия поверх листа кампании не ниже его
   (min-height ставит drawSheet), на компьютере — обычный лист сбоку. Восстановление листа после обновления страницы — без движения ── */
:root[data-shnoa] :is(.sheet,.scrim){transition:none!important}
:root[data-shnoa] .sheet :is(.tt,.sbody){animation:none!important}

/* ── ход команды: «Отправлено → Сторож выполняет → Готово» и ответ сторожа крупно (14.11 Андрей: «если в процессе назад — непонятно, чем закончится») ── */
.rsteps{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin:14px 0 2px;font-size:12.5px;font-weight:600;color:var(--ink3)}
.rsteps>b{font-weight:400;color:var(--ink3);opacity:.6}
.rsteps span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.rsteps i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.6px currentColor;flex:none}
.rsteps .ok{color:var(--good)}.rsteps .ok i{background:var(--good);box-shadow:none}
.rsteps .cur{color:var(--acc)}.rsteps .cur i{background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);animation:bdPulse 1.6s ease-in-out infinite}
.rsteps .x{color:var(--bad)}.rsteps .x i{background:var(--bad);box-shadow:none}
.rsteps+.prog{margin-top:8px}
.rfact{border-radius:15px;padding:12px 14px;margin-top:10px;display:grid;gap:3px}
.rfact b{font-size:17px;font-weight:700;line-height:1.28;overflow-wrap:anywhere}
.rfact small{font-size:12px;color:var(--ink3);font-weight:500}
.rfact.g{background:var(--good-soft)}.rfact.g b{color:var(--good)}
.rfact.b{background:var(--bad-soft)}.rfact.b b{color:var(--bad)}
.rfact.w{background:var(--warn-soft)}.rfact.w b{color:var(--warn)}
.rfact+.acts{margin-top:12px}
/* итог вверху экрана — поверх листов, держится 6+ секунд; нажатие убирает */
.runres{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 10px);z-index:210;display:grid;gap:8px;justify-items:center;padding:0 16px;pointer-events:none}
.rres{display:flex;align-items:flex-start;gap:11px;width:min(520px,100%);border:0;border-radius:18px;padding:12px 15px 13px 12px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;
  box-shadow:var(--sh2),0 0 0 .5px var(--line);pointer-events:auto;opacity:0;transform:translateY(-14px);transition:opacity .22s var(--ease),transform .3s var(--out)}
.rres.on{opacity:1;transform:none}
.rres>div{min-width:0}
.rres i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 14px/1 var(--f);font-style:normal;color:#fff;background:var(--good)}
.rres.b i{background:var(--bad)}.rres.w i{background:var(--warn)}
.rres small{display:block;font-size:12px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rres b{display:block;font-size:15.5px;font-weight:700;line-height:1.3;margin-top:1px;overflow-wrap:anywhere}
.rres.g b{color:var(--good)}.rres.b b{color:var(--bad)}.rres.w b{color:var(--warn)}
:root[data-theme="kosmos"] .rres,:root[data-theme="space"] .rres{background:#0a0d2c}
:root[data-lite="1"] .rres{transition:none}
@media (prefers-reduced-motion:reduce){.rres{transition:none}.rsteps .cur i{animation:none}}

/* ── биддер: «Как это работает» (свёрнуто) и общая ставка (14.11 Андрей: «уточни, как работает… есть общая ставка для всех помимо биддера») ── */
.bdhow{border-radius:12px;background:var(--fill2);padding:0 12px}
.bdhow summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:40px;font-size:14px;font-weight:650;color:var(--acc)}
.bdhow summary::-webkit-details-marker{display:none}
.bdhow summary::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg);margin:-3px 0 0 auto;transition:transform .2s var(--ease)}
.bdhow[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.bdhow ul{margin:0;padding:0 0 11px 17px;display:grid;gap:5px;font-size:13px;line-height:1.4;color:var(--ink2)}
.bdhow li b{color:var(--ink);font-weight:700}
.sbody>.bdhow{margin-top:10px}
.bdkl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;font-size:13.5px;margin-top:10px}
.bdc .bdkl{margin-top:0}
.bdkl span{color:var(--ink3)}.bdkl b{font-weight:650;text-align:right;min-width:0;overflow-wrap:anywhere}

/* ── строка кампании (rkRow: лист товара «Работают» / «На паузе», лист склейки). 14.11 Андрей (08:37): «Это не нужно, лучше показатели крупнее, но не все
   светофоры, + возможность на паузу поставить». Плашек вида, мест и ставки нет; название с состоянием (точка) слева, кнопка «Пауза» / «Запустить» справа;
   четыре показателя крупно, цветом — только «ДРР от всего» (и траты красные без заказов). На 360 px строка не шире листа ── */
.rk.rkr .t{align-items:flex-start;gap:10px}
.rk.rkr .rkn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.rk.rkr .rkn b{flex:none;width:100%;font-size:15px}
.rkgo{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 11px;margin:-3px -4px 0 0;border-radius:999px;
  font:700 14px/1 var(--f);white-space:nowrap;cursor:pointer;transition:transform .3s var(--spring),background-color .2s}
.rkgo::after{content:"";position:absolute;inset:-7px -6px}
.rkgo svg{width:15px;height:15px;flex:none}
.rkgo.pz{background:var(--warn-soft);color:var(--warn)}
.rkgo.go{background:var(--good-soft);color:var(--good)}
.rkgo:active{transform:scale(.92);transition-duration:.1s}
.rk.rkr:has(.rkgo:active){transform:none}   /* нажали кнопку — строка не «проседает» вся */
.rk.rkr .m{margin-top:8px;gap:5px}
.rk.rkr .m .pill{height:20px;font-size:11.5px;padding:0 8px}
.rk.rkr .m .pill.nov{height:auto;min-height:20px;white-space:normal;line-height:1.25;padding:2px 8px}
.rk.rkr .k{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:11px}
.rk.rkr .k b{font:700 19px/1.15 var(--fd);letter-spacing:-.02em}
.rk.rkr .k b small{font-size:12.5px;font-weight:650;letter-spacing:0}
.rk.rkr .k b em{font-style:normal;font-size:15px;letter-spacing:-.01em}
.rk.rkr .k span{font-size:11.5px;margin-top:3px}
@media (max-width:379px){.rk.rkr .k b{font-size:17.5px}.rk.rkr .k b em{font-size:14px}.rk.rkr .k span{font-size:11px}.rkgo{padding:0 11px 0 9px;font-size:13.5px}}

/* ── «мин. ставка 3,10 ₽» (14.11 Андрей, 08:10: «ставка писать на минимуме не надо, просто мин. ставка такая-то, заметнее») ── */
.pill.mnp{color:var(--ink);background:var(--fill)}
.pill.mnp b{font-weight:800}
.pill.mnp.g{background:var(--good-soft);color:var(--good)}
.mnl{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin:2px 2px 10px;font-size:15px;font-weight:600;color:var(--ink2)}
.mnl b{font:800 20px/1.2 var(--fd);color:var(--ink);letter-spacing:-.02em}
.mnl span{font-size:12.5px;color:var(--ink3);font-weight:500}

/* ── новая кампания создана: кнопка «открыть» в листе подтверждения ── */
.rkngo{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:13px 15px;border:0;border-radius:15px;background:var(--acc);color:var(--on-acc);font:inherit;text-align:left;cursor:pointer}
.rkngo span{flex:1;min-width:0}
.rkngo b{display:block;font-size:16px;font-weight:700;line-height:1.25}
.rkngo small{display:block;font-size:12.5px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkngo em{font-style:normal;font-weight:700;font-size:15px;white-space:nowrap}

/* ── потянуть вниз — обновить (14.11 Андрей: «чтобы и в рк и в товаре можно подтянуть вниз и обновилась стр.», «вот надо обновление каждой страницы»).
   Круглая стрелка выезжает из-под шапки сайта или листа; синяя — «отпускайте». Браузерное «потянуть-обновить» (перезагрузка всей страницы) выключено:
   его место занимает наше ── */
html,body{overscroll-behavior-y:contain}
#sbody{overscroll-behavior-y:contain}
.ptr{position:fixed;left:50%;top:0;z-index:150;width:40px;height:40px;margin-left:-20px;border-radius:50%;display:grid;place-items:center;pointer-events:none;
  background:var(--card);color:var(--ink2);box-shadow:var(--sh2),0 0 0 .5px var(--line);opacity:0;transform:translateY(var(--py,-46px))}
.ptr svg{width:21px;height:21px;transform:rotate(var(--pr,0deg))}
.ptr.rdy,.ptr.spin{color:var(--acc)}
.ptr.go{transition:transform .24s var(--out),opacity .2s var(--ease)}
.ptr.spin svg{animation:rot .8s linear infinite}
:root[data-theme="kosmos"] .ptr,:root[data-theme="space"] .ptr{background:var(--svc-card)}
:root[data-lite="1"] .ptr{transition:none!important}:root[data-lite="1"] .ptr svg{transform:none}:root[data-lite="1"] .ptr.spin svg{animation:none}
@media (prefers-reduced-motion:reduce){.ptr{transition:none!important}.ptr.spin svg{animation:none}}

/* 14.11 Андрей в «К»: «тему космоса в рекламе не полноценно, ниче не движется, аффирмаций нет, надо как везде».
   «Космос» как в Склейках и Юнитке (код перенесён из skleykipp.html): по фону мерцают звёзды и пролетают метеоры (#spDeco),
   над разделами окошко #spCard — слайд-шоу аффирмаций (те же, что в Склейках/Юнитке, порядок один у всех раз в 2 дня),
   живые звёзды в окошке, картинка плывёт камерой, музыка Космоса из /shov/. В «Космос 3D» — окошко и музыка, фон — 3D-сцена.
   JS — d_kosmos.js. Картинки и музыка — общие файлы сайта /shov/ (выкладывает Склейки). */
:root{--sph:url("/shov/space-hero.webp");--sbh:clamp(250px,28vw,360px)}
#spDeco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#spDeco .kz{position:absolute;width:var(--z);height:var(--z);border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(200,215,255,.85);opacity:.15;animation:sp-tw var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes sp-tw{0%,100%{opacity:.12;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}
#spDeco .met{position:absolute;left:0;top:0;width:190px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(214,206,255,.7) 70%,#fff);box-shadow:0 0 8px rgba(190,180,255,.7);opacity:0}
#spWrap{max-width:1240px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
#spWrap:empty{display:none}
#spWrap:not(:empty)+main{padding-top:0}
#spCard{position:relative;height:var(--sbh);margin:0 0 14px;border-radius:22px;overflow:hidden;isolation:isolate;background:#050716;outline:none;
  box-shadow:0 0 0 1px rgba(190,180,255,.3),0 0 42px rgba(120,100,255,.24),0 18px 50px rgba(0,0,0,.55);-webkit-user-select:none;user-select:none}
#spCard:focus-visible{box-shadow:0 0 0 2px #cfc6ff,0 0 42px rgba(120,100,255,.4)}
#spCard .spimg{position:absolute;inset:-7%;background:var(--sph) 50% 50%/cover;transition:transform 2.6s cubic-bezier(.2,.7,.2,1);will-change:transform}
#spCard .spsh{position:absolute;inset:0;background:radial-gradient(ellipse 62% 60% at 50% 48%,rgba(4,6,20,.58),rgba(4,6,20,.18) 72%,transparent),linear-gradient(180deg,rgba(4,6,20,.6),transparent 26%,transparent 72%,rgba(4,6,20,.6))}
#spCard canvas.spst{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#spCard .spfl{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 30%,rgba(220,214,255,.16) 45%,rgba(255,255,255,.28) 50%,rgba(220,214,255,.16) 55%,transparent 70%)}
#spCard .sphud{position:absolute;z-index:2;inset:10px;pointer-events:none;border-radius:16px;border:1px solid rgba(200,190,255,.16)}
#spCard .sphud i{position:absolute;width:24px;height:24px;border:2px solid #d3cbff;filter:drop-shadow(0 0 5px rgba(164,147,255,.95))}
#spCard .sphud i:nth-child(1){left:-1px;top:-1px;border-right:0;border-bottom:0;border-top-left-radius:16px}
#spCard .sphud i:nth-child(2){right:-1px;top:-1px;border-left:0;border-bottom:0;border-top-right-radius:16px}
#spCard .sphud i:nth-child(3){left:-1px;bottom:-1px;border-right:0;border-top:0;border-bottom-left-radius:16px}
#spCard .sphud i:nth-child(4){right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:16px}
#spCard .sptop{position:absolute;z-index:3;left:26px;right:26px;top:22px;display:flex;align-items:center;gap:10px;pointer-events:none;font:700 11px/1 "Manrope",var(--f);letter-spacing:.16em;text-transform:uppercase;color:rgba(232,229,255,.85)}
#spCard .splogo{font:700 13px/1 "Unbounded","Manrope",var(--fd);letter-spacing:.26em;color:#fff;text-shadow:0 0 12px rgba(164,147,255,.95)}
#spCard .spch{padding:5px 10px;border-radius:999px;background:rgba(164,147,255,.16);border:1px solid rgba(200,190,255,.32)}
#spCard .spnum{margin-left:auto;font-variant-numeric:tabular-nums}
#spCard .spstage{position:absolute;z-index:2;inset:58px 78px 56px;display:grid;place-items:center;text-align:center;cursor:grab;touch-action:pan-y}
#spCard .spstage:active{cursor:grabbing}
#spCard .spq{grid-area:1/1;margin:0;max-width:21ch;font:800 clamp(25px,3.5vw,50px)/1.16 "Manrope","Manrope",var(--f);letter-spacing:-.022em;color:#fff;text-wrap:balance;text-shadow:0 2px 22px rgba(5,6,25,.85),0 0 40px rgba(130,110,255,.35)}
#spCard .spq span{display:inline-block}
#spCard .spq.drag{transition:none}
#spCard .spq.back{transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
#spCard .spnav{position:absolute;z-index:3;top:50%;width:46px;height:46px;margin-top:-23px;padding:0;border-radius:50%;border:1px solid rgba(220,215,255,.36);background:rgba(10,12,36,.42);color:#fff;display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .2s,background .2s}
#spCard .spnav:hover{background:rgba(164,147,255,.38);transform:scale(1.08)}
#spCard .spnav:active{transform:scale(.94)}
#spCard .spnav.prev{left:20px} #spCard .spnav.next{right:20px}
#spCard .spnav svg{width:20px;height:20px;display:block}
#spCard .spbar{position:absolute;z-index:3;left:26px;right:146px;bottom:20px;display:flex;gap:6px}
#spCard .spbar button{flex:1;min-width:0;height:16px;padding:6px 0;border:0;background:none;cursor:pointer}
#spCard .spbar button i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
#spCard .spbar button i b{display:block;height:100%;width:100%;background:#fff;transform:scaleX(0);transform-origin:0 50%}
#spCard .spbar button.done i b{transform:scaleX(1);background:rgba(255,255,255,.75)}
#spCard .spbar button.cur i b{animation:sp-fill 7s linear forwards;box-shadow:0 0 8px #b3a5ff}
#spCard:is(.hold,.stop) .spbar button.cur i b{animation-play-state:paused}
@keyframes sp-fill{to{transform:scaleX(1)}}
#spCard .spbtns{position:absolute;z-index:3;right:22px;bottom:10px;display:flex;gap:6px}
#spCard .spbtns button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(220,215,255,.36);background:rgba(10,12,36,.42);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
#spCard .spmenu{position:absolute;right:0;bottom:44px;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:16px;background:rgba(10,12,36,.86);border:1px solid rgba(220,215,255,.36)}
#spCard .spmenu[hidden]{display:none}
#spCard .spbtns .spmenu button{width:auto;height:34px;border-radius:17px;padding:0 16px;font-size:14px;font-family:inherit;white-space:nowrap;display:block;text-align:left}
#spCard .spbtns .spmenu button[aria-current="true"]{background:rgba(164,147,255,.6);border-color:#fff}
#spCard [data-sp="next"] small{font-size:10px;margin:6px 0 0 1px}
#spCard .spbtns [data-sp="next"]{display:flex;align-items:center;justify-content:center}
#spCard .spbtns button:hover{background:rgba(164,147,255,.38)}
#spCard .spbtns svg{width:16px;height:16px;display:block}
#spCard [data-sp="play"] .pl,#spCard.stop [data-sp="play"] .pa,#spCard [data-sp="mute"] .off,#spCard [data-sp="mute"][aria-pressed="true"] .on{display:none}
#spCard [data-sp="mute"][aria-pressed="true"] .off{display:block}
#spCard.stop [data-sp="play"] .pl{display:block}
#spCard.big{position:fixed;inset:0;z-index:300;height:auto;margin:0;border-radius:0}
#spCard.big .spq{font-size:clamp(30px,5.2vw,80px)}
#spCard.big .spstage{inset:84px 96px 84px}
@media (max-width:899px){
  :root{--sph:url("/shov/space-hero-m.webp");--sbh:max(250px,66vw)}
  #spCard{border-radius:18px}
  #spCard .sptop{left:20px;right:20px;top:20px;font-size:10px;letter-spacing:.12em}
  #spCard .splogo{font-size:11.5px}
  #spCard .spstage{inset:52px 20px 56px}
  #spCard .spq{max-width:none;font-size:clamp(21px,6.3vw,30px)}
  #spCard .spnav{display:none}
  #spCard .spbar{left:20px;right:186px;bottom:24px;gap:3px}
  #spCard .spbtns{right:16px;bottom:9px}
  #spCard.big .spq{font-size:clamp(26px,8vw,44px)}
  #spCard.big .spstage{inset:70px 22px 70px}
}
@media (orientation:portrait) and (max-width:899px){#spCard.big .spimg{background-image:url("/shov/space-hero-tall.webp")}}
/* без видеокарты: без размытия под кнопками окошка */
:root[data-lite="1"] #spCard .spnav{backdrop-filter:none;-webkit-backdrop-filter:none}
/* в «Космос 3D» фон рисует сцена — свои звёзды страницы не нужны */
:root[data-theme="space"] #spDeco{display:none}

/* 14.11 Андрей: «обведи красиво эффект перелива света… очень аккуратно мягко и подпиши Рекламные кампании».
   Рамка окошка: тонкий светлый блик медленно обходит её по кругу (12 с), под ним мягкое свечение; подпись слева вверху — «Рекламные кампании» (d_kosmos.js) */
@property --spa{syntax:"<angle>";inherits:false;initial-value:0deg}
#spCard::after,#spCard::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4;padding:1.5px;
  background:conic-gradient(from var(--spa),rgba(190,180,255,.18) 0deg,rgba(190,180,255,.18) 200deg,rgba(214,206,255,.55) 250deg,#fff 282deg,rgba(150,215,255,.75) 300deg,rgba(190,180,255,.18) 345deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:sp-ring 12s linear infinite}
#spCard::before{padding:5px;filter:blur(6px);opacity:.55}
@keyframes sp-ring{to{--spa:360deg}}
#spCard .splogo{white-space:nowrap}
@media (max-width:899px){#spCard .splogo{letter-spacing:.16em}#spCard .spch{display:none}}
:root[data-lite="1"] #spCard::before{display:none}
:root[data-lite="1"] #spCard::after{animation-duration:20s}

/* ───────── «Реклама»: добавочные стили помощника «Н» — листы товара и кампании, «Кампании», заметки, «Обновление» (14.11, по замечаниям Андрея).
   Подключается после стилей a_head.html (make.py) и перекрывает их. Цвета — переменными темы ───────── */
/* текст на цветной кнопке (зелёной, жёлтой): в светлой теме белый, в тёмных — тёмный, как у столбиков графика */
:root{--on-sig:#fff}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--on-sig:#0b1408}}
:root:is([data-theme="dark"],[data-theme="kosmos"],[data-theme="space"]){--on-sig:#0b1408}

/* ── период в листе: один, первой строкой, прилипает к верху (14.11 Андрей: «как на главной он в шапке»). Подложка — цвет листа: в «Космосе» лист
   непрозрачный (тот же цвет, что у .sheet в a_head.html). На 360 кнопки прокручиваются вбок внутри себя, лист не раздвигают ── */
.sheet{--shbg:var(--card)}
:root:is([data-theme="kosmos"],[data-theme="space"]) .sheet{--shbg:#0a0d2c}
#sbody .pseg{position:sticky;top:0;z-index:7;display:block;margin:0 -16px;padding:6px 16px 8px;background:var(--shbg);box-shadow:0 .5px 0 var(--line);font-size:12.5px}
#sbody .pseg .seg{display:flex;width:100%;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
#sbody .pseg .seg::-webkit-scrollbar{display:none}
#sbody .pseg .seg button{flex:1 0 auto;justify-content:center;padding:7px 6px;font-size:13px}
.psegl{font-size:12px;margin:7px 3px 0}
.psegl+.prh{margin-top:10px}
@media (min-width:900px){#sbody .pseg .seg button{padding:7px 10px}}

/* ── лист кампании: фото товара первым (нажатие — лист товара), ряд ссылок с кнопкой «Товар здесь» ── */
.rkh{display:flex;gap:12px;align-items:center;margin-top:12px}
.rkh .m{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.rkph{position:relative;flex:none;border:0;padding:0;background:none;cursor:pointer;border-radius:11px}
.rkph .ph{display:block;width:46px;height:60px;border-radius:11px;background:var(--fill) center/cover no-repeat;box-shadow:0 0 0 .5px var(--line)}
.rkph::after{content:"›";position:absolute;right:-6px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--on-acc);font:700 14px/19px var(--fd);text-align:center;box-shadow:0 0 0 2px var(--shbg,var(--card))}
/* 14.11 (четвёртый заход) Андрей: «Всегда картинка должна быть» — фото товара в шапке листа кампании (нажатие — товар) и листа товара */
.shh .shph{flex:none;position:relative;display:block;width:40px;height:52px;padding:0;margin:0;border:0;background:none;border-radius:10px}
.shh .shph .ph{display:block;width:100%;height:100%;border-radius:10px;background:var(--fill) center/cover no-repeat;box-shadow:0 0 0 .5px var(--line)}
.shh .shph.rkph::after{right:-5px;bottom:-4px;width:18px;height:18px;font-size:13px;line-height:17px}
@media (max-width:379px){.shh .shph{width:36px;height:47px}}
.rkh+.wbln{gap:7px}
.rkh+.wbln a,.wbln .totov{flex:1 1 auto;justify-content:center;min-height:38px}
.wbln .totov{display:inline-flex;align-items:center;gap:7px;width:auto;margin:0;padding:4px 11px 4px 5px;border:0;border-radius:11px;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
.wbln .totov .ph{width:23px;height:30px;border-radius:6px;background:var(--fill) center/cover no-repeat;flex:none}
@media (max-width:379px){.rkh+.wbln{gap:5px}.rkh+.wbln a,.wbln .totov{font-size:12.5px}.rkh+.wbln a{padding:8px 7px}.wbln .totov{padding:4px 8px 4px 5px}}

/* ── блок управления кампанией: состояние + кнопка, плитки настроек (14.11 Андрей: «в 1 месте», «одно цветно + мелко», «нет кнопки поставить на паузу») ── */
.cts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:12px;padding:12px 12px 12px 14px;border-radius:18px;background:var(--card2)}
.cts .s{display:flex;align-items:center;gap:11px;flex:1 1 auto;min-width:0}
.cts .s>i{width:12px;height:12px;border-radius:50%;background:var(--ink3);flex:none}
.cts .s small{display:block;font-size:12px;line-height:1.2;font-weight:600;color:var(--ink3)}
.cts .s b{display:block;font:700 20px/1.2 var(--fd);letter-spacing:-.015em;white-space:nowrap}
.cts.on .s>i{background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}.cts.on .s b{color:var(--good)}
.cts.gr .s>i{background:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}.cts.gr .s b{color:var(--acc)}
.cts.off .s b{color:var(--ink2)}
.ctgo{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 auto;height:48px;padding:0 16px;border:0;border-radius:14px;font-weight:700;font-size:16px;white-space:nowrap;cursor:pointer;color:var(--on-sig)}
.ctgo svg{width:18px;height:18px;flex:none}
.ctgo.pz{background:var(--warn)}.ctgo.go{background:var(--good)}
.ctg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.ctg>:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:900px){.ctg{grid-template-columns:repeat(3,minmax(0,1fr))}.ctg>:last-child:nth-child(odd){grid-column:auto}}
.ctt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;border:0;border-radius:16px;padding:10px 24px 10px 12px;background:var(--card2);color:var(--ink);text-align:left;cursor:pointer}
.ctt::after{content:"›";position:absolute;right:10px;top:50%;margin-top:-10px;font:600 18px/20px var(--fd);color:var(--ink3)}
.ctt .l{display:flex;align-items:center;gap:6px;max-width:100%;font-size:12.5px;font-weight:600;color:var(--ink2)}
.ctt .l span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctt .l i{width:8px;height:8px;border-radius:50%;flex:none}
.ctt small em{font-style:normal;font-weight:700}
.ctt>b{max-width:100%;margin-top:3px;font:700 18px/1.2 var(--fd);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctt small{max-width:100%;font-size:12px;line-height:1.3;color:var(--ink3);overflow-wrap:anywhere}
.ctt.on{background:var(--good-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 45%,transparent)}
.ctt.on .l i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft),0 0 9px var(--good)}
.ctt.on .l,.ctt.on small em{color:var(--good)}
.ctt.mar{background:var(--acc-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 40%,transparent)}
.ctt.mar .l i{background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft),0 0 9px var(--acc)}
.ctt.mar .l,.ctt.mar small em{color:var(--acc)}
.ctt.low{background:var(--bad-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 45%,transparent)}
.ctt.low>b,.ctt.low small{color:var(--bad)}
.ctg+.rkupd{margin:8px 3px 0}

/* ── «Кампании»: фото товара у кампании в карточках; «Требуют внимания» ── */
.rk .t .ph{width:34px;height:45px;border-radius:8px;background:var(--fill) center/cover no-repeat;flex:none}
.vnm{display:grid;gap:7px;margin:0 0 12px}
.vnh{font:650 13px var(--f);letter-spacing:.03em;text-transform:uppercase;color:var(--ink3);margin:2px 3px 0}
.vnr{display:flex;align-items:center;gap:12px;width:100%;min-width:0;border:0;border-radius:16px;padding:10px 13px;background:var(--card);box-shadow:var(--sh1);color:var(--ink);text-align:left;cursor:pointer}
.vnr>b{flex:none;min-width:30px;text-align:center;font:700 24px/1 var(--fd);letter-spacing:-.02em}
.vnr.bud>b{color:var(--bad)}.vnr.zas>b{color:var(--warn)}
.vnr span{flex:1;min-width:0}
.vnr span b{display:block;font-size:15px;font-weight:650;line-height:1.25}
.vnr span small{display:block;font-size:12.5px;line-height:1.3;color:var(--ink3)}
.vnr>i{flex:none;font-style:normal;font-size:17px;font-weight:600;color:var(--ink3)}
.vnr[aria-pressed="true"]{box-shadow:var(--sh1),inset 0 0 0 2px var(--acc)}.vnr[aria-pressed="true"]>i{color:var(--acc)}
@media (min-width:760px){.vnm{grid-template-columns:repeat(2,minmax(0,1fr))}.vnh{grid-column:1/-1}}

/* ── заметки: три кнопки отбора во всю ширину; пометка «заметка» в общем списке ── */
.ntf{margin-top:6px}
.ntf .seg{display:flex;width:100%}
.ntf .seg button{flex:1 1 0;min-width:0;justify-content:center;padding:8px 4px;font-size:13px}
.ntw{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px;background:var(--acc-soft);color:var(--acc)}
.sheet .ntrow{margin-top:4px}
.evrk .ev .w small{display:none}   /* лист кампании: её название под каждой правкой не повторяем */

/* ── таблица фраз: спокойная смена «Активные / Исключённые / Все» ── */
#rkkw>.chips{flex-wrap:nowrap;gap:6px}
#rkkw>.chips .chip{flex:0 1 auto;min-width:0;padding:0 11px;font-size:13px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:379px){#rkkw>.chips{gap:4px}#rkkw>.chips .chip{padding:0 8px;font-size:12px}}
@keyframes frin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#rkkw.frin>:not(.chips){animation:frin .3s var(--ease) both}
@media (prefers-reduced-motion:reduce){#rkkw.frin>:not(.chips){animation:none}}

/* ── ход замера мест — плашка внизу экрана, над сообщением ── */
#mprog{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;max-width:calc(100vw - 24px);bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 72px);z-index:199;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:14px;background:rgba(28,28,30,.94);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--sh2);pointer-events:none}
body.mjob #runp{display:none}
#mprog .sp{width:16px;height:16px;border-radius:50%;border:2.4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:rot .7s linear infinite;flex:none}

/* ── лист «Обновление»: строка «когда собрано» и четыре кнопки — что обновится и сколько ждать ── */
.rfw{font-size:14.5px;line-height:1.4;color:var(--ink2);margin-top:2px}
.rfw b{font-weight:650;color:var(--ink)}.rfw.old b{color:var(--warn)}
.rfl{display:grid;gap:8px;margin-top:14px}
.rfr{display:flex;align-items:center;gap:12px;width:100%;min-width:0;border:0;border-radius:16px;padding:13px 12px 13px 14px;background:var(--card2);color:var(--ink);text-align:left;cursor:pointer}
.rfr svg{width:22px;height:22px;flex:none;color:var(--acc)}
.rfr span{flex:1;min-width:0}
.rfr span b{display:block;font-size:15.5px;font-weight:650;line-height:1.2}
.rfr span small{display:block;font-size:12.5px;line-height:1.3;color:var(--ink3);margin-top:2px}
.rfr em{flex:none;font-style:normal;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--fill);border-radius:999px;padding:4px 9px;white-space:nowrap}

/* ── 14.11: сводная запись «Что меняли» раскрывается списком (evX в d_novoe.js) ── */
.evx>.ev{position:relative;padding-right:24px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.evx>.ev::after{content:'›';position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:600;line-height:1;color:var(--acc);transition:transform .2s ease}
.evx.on>.ev::after{transform:translateY(-50%) rotate(90deg)}
.evx.on>.ev{border-bottom:0}
.evx .evd{display:none;margin:0 0 8px 56px;padding:6px 10px;border-radius:12px;background:var(--card2)}
.evx.on .evd{display:block}
.evx:last-child.on .evd{margin-bottom:0}
.evdr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:.5px solid var(--line);font-size:13.5px;line-height:1.3}
.evdr:last-child{border-bottom:0}
.evdr span{min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.evdr em{flex:none;font-style:normal;color:var(--ink3);white-space:nowrap}
.evdr em b{color:var(--ink);font-weight:650}
.evx .evd .tnote{margin:4px 0 0}
@media (max-width:400px){.evx .evd{margin-left:0}}

/* ── 14.11: «Последняя команда: … — готово / не выполнена» в блоке управления кампанией (lcLine) ── */
.lcmd{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--card2);font-size:13.5px;line-height:1.35;color:var(--ink2)}
.lcmd:empty{display:none}
.lcmd b{color:var(--ink);font-weight:650}
.lcmd>i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--ink3)}
.lcmd>i.g{background:var(--good)}.lcmd>i.w{background:var(--warn)}.lcmd>i.b{background:var(--bad)}
.lcmd .sp{flex:none;width:13px;height:13px;margin-top:2px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:rot .7s linear infinite}

/* ── 14.11: продажи по дням в листе товара — компактно, в один ряд; подсказка вместо мест по фразам ── */
.sal1{margin-top:2px}
.pmxh{margin-top:12px}

/* ── 14.11: «Акции ВБ» в листе товара — цена, ДРР, маржа панели; у акции — ниже на N ₽ и маржа по расчёту ── */
.akm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.akm>div{min-width:0;background:var(--card2);border-radius:14px;padding:9px 11px}
.akm small{display:block;font-size:12px;font-weight:600;color:var(--ink3)}
.akm b{display:block;font:700 18px var(--fd);line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.akm b.muted{color:var(--ink3)}
.akm em{display:block;font-style:normal;font-size:11.5px;line-height:1.25;color:var(--ink3);margin-top:2px}
.akr .pr{max-width:52%}
.akr .pr small i{display:block;font-style:normal;white-space:normal}
.akr .pr small i.good{color:var(--good)}.akr .pr small i.bad{color:var(--bad)}
@media (max-width:370px){.akm b{font-size:16px}.akm>div{padding:8px 9px}}

/* ── 14.11 Андрей 08:10 «пусть рк будет выше в товаре и заметнее»: заголовок кампаний товара крупно, число — плашкой; на паузе — свёрнутой строкой ── */
.hrw.rkhd{margin-top:22px}
.hrw.rkhd h3{display:flex;align-items:center;gap:8px;font:700 20px/1.2 var(--fd);letter-spacing:-.015em;text-transform:none;color:var(--ink)}
.hrw.rkhd h3 b{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:26px;padding:0 8px;border-radius:999px;background:var(--acc);color:var(--on-acc,#fff);font:700 15px/1 var(--fd)}
.hrw.rkhd>.muted{font-size:12.5px}
.pzr{display:flex;align-items:center;gap:10px;width:100%;min-width:0;margin-top:8px;border:0;border-radius:16px;padding:12px 14px;background:var(--card2);color:var(--ink);text-align:left;cursor:pointer}
.pzr span{flex:1;min-width:0}
.pzr span b{display:block;font-size:15.5px;font-weight:650;line-height:1.2}
.pzr span small{display:block;font-size:12.5px;line-height:1.3;color:var(--ink3);margin-top:2px}
.pzr>i{flex:none;font-style:normal;font:600 20px/1 var(--fd);color:var(--ink3)}
.hrw.pzh{margin-top:16px}

/* ── 14.11 Андрей 08:05 «над акции динамику цен»: «Цена по дням» — переключатель, низкая гистограмма с шкалой в рублях, подписи наибольшей и наименьшей ── */
.prch>.muted{font-size:12.5px}
.prc .prsg{display:flex;width:100%;margin:0 0 8px}
.prc .prsg button{flex:1 1 0;min-width:0;justify-content:center;padding:7px 4px;font-size:12.5px}
.prc .ch.ax .bars,.prc .ch.ax .xl{margin-left:34px}
.prc .bars .yt span{left:-35px;width:31px}
@media (max-width:639px){.prc .ch.ax .bars,.prc .ch.ax .xl{margin-left:32px}.prc .bars .yt span{left:-33px;width:30px}}
.prc .bars .col .tp{font-size:10px;letter-spacing:-.02em}
.prc .bars .col .tp .pca{display:block;color:var(--acc);font-size:9.5px;margin-bottom:1px}
.prc .bars .col .tp .e0{position:relative;left:5px}.prc .bars .col .tp .e1{position:relative;left:-5px}
.prc .pcc{color:var(--acc);font-weight:650;white-space:nowrap}
.prlg{margin-top:6px;gap:10px;font-size:11.5px;color:var(--ink3)}
.prlg .pcd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:5px;vertical-align:0}
.prc.frin>*{animation:frin .3s var(--ease) both}
@media (prefers-reduced-motion:reduce){.prc.frin>*{animation:none}}

/* ── 14.11 (четвёртый заход) Андрей 09:18 «выше динамика цен гистограмма чтобы я понимал реально войти в акцию»: линии плановых цен акций на «Цене по дням»
   (пунктир — не участвуем, зелёная — участвуем), подпись справа; строка «чтобы войти…» под графиком ── */
.bars .hl{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--ink2);opacity:.9;pointer-events:none;z-index:2}
.bars .hl.in{border-top:2px solid var(--good)}
.bars .hl span{position:absolute;left:0;bottom:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 5px;border-radius:6px;
  font-size:10.5px;font-weight:700;line-height:13px;color:var(--ink);background:color-mix(in srgb,var(--card) 88%,transparent)}
.bars .hl.in span{color:var(--good)}
.prlg .hlk{display:inline-block;width:14px;height:0;border-top:1.5px dashed var(--ink2);margin-right:5px;vertical-align:3px}
.prlg .hlk.in{border-top:2px solid var(--good)}
.prin{margin:8px 0 2px;padding:9px 12px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:13.5px;line-height:1.35}
.prin b{color:var(--warn);font-weight:750;white-space:nowrap}
.prin.g{background:var(--good-soft)}
.akh+.akst+.prc{margin-top:8px}
/* ── 14.11 (четвёртый заход) Андрей 09:18 «По панели маржу и дрр … это отдельно выше поставить лучше булочек»: блок «Показатели» — карточка-таблица ── */
.pnt{border-radius:16px;background:var(--card2);padding:4px 12px 9px}
.pnt table{width:100%;border-collapse:collapse;table-layout:fixed}
.pnt th,.pnt td{padding:8px 0;text-align:right;vertical-align:baseline;border-bottom:.5px solid var(--line);background:none!important;position:static!important;box-shadow:none!important}
.pnt tbody tr:last-child>*{border-bottom:0}
.pnt thead th{padding:6px 0 7px;font-size:12px;font-weight:650;color:var(--ink2);line-height:1.2}
.pnt thead th small{display:block;font-size:10.5px;font-weight:500;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnt thead th:first-child,.pnt tbody th{text-align:left;width:27%}
.pnt tbody th{font-size:13.5px;font-weight:600;color:var(--ink2)}
.pnt td b{font:700 17px/1.15 var(--fd);letter-spacing:-.02em}
.pnt td .muted{font-size:15px}
.pnt .pnn{margin-top:4px;font-size:11.5px;line-height:1.35;color:var(--ink3)}
@media (max-width:379px){.pnt{padding:3px 10px 8px}.pnt td b{font-size:15.5px}.pnt tbody th{font-size:12.5px}.pnt thead th{font-size:11.5px}}
:root:is([data-theme="kosmos"],[data-theme="space"]) .bars .hl span{background:rgba(10,13,44,.86)}

/* ── 14.11 Андрей 08:10 «ставка писать на минимуме не надо просто мин ставка такая то заметнее»: в плитке «Ставка» отдельной строкой ── */
.ctt small .ctmin{display:block;margin-top:3px;font-size:13.5px;font-weight:750;color:var(--acc);white-space:nowrap}
.ctt small .ctmin .sep{display:none}

/* ── 14.11: новая кампания, созданная с сайта (r.nov) — пометка в «Кампаниях» карточкой и в подзаголовке листа кампании ── */
.rk.pg .m .pill.nov{height:auto;min-height:20px;white-space:normal;line-height:1.25;padding:2px 8px}
.rknov{color:var(--acc);font-weight:650}

/* ── 14.11 Андрей 08:10 «логика кластеры и фразы… не понял»: свёрнутое «Что такое кластер ›» над таблицей фраз ── */
.klhow{margin:0 0 10px;border-radius:14px;background:var(--card2)}
.klhow>summary{display:flex;align-items:center;gap:6px;padding:10px 13px;font-size:14px;font-weight:650;color:var(--acc);cursor:pointer;list-style:none;-webkit-tap-highlight-color:transparent}
.klhow>summary::-webkit-details-marker{display:none}
.klhow>summary i{font-style:normal;font-size:18px;line-height:1;transition:transform .2s ease}
.klhow[open]>summary i{transform:rotate(90deg)}
.klhb{padding:0 13px 11px;font-size:13.5px;line-height:1.42;color:var(--ink2)}
.klhb p{margin:0 0 6px}.klhb p:last-child{margin:0}
.klhb b{color:var(--ink);font-weight:650}

/* ── 14.11 Андрей 08:10 «Кластеры кликабельные как в марпле»: название кластера раскрывает под строкой его состав ── */
.fr .qn.klo{display:flex;align-items:center;gap:4px}
.fr .qn.klo .qt{flex:1;min-width:0}
.fr .qn .kla{flex:none;font-style:normal;font:600 17px/1 var(--fd);color:var(--acc);transition:transform .2s ease;padding:0 2px}
.fr .qn.klo.on .kla{transform:rotate(90deg)}
.fr tr.klop td{box-shadow:none}
.tws.frw{container-type:inline-size}
.sheet .tws.frw tr.klr>td,.fr tr.klr>td{position:static;max-width:none;overflow:visible;text-overflow:clip;padding:0 0 4px;text-align:left;background:var(--card2)}
.fr .kls{position:sticky;left:0;box-sizing:border-box;width:100cqw;max-width:100%;padding:4px 10px 8px 12px}
.fr .kls>*{white-space:normal}
.klh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 0 4px;font-size:12.5px}
.klh b{font-weight:650;color:var(--ink)}.klh span{color:var(--ink3);font-size:11.5px;white-space:nowrap}
.klq{border-radius:12px;background:var(--card);padding:2px 10px}
.klq>div{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:.5px solid var(--line);font-size:13px;line-height:1.3}
.klq>div:last-child{border-bottom:0}
.klq span{min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.klq em{flex:none;font-style:normal;font-weight:650;color:var(--ink2);white-space:nowrap}.klq em.z{color:var(--ink3);font-weight:500}
.kls .klm{display:block;margin:6px 2px 0;font-size:13px}
.kls .tnote{margin:6px 2px 0;font-size:11.5px}
.kls .klno{font-size:13px;line-height:1.4;color:var(--ink2);padding:4px 2px 2px}.kls .klno b{color:var(--ink)}
.kls .klgo{display:block;width:100%;margin-top:8px}
.fr tr.klr.klin .kls{animation:frin .25s var(--ease) both}
@media (prefers-reduced-motion:reduce){.fr tr.klr.klin .kls{animation:none}}
:root:is([data-theme="kosmos"],[data-theme="space"]) .sheet .tws.frw tr.klr>td{background:#1a1f52}
:root:is([data-theme="kosmos"],[data-theme="space"]) .klq{background:rgba(255,255,255,.06)}

/* 14.11 Андрей: «попадаешь на ВБ — запрос посмотреть выдачу» — значок выдачи ВБ у кластера и у фраз состава (wbq в d_novoe.js) */
.qw{display:flex;align-items:center;gap:4px}
.qw .qn{flex:1;min-width:0}
.wbq{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:1px;min-width:34px;height:30px;padding:0 5px;border-radius:9px;background:var(--fill2);color:var(--ink2);text-decoration:none;font-size:11px;font-weight:700}
.wbq i{font-style:normal;font-size:11px;margin-left:1px}
.wbq .wbl{margin:0}
.klr .wbq{height:24px;min-width:30px;margin-left:6px}

/* 14.11 Андрей: «прожатие — кнопка заметная, как у Марплы, зелёным наливается по мере поступления данных, как в Эпл» — d_novoe.js mBtn */
.mbtn{position:relative;overflow:hidden;width:100%;height:50px;border:0;border-radius:14px;cursor:pointer;font:inherit;font-weight:700;font-size:16px;letter-spacing:-.01em;
  color:#fff;background:var(--good);box-shadow:0 6px 18px -8px rgba(22,144,74,.55);display:flex;align-items:center;justify-content:center;padding:0 16px;isolation:isolate}
.mbtn.sm{height:36px;width:auto;font-size:14px;border-radius:11px;padding:0 14px;box-shadow:none}
.mbtn .mbt{position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.mbtn .mbf{position:absolute;inset:0;z-index:0;background:var(--good);transform-origin:left center;transform:scaleX(0);transition:transform .7s cubic-bezier(.22,1,.36,1)}
.mbtn.run{background:var(--good-soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(31,157,85,.35);cursor:default}
.mbtn.run .mbf{transform:scaleX(var(--mp,0));background:rgba(31,157,85,.42)}
.mbtn.end .mbf{background:var(--good)}
.mbtn.run .mbf::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);background-size:200% 100%;animation:sk 1.6s linear infinite}
.mbtn.run.end .mbf::after{animation:none;background:none}
.mbtn.end .mbt{color:#fff}
.mbtn.end{background:var(--good);color:#fff}
.selbar .mbtn{flex:none}
/* ожидание места у фразы: мягко дышащая капсула вместо крутилки */
.plb .mwait{position:relative;overflow:hidden;width:34px;height:22px;border-radius:11px;background:var(--good-soft);display:inline-block}
.plb .mwait i{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(31,157,85,.38),transparent);background-size:200% 100%;animation:sk 1.3s ease-in-out infinite}
.plb .mwt{color:var(--good)!important;animation:mbreath 1.6s ease-in-out infinite}
@keyframes mbreath{50%{opacity:.45}}
.plb .mfresh{display:inline-block;animation:mfr .7s cubic-bezier(.22,1,.36,1) both}
@keyframes mfr{from{opacity:0;transform:scale(.7)}60%{opacity:1;transform:scale(1.08)}to{transform:none}}
:root[data-lite="1"] .mbtn .mbf{transition:none}:root[data-lite="1"] .mbtn .mbf::after,:root[data-lite="1"] .plb .mwait i,:root[data-lite="1"] .plb .mwt,:root[data-lite="1"] .plb .mfresh{animation:none}
@media (prefers-reduced-motion:reduce){.mbtn .mbf{transition:none}.mbtn .mbf::after,.plb .mwait i,.plb .mwt,.plb .mfresh{animation:none}}

/* «Реклама» — правки 14.11 по словам Андрея (главная, шапка, нижняя полоса, таблицы, «Баллы», «Акции», «Ещё»). Встаёт после стилей a_head.html и перекрывает их.
   Цвета — только переменными темы. */

/* ── 14.11 Андрей: «плоский график показал такой бесполезный», «ты гистограммы поменял на полоски зачем» — в карточке товара маленькая гистограмма:
   столбики от наибольшего дня товара, над самым высоким — его число, под столбиками — числа месяца (spark в c_core.js) ── */
.spark{grid-column:1/-1;height:auto;margin-top:0}
.spb{display:flex;align-items:flex-end;gap:3px;height:54px}   /* 40 — самый высокий столбик, сверху место под его число */
.spc{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.spc i{display:block;width:100%;border-radius:4px 4px 2px 2px}
.spc em{font-style:normal;font-size:10.5px;font-weight:700;line-height:1;color:var(--ink2);margin-bottom:3px;white-space:nowrap}
.spc em.l{align-self:flex-start}.spc em.r{align-self:flex-end}
.spc.dm i{opacity:.36}
/* столбиков много (14, 30 дней) — число стоит в верхней строке над своим столбиком: рядом с высокими соседями оно не ложится на них */
.spb.tp .spc{position:relative}.spb.tp .spc em{position:absolute;top:0;left:50%;transform:translateX(-50%);margin:0}
.spb.tp .spc em.l{left:0;transform:none}.spb.tp .spc em.r{left:auto;right:0;transform:none}
.spx{display:flex;gap:3px;margin-top:4px}
.spx span{flex:1;min-width:0;display:flex;justify-content:center;font-size:10px;font-weight:600;line-height:1;color:var(--ink3);white-space:nowrap}
.spb.many,.spx.many{gap:2px}.spb.many .spc i{border-radius:2.5px 2.5px 1px 1px}
/* подписи под цифрами карточки не наезжают друг на друга на 360 и 390: столбцы под длину чисел, длинное — второй строкой */
.pc .kpi{grid-template-columns:minmax(0,.86fr) minmax(0,1.12fr) minmax(0,1.02fr) minmax(0,1fr);align-items:start}
.pc .kpi span{line-height:1.25}
@media (max-width:385px){.pc .kpi{gap:4px}.pc .kpi b{font-size:14.5px}.pc .kpi span{font-size:10.5px}}

/* ── 14.11 Андрей: «время обновл стоит а если 3 дня назад как» — кнопка обновления: давние данные — жёлтая, не сегодняшние — красная с датой ── */
.rfb.old{color:var(--warn);background:var(--warn-soft)}
.rfb.old2{color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1.5px var(--bad)}

/* ── 14.11 Андрей: «внизу раздел который выбран плохо виден» — выбранный раздел: плашка-подложка, жирная подпись, яркий цвет (в «Космосе» — белый) ── */
.tabs button{transition:color .2s,background-color .25s var(--ease)}
.tabs button[aria-current="true"]{color:var(--acc);font-weight:750;background:color-mix(in srgb,var(--acc) 15%,transparent)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .tabs button[aria-current="true"]{background:color-mix(in srgb,var(--acc) 28%,transparent)}}
:root[data-theme="dark"] .tabs button[aria-current="true"]{background:color-mix(in srgb,var(--acc) 28%,transparent)}
:root:is([data-theme="kosmos"],[data-theme="space"]) .tabs button[aria-current="true"]{color:var(--ink);background:color-mix(in srgb,var(--acc) 36%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent)}
:root:is([data-theme="kosmos"],[data-theme="space"]) .tabs button[aria-current="true"] svg{color:var(--acc)}
@media (max-width:899px){.tabs{padding-top:5px}.tabs button{border-radius:13px;padding:6px 0 5px}.tabs button[aria-current="true"]{letter-spacing:-.02em}}

/* ── 14.11 Андрей: «поиск… не надо раздел целый — вот можно кнопкой справа в шапке от периодов» — лупа #fsb в строке под шапкой.
   На телефоне: периоды занимают всю ширину и не листаются вбок, лупа справа; в разделах без периодов она с подписью и тянется, как поле поиска;
   старое поле .srch на телефоне скрыто. На широком экране поиск — прежнее поле, лупы нет ── */
.fsb{display:none}
@media (min-width:900px){.sub.only{display:none}}
@media (max-width:899px){
  .sub{flex-wrap:wrap;overflow:visible;gap:6px}
  .sub .srch{display:none}
  .fsb{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:none;width:38px;height:34px;padding:0;border:0;border-radius:11px;background:var(--fill);color:var(--ink);font-size:14.5px;font-weight:600;cursor:pointer}
  .fsb svg{width:18px;height:18px;flex:none}
  .fsb span{display:none}
  .sub:not(.wper) .fsb{flex:1 1 96px;width:auto;min-width:0;justify-content:flex-start;padding:0 12px;color:var(--ink3)}
  .sub:not(.wper) .fsb span{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub [data-seg="per"]{flex:1 1 0;min-width:0}
  .sub [data-seg="per"] button{flex:1 1 auto;min-width:0;justify-content:center;padding:6px 2px;font-size:13px}
  .sub [data-seg="rkf"]{order:3;flex:1 1 100%}
  .sub [data-seg="rkf"] button{flex:1 1 auto;justify-content:center}
}
@media (max-width:385px){.sub [data-seg="per"] button{font-size:12.5px;letter-spacing:-.01em}.fsb{width:36px}}

/* ── 14.11 Андрей: «значек вб некрасиво вписал» — настоящий значок ВБ (skleyki\icons.json, как в «Панели» и «Конкурентах») вместо квадрата с буквами:
   один размер, по одной линии с текстом; на телефоне в шапке — один значок перед обоими кабинетами ── */

.wbl{display:inline-block;width:18px;height:18px;margin-right:6px;flex:none;border-radius:0;font-size:0;line-height:0;letter-spacing:0;vertical-align:-3.5px;background:var(--wbi) center/contain no-repeat}
#kabSeg .wbl{width:17px;height:17px;margin-right:5px}
.h3wb .wbl{transform:translateY(1px)}
.wbln .wbl{width:16px;height:16px;margin-right:5px}
@media (max-width:560px){#kabSeg .wbl{display:none}
  #kabSeg::before{content:"";display:block;align-self:center;flex:none;width:20px;height:20px;margin:0 3px 0 4px;border-radius:0;background:var(--wbi) center/contain no-repeat}}
@media (max-width:385px){#kabSeg::before{width:18px;height:18px;margin:0 2px 0 3px}}

/* ── 14.11 Андрей: «когда товары в списках картинки тоже надо везде» — маленькое фото в первом столбце таблиц, в строках склеек и «Баллов» ── */
.tf{display:flex;align-items:center;gap:8px;min-width:0}
.tf>div{min-width:0;flex:1}
.tph{display:block;flex:none;width:30px;height:40px;border-radius:7px;background:var(--fill) center/cover no-repeat}
.tw[data-tbl] td.t1{min-width:190px}
@media (max-width:700px){.tw[data-tbl] td.t1{min-width:150px;max-width:44vw}.tw[data-tbl] th:first-child{max-width:44vw}.tw[data-tbl] .tf{gap:7px}.tw[data-tbl] .tph{width:27px;height:36px;border-radius:6px}}
/* вторая строка в числовой ячейке («мин. 3,62 ₽» под ставкой) — отдельной строкой, а не слитно с числом */
.tw[data-tbl] td.num small{display:block;font-size:11px;font-weight:500;color:var(--ink3);margin-top:1px}
.skt .tf{gap:7px}.skt .tph{width:24px;height:32px;border-radius:6px}
/* с фото название уже: длинное слово переносим по буквам, иначе таблица распирает карточку и страницу (на 390 — «самоклеящаяся») */
@media (max-width:640px){.skt td:first-child{overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto}}
@media (min-width:386px) and (max-width:640px){.skt th,.skt td{padding-left:3px;padding-right:3px}}
@media (max-width:385px){.skt .tf{gap:6px}.skt .tph{width:21px;height:28px;border-radius:5px}}
.akr .tph{width:33px;height:44px;border-radius:8px}

/* ── 14.11 Андрей: «снизу куча текста не понятного» — «Как считается» в «Ещё» свёрнуто: открывается нажатием, внутри — короткая таблица ── */
.dtl{padding:0}
.dtl summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;cursor:pointer;list-style:none}
.dtl summary::-webkit-details-marker{display:none}
.dtl summary h3{margin:0}
.dtl summary svg{transition:transform .25s var(--ease)}
.dtl[open] summary svg{transform:rotate(90deg)}
.kvt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;padding:0 16px 16px;font-size:13px;line-height:1.35}
.kvt b{font-weight:650;white-space:nowrap}.kvt span{color:var(--ink2)}

/* ── 14.11 Андрей 06:40: «…статистика табличного типа, как в Марпле» — таблица по дням под гистограммой (dayTbl в d_tabl.js): своя высота, листается внутри себя
   вбок и вниз, «Дата» закреплена слева, строка «За период» — выделена; страница и лист не раздвигаются ── */
.hrw.dth{margin-top:14px}
.tw.dtw{max-height:min(430px,62vh);max-width:100%}
.tw.dtw th{white-space:normal;line-height:1.15;vertical-align:bottom;max-width:86px;box-shadow:inset 0 -1px 0 var(--line)}
.tw.dtw td.t1{min-width:0;max-width:none}
.tw.dtw td.t1 small{display:block;font-size:11px;font-weight:500;color:var(--ink3);margin-top:1px}
.tw.dtw tr.dtr{cursor:default}
.tw.dtw tr.dtot td{font-weight:650;box-shadow:inset 0 -1px 0 var(--line)}
.tw.dtw tr.dtot td{background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.sheet .tw.dtw tr.dtot td{background:color-mix(in srgb,var(--acc) 10%,var(--card2))}
@media (max-width:700px){.tw.dtw th,.tw.dtw td{padding:8px 7px}.tw.dtw td{font-size:13.5px}}
.sheet .tw.dtw{background:var(--card2);box-shadow:none;border-radius:16px}
.sheet .tw.dtw th,.sheet .tw.dtw td:first-child{background:var(--card2)}
/* «Космос»: полупрозрачные карточки — закреплённым ячейкам плотный фон, как у остальных таблиц листа (те же цвета, что в a_head.html) */
:root:is([data-theme="kosmos"],[data-theme="space"]) .sheet .tw.dtw,:root:is([data-theme="kosmos"],[data-theme="space"]) .sheet .tw.dtw th,:root:is([data-theme="kosmos"],[data-theme="space"]) .sheet .tw.dtw td:first-child{background:#1a1f52}

/* ── 14.11 Андрей 06:40: «цены акций, где участвуем, выделить зелёным и нашу цену больше» и «под каждым товаром в разделе акции гистограмма продаж как в ЛК ВБ,
   в 1 ряд… не размашисто» ── */
.akp{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 8px;margin-top:4px}
.akp b{font:700 21px/1.1 var(--fd);letter-spacing:-.02em;color:var(--ink)}
.akp span{font-size:12px;color:var(--ink3);font-weight:600}
.akr.akin{background:var(--good-soft);border-radius:12px;padding:10px 11px;margin:5px 0;border-bottom:0}
.akr.akin .pr{color:var(--good)}
.akr .akok{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:999px;box-shadow:inset 0 0 0 1.2px var(--good);color:var(--good);font-weight:700}
.akg{margin-top:10px;padding:8px 10px 6px;border-radius:12px;background:var(--fill2)}
.akgl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink3);font-weight:600;margin-bottom:2px}
.akgl b{color:var(--ink);font-size:13px}
/* компактная гистограмма заказов (sparkQ в c_core.js): столбики до 30 px + число над наибольшим = 40 px, даты под крайними */
.sq{min-width:0}
.sqb{display:flex;align-items:flex-end;gap:2px;height:40px}
.sqc{position:relative;flex:1;min-width:0;height:100%;display:flex;align-items:flex-end}
.sqc i{display:block;width:100%;border-radius:2.5px 2.5px 1px 1px;background:var(--wb)}
.sqc i.z{height:2px;background:var(--bar)}
.sqc em{position:absolute;top:0;left:50%;transform:translateX(-50%);font-style:normal;font-size:10.5px;font-weight:700;line-height:1;color:var(--ink2);white-space:nowrap}
.sqc em.l{left:0;transform:none}.sqc em.r{left:auto;right:0;transform:none}
.sqx{display:flex;justify-content:space-between;margin-top:3px;font-size:10px;font-weight:600;line-height:1;color:var(--ink3)}

/* ── 14.11 Андрей 06:40: «раздел цены показать по каждому по панели данные» — карточки раздела «Цены» (vCeny в d_views.js) ── */
.pc.cnc{grid-template-columns:44px 1fr;gap:6px 11px;padding:12px 13px}
.pc.cnc .ph{width:44px;height:58px;border-radius:10px}
.pc.cnc .nm{-webkit-line-clamp:1;font-size:15px}
.cnp{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;margin-top:3px}
.cnp b{font:700 21px/1.1 var(--fd);letter-spacing:-.02em;color:var(--ink)}
.cnp span{font-size:12px;color:var(--ink3);font-weight:600}
.cnm{grid-column:1/-1;margin-top:0;gap:4px}
.cnm .pill{height:auto;min-height:22px;white-space:normal;line-height:1.2;padding:3px 8px}
/* панель: неделя и месяц — двумя столбцами рядом: период, маржа и ДРР, продажи */
.cnpn{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;padding-top:7px;border-top:.5px solid var(--line2)}
.cnpr{display:flex;flex-wrap:wrap;align-items:baseline;align-content:flex-start;gap:0 7px;font-size:12px;line-height:1.35;color:var(--ink2);min-width:0}
.cnpr .l{flex:0 0 100%;font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnpr b{font-weight:700}
.cnpr span:last-child{flex:0 0 100%}

/* ── 14.11: семь разделов в нижней полосе — подписи помещаются на 360 ── */
@media (max-width:899px){.tabs button span{max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap}}
@media (max-width:385px){.tabs button{font-size:9.5px;letter-spacing:-.03em}.tabs button svg{width:22px;height:22px}}

/* ── 14.11 Андрей 08:10: «а сверху это обновление мест именно?» — кнопка в шапке обновляет ДАННЫЕ: на телефоне три строки в той же ширине
   (значок, время сбора, мелко «данные»), на компьютере в ряд «⟳ Данные 08:38». Ширина кнопки прежняя — шапка на 360 не раздвигается ── */
.rfb{gap:1px}
.rfb svg{width:13px;height:13px}
.rfb #refT{line-height:1}
.rfb .rfd{display:block;font-size:9px;font-weight:650;line-height:1;letter-spacing:-.01em;color:inherit;opacity:.78;white-space:nowrap}
/* телефон: кнопка на 2 px выше (строка шапки и так 40 px — по блоку «Реклама»), значок 12 px — трём строкам хватает места и у красной рамки старых данных;
   точка предупреждений — в самом углу, не впритык к значку */
@media (max-width:699px){.rfb{height:40px;padding-bottom:2px}.rfb svg{width:12px;height:12px}.rfb .rfd{font-size:8.5px;letter-spacing:-.03em}.rfb .dot{top:3px;right:3px;width:7px;height:7px}}
@media (min-width:700px){
  .rfb{gap:6px}.rfb svg{width:17px;height:17px}
  .rfb .rfd{order:1;font-size:13px;font-weight:600;opacity:.8;letter-spacing:0;text-transform:capitalize}   /* «Данные 08:38»: подпись перед временем */
  .rfb #refT{order:2}
}

/* ── 14.11 Андрей 08:10: «…от 1000 показов какие» — вторая строка шапки столбца словами («за клик», «за 1000 показов»; sub в TBL, d_tabl.js) ── */
th .ths{display:block;margin-top:2px;font-size:10px;font-weight:600;letter-spacing:0;line-height:1.15;color:var(--ink3);opacity:.85;white-space:normal}

</style>

/* «назад» на телефоне не выкидывает с сайта (Андрей 29.10: «назад сначала закрывает всплывающее, потом в начало раздела, потом на главную,
   а на главной — наверх; с сайта не выкидывать, и так везде надо»). Над страницей — запас записей-«стражей» {svg:1…20}; каждое «назад»
   тратит одну и делает один шаг. Записи ставим только из касания (отпустил палец, клик, клавиша): добавленные без него Chrome кнопкой
   «назад» пропускает — поэтому не «поставить стража заново после назад», а запас, который доливается при следующем касании.
   svcBack({pop:[шаги страницы: вернуть true, если что-то закрыли], main: перейти в главный раздел (true, если перешли), home: «это главная»}) */
window.svcBack=o=>{
  const q=s=>document.querySelector(s),rs=history.replaceState.bind(history),ps=history.pushState.bind(history),N=20;
  const n=()=>{const s=history.state;return s&&s.svg||0};   // номер стража; 0 — не страж (основа страницы или своя запись страницы)
  let last=n(),gu=location.href;   // gu — адрес текущей записи: страницы меняют в нём раздел (#skleyki) — после «назад» оставляем его
  history.replaceState=function(s,t,u){const k=n();if(k&&!(s&&s.svg))s=Object.assign({},s,{svg:k});rs(s,t,u);if(n())gu=location.href};
  const fill=()=>{try{let k=n();const s=history.state;
    if(!k){if(s&&!s.svb&&Object.keys(s).length)return;rs(Object.assign({},s,{svb:1}),'')}   // своя запись страницы (карточка Юнитки) — не доливаем
    for(k++;k<=N;k++)ps({svg:k},'',location.href);last=n();gu=location.href}catch(e){}};
  ['click','touchend','keydown'].forEach(k=>document.addEventListener(k,fill,{capture:true,passive:true}));
  const step=()=>{
    for(const f of o.pop||[])if(f())return;                                   // всплывающее страницы: фишки, листы, окна
    if(m.classList.contains('on')){open(false);return}                       // выбор сервиса
    const t=q('.svt-btn[aria-expanded="true"]');if(t){t.click();return}       // выбор темы
    const big=q('#sxCard.big [data-sx="big"],#ptCard.big [data-pt="big"],#abCard.big [data-ab="big"],#spCard.big [data-sp="big"]');if(big){big.click();return}
    const g=q('#sxCard.flip [data-sx="back"],#ptCard.flip [data-pt="back"],#abCard.flip [data-ab="back"]');if(g){g.click();return}   // игра — обратно на баннер
    if(scrollY>40){scrollTo({top:0,behavior:'smooth'});return}              // в начало раздела
    if(o.main&&o.main())return;                                               // на главный раздел
    if(o.home)o.home();                                                       // уже на главной, наверху
  };
  addEventListener('popstate',()=>{const k=n(),s=history.state;

function drrChart(ix,get,o){o=o||{};let mxS=0,mxD=NORMA/3;const cap=o.cap||60;

function tblSt(id){const T0=TBL[id],s=RS.get('tb.'+id,null)||{},all=T0.cols.map(c=>c.k),kn=new Set(s.kn||[]),fx=all[0];
  const ord=(s.ord||[]).filter(k=>all.includes(k));for(const k of all)if(!ord.includes(k))ord.push(k);
  const hid=new Set((s.hid||[]).filter(k=>all.includes(k)));
  for(const c of T0.cols)if(c.def===0&&!kn.has(c.k))hid.add(c.k);   // столбец, которого человек ещё не настраивал, — как задумано по умолчанию
  hid.delete(fx);
  /* 14.11 Андрей: «в Марпле можно было двойную сортировку ставить: один столбец основной и по нему второй — надо тоже». sort2 / dir2 — второй столбец:
     он решает порядок строк, у которых в основном столбце значения равны. Нажали на новый столбец — он основной, прежний основной остаётся вторым */
  const so=all.includes(s.sort)?s.sort:T0.sort[0];
  return {ord:[fx].concat(ord.filter(k=>k!==fx)),hid,sort:so,dir:all.includes(s.sort)?s.dir:T0.sort[1],sort2:all.includes(s.sort2)&&s.sort2!==so?s.sort2:null,dir2:s.dir2===1?1:-1}}
const tblSave=(id,st)=>RS.set('tb.'+id,{ord:st.ord,hid:[...st.hid],sort:st.sort,dir:st.dir,sort2:st.sort2||null,dir2:st.dir2===1?1:-1,kn:TBL[id].cols.map(c=>c.k)});

function tblSort(id,rows){const st=tblSt(id),C=TBL[id].cols,c=C.find(x=>x.k===st.sort)||C[0],c2=st.sort2?C.find(x=>x.k===st.sort2):null;   // «нет данных» — всегда внизу, «нет заказов» (∞) — как самое большое
  const nv=v=>v==null||(typeof v==='number'&&isNaN(v))?null:v===Infinity?1e15:v,cmp=(a,b,d)=>a==null?(b==null?0:1):b==null?-1:(a<b?-1:a>b?1:0)*d;
  return rows.map(r=>[nv(c.v(r)),c2?nv(c2.v(r)):null,r]).sort((a,b)=>cmp(a[0],b[0],st.dir)||(c2?cmp(a[1],b[1],st.dir2):0)).map(x=>x[2])}

  {k:'s',l:'Реклама, ₽',v:x=>x.a.s,h:x=>f0(x.a.s),cls:x=>sbad(x.a.s,x.a.oq)},
  {k:'oq',l:'Заказы, шт',v:x=>x.a.oq,h:x=>f0(x.a.oq)},

  {k:'q',l:'Заказы с рекламы, шт',def:0,v:x=>x.a.q,h:x=>f0(x.a.q)},
