/* ───────── 14.11 Андрей 06:40: «помимо представленности статистика в гистограммах надо ещё показать табличного типа как в Марпле, тоже там важны показатели —
   показы, клики, СПМ, СПС, ДРР РК, ДРР, затраты, заказы кол-во, корзины, и также выбор фильтров и прочее как делал» — таблица по дням под гистограммой:
   первая строка «За период» (итог), дальше день за днём, свежий сверху. Свои столбцы и сортировка — те же, что у общих таблиц (TBL, tblSt, openCols),
   запоминаются отдельно для каждого места: dayTbl(kind, ix, get) — kind 'kab' главная, 'skl' склейка, 'tov' лист товара, 'rk' лист кампании;
   ix — дни, как у гистограммы; get(i) → {v показы, c клики, a корзины, q заказы РК шт, s траты ₽, sp сумма заказов РК ₽, or заказы товара ₽, oq заказы товара шт},
   поля может не быть — тогда «—» ───────── */
const DFL=['v','c','a','q','s','sp','or','oq'];
function dRow(i,g){g=g||{};const x={i};for(const k of DFL)x[k]=typeof g[k]==='number'&&isFinite(g[k])?g[k]:null;
  const dv=(a,b,m)=>a==null||!b?null:m*a/b,dr=(s,o)=>s==null||o==null?null:o?100*s/o:(s>=1?Infinity:null);   // траты есть, заказов 0 — «нет зак.»
  x.ctr=dv(x.c,x.v,100);x.cpc=dv(x.s,x.c,1);x.cpm=dv(x.s,x.v,1000);x.drrk=dr(x.s,x.sp);x.drr=dr(x.s,x.or);return x}
const dNum=(k,l,o)=>Object.assign({k,l,v:x=>x[k],h:x=>x[k]==null?'—':f0(x[k])},o||{});
const dDrr=(k,l,t)=>({k,l,t,v:x=>x[k],h:x=>x[k]==null?'—':`<b>${drrT(x[k])}</b>`,cls:x=>dcls(x[k])});
const DCOLS=[
  {k:'d',l:'Дата',v:x=>x.i,h:x=>x.tot?`<b>За период</b><small>${x.lab}</small>`:dlab(x.i)+(x.i===T?'<small>сегодня, день идёт</small>':'')},
  dNum('v','Показы'),dNum('c','Клики'),
  {k:'ctr',l:'CTR',t:'клик из показа: клики ÷ показы',v:x=>x.ctr,h:x=>pc(x.ctr)},
  /* 14.11 Андрей 08:10: «…от 1000 показов какие» — под CPC и CPM словами: «за клик», «за 1000 показов» (sub — вторая строка шапки, a_css_v.css .ths) */
  {k:'cpc',l:'CPC, ₽',sub:'за клик',t:'CPC — сколько стоил один клик: затраты ÷ клики',v:x=>x.cpc,h:x=>x.cpc==null?'—':f2(x.cpc)},
  {k:'cpm',l:'CPM, ₽',sub:'за 1000 показов',t:'CPM — сколько стоили 1000 показов: затраты ÷ показы × 1000',v:x=>x.cpm,h:x=>x.cpm==null?'—':f0(x.cpm)},
  dNum('a','Корзины'),
  dNum('q','Заказы РК, шт',{t:'заказы, которые ВБ отнёс к рекламе'}),
  dNum('oq','Заказы товара, шт',{t:'все заказы, как гистограмма товара в кабинете ВБ'}),
  dNum('s','Затраты, ₽',{cls:x=>sbad(x.s,x.oq!=null?x.oq:x.q)}),
  dDrr('drrk','ДРР РК','затраты ÷ сумма заказов с рекламы, ₽'),
  dDrr('drr','ДРР','затраты ÷ все заказы товара, ₽'),
  dNum('sp','Заказы РК, ₽',{t:'сумма заказов, которые ВБ отнёс к рекламе',def:0}),
  dNum('or','Заказы товара, ₽',{t:'сумма всех заказов товара',def:0})];
function dayTbl(kind,ix,get){const id='d_'+kind;if(!TBL[id])TBL[id]={sort:['d',-1],cols:DCOLS};
  const R=ix.map(i=>dRow(i,get(i))),tt={};
  for(const k of DFL){let s=null;for(const r of R)if(r[k]!=null)s=(s||0)+r[k];tt[k]=s}
  const tot=Object.assign(dRow(-1,tt),{tot:1,lab:ix.length?dm(D.days[ix[0]])+'–'+dm(D.days[ix[ix.length-1]]):''});
  return `<div class="hrw dth"><h3>По дням таблицей</h3>${tblBtn(id)}</div>`+tblHtml(id,[tot].concat(tblSort(id,R)),x=>x.tot?'class="dtot"':'class="dtr"','dtw')}

/* ───────── Склейки ───────── */
function sklAgg(L,ix){const a={s:0,or:0,oq:0,q:0,c:0,v:0,sp:0,a:0};for(const t of L){const x=pAgg(t,ix);a.s+=x.s;a.or+=x.or;a.oq+=x.oq;a.q+=x.q;a.c+=x.c;a.v+=x.v;a.sp+=x.sp;a.a+=x.a}   // a — корзины (для таблицы по дням)
  a.drr=a.or?100*a.s/a.or:(a.s?Infinity:null);a.drrk=a.sp?100*a.s/a.sp:(a.s?Infinity:null);a.cpa=a.oq?a.s/a.oq:null;return a}
function sklGroups(){const ix=PI(),G=new Map();
  for(const t of K.tov){if(!t.imt)continue;let g=G.get(t.imt);if(!g)G.set(t.imt,g={imt:t.imt,L:[]});g.L.push({t,a:pAgg(t,ix),w:wrk(t).length})}
  const out=[];
  for(const g of G.values()){if(g.L.length<2)continue;g.a=sklAgg(g.L.map(x=>x.t),ix);
    g.L.sort((x,y)=>y.a.or-x.a.or||y.a.s-x.a.s);for(const x of g.L)x.sh=g.a.oq?100*x.a.oq/g.a.oq:null;
    g.top=g.L[0].t;g.nw=g.L.filter(x=>x.w>0).length;g.bez=g.L.filter(x=>!x.a.s).reduce((z,x)=>z+x.a.oq,0);out.push(g)}   // bez — заказы товаров склейки, на которые реклама не тратилась
  return out}
function sklRows(){let L=sklGroups();if(FRZ.skl){const m=new Map(L.map(g=>[g.imt,g]));return FRZ.skl.map(i=>m.get(i)).filter(Boolean)}
  const q=(S.q||'').toLowerCase();if(q)L=L.filter(g=>g.L.some(x=>(x.t.art+' '+x.t.nm).toLowerCase().includes(q)));
  const key=({s:g=>g.a.s,drr:g=>g.a.drr==null?-1:isFinite(g.a.drr)?g.a.drr:1e9,or:g=>g.a.or})[S.skls]||(g=>g.a.s);
  return L.sort((x,y)=>key(y)-key(x)||y.a.or-x.a.or)}
const sklName=g=>esc(g.top.art)+` <span class="muted" style="font-weight:500">и ещё ${g.L.length-1}</span>`;
const CHEV='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ink3);flex:none"><path d="m9 6 6 6-6 6"/></svg>';
function vSkl(){const rows=sklRows();let h=fresh();
  /* 14.11 Андрей: «снизу куча текста непонятного» — пояснение одной строкой; «Остаток: склады ВБ · свой склад» под каждой карточкой убрано — это теперь название столбца */
  h+='<div class="muted tnote" style="margin:0 3px 2px">Реклама одной карточки ведёт на всю склейку — здесь реклама и заказы всех её товаров вместе.</div>';
  h+=`<div class="hrw"><h3>Склейки · ${rows.length}</h3>${frzChip('skl')}${seg('skls',[['s','Реклама'],['drr','ДРР'],['or','Заказы']],S.skls,'sm')}</div>`;
  if(!rows.length)return h+'<div class="empty"><b>Склеек нет</b>В этом кабинете нет склеек из двух и больше товаров — или поиск ничего не нашёл.</div>';
  h+='<div class="list">';
  for(const g of rows){const a=g.a;
    h+=`<div class="card skc"><button class="skh press" type="button" data-skl="${g.imt}"><div class="ph"${foto(g.top)}></div><div style="min-width:0;flex:1"><div class="nm">${sklName(g)}</div>
        <div class="muted" style="font-size:12.5px;margin-top:2px">${jn(g.L.length+' товаров','реклама идёт на '+g.nw,'заказы на '+kr(a.or)+' ₽')}</div></div>${CHEV}</button>
      <div class="kpi k4"><div><b class="num ${dcls(a.drr)}">${drrT(a.drr)}</b><span>ДРР склейки</span></div><div><b class="num">${kr(a.s)} ₽</b><span>реклама</span></div><div><b class="num">${f0(a.oq)} шт</b><span>заказы</span></div><div><b class="num">${a.cpa==null?'—':f0(a.cpa)+' ₽'}</b><span>на 1 заказ</span></div></div>
      <table class="skt"><thead><tr><th>Товар</th><th>ДРР</th><th>Реклама</th><th>Заказы</th><th>ВБ · свой, шт</th></tr></thead><tbody>`
      +g.L.map(x=>`<tr data-nm="${x.t.nm}"><td>${tcell(x.t,esc(x.t.art)+(x.w?'':`<small>${x.a.s?'реклама на паузе':'без своей рекламы'}</small>`))}</td><td class="num ${dcls(x.a.drr)}"><b>${x.a.s||x.a.or?drrT(x.a.drr):'—'}</b></td><td class="num">${x.a.s?f0(x.a.s):'—'}</td><td class="num">${f0(x.a.oq)}</td><td class="num">${ostCell(x.t.fbo)}<span class="muted"> · </span>${ostCell(x.t.fbs)}</td></tr>`).join('')
      +`</tbody></table>${g.bez&&g.a.s?`<div class="muted tnote">Товары без рекламы дали ${f0(g.bez)} из ${f0(a.oq)} заказов склейки.</div>`:''}</div>`}
  return h+'</div>'}
function openSkl(imt){if(typeof shMark==='function')shMark('skl',imt);sheet(()=>{const g=sklGroups().find(x=>String(x.imt)===String(imt));if(!g)return {t:'Склейка',s:'',h:'<div class="empty">Склейки нет в данных.</div>'};
  const L=g.L.map(x=>x.t),ix=PI(),pp=PP(),a=g.a,b=pp?sklAgg(L,pp):null,td=sklAgg(L,[T]),memo={},gm=i=>memo[i]||(memo[i]=sklAgg(L,[i]));
  const cx=[];for(let i=Math.max(0,T-Math.max(13,S.per-1));i<=T;i++)cx.push(i);
  /* 14.11: как в листе товара — четыре главные цифры kpi4 вместо плашек «ДРР вчера» и «ДРР период» («Вчера» — кнопкой периода) */
  let h=perSeg()+kpi4({drr:a.drr,pdrr:b&&b.drr,drrk:a.drrk,s:a.s,ps:b&&b.s,q:a.oq,z:a.oq,qd:'на '+kr(a.or)+' ₽ · с рекламы <b>'+f0(a.q)+'</b>'});
  h+=`<div class="tiles t3" style="margin-top:10px"><div class="tile"><div class="l">Реклама на 1 заказ</div><div class="v num">${a.cpa==null?'—':rub(a.cpa)}</div><div class="d">реклама ÷ все заказы</div></div>
    <div class="tile"><div class="l">Заказы без рекламы</div><div class="v num">${f0(g.bez)} <small>шт</small></div><div class="d">товары, на которые не тратились</div></div>
    <div class="tile"><div class="l">Сегодня</div><div class="v num">${rub(td.s)}</div><div class="d">заказы ${f0(td.oq)} шт</div></div></div>`;
  h+='<div class="hrw"><h3>Склейка по дням: ДРР и заказы</h3></div>'+drrChart(cx,gm)+CHLG+dayTbl('skl',cx,gm);   // 14.11 Андрей 06:40: таблица по дням, как в Марпле
  const rows=tblSort('skl',g.L);
  h+=`<div class="hrw"><h3>Товары склейки · ${g.L.length}</h3>${tblBtn('skl')}</div>`+tblHtml('skl',rows,x=>`data-nm2="${x.t.nm}"`);
  const W=[];for(const t of L)for(const r of wrk(t))W.push([r,t.nm]);
  if(W.length)h+=`<div class="hrw"><h3>Работающие кампании склейки · ${W.length}</h3></div><div class="rows" data-rctx="${W.map(z=>z[0].id+'|'+z[1]).join(',')}">`+W.map(z=>rkRow(z[0],z[1],ix,1)).join('')+'</div>';
  return {t:sklName(g),s:jn('склейка',esc(g.top.subj||''),g.L.length+' товаров',esc(K.name)),h}})}

/* ───────── Баллы за отзывы (Каб 1) ───────── */
const blList=()=>((K.bally||{}).promos||[]);
const blLive=()=>blList().filter(p=>p.st==='active'||p.st==='planned');
const blArt=i=>{const t=TOV[i.nm];return t?t.art:'№ '+i.nm};
function blCard(p){const its=p.items||[],pr=p.cel?Math.min(100,100*(p.fakt||0)/p.cel):0;
  return `<div class="card blc"><button class="blh press" type="button" data-bly="${p.id}"><div style="min-width:0;flex:1"><div class="nm">${esc(p.name)}</div>
      <div class="muted" style="font-size:12.5px;margin-top:2px">${jn(p.st==='planned'?'старт '+dm(p.s):'идёт с '+dm(p.s)+(p.s?'.'+p.s.slice(0,4):''),p.aud?'новым и уже купившим':'только новым покупателям')}</div></div><span class="stt ${p.st==='planned'?'gr':'on'}"><i></i>${p.st==='planned'?'запланирована':'идёт'}</span></button>
    <div class="blp"><div class="blb"><i style="width:${pr}%"></i></div><div class="blt num"><b>${f0(p.fakt)} из ${f0(p.cel)}</b> отзывов<span>потрачено <b>${rub(p.spent)}</b> из ${rub(p.bud)}</span></div></div>
    ${its.map(i=>`<button class="akr press" type="button" data-nm2="${i.nm}" style="width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;cursor:pointer">${tph(TOV[i.nm])}<div><b>${esc(blArt(i))}</b><span class="num">за текст ${f0(i.t)} · фото ${f0(i.p)} · видео ${f0(i.v)} баллов</span></div><div class="pr num">${i.got==null?'—':f0(i.got)}<small>из ${f0(i.cnt)} отзывов</small></div></button>`).join('')||`<div class="muted" style="font-size:12.5px;margin-top:8px">Товаров в акции: ${p.n}.</div>`}
    <div class="acts" style="grid-template-columns:1fr 1fr"><button class="btn gray sm press" type="button" data-bly="${p.id}" style="width:100%">Подробнее</button><button class="btn gray sm press${UPR?'':' nolk'}" type="button" data-act="ballystop" data-id="${p.id}" style="width:100%">Остановить</button></div></div>`}
function vBl(){const b=K.bally;
  if(!b)return fresh(1)+'<div class="empty"><b>Баллы за отзывы — пока только Каб 1</b>Акции с баллами читаются и запускаются через кабинет ВБ в рабочей Opera, а там открыт Каб 1. Переключите кабинет вверху.</div>';
  const q=(S.q||'').toLowerCase(),A=blLive(),dr=blList().filter(p=>p.st==='draft');
  const tot=A.reduce((z,p)=>{z.f+=p.fakt||0;z.c+=p.cel||0;z.s+=p.spent||0;z.b+=p.bud||0;z.n+=(p.items||[]).length||p.n||0;return z},{f:0,c:0,s:0,b:0,n:0});
  let h=`<div class="fresh">Кабинет ВБ прочитан <b>${b.at?dm(b.at.slice(0,10))+' '+b.at.slice(11,16)+' МСК':'—'}</b></div>`;
  h+=`<div class="tiles"><div class="tile"><div class="l">Идёт акций</div><div class="v num">${A.length}</div><div class="d">товаров в них ${tot.n}</div></div>
    <div class="tile"><div class="l">Отзывов собрано</div><div class="v num">${f0(tot.f)} <small>из ${f0(tot.c)}</small></div><div class="d">по идущим акциям</div></div>
    <div class="tile"><div class="l">Потрачено</div><div class="v num">${rub(tot.s)}</div><div class="d">из ${rub(tot.b)} — это потолок</div></div>
    <div class="tile"><div class="l">Цена одного отзыва</div><div class="v num">${tot.f?rub(tot.s/tot.f):'—'}</div><div class="d">потрачено ÷ отзывы</div></div></div>`;
  /* 14.11 Андрей: «снизу куча текста непонятного» — три предложения про баллы сжаты в одну строку, «перечитывается раз в 6 часов…» и перечень черновиков убраны */
  h+=`<div class="muted tnote" style="margin:8px 3px 0">Платим только за пришедшие отзывы: 1 балл = ${f2(BLK)} ₽. Бюджет акции — потолок.</div>`;
  if(S.blf==='no'){const have=new Set();for(const p of A)for(const i of p.items||[])have.add(i.nm);
    const L=K.tov.filter(t=>!have.has(t.nm)&&t.pr&&(!q||(t.art+' '+t.nm).toLowerCase().includes(q))).map(t=>({t,o:sum(t.o&&t.o.q,PI(30))})).sort((x,y)=>y.o-x.o);
    h+=`<div class="hrw"><h3>Товары без акции · ${L.length}</h3></div>`;
    if(!L.length)return h+'<div class="empty">Все товары уже в акциях — или поиск ничего не нашёл.</div>';
    return h+'<div class="card" style="padding:4px 14px">'+L.slice(0,120).map(({t,o})=>`<button class="akr press${UPR?'':' nolk'}" type="button" data-act="bally" data-nm="${t.nm}" style="width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;cursor:pointer">${tph(t)}<div><b>${esc(t.art)}</b><span class="num">${jn('цена '+rub(t.pr.f),'заказов за 30 дней '+f0(o))}</span></div><div class="pr" style="color:var(--acc);font-size:14px">Запустить</div></button>`).join('')+'</div>'}
  const AF=A.filter(p=>!q||(p.name+' '+(p.items||[]).map(blArt).join(' ')).toLowerCase().includes(q));
  h+=`<div class="hrw"><h3>Идут сейчас · ${AF.length}</h3><button class="btn sm press" type="button" data-act="blnew">Новая акция</button></div>`;
  h+=AF.length?'<div class="list">'+AF.map(blCard).join('')+'</div>':'<div class="empty" style="padding:28px 20px"><b>Ни одна акция не идёт</b>Нажмите «Новая акция» и выберите товар.</div>';
  if(dr.length)h+=`<div class="muted tnote" style="margin-top:12px">Черновиков в кабинете: ${dr.length} — не идут и денег не тратят.</div>`;
  return h}

/* ───────── листы товара и кампании по образцу листов «ВБ Маркетолог К», раздел «Кампании», фразы и места, заметки, темы, действия.

function kpi4(o){const ok=v=>v!=null&&isFinite(v),d=ok(o.drr)&&ok(o.pdrr)?o.drr-o.pdrr:null,inf=v=>v!=null&&!isFinite(v);

/* 14.11 Андрей: «то меняли если нажимаю на нее скажем ставки кластеров то открываются какие что» — сводная запись («ставки кластеров: изменено N»,
   «минус-фразы: добавлено N», «акция …: вошли N товаров») со значком «›»: нажатие раскрывает список прямо под записью — фраза (товар) · было → стало.
   Список пишет сборщик в поле det (sbor.py, с 14.11); у старых записей его нет — так и пишем. Запись журнала рисует evHtml (d_views.js), тут только обёртка */
const EVX=new Set(),EVRX=/^(ставки кластеров: изменено|минус-фразы: (добавлено|убрано)|акция «.*»: (вошли|вышли))/;
function evX(z,full){const d=z.det&&z.det.length?z.det:null,ch=z.chto||'',n=parseInt((ch.match(/(\d+)\D*$/)||[])[1])||0,ak=/^акция/.test(ch);
  /* старые записи минус-фраз без списка: до 6 фраз и так видны в самой записи — раскрывать нечего */
  if(!d&&(!EVRX.test(ch)||(/^минус/.test(ch)&&n<=6)))return evHtml(z,full);
  const k=z.t+'|'+(z.cid||'')+'|'+(z.nm||'')+'|'+ch,num=v=>typeof v==='number';
  const b=d?d.map(x=>{const q=x[0],a=x[1],c=x[2];return `<div class="evdr"><span>${esc(String(q))}</span><em class="num">${num(a)||num(c)?`${num(a)?kop(a):'общая'} → <b>${num(c)?kop(c):'общая'}</b>`:`<b>${esc(String(c||a||''))}</b>`}</em></div>`}).join('')
      +(n>d.length?`<div class="muted tnote">и ещё ${n-d.length} — в записи сохранены первые ${d.length}</div>`:'')

/* 14.11 Андрей: «если в процессе назад непонятно чем закончится как будто ничем» — итог последней команды по кампании виден в блоке управления
   и после ухода с листа: «Последняя команда: Ставка — готово в 07:12» / «не выполнена: причина». Источник — очередь ожидания соседа (WQ, WAIT в e_sheets.js):
   на ответ сторожа ставим свою короткую запись и передаём ответ дальше как было. Ничего не придумываем: ответ пришёл раньше, чем мы его увидели, — строки нет.
   Показываем 15 минут; живёт до закрытия вкладки (sessionStorage) */
const LCK={status:'Пауза или запуск',bid:'Ставка',deposit:'Пополнение',limit:'Лимит дня',klbid:'Ставка фразы',minus:'Минус-фразы',grafik:'График показа',bidder:'Биддер'};   // «Обновить» (rkref) сюда не берём: его итог и так в строке «перечитана в …» и сообщением — третий раз не повторяем (кадр 14.11)
const LCW={};let LC={};
try{LC=JSON.parse(sessionStorage.getItem('rk_lc')||'{}')||{};for(const c in LC)if(LC[c].st==='work')delete LC[c]}catch(e){LC={}}   // «выполняется» после обновления страницы — итога не знаем, строки нет
const lcSave=()=>{try{sessionStorage.setItem('rk_lc',JSON.stringify(LC))}catch(e){}};
const lcHm=ts=>{try{return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'})}catch(e){return ''}};
function lcTx(cid){const x=LC[cid];if(!x||Date.now()-(x.t1||x.t0)>15*60000)return '';const n='Последняя команда: <b>'+(LCK[x.k]||'команда')+'</b> — ';
  /* 14.11 Андрей 08:10: «сторож там не пиши» — на странице слова «сторож» нет: «выполняется», «сервис» */
  if(x.st==='work')return `<span class="sp"></span><span>${n}выполняется…</span>`;
  if(x.st==='done')return `<i class="g"></i><span>${n}готово в ${lcHm(x.t1)}${x.msg?' · '+esc(x.msg):''}</span>`;
  if(x.st==='late')return `<i class="w"></i><span>${n}ответа нет к ${lcHm(x.t1)}. Могла выполниться — загляните в «Что меняли» через пару минут</span>`;
  return `<i class="b"></i><span>${n}не выполнена${x.msg?': '+esc(x.msg):''} · ${lcHm(x.t1)}</span>`}
const lcLine=cid=>`<div class="lcmd" data-lc="${cid}">${lcTx(cid)}</div>`;
function lcTick(){if(typeof WQ==='undefined'||typeof WAIT==='undefined')return;const now=Date.now(),inq=new Set();let ch=0;
  for(const e of WQ){inq.add(e.id);const c=e.cmd||{};if(!c.cid||!LCK[c.k])continue;
    if(!LCW[e.id]){LCW[e.id]={cid:+c.cid,k:c.k,t0:e.t0,dl:e.dl,got:0};LC[c.cid]={k:c.k,t0:e.t0,st:'work'};ch=1}
    LCW[e.id].dl=e.dl;const f=WAIT[e.id];
    if(f&&!f.__lc){const w=m=>{const x=LCW[e.id];if(x&&m&&m.st!=='work'){x.got=1;LC[x.cid]={k:x.k,t0:x.t0,t1:Date.now(),st:m.st==='done'?'done':'no',msg:String(m.msg||'').slice(0,160)};lcSave()}return f(m)};w.__lc=1;WAIT[e.id]=w}}
  for(const id in LCW){if(inq.has(id))continue;const x=LCW[id],y=LC[x.cid];delete LCW[id];if(x.got||!y||y.t0!==x.t0)continue;
    if(now>=x.dl)LC[x.cid]=Object.assign(y,{t1:now,st:'late'});else delete LC[x.cid];ch=1}   // ушла из очереди без ответа: по сроку — «не ответил», иначе итога не знаем
  if(ch)lcSave();
  for(const el of $$('.lcmd[data-lc]')){const s=lcTx(el.dataset.lc);if(el._s!==s){el.innerHTML=s;el._s=s}}}
setInterval(lcTick,500);
/* заметки. 14.11 Андрей: «поиск фильтр такой к заметкам не надо. просто 2 фильтра то что я писал и из истории и вместе показать», «поиск с выбором заметок

/* ── места по фразам. В ячейке: «8 ← 111» — с рекламой 8-е, без рекламы 111-е. Откуда «без рекламы» (14.11): тот же замер — выдача ВБ,
   запрошенная «без продвижения» (o[5]; 0 — глубже o[6] мест). У замеров до 14.11: свой замер, когда кампания стояла, иначе замер Марплы ── */
const BIG=99000;   // у Марплы 99992 — «не нашла в выдаче»
const mestW=n=>{n=Math.abs(Math.round(n));const a=n%100,b=n%10;return a>10&&a<20?'мест':b===1?'место':b>=2&&b<=4?'места':'мест'};   // «на 293 места», «на 5 мест»
function cellOf(e,i){   // → {v, o — без рекламы, od — без рекламы глубже стольких мест, org — без рекламы у товара не в рекламе, deep, g, src: s — свой замер | m — Марпла | w — среднее за день по ВБ, ad, hm, os/oi/ohm — чей (n — тот же замер, s — свой другой, m — Марпла) и когда замер без рекламы}
  let o=null;for(const x of e.m||[])if(x[0]===i)o=x;
  let m=null;for(const x of e.mr||[])if(x[0]===i)m=x;
  const mo=m&&m[3]&&m[3]<BIG?m[3]:null;
  if(o){const c={v:o[2]||0,deep:!o[2],g:o[4]||MG(),src:'s',ad:o[3],hm:o[1],o:null};

async function frJob(nm,qs){const n=qs.length,t0=Date.now(),nrm=q=>String(q).trim().replace(/\s+/g,' ').toLowerCase(),got=new Set();let base=0,err='',one='';

/* 14.11 Андрей: «если бюджет 0, еще мы отлавливаем шеду залежавшиеся рк вот надо какой то раздельчик» — «Требуют внимания» над списком кампаний.

   полных дней траты в среднем не больше 100 ₽ в день; кампании, которые правили вчера или сегодня, не считаются */
function rkVnim(){const z={bud:new Set(),zas:new Set()};if(!K||T<5)return z;const d5=[],d7=[],edge=D.days[T-5];
  for(let i=T-5;i<T;i++)d5.push(i);for(let i=Math.max(0,T-7);i<=T;i++)d7.push(i);
  const ruki=new Set((D.ist||[]).filter(x=>x.kab===S.kab&&x.cid&&!x.avto&&x.kto!=='заметка'&&x.kto!=='марпла'&&x.t.slice(0,10)>=D.days[T-1]).map(x=>x.cid));
  for(const r of K.rk){if(r.st!==9&&r.st!==11)continue;let s7=0,s5=0,on=0;
    for(const i of d5){let v=0;for(const nm in r.nm){const d=r.nm[nm].d;if(d){v+=(d.v&&d.v[i])||0;s5+=(d.s&&d.s[i])||0}}if(v>0)on++}
    for(const nm in r.nm){const d=r.nm[nm].d;s7+=sum(d&&d.s,d7)}
    if(r.bud===0&&s7>=1)z.bud.add(r.id);
    const st=String(r.start||r.cr||'').slice(0,10);
    if(st&&st<edge&&(r.st===9||on>=3)&&s5/5<=100&&!ruki.has(r.id))z.zas.add(r.id)}
  return z}

function marPer(){if(S.kab!=='kab1'||!K)return [];
  return K.rk.filter(r=>r.mar&&(r.st===9||r.st===11)).map(r=>{const m=r.mar,ol=ourLim(r),og=ourGr(r);

    return {r,L,H,ol,og}}).filter(x=>x.L||x.H).sort((a,b)=>(b.r.st===9)-(a.r.st===9)||(!!b.H)-(!!a.H)||String(a.r.name).localeCompare(b.r.name,'ru'))}
const grHex=w=>w.map(s=>parseInt(s,2).toString(16).padStart(6,'0')).join('');
function actPerenos(){if(!need())return;const L=marPer();if(!L.length){toast('Переносить нечего');return}

      const l=x.L?`<div class="s2 num" style="font-size:13.5px;margin-top:3px">Лимит дня: Марпла ${f0(x.L)} ₽ → свой ${f0(x.L)} ₽${x.ol&&x.ol.on?' (свой был '+f0(x.ol.sum)+' ₽)':''}</div>`:'';
      const g=x.H?`<div class="s2" style="font-size:13.5px;margin-top:3px">График «${esc(m.gr.name)}», ${grHours({h:x.H})} ч в неделю → свой, те же часы${x.og&&x.og.on?' (свой был '+grHours(x.og)+' ч в неделю)':''}</div>${grStrip(x.H)}`:'';
      return `<div class="opt" style="align-items:flex-start"><div style="min-width:0"><div style="font-weight:600">${esc(r.name)}</div><div class="muted" style="font-size:12.5px">${r.st===9?'идёт':'на паузе'}</div>${l}${g}</div><button class="sw" type="button" role="switch" data-per="${r.id}" aria-checked="${on}"></button></div>`};
    return {t:'Из Марплы к себе',s:'Каб 1 · '+L.length+' '+(L.length%10===1&&L.length%100!==11?'кампания':'кампаний'),h:`<div class="note pern"><b>Зачем.</b> Лимит трат на день и включение кампаний по часам сейчас делает Марпла. Закончится её подписка — лимиты и графики пропадут: кампании пойдут круглые сутки и без дневного потолка. Перенос заводит такие же лимиты и графики у нас.
      <b>Что произойдёт после кнопки «Перенести».</b> У каждой включённой ниже кампании в нашем сервисе появятся свой лимит дня и свой график — с теми же суммами и теми же часами, что стоят в Марпле. Следит за ними наш сервис, раз в 10 минут: траты дошли до лимита — пауза до полуночи; час не из графика — пауза; час показа — запуск.
      <b>Чего не произойдёт.</b> В Марпле ничего не выключится и не поменяется — её лимиты и графики продолжат работать, как сейчас. Ставки, бюджеты и сами кампании не трогаются, деньги не списываются. Выключить лимиты и графики в Марпле — отдельный шаг, только по вашему слову.

const IKIND=[['all','Всё'],['bid','Ставки'],['price','Цены'],['money','Бюджет и лимиты'],['st','Паузы и запуски'],['ak','Акции']];

function openIst(){if(!IKIND.some(x=>x[0]===S.ist.k))S.ist.k='all';

  const cnt={};for(const z of L){const k=ikind(z);cnt[k]=(cnt[k]||0)+1}

    <div class="chips">${IKIND.map(([k,l])=>`<button class="chip press" type="button" data-istk="${k}" aria-pressed="${S.ist.k===k}">${l}${k==='all'?' · '+all:cnt[k]?' · '+cnt[k]:''}</button>`).join('')}<button class="chip press" type="button" data-act="istavto" aria-pressed="${S.ist.avto}">+ автоматика</button></div>`;
  if(!L.length)return {t:'Журнал правок',s:esc(K.name),h:h+'<div class="empty"><b>Пусто</b>По этому отбору записей нет. «Автоматика» — правки биддера, графика и лимита дня — скрыта, пока не включить.</div>'};

  return {t:'Журнал правок',s:esc(K.name)+' · записей '+L.length,h:h+'</div>'+(L.length>300?`<div class="muted tnote">Показаны первые 300 из ${L.length} — уточните отбором.</div>`:''),

   14.11 Андрей 08:10 («сверху это обновление мест именно?»): заголовок листа — «Обновить данные», как теперь подписана кнопка в шапке */

  return {t:'Обновить данные',s:'',h:`<div class="rfw${old?' old':''}">Данные собраны <b class="num">${when}</b>. Сбор идёт сам каждые 30 минут.</div><div class="rfl">`

  else if(a==='st')actStatus(+rk[0],rk[1]);else if(a==='bid')actBid(+rk[0],rk[1]);else if(a==='dep')actDep(+rk[0],rk[1]);else if(a==='lim')actLim(+rk[0],rk[1]);
  else if(a==='price')actPrice(+ds.nm);else if(a==='note'||a==='notes')openNotes(+ds.nm||0,+ds.cid||0);else if(a==='create')actCreate(+ds.nm);
  else if(a==='minus')actMinus(kk[0],kk[1],kk.slice(2).join('|'));else if(a==='klbid')actKlBid(kk[0],kk[1],kk.slice(2).join('|'));
  else if(a==='perenos')actPerenos();else if(a==='bidder')actBidder(+rk[0],rk[1]);else if(a==='gr')actGr(+rk[0],rk[1]);
  else if(a==='bally'){const t=TOV[ds.nm];if(t&&t.bl)openBally(t.bl.id);else actBally(+ds.nm)}else if(a==='ballystop')actBallyStop(+ds.id);
  else if(a==='unlock')unlock();else if(a==='lockupr'){UPR=null;RS.del('upr');if(ES){ES.close();ES=null}render(true);toast('Управление на этом устройстве выключено')}
  else if(a==='ref-read'){closeAll();$('#refBtn').classList.add('spin');reload().then(()=>toast('Показаны данные на '+D.at.slice(11,16)+' МСК')).catch(e=>toast(e.message)).then(()=>$('#refBtn').classList.remove('spin'))}

/* ── свайп по листу — к соседней кампании или товару. Свайп между разделами убран: срабатывал при прокрутке таблиц и графиков
   (13.11 Андрей: «свайп плохо работает между разделами») — разделы переключаются нижними кнопками ── */
function swapSheet(d){const top=SHS[SHS.length-1];if(!top||!top.nav)return false;const j=top.nav.i+d;if(j<0||j>=top.nav.n){toast(d>0?'Это последняя в списке':'Это первая в списке');return false}
  SHS.pop();SWK=d>0?'shf':'shb';top.nav.to(j);SWK=null;return true}
(()=>{const HS='.scx,.tw,.tws,.mxw,.sub,.chips,.bars,.grw,.seg,.selbar,.prs,input,textarea,select';let s=null;const el=$('#sbody');
  el.addEventListener('touchstart',e=>{if(e.touches.length!==1){s=null;return}const t=e.touches[0];s={x:t.clientX,y:t.clientY,t:Date.now(),el:e.target}},{passive:true});
  el.addEventListener('touchend',e=>{if(!s)return;const t=e.changedTouches[0],dx=t.clientX-s.x,dy=t.clientY-s.y,o=s;s=null;
    if(Date.now()-o.t>600||Math.abs(dx)<90||Math.abs(dx)<Math.abs(dy)*2.5)return;

  el.addEventListener('click',e=>{const x=e.target.closest&&e.target.closest('[data-frf]');if(x){e.stopPropagation();frSwitch(x.dataset.frf)}});

  /* 14.11: сводная запись «Что меняли» — раскрыть / свернуть список на месте, без перерисовки листа */

]).flatMap((s,i)=>i%3===2?[s,'Благодарю']:[s]);   // как в Отклике (Андрей 28.10): «через каждые 3 аффирмации — одну «Благодарю»»

function actCreate(nm){if(!need())return;const t=TOV[nm];if(!t)return;const b=K.bal||{},mt=(K.cfg.minTopUp||100000)/100,td=D.today.slice(8,10)+'.'+D.today.slice(5,7)+'.'+D.today.slice(0,4);

  const o={typ:'sps',name:'',plus1:true,start:true,src:depFirst(b,mt),touched:false,sum:String(mt),lim:''},mk=()=>TY[o.typ][0]+' '+t.art+' от '+td;o.name=mk();
  sheet(()=>({t:'Новая кампания',s:esc(t.art),h:`${seg('crt',[['sps','СПС'],['poisk','ПОИСК'],['avto','АВТО']],o.typ,'sm')}<div class="hint">${TY[o.typ][0]} — ${TY[o.typ][1]}.</div>
     <label class="fld"><span>Название</span><input class="inp" id="cn" maxlength="100" value="${esc(o.name)}" style="font-size:16px"></label>
     <div class="opt"><div><b>Ставка: минимум ВБ + 1 ₽</b><span>выключено — останется минимальная</span></div><button class="sw" type="button" role="switch" id="cp1" aria-checked="${o.plus1}"></button></div>
     <label class="fld"><span>Бюджет, ₽ · от ${f0(mt)}</span><input class="inp num" id="cs" inputmode="numeric" value="${esc(o.sum)}"></label>
     ${depHtml(b,o.src)}
     <div class="opt"><div><b>Сразу запустить</b><span>иначе останется «готова к запуску»</span></div><button class="sw" type="button" role="switch" id="cst" aria-checked="${o.start}"></button></div>
     <label class="fld"><span>Свой лимит расхода в день, ₽ · пусто — без лимита</span><input class="inp num" id="cl" inputmode="numeric" placeholder="например 177" value="${esc(o.lim)}"></label>
     <div class="note w">Создание кампаний здесь ещё не проверено на живом кабинете — сервис сообщит о каждом шаге.</div>
     <div id="cerr" class="bad" style="font-size:13px;min-height:18px;margin-top:8px"></div>${RUNBOX('Создать кампанию')}`,
     after:()=>{const up=()=>{const v=numv('cs'),l=numv('cl'),have=depHave(b,o.src),okl=!$('#cl').value.trim()||(isFinite(l)&&l>=50&&l<=100000);
        $('#cerr').textContent=!isFinite(v)?'':v<mt?'ВБ принимает бюджет от '+f0(mt)+' ₽.':v>50000?'Больше 50 000 ₽ за раз сервис не кладёт.':v>have?'На '+depName(o.src)+' столько нет.':!okl?'Лимит дня — от 50 ₽.':'';
        $('#okBtn').disabled=!(isFinite(v)&&v>=mt&&v<=50000&&v===Math.round(v)&&v<=have&&okl&&$('#cn').value.trim().length>=3)};
       $('#cn').oninput=()=>{o.name=$('#cn').value;o.touched=true;up()};$('#cs').oninput=()=>{o.sum=$('#cs').value;up()};$('#cl').oninput=()=>{o.lim=$('#cl').value;up()};up();
       $('#cp1').onclick=e=>{o.plus1=!o.plus1;e.currentTarget.setAttribute('aria-checked',o.plus1)};$('#cst').onclick=e=>{o.start=!o.start;e.currentTarget.setAttribute('aria-checked',o.start)};
       $$('#sbody [data-src]').forEach(x=>x.onclick=()=>{o.src=+x.dataset.src;redraw()});
       /* 14.11: ответ пришёл с самой кампанией (patch.rkn) — она уже в списке; лист подтверждения не закрывается сам, в нём кнопка «открыть» —
          лист новой кампании вместо этого листа. Ответ без кампании (прежний сервис) — лист закрывается, как раньше */
       $('#okBtn').onclick=()=>{const my=SHS[SHS.length-1],nk=r=>{const n=r&&r.patch&&r.patch.rkn;return n&&RK[n.id]?n:null};
         run({k:'create',nm:+nm,typ:o.typ,name:$('#cn').value.trim(),plus1:o.plus1,sum:numv('cs'),src:o.src,start:o.start,lim:$('#cl').value.trim()?numv('cl'):0},
           (r,away)=>{if(away||nk(r))return;const i=SHS.indexOf(my);if(i<0)return;if(i===SHS.length-1)back();else SHS.splice(i,1)},
           {ok:(r,box)=>{const n=nk(r);if(!n)return;
             box.insertAdjacentHTML('beforeend',`<button class="rkngo press" type="button" id="rkngo"><span><b>Кампания создана в кабинете ВБ</b><small>${esc(RK[n.id].name)} · ${rkSt(RK[n.id]).t}</small></span><em>открыть ›</em></button>`
               +'<div class="acts" style="grid-template-columns:1fr;margin-top:8px"><button class="btn gray press" type="button" data-act="back">Закрыть</button></div>');
             try{$('#rkngo').scrollIntoView({block:'nearest',behavior:shMove()?'smooth':'auto'})}catch(x){}
             $('#rkngo').onclick=()=>{const i=SHS.indexOf(my),u=i>0?SHS[i-1]:null,sc=u&&u.sc;if(i>=0&&i===SHS.length-1)SHS.pop();openRk(+n.id,String(n.nm));if(u&&sc)u.sc=sc}}})}}}),true);   // лист товара под ним вернётся на своё место
  SEGCB.crt=v=>{o.typ=v;if(!o.touched)o.name=mk();redraw()}}
function actNote(nm,cid){if(!need())return;sheet(()=>({t:'Заметка',s:nm&&TOV[nm]?esc(TOV[nm].art):esc(K.name),h:`<label class="fld"><span>Что сделали и зачем</span><textarea class="inp" id="nt" maxlength="300" placeholder="Например: подняли ставку — упали на 9-е место"></textarea></label>${RUNBOX('Сохранить')}`,
   after:()=>{const up=()=>{$('#okBtn').disabled=!$('#nt').value.trim()};$('#nt').oninput=up;up();setTimeout(()=>{const x=$('#nt');if(x)x.focus()},350);$('#okBtn').onclick=()=>run({k:'note',nm:nm?+nm:null,cid:cid?+cid:null,text:$('#nt').value.trim().slice(0,300)})}}),true)}
function actMinus(cid,nm,q){if(!need())return;const z=(((KL.kab[S.kab]||{}).k||{})[cid+'|'+nm]||{q:[]}).q.find(x=>x.t===q),isx=!!(z&&z.x),r=RK[cid];
  sheet(()=>({t:isx?'Вернуть показы по запросу?':'Добавить в минус-фразы?',s:esc(r.name),h:`<div class="cmp"><div><small>Запрос</small><b style="font-size:16px;white-space:normal">${esc(q)}</b></div><div class="ar">→</div><div><small>Станет</small><b style="font-size:16px">${isx?'показывается':'в минус-фразах'}</b></div></div>
    <div class="note">${isx?'Запрос уберётся из минус-фраз кампании.':'Товар перестанет показываться по этому запросу в этой кампании. Остальные минус-фразы останутся как есть.'}</div>${RUNBOX(isx?'Вернуть':'В минус')}`,
    after:()=>{$('#okBtn').onclick=()=>run({k:'minus',cid:+cid,nm:+nm,q,add:!isx})}}),true)}
function actKlBid(cid,nm,q){if(!need())return;const z=(((KL.kab[S.kab]||{}).k||{})[cid+'|'+nm]||{q:[]}).q.find(x=>x.t===q),cur=z&&z.b,r=RK[cid],base=(r.nm[nm]||{b:{}}).b.search;
  sheet(()=>({t:'Ставка запроса',s:esc(q),h:`<div class="hint" style="margin-top:0">Своя ставка одного запроса. Без неё действует общая ставка кампании: ${kop(base)}.</div>
     <label class="fld"><span>Ставка, ₽ за 1000 показов · сейчас ${cur?kop(cur):'общая'}</span><input class="inp num" id="kv" inputmode="numeric" value="${Math.round((cur||base||0)/100)}"></label>
     <div class="cmp"><div><small>Было</small><b class="num">${cur?kop(cur):'общая'}</b></div><div class="ar">→</div><div><small>Станет</small><b class="num" id="knew">—</b></div></div>
     <div id="runbox"><div class="acts" style="grid-template-columns:1fr 1fr 1.4fr"><button class="btn gray press" type="button" data-act="back">Отмена</button><button class="btn gray press" type="button" id="kdel"${cur?'':' disabled'}>Снять</button><button class="btn press" type="button" id="okBtn">Поставить</button></div></div>`,
     after:()=>{const up=()=>{const v=numv('kv');$('#knew').textContent=isFinite(v)?kop(Math.round(v)*100):'—';$('#okBtn').disabled=!(isFinite(v)&&v>=1&&v<=29999)};$('#kv').oninput=up;up();
       $('#okBtn').onclick=()=>run({k:'klbid',cid:+cid,nm:+nm,q,kop:Math.round(numv('kv'))*100,was:cur||null});$('#kdel').onclick=()=>run({k:'klbid',cid:+cid,nm:+nm,q,kop:0,was:cur||null})}}),true)}
/* 14.11 Андрей: «обновить РК нужно чтобы» — сторож перечитывает ОДНУ кампанию (rkref: статус, ставка, остаток бюджета, статистика за сегодня)
   и отвечает за секунды; общий быстрый сбор, около двух минут, остался в «Обновлении». В кабинете ничего не меняется — только чтение */
let RKREF=0;
async function actRkRef(id,nm){if(RKREF||!need())return;RKREF=id;redraw();
  const tx=m=>{const b=$('#rkrefb');if(b)b.innerHTML='<span class="sp"></span>'+esc(m)};
  try{const r=await quick({k:'rkref',cid:id,nm:+nm},()=>tx('Читаю ВБ…'),90000);RKREF=0;redraw();toast(r.msg||'Кампания перечитана')}
  catch(e){RKREF=0;redraw();toast(e.message)}}
function actRefresh(mode){if(!need())return;
  if(mode==='mesta'){const m=D.mst||{};
    sheet(()=>({t:'Снять места сейчас',s:'ручной замер, как «прожим» в Марпле',h:`<div class="note">Сервис снимет места по главным фразам работающих кампаний. Идёт в фоне около 20 минут — страницу можно закрыть, места появятся сами. В кабинетах ничего не меняется.</div>${RUNBOX('Запустить замер')}`,
      after:()=>{$('#okBtn').onclick=()=>run({k:'mesta'},(r,away)=>{if(!away)closeAll()})}}),true);return}
  sheet(()=>({t:mode==='full'?'Собрать всё заново':'Собрать сейчас',s:esc(D.kab.kab1?'оба кабинета':K.name),h:`<div class="note">${mode==='full'?'Полный сбор: 31 день статистики, запросы, акции, остатки. Идёт 15–30 минут — страницу можно закрыть.':'Быстрый сбор: статусы, ставки, бюджеты, цены, статистика за 3 дня. Около двух минут.'} В кабинетах ничего не меняется.</div>${RUNBOX('Запустить сбор')}`,
    /* 14.11: сбор не удался или сторож промолчал — кнопка обновления в шапке раньше крутилась без конца; теперь останавливается */
    after:()=>{$('#okBtn').onclick=()=>{$('#refBtn').classList.add('spin');const my=SHS[SHS.length-1];run({k:'refresh',mode},(r,away)=>{$('#refBtn').classList.remove('spin');const fin=()=>{const i=SHS.indexOf(my);if(i>=0)SHS.splice(i,1);const u=SHS[SHS.length-1];if(u&&u.ref){SHS.pop()}try{if(away)redraw();else drawSheet()}catch(e){closeAll()}};reload().then(()=>{fin();toast('✓ Данные обновлены')}).catch(fin)}).then(ok=>{if(!ok)$('#refBtn').classList.remove('spin')})}}}),true)}

/* ───────── баллы за отзывы (Каб 1): акции читаются из кабинета; создать и остановить — сторож через кабинет, после подтверждения ───────── */
const BLK=1.2806;   // 1 балл покупателю = 1,2806 ₽: комиссия ВБ 23% и НДС 22% от комиссии
function openBally(id){sheet(()=>{const p=((K.bally||{}).promos||[]).find(x=>x.id===id);if(!p)return {t:'Баллы за отзывы',s:'',h:'<div class="empty"><b>Акции нет в списке</b>Обновите данные.</div>'};
  const its=p.items||[];
  let h=`<div class="tiles"><div class="tile"><div class="l">Отзывы</div><div class="v num">${f0(p.fakt)} <small>из ${f0(p.cel)}</small></div><div class="d">оплачено ${f0(p.opl)}</div></div>
    <div class="tile"><div class="l">Потрачено</div><div class="v num">${rub(p.spent)}</div><div class="d">из ${rub(p.bud)}</div></div>
    <div class="tile"><div class="l">Покупателям</div><div class="v num">до ${kr(p.net)} <small>₽</small></div><div class="d">остальное — комиссия ВБ и НДС</div></div>
    <div class="tile"><div class="l">Кому</div><div class="v" style="font-size:15px;line-height:1.25">${p.aud?'новым и уже купившим':'только новым покупателям'}</div><div class="d">${p.st==='planned'?'старт '+dm(p.s):p.st==='draft'?'черновик':'идёт с '+dm(p.s)}</div></div></div>
    <div class="hrw"><h3>Товары · ${its.length||p.n}</h3></div>`;
  h+=its.length?'<div>'+its.map(i=>{const t=TOV[i.nm];return `<button class="akr press" type="button" data-nm2="${i.nm}" style="width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;cursor:pointer"><i class="tph"${foto(t||{nm:i.nm})}></i><div><b>${esc(t?t.art:'№ '+i.nm)}</b><span class="num">${jn('за текст '+i.t,'фото '+i.p,'видео '+i.v)}</span></div><div class="pr num">${i.got==null?'—':f0(i.got)}<small>из ${f0(i.cnt)} отзывов</small></div></button>`}).join('')+'</div>':'<div class="note" style="margin-top:0">Товары этой акции не прочитаны.</div>';
  h+=`<div class="hint">Бюджет ${rub(p.bud)} — потолок на всю цель: ${rub(p.net)} — баллы покупателям, остальное — комиссия ВБ и НДС.</div>`;
  if(p.st==='active'||p.st==='planned')h+=`<div class="acts" style="grid-template-columns:1fr"><button class="btn gray press${UPR?'':' nolk'}" type="button" data-act="ballystop" data-id="${p.id}">Остановить акцию</button></div>`;
  return {t:esc(p.name),s:'Баллы за отзывы · № '+p.id+' · '+esc(K.name),h}})}
function blRange(t){const v=(K.bally&&K.bally.val)||[],pr=t.pr?t.pr.f:0,i=pr<=500?1:pr<=2000?2:pr<=5000?3:4;return v.find(x=>x.id===i)||{t:[100,5000,150],p:[50,4850,100],v:[50,4850,100],cnt:[20,10000,25],mx:5000}}
function actBally(nm){if(!need())return;const t=TOV[nm];if(!t)return;const R=blRange(t),td=D.today.slice(8,10)+'.'+D.today.slice(5,7);
  const o={t:String(R.t[0]),p:String(R.p[0]),v:String(R.v[0]),cnt:String(R.cnt[0]),aud:0,name:(t.art+' '+td).slice(0,60)};
  sheet(()=>({t:'Баллы за отзывы',s:esc(t.art),h:`<div class="hint" style="margin-top:0">Покупатель получает баллы ВБ за отзыв: за текст, фото и видео — баллы складываются.</div>
    <label class="fld"><span>За текст, баллов · от ${R.t[0]}${R.t[2]?' · ВБ советует '+R.t[2]:''}</span><input class="inp num" id="blt" inputmode="numeric" value="${esc(o.t)}"></label>
    <label class="fld"><span>За фото, баллов · от ${R.p[0]}</span><input class="inp num" id="blp" inputmode="numeric" value="${esc(o.p)}"></label>
    <label class="fld"><span>За видео, баллов · от ${R.v[0]}</span><input class="inp num" id="blv" inputmode="numeric" value="${esc(o.v)}"></label>
    <label class="fld"><span>Сколько отзывов собрать · от ${R.cnt[0]}</span><input class="inp num" id="blc" inputmode="numeric" value="${esc(o.cnt)}"></label>
    <div class="fld"><span>Кому предлагать</span>${seg('blaud',[[0,'Только новым покупателям'],[1,'И тем, кто уже купил']],o.aud,'sm')}</div>
    <label class="fld"><span>Название акции · покупатели его не видят</span><input class="inp" id="bln" maxlength="60" value="${esc(o.name)}" style="font-size:16px"></label>
    <div id="blcalc"></div><div id="blerr" class="bad" style="font-size:13px;min-height:18px;margin-top:8px"></div>${RUNBOX('Запустить акцию')}`,
    after:()=>{const up=()=>{const a=numv('blt'),b=numv('blp'),c=numv('blv'),n=numv('blc'),ii=x=>isFinite(x)&&x===Math.round(x)&&x>=0;
        const okn=ii(a)&&ii(b)&&ii(c)&&ii(n)&&a>=1,one=a+b+c,net=one*n,tot=net*BLK,ok=okn&&n>=R.cnt[0]&&n<=500&&one<=R.mx&&tot<=50000&&$('#bln').value.trim().length>=3;
        $('#blcalc').innerHTML=okn&&n>=1?`<div class="cmp"><div><small>Покупателям, не больше</small><b class="num">${rub(net)}</b></div><div class="ar">→</div><div><small>Бюджет с комиссией ВБ</small><b class="num">${rub2(tot)}</b></div></div>
          <div class="kv"><span>За отзыв с текстом, фото и видео</span><b class="num">${f0(one)} баллов · ${rub2(one*BLK)}</b><span>Комиссия ВБ 23% и НДС 22% от неё</span><b class="num">${rub2(tot-net)}</b></div>
          <div class="note">Это потолок: ВБ спишет только за пришедшие отзывы. Для запуска на балансе нужно ${rub(tot*(o.aud?0.3:0.2))} (${o.aud?'30':'20'}% бюджета), иначе акция останется черновиком.</div>`:'';
        $('#blerr').textContent=!okn?(isFinite(a)&&isFinite(n)?'Баллы и число отзывов — целыми числами, за текст — больше нуля.':''):n<R.cnt[0]?'ВБ принимает цель от '+R.cnt[0]+' отзывов.':n>500?'Больше 500 отзывов за одну акцию сервис не оформляет.':one>R.mx?'Больше '+f0(R.mx)+' баллов за один отзыв для товара с такой ценой ВБ не принимает.':tot>50000?'Бюджет больше 50 000 ₽ сервис не оформляет.':a<R.t[0]||b<R.p[0]||c<R.v[0]?'Меньше обычного минимума ВБ ('+R.t[0]+' / '+R.p[0]+' / '+R.v[0]+'). В части категорий минимум ниже — кабинет примет или откажет сам.':'';
        $('#okBtn').disabled=!ok};
      for(const id of ['blt','blp','blv','blc','bln'])$('#'+id).oninput=()=>{o.t=$('#blt').value;o.p=$('#blp').value;o.v=$('#blv').value;o.cnt=$('#blc').value;o.name=$('#bln').value;up()};up();
      $('#okBtn').onclick=()=>{const a=numv('blt'),b=numv('blp'),c=numv('blv'),n=numv('blc');run({k:'bally',nm:+nm,t:a,p:b,v:c,cnt:n,aud:o.aud,name:$('#bln').value.trim(),bud:Math.round((a+b+c)*n*BLK*100)/100},(r,away)=>{if(away)return;closeAll();if(S.tab==='bl'){S.blf='on';sync();render()}else openProd(+nm)})}}}),true);
  SEGCB.blaud=v=>{o.aud=+v;redraw()}}
function actBallyStop(id){if(!need())return;const p=((K.bally||{}).promos||[]).find(x=>x.id===id);if(!p)return;
  sheet(()=>({t:'Остановить акцию?',s:esc(p.name),h:`<div class="cmp"><div><small>Сейчас</small><b>${p.st==='planned'?'запланирована':'идёт'}</b></div><div class="ar">→</div><div><small>Станет</small><b>в архиве</b></div></div>
    <div class="note">Значок пропадёт с карточек. Купившие по акции ещё 5 дней могут получить баллы за отзыв. Вернуть акцию нельзя — только создать новую.</div>${RUNBOX('Остановить')}`,
    after:()=>{$('#okBtn').onclick=()=>run({k:'ballystop',pid:id},(r,away)=>{if(!away)closeAll();render(true)})}}),true)}

/* ───────── биддер: совет считает сборщик (bidder.py), в режиме «сам» ставку ставит страж ───────── */
const BDK={segodnya:' сегодня',posle:' после смены ставки',vchera:' вчера',malo:' сегодня',seychas:' сейчас в поиске',glubzhe:' сейчас в поиске'};
const bdOn=b=>!!(b&&b.mode&&b.mode!=='off');
const bdCh=b=>bdOn(b)&&b.new!=null&&b.cur!=null&&b.new!==b.cur;
const bdName=b=>!bdOn(b)||b.src==='marpla'?'выключен':(b.mode==='sam'?'сам':'совет')+' · цель '+b.cel+' · до '+kop(b.max);
const bdPill=(e,lv)=>{const b=e.bd;if(!bdOn(b))return '';const ch=bdCh(b);if(b.src==='marpla'&&!ch)return '';const dot=lv&&b.src!=='marpla';
  return `<span class="pill ${b.mode==='sam'?'a':''}${dot?(b.mode==='sam'?' lv':' lv sv'):''} num">${dot?'<i></i>':''}${b.src==='marpla'?'наш биддер поставил бы':b.mode==='sam'?'биддер: сам':'биддер: совет'}${ch?' '+(b.new>b.cur?'↑':'↓')+' '+kop(b.new):''}</span>`};
/* 14.11 Андрей: «фраза биддера, факт тоже надо». Факт — на каком месте товар по фразе биддера сейчас: сегодняшний свой замер выдачи (D.ms, со временем),
   иначе место, по которому считал биддер (b.p, b.pk), иначе последний старый замер; нет ничего — так и пишем «место не снято» */
