/* 18.11 Андрей (кадр листа товара, обвёл «Продажи по дням» и «По дням: ДРР и заказы»): «пусть свёрнуты и будут каждый с раскрытием» — каждый график открывается своей строкой;
   открыто / закрыто помним до перезагрузки страницы (при смене периода и товара не схлопывается) */
let PGF={};
document.addEventListener('toggle',e=>{const x=e.target;if(x&&x.classList&&x.classList.contains('gfd'))PGF[x.dataset.gf]=x.open},true);
const gfBlk=(k,ttl,hint,oo,body)=>`<details class="gfd" data-gf="${k}"${PGF[k]?' open':''}><summary class="hrw"><h3>${ttl}</h3>${oo?`<span class="muted gfo">${oo}</span>`:''}<span class="muted num gfc">${hint}</span><i class="gfa" aria-hidden="true">›</i></summary>${body}</details>`;
function prodBody(nm,ctx,ci){const t=TOV[nm],ix=PI(),pp=PP(),a=pAgg(t,ix),b=pp?pAgg(t,pp):null,td=pAgg(t,[T]),y=T>0?pAgg(t,[T-1]):null,y2=T>1?pAgg(t,[T-2]):null,W=wrk(t),P=t.rk.map(id=>RK[id]).filter(r=>r&&!rkLive(r));
  const memo={},gm=i=>memo[i]||(memo[i]=pAgg(t,[i])),pn=t.pan||{},cx=[];for(let i=Math.max(0,T-Math.max(13,S.per-1));i<=T;i++)cx.push(i);
  const rctx=t.rk.map(id=>id+'|'+nm).join(',');
  /* 13.11 Андрей: «с нашей скидкой нашу цену надо и цену для покупателя чуть меньше», цену с WB Клубом не показываем */
  /* 14.11 Андрей: «в товаре над рк отдельный смену периода или нет вот как на главной он в шапке» — период один, первой строкой листа, прилипает к верху */
  /* 24.11 Андрей (кадр листа товара Средство_яма, обвёл шапку): «этот блок надо сделать таким же как в рк» — из тела убраны большое фото с ценой (div.prh), кнопка «Товар на ВБ» (div.wbln) и плашки остатков: они в шапке. Нижняя цена автоакций, блокировка снижения и «со складов ВБ» остаются здесь */
  const metaRest=(t.am&&(t.am[0]||t.am[1])?`<span class="pill num">${t.am[0]?'нижняя цена автоакций '+f0(t.am[0])+' ₽'+(t.am[2]?' до '+dm(t.am[2]):''):''}${t.am[1]?(t.am[0]?' · ':'')+'снижение цены в автоакциях заблокировано':''}</span>`:'')+(a.oq&&a.wb?`<span class="pill num">со складов ВБ ${pc(100*a.wb/a.oq)} заказов</span>`:'');
  let h=perSeg()+(metaRest?`<div class="meta" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:9px">${metaRest}</div>`:'');
  if(t.oh&&S.ostOpen)h+=ostHist(t);
  if(ostNet(t)&&W.length)h+='<div class="note b">'+(fboR(t)===0&&t.fbo>0?`На складах ВБ по отчёту ${f0(t.fbo)} шт, но заказать нельзя ни одной, а реклама идёт.`:'Товара нет ни на складах ВБ, ни на своём складе, а реклама идёт.')+'</div>';
  h+=panBlock(t,a);   // 14.11 23:08 Андрей: «по панели надо видеть сверху ситуацию, необязательно сразу 3 периода» — сразу под ценой и остатками, один период
  h+='AKROW';   /* 24.11 Андрей (кадр листа товара Сетка20х20_10м): «в таких разделах тоже надо работу с акциями блок» — как в листе кампании, свёрнутой строкой «Акции» под «Показателями» (они по-прежнему выше акций); блок «Акции ВБ» снизу переехал сюда */
  /* 14.11 (четвёртый заход): строки «панель неделя / месяц: ДРР · маржа» над главными цифрами больше нет — те же числа в блоке «Показатели» под кампаниями (panBlock) */

  h+=`<div class="tdl num">Сегодня: траты <b class="${sbad(td.s,td.oq)}">${rub(td.s)}</b> · заказы <b>${f0(td.oq)} шт</b> на ${kr(td.or)} ₽ · цена заказа с рекламы ${perZa()} <b>${a.cpo==null?'—':isFinite(a.cpo)?rub(a.cpo):'нет заказов'}</b></div>`;
  /* 15.11 Андрей (кадр «СТИК», обвёл кампании и графики, стрелка вверх): «поменяй пожалуйста местами» — продажи и ДРР по дням стоят над кампаниями */
  /* 14.11 Андрей: «гистограмма продаж как в лк вб только в 1 ряд прям такой же дизайн возьми просто не размашисто» — продажи по дням сразу под главными
     цифрами, низко (100 px); это прежний блок «Карточка по дням: заказали, шт» (он стоял внизу листа) — перенесён сюда, второго нет.
     Нет счёта карточки за день — заказы по отчёту ВБ (t.o.q), подпись под столбиками говорит об этом */
  const hasF=i=>!!(t.f&&t.f.has[i]),sq=i=>hasF(i)?t.f.o[i]:t.o&&t.o.q?t.o.q[i]||0:null;

  const nzq=!cx.some(i=>(sq(i)||0)>0);

  else if(cx.some(i=>sq(i)!=null)){const nf=cx.filter(i=>!hasF(i)).length;
    h+=gfBlk('sal','Продажи по дням, шт',`сегодня ${f0(sq(T)||0)} шт`,'как в кабинете',`<div class="sal1">`+chart({ix:cx,h:100,val:sq,col:()=>'var(--acc)',top:i=>sq(i)?sq(i):'',
      read:i=>hasF(i)?`<b>${dlab(i)}${i===T?' (сегодня)':''}</b> · открыли ${f0(t.f.op[i])} · в корзину ${f0(t.f.cart[i])}${t.f.op[i]?' ('+pc(100*t.f.cart[i]/t.f.op[i])+')':''} · заказали <b>${f0(t.f.o[i])}</b> на ${rub(t.f.r[i])} · выкупили ${f0(t.f.b[i])}`
        :`<b>${dlab(i)}</b> · заказали <b>${f0(sq(i)||0)}</b> — по отчёту ВБ, счёта карточки за этот день нет`})+'</div>'
      +(nf?`<div class="muted tnote">${nf===cx.length?'Счёта карточки нет — заказы по отчёту ВБ (он показывает меньше).':'За '+nf+' дн. счёта карточки нет — там заказы по отчёту ВБ (он показывает меньше).'}</div>`:''))}
  const cd=chgDays(nm,0);

    <div class="chips">${IKIND.map(([k,l])=>`<button class="chip press" type="button" data-istk="${k}" aria-pressed="${S.ist.k===k}">${l}${k==='all'?' · '+all:cnt[k]?' · '+cnt[k]:''}</button>`).join('')}<button class="chip press" type="button" data-act="istavto" aria-pressed="${S.ist.avto}">+ автоматика</button></div>`;

  /* 24.11 Андрей «проверь все мои правки, чтобы ко всем» (23.11 «одного достаточно» — одинаковые записи автоматики одной строкой, как в истории товара и листе лимита):

/* ── свайп по листу — к соседней кампании или товару. Свайп между разделами убран: срабатывал при прокрутке таблиц и графиков
   (13.11 Андрей: «свайп плохо работает между разделами») — разделы переключаются нижними кнопками ── */
function swapSheet(d){const top=SHS[SHS.length-1];if(!top||!top.nav)return false;const j=top.nav.i+d;if(j<0||j>=top.nav.n){toast(d>0?'Это последняя в списке':'Это первая в списке');return false}
  SHS.pop();SWK=d>0?'shf':'shb';top.nav.to(j);SWK=null;return true}
(()=>{const HS='.scx,.tw,.tws,.mxw,.sub,.chips,.bars,.grw,.seg,.selbar,.prs,input,textarea,select,.dh';let s=null;const el=$('#sbody');
  el.addEventListener('touchstart',e=>{if(e.touches.length!==1){s=null;return}const t=e.touches[0];s={x:t.clientX,y:t.clientY,t:Date.now(),el:e.target}},{passive:true});
  el.addEventListener('touchend',e=>{if(!s)return;const t=e.changedTouches[0],dx=t.clientX-s.x,dy=t.clientY-s.y,o=s;s=null;
    if(Date.now()-o.t>600||Math.abs(dx)<90||Math.abs(dx)<Math.abs(dy)*2.5)return;
    if(o.el.closest&&o.el.closest(HS))return;   // там свой жест вбок
    swapSheet(dx<0?1:-1)},{passive:true});
  /* 14.11: «Активные / Исключённые / Все» в таблице фраз — спокойная смена (frSwitch); ловим раньше общего обработчика, он перерисовал бы весь лист */
  el.addEventListener('click',e=>{const x=e.target.closest&&e.target.closest('[data-frf]');if(x){e.stopPropagation();frSwitch(x.dataset.frf)}});
  /* 14.11: состав кластера в таблице фраз — раскрыть / свернуть на месте (klToggle); «Цена по дням» — смена «наша / у покупателя / скидка ВБ» только в своём блоке */

  el.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('klhow'))KLHOW=e.target.open},true);   // «Что такое кластер» — помним, открыто ли
  /* 15.11: «история ›» в строке «Сегодня» листа кампании — 7 последних записей раскрыть / свернуть на месте */
  el.addEventListener('click',e=>{const x=e.target.closest&&e.target.closest('[data-tdlh]');if(!x)return;e.stopPropagation();TDLH=!TDLH;x.classList.toggle('on',TDLH);const w=x.closest('.tdl'),n=w&&w.nextElementSibling;if(n&&n.classList.contains('tdlh'))n.classList.toggle('on',TDLH)});

/* ───────── 24.11 Андрей: «проверка по выбранным ключам … раз в день … есть она в тексте или описании или нет, как-то аккуратно,
   и кнопка, чтобы проверить сразу. И быстро. Без трат».
   Название и описание карточки приходят со сбором (tt, ds, tat — тексты перечитываются раз в сутки, в полном сборе), у каждой фразы
   в таблице — пометка. «Текст · N» в полосе выбора — лист по выбранным фразам; «Проверить сейчас» — сторож (txt) за секунды
   перечитывает карточку из ВБ (только чтение, бесплатно) и возвращает итог по фразам (txr). Правило сверки — как tx_in() в wbapi.py. */
function txNorm(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/x/g,'х').replace(/[^0-9a-zа-я]+/g,' ').trim()}
function txIn(q,text){q=txNorm(q);const t=txNorm(text);if(!q||!t)return 0;if((' '+t+' ').includes(' '+q+' '))return 2;
  const tw=t.split(' '),ts=new Set(tw);
  for(const w of q.split(' ')){if(w.length<=3){if(!ts.has(w))return 0}else{const st=w.slice(0,Math.max(4,w.length-2));if(!tw.some(x=>x.startsWith(st)))return 0}}
  return 1}
/* [в названии, в описании]: 2 — дословно, 1 — все слова есть, 0 — нет; null — текста карточки нет в данных */
function txRes(nm,q){const t=TOV[nm];if(!t)return null;if(t.txr&&t.txr[q])return t.txr[q];if(t.ds==null)return null;return [txIn(q,t.tt),txIn(q,t.ds)]}
function txkTag(nm,q){const r=txRes(nm,q);if(!r)return '';
  const [a,b]=r,m=Math.max(a,b);
  const tx=a===2&&b===2?'✓ в названии и описании':a===2?'✓ в названии':b===2?'✓ в описании':m===1?'≈ слова есть, но не подряд':'✗ нет в тексте';
  return `<small class="txk ${m===2?'ok':m===1?'sl':'no'}">${tx}</small>`}
const txCell=v=>v===2?'<span class="txk ok">✓ есть</span>':v===1?'<span class="txk sl">≈ по словам</span>':'<span class="txk no">✗ нет</span>';
const txWhen=s=>{if(!s)return '';const d=String(s),day=d.slice(0,10);return (day===D.today?'сегодня':day.slice(8,10)+'.'+day.slice(5,7))+' в '+d.slice(11,16)};
let TXK=0;
function openTxk(id,nm){const qs=[...FR.sel];if(!qs.length){toast('Отметьте фразы галочками');return}
  sheet(()=>{const t=TOV[nm]||{},L=[...FR.sel].length?[...FR.sel]:qs,res=L.map(q=>[q,txRes(nm,q)]),have=res.some(x=>x[1]);
    const n2=res.filter(x=>x[1]&&Math.max(...x[1])===2).length,n0=res.filter(x=>x[1]&&Math.max(...x[1])===0).length;
    const dl=t.dl!=null?t.dl:t.ds!=null?String(t.ds).length:null,tl=t.tl!=null?t.tl:t.tt!=null?String(t.tt).length:null;
    let h=have?`<div class="note" style="margin-top:0"><b>Дословно: ${n2} из ${L.length}</b>${n0?` · нет совсем: <b class="bad">${n0}</b>`:''}<br>`
        +`<span class="muted">Текст карточки — ${esc(txWhen(t.tat)||'нет даты')}${tl!=null?` · название ${tl} знаков из 60`:''}${dl!=null?` · описание ${f0(dl)} знаков, предел обычно 2 000`:''}</span></div>`
      :`<div class="note" style="margin-top:0">Текста этой карточки в данных ещё нет — нажмите «Проверить сейчас».</div>`;
    h+=`<table class="txkt"><thead><tr><th>Фраза</th><th>Название</th><th>Описание</th></tr></thead><tbody>`
      +res.map(([q,r])=>`<tr><td>${esc(q)}</td>${r?`<td>${txCell(r[0])}</td><td>${txCell(r[1])}</td>`:'<td class="muted">—</td><td class="muted">—</td>'}</tr>`).join('')+`</tbody></table>`;
    h+=`<div class="muted" style="font-size:12px;margin:8px 2px 0">✓ — фраза стоит дословно, ≈ — все слова есть, но не подряд или в другой форме. Тексты карточек перечитываются раз в сутки, ночью.</div>`;
    h+=`<div class="acts" style="grid-template-columns:1fr;margin-top:12px"><button class="btn press${UPR?'':' nolk'}" type="button" id="txkb" data-act="frtxtgo" data-rk="${id}|${nm}"${TXK?' disabled':''}>${TXK?'<span class="sp"></span>Читаю ВБ…':'⟳ Проверить сейчас'}</button></div>`;
    return {t:'Ключи в тексте',s:esc((t.art||nm)+'')+' · выбрано '+L.length,h}},true)}
async function actTxk(id,nm){if(TXK||!need())return;const qs=[...FR.sel];if(!qs.length){toast('Отметьте фразы галочками');return}
  TXK=1;redraw();
  try{const r=await quick({k:'txt',nm:+nm,q:qs.slice(0,30)},()=>{const b=$('#txkb');if(b)b.innerHTML='<span class="sp"></span>Читаю ВБ…'},60000);TXK=0;redraw();toast(r.msg||'Текст перечитан')}
  catch(e){TXK=0;redraw()}}

/* ── 15.11 Андрей («ВБ Маркетолог К»): траты кампании по часам. ВБ по часам не отдаёт — сервис каждые 30 минут запоминает «сколько с начала дня» (chasy.py), за час = разница замеров.
   18.11 Андрей (скрин, «совершенно непонятно, читай не читай, надо по-другому»): вместо двух графиков с точками и абзаца — вывод одной фразой, таблица по частям дня
   и один график по часам с выбором Траты | Корзины | Заказы. Числа — суммы за период, а не средние с дробями («заказы 0,4»). Только показывает, ничего не меняет. ── */
document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('[data-chm]');if(!b)return;S.chm=b.dataset.chm;redraw()});
document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('[data-chz]');if(!b)return;S.chz=b.dataset.chz;redraw()});
const CHCAST=[[0,4,'Ночь'],[4,8,'Раннее утро'],[8,12,'Утро'],[12,16,'День'],[16,20,'Вечер'],[20,24,'Поздний вечер']];
function chasBlock(r,nm){const e=(r.nm||{})[nm]||{},z=e.ch,T='Когда работает реклама';
  const hd=x=>`<div class="hrw"><h3>${T}</h3>${x||''}</div>`;
  if(!z)return hd('')+`<div class="muted tnote">Копим данные по часам: сервис каждые 30 минут запоминает, сколько кампания потратила с начала дня. Первая картинка — через сутки, судить — через 5–7 дней.</div>`;
  /* 23.11 Андрей («история накопилась, сделать периоды к общим»): свой переключатель «За 7 дней | Сегодня» убран — блок берёт период из общих кнопок
     (сегодня, вчера, позавчера, 3/7/14/30 дн) и складывает часы по дням из «dd». Дней с замерами меньше, чем в периоде, — так и пишем. */
  const dd=z.dd||{},ix=PI(),isT=ix.length===1&&ix[0]===T,ds=ix.map(i=>D.days[i]),hv=ds.filter(d=>dd[d]),n=hv.length;
  const dn=k=>k%10===1&&k%100!==11?'день':k%10>=2&&k%10<=4&&(k%100<10||k%100>=20)?'дня':'дней',head=hd('');
  const P={s:Array(24).fill(0),c:Array(24).fill(0),a:Array(24).fill(0),o:Array(24).fill(0)},hasK=true,H=[...Array(24).keys()],at=(k,h)=>P[k][h]||0;
  hv.forEach(d=>['s','c','a','o'].forEach((k,j)=>{const v=dd[d][j];if(v)for(let h=0;h<24;h++)P[k][h]+=v[h]||0}));
  const sum=(k,a,b)=>{let v=0;for(let h=a;h<b;h++)v+=at(k,h);return v},all={s:sum('s',0,24),a:sum('a',0,24),o:sum('o',0,24)};
  const dp=z.dp?dm(z.dp):'—',miss=!isT&&ds.length>1&&n<ds.length&&ds[0]<(z.dp||'');
  const per=isT?`Сегодня${z.tp?', копим не с полуночи':''}, день ещё идёт.`:ds.length===1?`${perD1()[0].toUpperCase()+perD1().slice(1)}, ${dm(ds[0])}.`
    :`${perZa()[0].toUpperCase()+perZa().slice(1)}${miss?` По часам копим с ${dp}: есть ${n} ${dn(n)} из ${ds.length}.`:''}`;
  if(all.s<1)return head+`<div class="muted tnote">${per} ${!isT&&!n&&ds[ds.length-1]<(z.dp||'')?`По часам копим с ${dp}, за этот период замеров нет.`:'Трат за это время нет.'}</div>`;
  const R=CHCAST.map(([a,b,l])=>{const s=sum('s',a,b),k=sum('a',a,b),o=sum('o',a,b);return {a,b,l,s,k,o,p:k>=.5?s/k:null,ok:k>=3}});
  /* вывод — только по частям дня, где набралось хотя бы 3 корзины: на меньшем числе цена корзины случайна */
  const E=R.filter(x=>x.ok).sort((x,y)=>x.p-y.p),lo=E[0],hi=E[E.length-1],cmp=E.length>1&&hi.p/lo.p>=1.3,nm2=x=>`${x.l.toLowerCase()} ${x.a}–${x.b}`;

  if(E.length>1&&!isT&&n<5)vy+=n===1?' Это один день, вывод может поменяться.':' Дней пока мало, вывод может поменяться.';
  const cell=(v,f)=>v>=.5?f(v):'—',row=x=>{const c=cmp&&x===lo?' good':cmp&&x===hi?' bad':'';
    return `<div class="t"><b>${x.l}</b><span>${x.a}–${x.b} ч</span></div><div class="num">${cell(x.s,rub)}</div><div class="num">${hasK?cell(x.k,f0):'—'}</div><div class="num">${hasK?cell(x.o,f0):'—'}</div><div class="num pr${c}">${x.p!=null?rub(x.p):'—'}</div>`};
  const tb=`<div class="chq"><div class="h">Время</div><div class="h">Траты</div><div class="h">Корзины</div><div class="h">Заказы</div><div class="h">1 корзина</div>${R.map(row).join('')}`
    +`<div class="t f"><b>Всего</b></div><div class="num f">${rub(all.s)}</div><div class="num f">${hasK?f0(all.a):'—'}</div><div class="num f">${hasK?f0(all.o):'—'}</div><div class="num f">${hasK&&all.a>=.5?rub(all.s/all.a):'—'}</div></div>`;

  const w=hasK&&(S.chz==='a'||S.chz==='o')?S.chz:'s',V=H.map(h=>at(w,h)),mx=Math.max(w==='s'?1:.5,...V),top=[...H].filter(h=>V[h]>0).sort((a,b)=>V[b]-V[a]).slice(0,3),sel=top.length?top[0]:12;

  const ax=axTicks(mx,false).map(v=>`<div class="yt" style="bottom:${(MH*v/mx).toFixed(2)}%"><span class="num">${axNum(v)}</span></div>`).join('');
  const zb=(v,l)=>`<button type="button" class="press" data-chz="${v}" aria-pressed="${w===v}">${l}</button>`;
  return head+`<div class="chv">${vy}</div>`+tb
    +`<div class="hrw"><h3>По часам</h3><span class="pnqs">${zb('s','Траты')}${hasK?zb('a','Корзины')+zb('o','Заказы'):''}</span></div>`
    +`<div class="ch ax chh" id="${id}"><div class="rd num">${CHR[id](sel)}</div><div class="bars" style="height:150px">${ax}${b}</div><div class="xl">${x}</div></div>`
    +`<div class="muted tnote">${per} ВБ присылает статистику с задержкой, поэтому час примерный: надёжнее смотреть таблицу.${isT?'':' Что ВБ донёс после полуночи, разложено по часам дня по числу кликов.'} Нажмите на столбик — цифры за час.</div>`}

/* ── 17.11 Андрей («К», скрин главной приложения ВБ): «добавить пока что такое же точно и чтобы обновлялось также».

/* ───────── «А/Б» — свой А/Б-тест главного фото карточки ВБ вместо Марплы (27.11.2026, PROMT_AB_TEST.md разделы 3–4) ─────────
   Договор со сторожем — reklama_wb\AB_KONTRAKT.md: данные data.json → "ab" {"tests":[TEST]}, команды abfoto / abup / abstart / abpause / abgo /
   abstop / abwin / abexcl / abref, ответ сторожа patch {"ab_test": TEST} — страница подменяет тест сразу (abPut из applyPatch).
   Раздел: список тестов карточками, крупная «Новый тест». Мастер — три листа подряд (товар → кампания и фото → настройки и запуск), «назад» —
   на прошлый шаг. Лист теста — плитки вариантов, уверенность, подсказки, кнопки; всё, что меняет карточку, — через лист «было → стало» (run),
   «⟳ Обновить» — только чтение (quick). Фото с телефона: сжать до 1500 px, вложением в ntfy (тема команд + «-f»), sha256 → abup */
const AB_ST={running:['идёт','g'],paused:['пауза','w'],done:['готово','a'],stopped:['остановлен',''],error:['сбой','r'],win:['победитель поставлен','g']};
const AB_DEF={pokazy:10000,krug:1000,minut:50};
const abAll=()=>D&&D.ab&&Array.isArray(D.ab.tests)?D.ab.tests:[];
const abList=()=>abAll().filter(x=>x&&(!x.kab||x.kab===S.kab));
const abGet=id=>abAll().find(x=>x&&String(x.id)===String(id))||null;
const abLive=x=>!!x&&(x.status==='running'||x.status==='paused');
const abVis=x=>((x&&x.variants)||[]).filter(v=>!v.excl);
const abVar=(x,id)=>((x&&x.variants)||[]).find(v=>v.id===id)||null;
const abBaseV=x=>((x&&x.variants)||[]).find(v=>v.base)||((x&&x.variants)||[])[0]||null;
const abSet=x=>Object.assign({},AB_DEF,(x&&x.set)||{});
/* превью: большие фото витрины ВБ — мелким размером (плитки 3:4, телефону хватает) */
const abThumb=u=>String(u||'').replace(/\/images\/(big|hq|c516x688)\//,'/images/c246x328/');
const abBg=u=>u?` style="background-image:url('${esc(abThumb(u))}')"`:'';
const abCtr=v=>!v||!v.v?null:100*(v.ctr!=null?v.ctr:(v.c||0)/v.v);
const abLbl=v=>v?esc(v.label||v.id)+(v.base?' · исходное':''):'—';
const abTm=ts=>{if(!ts)return '';const s=new Date((+ts+3*3600)*1000).toISOString();return s.slice(8,10)+'.'+s.slice(5,7)+' '+s.slice(11,16)};
const abNow=()=>Math.floor(Date.now()/1000);
const abDur=s=>{const h=Math.round(s/3600);return h<1?'меньше часа':h<24?'≈ '+h+' ч':'≈ '+Math.floor(h/24)+' дн'+(h%24?' '+h%24+' ч':'')};
const abWord=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k===1?a:k>=2&&k<=4?b:c};
/* фото, которое сейчас главное (во время теста — текущий вариант, иначе исходное или победитель) */
const abImg=x=>{const v=abVar(x,x.cur)||abVar(x,x.winner)||abBaseV(x);return v?v.img:''};
const abTov=x=>TOV[x.nm]||null;
const abArt=x=>esc(x.art||(abTov(x)||{}).art||x.nm);
const abName=x=>esc(x.name||(abTov(x)||{}).tt||'');

/* сколько показов набрано из нужного и сколько примерно осталось (по скорости с начала теста) */
function abProg(x){const P=abSet(x).pokazy,L=abVis(x);let got=0;for(const v of L)got+=Math.min(P,v.v||0);const need=P*L.length;
  let left='';const el=(x.upd||abNow())-(x.started||0);if(x.status==='running'&&got>0&&got<need&&el>600)left=abDur((need-got)*el/got);
  return {got,need,p:need?Math.min(1,got/need):0,left}}
function abConfH(x,big){const c=x.conf,L=abVar(x,x.leader);
  if(c==null||!L)return `<div class="abcf"><div class="abcft"><span>Насколько уверены</span><b class="muted">пока рано</b></div><div class="abbar"><i style="width:0"></i></div>${big?'<small>Нужно больше показов — тогда станет видно, какое фото открывают чаще.</small>':''}</div>`;
  const p=Math.round(100*c),k=c>=.95?'g':c>=.8?'w':'';
  const tx=c>=.95?'лидер лучше уверенно':c>=.8?'скорее лучше, ждём ещё показов':'разница пока может быть случайной';
  return `<div class="abcf"><div class="abcft"><span>Насколько уверены, что <b>${esc(L.label||L.id)}</b> лучше</span><b class="${k==='g'?'good':''}">${p}%</b></div><div class="abbar ${k}"><i style="width:${p}%"></i></div>${big?`<small>${tx}</small>`:''}</div>`}

/* ── раздел ── */
function vAb(){const L=abList(),oth=abAll().length-L.length;
  let h=`<button class="btn abnew press" type="button" data-act="abnew"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Новый тест</button>`;
  if(!L.length)return h+`<div class="empty abempty"><b>Тестов пока нет</b>Нажмите «Новый тест»: выберите товар, его поисковую кампанию и 2–10 фото. Сервис сам будет по очереди ставить фото главным и считать, какое чаще открывают.${oth?`<br><br>В другом кабинете тестов: ${oth}.`:''}</div>`;
  const G=[['Нужно решение',L.filter(x=>x.status==='done'||x.status==='error')],['Идут',L.filter(abLive)],['Завершённые за 30 дней',L.filter(x=>x.status==='stopped'||x.status==='win')]];
  for(const [t,a] of G)if(a.length)h+=`<div class="abgh">${t} · ${a.length}</div><div class="abgr">`+a.map(abCard).join('')+'</div>';
  if(oth)h+=`<div class="muted abkab">В другом кабинете тестов: ${oth}</div>`;
  return h}
function abCard(x){const st=AB_ST[x.status]||[x.status||'—',''],pr=abProg(x),L=abVar(x,x.leader),W=abVar(x,x.winner),c=x.conf;
  const rk=x.rk||(RK[x.cid]||{}).name||'';
  let line='';
  if(x.status==='win'&&W)line=`<div class="ablead">Победитель <b>${esc(W.label||W.id)}</b>${abCtr(W)!=null?' · CTR '+pc(abCtr(W)):''}</div>`;
  else if(L)line=`<div class="ablead">Лидер <b>${esc(L.label||L.id)}</b>${abCtr(L)!=null?' · CTR '+pc(abCtr(L)):''}${c!=null?' · уверенность '+Math.round(100*c)+'%':''}</div>`+(c!=null?`<div class="abbar sm ${c>=.95?'g':c>=.8?'w':''}"><i style="width:${Math.round(100*c)}%"></i></div>`:'');
  else line='<div class="ablead muted">Лидера пока нет — мало показов</div>';
  const pl=x.status==='done'?'все фото набрали показы — выберите победителя':f0(pr.got)+' из '+f0(pr.need)+' показов'+(pr.left?' · осталось '+pr.left:'');
  return `<button class="abc press" type="button" data-act="abopen" data-t="${esc(x.id)}"><i class="abph"${abBg(abImg(x))}></i><div class="abm">
    <div class="abt"><b>${abArt(x)}</b><span class="pill abs ${st[1]}">${st[0]}</span></div>
    ${abName(x)?`<small>${abName(x)}</small>`:''}${rk?`<small>РК: ${esc(rk)}</small>`:''}
    ${abLive(x)||x.status==='done'?`<div class="abbar"><i style="width:${Math.round(100*pr.p)}%"></i></div><small class="abpl">${pl}</small>`:''}
    ${x.wait?'<div class="abwait"><span class="sp"></span>ставлю фото в карточку… до нескольких минут</div>':''}${line}${x.status==='error'?`<div class="aberr">${esc(x.err||'Сбой — тест остановлен, исходное фото возвращено')}</div>`:''}</div></button>`}

/* ── лист теста ── */
function abOpen(id,ctx){const t=abGet(id);if(!t)return;if(typeof shMark==='function')shMark('ab',id);
  const L=ctx||abList().map(x=>String(x.id)),i=L.indexOf(String(id));
  const fn=()=>abBody(id);fn.abT=String(id);
  sheet(fn,false,i>=0&&L.length>1?{i,n:L.length,to:j=>abOpen(L[j],L)}:null)}
function abBody(id){const x=abGet(id);if(!x)return {t:'А/Б-тест',s:'',h:'<div class="empty"><b>Тест не найден</b>Его уже нет в данных — закройте лист.</div>'};
  const st=AB_ST[x.status]||[x.status||'—',''],set=abSet(x),pr=abProg(x),V=x.variants||[],live=abLive(x),tot=V.reduce((s,v)=>s+(v.v||0),0)||1;
  const rk=x.rk||(RK[x.cid]||{}).name||'',canX=live&&abVis(x).length>2,sg=x.suggest||{};
  let h='';
  if(x.status==='error')h+=`<div class="aberr big">${esc(x.err||'Сбой — тест остановлен, исходное фото возвращено')}</div>`;
  h+=`<div class="abhd"><span class="pill abs ${st[1]}">${st[0]}</span>${rk?`<span class="abrkn">РК: ${esc(rk)}</span>`:''}</div>`;
  if(x.wait)h+='<div class="abwait big"><span class="sp"></span><div><b>Ставлю фото в карточку…</b><small>ВБ принимает его до нескольких минут — цифры пойдут, когда встанет</small></div></div>';
  if(x.status==='running'&&x.cur){const v=abVar(x,x.cur),mn=x.krug_t?Math.max(0,Math.round((abNow()-x.krug_t)/60)):null;
    h+=`<div class="note abnow">Сейчас главное — <b>${abLbl(v)}</b>. Круг: ${f0(x.krug_v||0)} из ${f0(set.krug)} показов${mn!=null?', идёт '+mn+' мин из '+set.minut:''}.</div>`}
  else if(x.status==='paused')h+='<div class="note abnow">На паузе главным стоит исходное фото, показы не считаются.</div>';
  else if(x.status==='done')h+='<div class="note abnow">Все фото набрали показы. Главным сейчас стоит исходное — выберите победителя или оставьте как есть.</div>';
  if(live||x.status==='done')h+=`<div class="abpr2"><div class="abcft"><span>Показы</span><b>${f0(pr.got)} из ${f0(pr.need)}</b></div><div class="abbar"><i style="width:${Math.round(100*pr.p)}%"></i></div>${pr.left?`<small>осталось ${pr.left} (примерно, по скорости с начала)</small>`:''}</div>`;
  h+=abConfH(x,true);
  if(live||x.status==='done'){
    if(sg.win){const v=abVar(x,sg.win);if(v)h+=`<div class="absg g"><b>${esc(v.label||v.id)} уверенно лучше</b><span>Можно ставить победителем — главное фото станет этим.</span><button class="btn sm press" type="button" data-act="abwin" data-t="${esc(x.id)}" data-v="${esc(v.id)}">Поставить ${esc(v.label||v.id)}</button></div>`}
    if(sg.excl&&live){const v=abVar(x,sg.excl);if(v&&!v.excl)h+=`<div class="absg w"><b>${esc(v.label||v.id)} явно хуже</b><span>Исключите, чтобы не тратить на него показы.</span><button class="btn sm gray press" type="button" data-act="abexcl" data-t="${esc(x.id)}" data-v="${esc(v.id)}">Исключить ${esc(v.label||v.id)}</button></div>`}}
  h+='<div class="abvg">'+V.map(v=>{const lead=v.id===x.leader&&!v.excl,ctr=abCtr(v),sh=(v.v||0)/tot,tags=[];
      if(v.id===x.winner)tags.push('<span class="abtag g">победитель</span>');else if(lead)tags.push('<span class="abtag g">лидер</span>');
      if(v.id===x.cur&&x.status!=='error'&&v.id!==x.winner)tags.push('<span class="abtag a">сейчас главное</span>');
      if(v.excl)tags.push('<span class="abtag">исключён</span>');else if(v.done)tags.push('<span class="abtag">набрал</span>');
      return `<div class="abv${lead?' lead':''}${v.excl?' ex':''}"><i class="abim"${abBg(v.img)}></i><div class="abvh"><b>${esc(v.label||v.id)}</b>${v.base?'<span class="abtag">исходное</span>':''}${tags.join('')}</div>
        <div class="abkv"><span>Показы</span><b>${f0(v.v||0)}</b><span>Клики</span><b>${f0(v.c||0)}</b><span>CTR</span><b class="${lead?'good':''}">${ctr==null?'—':pc(ctr)}</b><span>Кругов</span><b>${f0(v.krugi||0)}</b></div>
        <div class="abbar sm" title="Доля показов"><i style="width:${Math.round(100*sh)}%"></i></div><small class="abvs">доля показов ${Math.round(100*sh)}%</small>
        ${canX&&!v.base&&!v.excl?`<button class="btn sm gray press" type="button" data-act="abexcl" data-t="${esc(x.id)}" data-v="${esc(v.id)}">Исключить</button>`:''}</div>`}).join('')+'</div>';
  const fu=x.fun||{};
  if(fu.kor!=null||fu.zak!=null)h+=`<div class="abfun"><div><small>Корзины</small><b>${f0(fu.kor||0)}</b></div><div><small>Заказы</small><b>${f0(fu.zak||0)}</b></div><span>по карточке, общие${fu.s?', с '+(typeof fu.s==='number'?abTm(fu.s).slice(0,5):dm(String(fu.s).slice(0,10))):''} — на варианты не делятся</span></div>`;
  const B=[],tid=esc(x.id);
  if(x.status==='running')B.push(`<button class="btn gray press" type="button" data-act="abpause" data-t="${tid}">Пауза</button>`);

/* фото с телефона: сжать, вложением в ntfy, sha256, команда abup */
async function abShrink(file){if(file.type&&!/^image\//.test(file.type))throw new Error('Это не картинка — выберите фото');

  catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Фото не открылось — попробуйте другое (JPG или PNG)'));i.src=URL.createObjectURL(file)});w=src.naturalWidth;h=src.naturalHeight}
  if(!(w>0&&h>0))throw new Error('Фото пустое — выберите другое');
  /* 27.11 сторож: меньше 700×900 ВБ не принимает — такое не грузим; сжатие тоже не опускает ниже 700×900 */
  if(w<700||h<900){try{if(src.close)src.close()}catch(e){}throw new Error('Фото меньше 700×900 ('+w+'×'+h+') — ВБ такое не примет. Выберите фото крупнее.')}
  let k=Math.min(1,1500/Math.max(w,h));if(w*k<700||h*k<900)k=Math.min(1,Math.max(700/w,900/h));
  const cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k)),c=document.createElement('canvas');c.width=cw;c.height=ch;
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cw,ch);g.drawImage(src,0,0,cw,ch);try{if(src.close)src.close()}catch(e){}

    +`<div class="note">Фото станет главным навсегда, тест закроется. Прежнее главное фото останется в галерее.</div>${RUNBOX('Поставить '+esc(v.label||v.id))}`,after:()=>{$('#okBtn').onclick=()=>run(abCmd('abwin',x,{v:v.id}),abToTest(x.id))}}),true)}

/* ───────── листы: стопка, «назад» возвращает на предыдущий ─────────
   14.11 Андрей: «и крестик справа не надо, хватает назад и шторки» — стрелка «назад» слева есть всегда (на первом листе она закрывает лист),
   крестик остался в разметке скрытым (его нажимают проверки). «назад плохо работает», «резко срабатывает, надо придать большей плавности» —
   лист под новым листом помнит, где его читали (sc), и «назад» возвращает на то же место, а не в начало; смена листа — без рывка:
   новое содержимое въезжает сбоку, а высота листа доезжает плавно (shNav). На компьютере без видеокарты и при «меньше движения» — сразу. */
const SHS=[];
const SHRM=matchMedia('(prefers-reduced-motion:reduce)');
const shMove=()=>document.documentElement.dataset.lite!=='1'&&!SHRM.matches&&!document.documentElement.dataset.shnoa;
const shKeep=u=>{u.sc={y:$('#sbody').scrollTop,tw:$$('#sbody .tws').map(e=>[e.scrollTop,e.scrollLeft])}};
let SHT=0;
/* смена содержимого открытого листа: dir «f» — вперёд, «b» — назад. Ничего не ждёт и не запирает: содержимое меняется сразу, движение — только украшение,
   поэтому два быстрых «назад» подряд или закрытие посреди перехода не залипают */
function shNav(dir,fn){const sh=$('#sheet'),go=shMove()&&$('#shw').classList.contains('on'),ph=go&&!WIDE(),y0=ph?sh.getBoundingClientRect().top:0;
  fn();if(!go||!SHS.length)return;
  sh.classList.remove('shnf','shnb');
  if(ph){sh.style.transition='none';sh.style.transform='none';const dy=y0-sh.getBoundingClientRect().top;sh.style.transform=Math.abs(dy)>2?`translateY(${dy}px)`:''}   // лист встал на прежнюю высоту…
  void sh.offsetWidth;sh.style.transition='';sh.style.transform='';   // …и плавно доезжает до новой
  sh.classList.add(dir==='b'?'shnb':'shnf');clearTimeout(SHT);SHT=setTimeout(()=>sh.classList.remove('shnf','shnb'),420)}
/* 14.11 Андрей: «ставку если не поставил и в кластере если назад — то выкидывает все товары». Лист «Ставка» короткий: поверх листа кампании он
   садился низко, а над ним сквозь затемнение была видна главная с товарами — казалось, что кампания закрылась; касание этого затемнения и правда
   закрывало всё. Теперь лист действия поверх другого листа не ниже листа под ним (mh — его высота; на компьютере — обычный лист сбоку, не окно
   посередине), а затемнение листы не закрывает (ниже, «события») */
function sheet(fn,mid,nav){const was=SHS.length,k=SWK,sh=$('#sheet'),mh=was&&!WIDE()?Math.round(sh.getBoundingClientRect().height):0;if(was&&!k)shKeep(SHS[was-1]);
  SHS.push({fn,mid:!!mid,nav:nav||null,adr:SHMK,mh:mh?Math.max(mh,SHS[was-1].mh||0):0});SHMK=null;if(was||k)shNav(k==='shb'?'b':'f',()=>drawSheet());else{drawSheet();K3.call('zoom',true)}}
function drawSheet(keep){const top=SHS[SHS.length-1],w=$('#shw');shSave();if(WQ.length)setTimeout(wqDraw,0);
  if(!top){w.classList.remove('on');document.body.style.overflow='';$('#sheet').style.minHeight='';return}
  const sv=keep?null:top.sc,tw=keep?$$('#sbody .tws').map(e=>[e.scrollTop,e.scrollLeft]):sv?sv.tw:[],o=top.fn(),st=keep?$('#sbody').scrollTop:sv?sv.y:0,one=SHS.length<2;top.sc=null;
  $('#sheet').classList.toggle('mid',top.mid&&one);$('#sheet').style.minHeight=!one&&top.mh&&!WIDE()?top.mh+'px':'';
  $('#shh').innerHTML=`<button class="bk press" type="button" data-act="back" aria-label="${one?'Закрыть':'Назад'}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></button>`
    /* 14.11 (утро, четвёртый заход) Андрей: «Всегда картинка должна быть» — o.ph: фото товара в шапке листа (листы кампании и товара), шапка не уезжает при прокрутке */
    +(o.ph||'')+`<div class="tt"><b>${o.t}</b>${o.s?`<span>${o.s}</span>`:''}</div><button class="x" type="button" data-act="close" aria-label="Закрыть" tabindex="-1" hidden></button>`;
  $('#sbody').innerHTML=o.h;{/* 15.11 Андрей «выбор периода тоже удобно» (стрелка на снимке): кнопки периода — в шапке листа под плашками, не прилипают поверх содержимого */const ps=$('#sbody>.pseg');if(ps){$('#shh').appendChild(ps);const b=ps.querySelector('[aria-pressed="true"]'),q=b&&b.parentNode;if(q&&q.scrollWidth>q.clientWidth+2)q.scrollLeft=Math.max(0,b.offsetLeft-(q.clientWidth-b.offsetWidth)/2)}}$('#sbody').scrollTop=st;$$('#sbody .tws').forEach((e,i)=>{if(tw[i]){e.scrollTop=tw[i][0];e.scrollLeft=tw[i][1]}});w.classList.add('on');document.body.style.overflow='hidden';if(o.after)o.after()}
const redraw=()=>{if(SHS.length)drawSheet(true)};
function back(){SHS.pop();if(SHS.length)shNav('b',()=>drawSheet());else{drawSheet();K3.call('zoom',false)}}
function closeAll(){SHS.length=0;drawSheet();K3.call('zoom',false);return true}
/* 14.11 Андрей: «если находишься в РК или товаре — нельзя обновить страницу». Листы товара, кампании и склейки помечают себя адресом:
   shMark('tov',nm) / shMark('rk',id,nm) / shMark('skl',imt) первой строкой openProd / openRk / openSkl — метку забирает ближайший sheet().
   Цепочка помеченных листов стопки (не больше 4), кабинет и раздел — в адресе страницы (#sh=tov-…~rk-…-…&kb=…&tb=…, без новых шагов
   в истории браузера) и в памяти вкладки. Обновили страницу — после загрузки те же листы открываются сразу, без движения. Листы действий
   (ставка, лимит и т.п.) адреса не имеют и не восстанавливаются. Лист закрыли — адрес убран */
let SHMK=null,SHAT=0;const SHAK='rek.sh';
/* 14.11 (утро, четвёртый заход): «назад» из листа товара возвращал главную в самое начало, а не туда, где её читали: записи «назад» (svcBack) ставятся
   первым касанием, когда страница ещё наверху, и браузер при «назад» сам прокручивал её к тому месту. Прокрутку ведёт страница, не браузер */
try{history.scrollRestoration='manual'}catch(e){}
function shMark(kind,...a){SHMK={k:String(kind),a:a.map(x=>String(x==null?'':x).replace(/[^\w]/g,''))};queueMicrotask(()=>{SHMK=null})}
const shAdr=()=>SHS.filter(u=>u.adr).slice(-4).map(u=>[u.adr.k,...u.adr.a].join('-')).join('~');
/* пишем после текущего шага: svcBack (кнопка «назад» телефона) после своего шага возвращает прежний адрес — наш должен лечь последним */
function shSave(){clearTimeout(SHAT);SHAT=setTimeout(()=>{const a=shAdr(),ours=/^#sh=/.test(location.hash);
  try{if(a)sessionStorage.setItem(SHAK,JSON.stringify({a,kab:S.kab,tab:S.tab}));else sessionStorage.removeItem(SHAK)}catch(e){}
  const h=a?'#sh='+a+'&kb='+encodeURIComponent(S.kab)+'&tb='+encodeURIComponent(S.tab):'';if(location.hash===h||(!a&&!ours))return;   // чужой адрес (#nm=…) не трогаем
  try{history.replaceState(history.state,'',location.pathname+location.search+h)}catch(e){}},0)}
/* 14.11 (утро, четвёртый заход) Андрей: «Из товара назад и в панель переносит». Память вкладки (sessionStorage) переживает уход на другой сервис: пришёл
   из «Панели» заново (или «Панель» заранее подгрузила «Рекламу» — svc.py, prerender) — сайт сам открывал прежний лист товара, а записей «назад» у новой
   страницы ещё нет (их ставит касание, svcBack) — и «назад» телефона уводил обратно в «Панель». Теперь из памяти вкладки листы открываются только при
   обновлении страницы и при возврате к ней «назад / вперёд» (тогда и записи «назад» на месте); пришли заново — главная, память стёрта */
const navType=()=>{try{const n=performance.getEntriesByType('navigation')[0];return n?String(n.type):''}catch(e){return ''}};
function shRead(){let o=null;const g=k=>{const m=location.hash.match(new RegExp('[#&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1]):''};
  if(/^#sh=/.test(location.hash))o={a:g('sh'),kab:g('kb'),tab:g('tb')};
  if(!o){const nt=navType();if(nt==='reload'||nt==='back_forward')try{o=JSON.parse(sessionStorage.getItem(SHAK)||'null')}catch(e){}else try{sessionStorage.removeItem(SHAK)}catch(e){}}
  return o&&o.a?o:null}
/* до первой отрисовки: кабинет и раздел, где был открыт лист */
function shPre(o){if(!o)return;if(o.kab&&D.kab&&D.kab[o.kab]&&o.kab!==S.kab){S.kab=o.kab;RS.set('kab',S.kab)}if(o.tab&&TABS.includes(o.tab))S.tab=o.tab}
/* после отрисовки: открыть те же листы, если товар / кампания / склейка есть в данных этого кабинета; первого же несуществующего — дальше не идём */
function shOpen(o){if(!o)return;const R=document.documentElement;R.dataset.shnoa='1';
  try{for(const p of String(o.a).split('~')){const [k,x,y]=p.split('-');
      if(k==='tov'&&TOV[x])openProd(+x);
      else if(k==='rk'&&RK[x])openRk(+x,y&&RK[x].nm[y]?y:undefined);
      else if(k==='skl'&&typeof sklGroups==='function'&&sklGroups().some(g=>String(g.imt)===x))openSkl(x);
      else if(k==='ab'&&abGet(x))abOpen(x);   // 27.11 лист А/Б-теста
      else break}}catch(e){}
  shSave();requestAnimationFrame(()=>requestAnimationFrame(()=>{delete R.dataset.shnoa}))}
const bidTxt=(r,e)=>Object.entries(e.b||{}).map(([p,v])=>(r.pl.length>1||p!=='search'?(PLN[p]||p)+' ':'')+kop(v)+(r.pay==='cpm'?' за 1000 показов':' за клик')).join(' · ');   // 14.11: «за 1000» — полностью
/* минимальная ставка ВБ по тем же местам показа, что и ставка кампании. minTxt — только число: «3,10 ₽» | «90 / 310 ₽» (подпись ставят те, кто зовёт).
   14.11 Андрей (08:10): «ставка писать на минимуме не надо, просто мин. ставка такая-то, заметнее» — одна надпись «мин. ставка 3,10 ₽», число жирным;
   ставка уже на минимуме — та же надпись зелёным */
const minTxt=e=>{const L=Object.keys(e.b||{}).map(p=>minOf(e,p));return L.length&&L.every(v=>v!=null)?L.map(v=>f2(v/100)).join(' / ')+' ₽':''};
const minPill=e=>{const t=minTxt(e);if(!t)return '';const on=Object.entries(e.b||{}).every(([p,v])=>v<=minOf(e,p));return `<span class="pill num mnp${on?' g':''}">мин. ставка <b>${t}</b></span>`};
function limNetPill(r){return limGoNet(r)?'<span class="pill w">⚠ без лимита</span>':''}   /* идёт и лимита нет — жёлтая метка (pill.w); на паузе пусто */
function limPill(r){const ol=ourLim(r);
  if(ol&&ol.on)return `<span class="pill a num">свой лимит ${f0(ol.sum)} ₽/день</span>`;

function prHist(nm,inl){const L=evSvern((D.ist||[]).filter(z=>z.kab===S.kab&&String(z.nm)===String(nm)&&!z.cid&&z.kto!=='заметка'&&/^цена/i.test(z.chto||'')));

  h+=L.length?'<div>'+(all?L:L.slice(0,15)).map(z=>evX(z,1)).join('')+'</div>':'<div class="note" style="margin-top:0">Смен цены в журнале нет.</div>';
  if(all&&pd.length)h+=`<div class="muted tnote" style="margin-top:12px">До ${dm(first)} — цена по дням: по заказам (середина за день), в дни без заказов — по снимку витрины из панели; журнала смен тогда не было</div><div class="prpd">`

  if(L.length>15||pd.length)h+=`<button type="button" class="ctlt press" ${inl?'data-act="prallin"':'id="prall"'} aria-expanded="${all}" style="margin-top:12px"><span>${all?'Свернуть историю':'Вся история цены'}</span><b>${all?'':L.length>15?'ещё '+(L.length-15)+(pd.length?' + по дням '+pd.length+' дн':''):'ещё по дням '+pd.length+' дн'}</b><span class="ar">${all?'▴':'▾'}</span></button>`;
  return h}
/* цена: вниз — процентом скидки, цена до скидки подгоняется до рубля; вверх — только ценой до скидки (правило Андрея 26.10) */
function calcPrice(P,Dc,target,dForce){const cur=P*(100-Dc)/100;
  if(target>cur&&dForce==null){const p=Math.ceil(target*100/(100-Dc)-1e-9);return {up:1,p,d:Dc,f:p*(100-Dc)/100,exact:p*(100-Dc)%100===0&&p*(100-Dc)/100===target}}
  const dmin=Math.max(Dc+1,Math.ceil(100*(1-target/P)-1e-9));let d=dForce;
  if(d==null){d=null;for(let x=dmin;x<=Math.min(95,dmin+40);x++)if((target*100)%(100-x)===0){d=x;break}if(d==null)d=Math.min(95,dmin)}
  const ex=(target*100)%(100-d)===0,p=ex?target*100/(100-d):Math.floor(target*100/(100-d));return {up:0,p,d,f:p*(100-d)/100,exact:ex,dmin}}
function actPrice(nm,target,ak,out){if(!need())return;const t=TOV[nm];if(!t||!t.pr)return;const P=t.pr.p,Dc=t.pr.d,cur=t.pr.f;let dF=null,tg=target||Math.round(cur);

     <div id="pcalc"></div><div id="perr" class="bad" style="font-size:13px;min-height:18px;margin-top:8px"></div>${RUNBOX('Поставить цену')}${prHist(nm)}`,
     after:()=>{const up=()=>{const v=numv('pv');tg=v;const box=$('#pcalc'),ok0=isFinite(v)&&v>=1&&v===Math.round(v);
        if(!ok0){box.innerHTML='';$('#perr').textContent=isFinite(v)?'Цена — целым числом рублей.':'';$('#okBtn').disabled=true;return}
        if(Math.abs(v-cur)<0.5){box.innerHTML='<div class="note">Цена уже такая.</div>';$('#perr').textContent='';$('#okBtn').disabled=true;return}
        const c=calcPrice(P,Dc,v,v<cur?dF:null);
        box.innerHTML=`<div class="cmp"><div><small>Цена сейчас</small><b class="num">${rub2(cur)}</b></div><div class="ar">→</div><div><small>Станет</small><b class="num">${c.f%1?f2(c.f)+' ₽':rub2(c.f)}</b></div></div>
         <div class="kv"><span>Цена до скидки</span><b class="num">${f0(P)} → ${f0(c.p)} ₽</b><span>Скидка продавца</span><b class="num">${Dc}% → ${c.d}%</b>
          ${sppLast!=null?`<span>У покупателя, по расчёту (скидка ВБ ${f0(sppLast)}%)</span><b class="num">≈ ${rub(c.f*(1-sppLast/100))}</b>`:''}</div>
         ${c.up?'<div class="note">Вверх — ценой до скидки, процент скидки не трогаем.</div>':`<div class="note">Вниз — процентом скидки, цена до скидки подогнана до рубля.</div>
           <div class="opt"><div><b>Другой процент скидки</b><span>цена до скидки пересчитается</span></div><div class="stp"><button type="button" id="dm1">−</button><b class="num">${c.d}%</b><button type="button" id="dp1">+</button></div></div>`}
         ${!c.exact?`<div class="note w">Ровно ${rub(v)} при таком проценте не выходит — получится ${c.f%1?f2(c.f)+' ₽':rub2(c.f)}.</div>`:''}
         ${c.f*3<cur?'<div class="note b">Цена упадёт больше чем в 3 раза — ВБ отправит товар в «карантин цен» и не применит цену, пока её не подтвердят в кабинете.</div>':''}
         ${ak&&!out&&c.f>ak.plan?`<div class="note w">Это выше плановой цены акции (${rub(ak.plan)}) — в акцию товар не войдёт.</div>`:''}${ak&&out&&c.f<=ak.plan?`<div class="note w">Это не выше плановой цены акции (${rub(ak.plan)}) — товар останется в акции.</div>`:''}
         <div class="hint">Нижняя цена для автоакций не меняется.</div>`;
        const m1=$('#dm1'),p1=$('#dp1');if(m1)m1.onclick=()=>{dF=Math.max(c.dmin,c.d-1);up()};if(p1)p1.onclick=()=>{dF=Math.min(95,c.d+1);up()};
        $('#perr').textContent=c.p<=0?'Не получается посчитать цену.':'';$('#okBtn').disabled=c.p<=0;
        $('#okBtn').onclick=()=>run({k:'price',nm:+nm,price:c.p,disc:c.d,target:v,was:[P,Dc],ak:ak&&!out?ak.id:null,akn:ak&&!out?ak.name:null,akout:ak&&out?ak.name:null,akid:ak?ak.id:null})};
       $('#pv').oninput=()=>{dF=null;up()};up();const ha=$('#prall');if(ha)ha.onclick=()=>{S.prAll=!S.prAll;redraw()}}}),true)}

function openBally(id){sheet(()=>{const p=((K.bally||{}).promos||[]).find(x=>x.id===id);if(!p)return {t:'Баллы за отзывы',s:'',h:'<div class="empty"><b>Акции нет в списке</b>Обновите данные.</div>'};

  h+=its.length?'<div>'+its.map(i=>{const t=TOV[i.nm];return `<button class="akr press" type="button" data-nm2="${i.nm}" style="width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;cursor:pointer"><i class="tph"${foto(t||{nm:i.nm})}></i><div><b>${esc(t?t.art:'№ '+i.nm)}</b><span class="num">${jn('за текст '+i.t,'фото '+i.p,'видео '+i.v)}</span><span class="num">${(()=>{const b=(+i.t||0)+(+i.p||0)+(+i.v||0);return b?'итого '+f0(b)+' ₽ за отзыв · с комиссией '+(b*BLK).toFixed(2).replace('.',',')+' ₽':''})()}</span></div><div class="pr num">${i.got==null?'—':f0(i.got)}<small>из ${f0(i.cnt)} отзывов</small></div></button>`}).join('')+'</div>':'<div class="note" style="margin-top:0">Товары этой акции не прочитаны.</div>';
  h+=`<div class="hint">Бюджет ${rub(p.bud)} — потолок на всю цель: ${rub(p.net)} — баллы покупателям, остальное — комиссия ВБ и НДС.</div>`;
  if(p.st==='active'||p.st==='planned')h+=`<div class="acts" style="grid-template-columns:1fr"><button class="btn gray press${UPR?'':' nolk'}" type="button" data-act="ballystop" data-id="${p.id}">Остановить акцию</button></div>`;
  return {t:esc(p.name),s:'Баллы за отзывы · № '+p.id+' · '+esc(K.name),h}})}
function blRange(t){const v=(K.bally&&K.bally.val)||[],pr=t.pr?t.pr.f:0,i=pr<=500?1:pr<=2000?2:pr<=5000?3:4;return v.find(x=>x.id===i)||{t:[100,5000,150],p:[50,4850,100],v:[50,4850,100],cnt:[20,10000,25],mx:5000}}
function actBally(nm){if(!need())return;const t=TOV[nm];if(!t)return;const R=blRange(t),td=D.today.slice(8,10)+'.'+D.today.slice(5,7);
  const o={t:String(R.t[0]),p:String(R.p[0]),v:String(R.v[0]),cnt:String(R.cnt[0]),aud:0,name:(t.art+' '+td).slice(0,60)};
  sheet(()=>({t:'Баллы за отзывы',s:esc(t.art),h:`<div class="hint" style="margin-top:0">Покупатель получает баллы ВБ за отзыв: за текст, фото и видео — баллы складываются.</div>
    <label class="fld"><span>За текст, баллов · от ${R.t[0]}${R.t[2]?' · ВБ советует '+R.t[2]:''}</span><input class="inp num" id="blt" inputmode="numeric" value="${esc(o.t)}"></label>

    <label class="fld"><span>За видео, баллов · от ${R.v[0]}</span><input class="inp num" id="blv" inputmode="numeric" value="${esc(o.v)}"></label>
    <label class="fld"><span>Сколько отзывов собрать · от ${R.cnt[0]}</span><input class="inp num" id="blc" inputmode="numeric" value="${esc(o.cnt)}"></label>
    <div class="fld"><span>Кому предлагать</span>${seg('blaud',[[0,'Только новым покупателям'],[1,'И тем, кто уже купил']],o.aud,'sm')}</div>
    <label class="fld"><span>Название акции · покупатели его не видят</span><input class="inp" id="bln" maxlength="60" value="${esc(o.name)}" style="font-size:16px"></label>
    <div id="blcalc"></div><div id="blerr" class="bad" style="font-size:13px;min-height:18px;margin-top:8px"></div>${RUNBOX('Запустить акцию')}`,
    after:()=>{const up=()=>{const a=numv('blt'),b=numv('blp'),c=numv('blv'),n=numv('blc'),ii=x=>isFinite(x)&&x===Math.round(x)&&x>=0;
        const okn=ii(a)&&ii(b)&&ii(c)&&ii(n)&&a>=1,one=a+b+c,net=one*n,tot=net*BLK,ok=okn&&n>=R.cnt[0]&&n<=500&&one<=R.mx&&tot<=50000&&$('#bln').value.trim().length>=3;
        $('#blcalc').innerHTML=okn&&n>=1?`<div class="cmp"><div><small>Покупателям, не больше</small><b class="num">${rub(net)}</b></div><div class="ar">→</div><div><small>Бюджет с комиссией ВБ</small><b class="num">${rub2(tot)}</b></div></div>
          <div class="kv"><span>За отзыв с текстом, фото и видео</span><b class="num">${f0(one)} баллов · ${rub2(one*BLK)}</b><span>Комиссия ВБ 23% и НДС 22% от неё</span><b class="num">${rub2(tot-net)}</b></div>
          <div class="note">Это потолок: ВБ спишет только за пришедшие отзывы. Для запуска на балансе нужно ${rub(tot*(o.aud?0.3:0.2))} (${o.aud?'30':'20'}% бюджета), иначе акция останется черновиком.</div>`:'';
        $('#blerr').textContent=!okn?(isFinite(a)&&isFinite(n)?'Баллы и число отзывов — целыми числами, за текст — больше нуля.':''):n<R.cnt[0]?'ВБ принимает цель от '+R.cnt[0]+' отзывов.':n>500?'Больше 500 отзывов за одну акцию сервис не оформляет.':one>R.mx?'Больше '+f0(R.mx)+' баллов за один отзыв для товара с такой ценой ВБ не принимает.':tot>50000?'Бюджет больше 50 000 ₽ сервис не оформляет.':a<R.t[0]||b<R.p[0]||c<R.v[0]?'Меньше обычного минимума ВБ ('+R.t[0]+' / '+R.p[0]+' / '+R.v[0]+'). В части категорий минимум ниже — кабинет примет или откажет сам.':'';
        $('#okBtn').disabled=!ok};
      for(const id of ['blt','blp','blv','blc','bln'])$('#'+id).oninput=()=>{o.t=$('#blt').value;o.p=$('#blp').value;o.v=$('#blv').value;o.cnt=$('#blc').value;o.name=$('#bln').value;up()};up();
      $('#okBtn').onclick=()=>{const a=numv('blt'),b=numv('blp'),c=numv('blv'),n=numv('blc');run({k:'bally',nm:+nm,t:a,p:b,v:c,cnt:n,aud:o.aud,name:$('#bln').value.trim(),bud:Math.round((a+b+c)*n*BLK*100)/100},(r,away)=>{if(away)return;closeAll();if(S.tab==='bl'){S.blf='on';sync();render()}else openProd(+nm)})}}}),true);
  SEGCB.blaud=v=>{o.aud=+v;redraw()}}
function actBallyStop(id){if(!need())return;const p=((K.bally||{}).promos||[]).find(x=>x.id===id);if(!p)return;
  sheet(()=>({t:'Остановить акцию?',s:esc(p.name),h:`<div class="cmp"><div><small>Сейчас</small><b>${p.st==='planned'?'запланирована':'идёт'}</b></div><div class="ar">→</div><div><small>Станет</small><b>в архиве</b></div></div>

/* ───────── биддер: совет считает сборщик (bidder.py), в режиме «сам» ставку ставит страж ───────── */
const BDK={segodnya:' сегодня',posle:' после смены ставки',vchera:' вчера',malo:' сегодня',seychas:' сейчас в поиске',glubzhe:' сейчас в поиске'};
const bdOn=b=>!!(b&&b.mode&&b.mode!=='off');
const bdCh=b=>bdOn(b)&&b.new!=null&&b.cur!=null&&b.new!==b.cur;
const bdName=b=>!bdOn(b)||b.src==='marpla'?'выключен':(b.mode==='sam'?'сам':'совет')+' · цель '+b.cel+' · до '+kop(b.max);
const bdPill=(e,lv)=>{const b=e.bd;if(!bdOn(b))return '';const ch=bdCh(b);if(b.src==='marpla'&&!ch)return '';const dot=lv&&b.src!=='marpla';
  return `<span class="pill ${b.mode==='sam'?'a':''}${dot?(b.mode==='sam'?' lv':' lv sv'):''} num">${dot?'<i></i>':''}${b.src==='marpla'?'наш биддер поставил бы':b.mode==='sam'?'биддер: сам':'биддер: совет'}${ch?' '+(b.new>b.cur?'↑':'↓')+' '+kop(b.new):''}</span>`};
/* 14.11 Андрей: «фраза биддера, факт тоже надо». Факт — на каком месте товар по фразе биддера сейчас: сегодняшний свой замер выдачи (D.ms, со временем),
   иначе место, по которому считал биддер (b.p, b.pk), иначе последний старый замер; нет ничего — так и пишем «место не снято» */
function bdFact(nm,q,b){const kq=String(q||'').trim().replace(/\s+/g,' ').toLowerCase(),L=kq?((D.ms||{})[nm]||{})[kq]:null,m=L&&L.length?L[L.length-1]:null;
  const mt=m?(m[0]===T?'сегодня':dm(D.days[m[0]]))+' в '+m[1]:'',mv=m?(m[2]?f0(m[2])+' место':'глубже '+f0(m[4]||(D.mst||{}).glub||300)):'';
  if(m&&m[0]===T)return {v:mv,n:m[2]||1e6,s:'наш замер '+mt+(m[2]?(m[3]?', в рекламе':', без рекламы'):'')};
  if(b&&b.p!=null&&b.pk)return {v:b.pk==='glubzhe'?'глубже '+f0(b.p-1):(b.pk==='seychas'?f0(b.p):f1(b.p))+' место',n:b.pk==='glubzhe'?1e6:b.p,s:((BDK[b.pk]||'').trim()||'по статистике ВБ')+(b.t?', расчёт в '+b.t:'')+(b.oc?', по расчёту':'')};
  if(m)return {v:mv,n:m[2]||1e6,s:'последний замер '+mt};
  return {v:'место не снято',n:null,s:kq?'замеров по этой фразе ещё нет':'фраза не задана'}}
/* 14.11 Андрей: «биддер пусть сразу будет открыт, и если какой-то работает — светился». Блок показан целиком: кто ведёт ставку (наш «Сам», наш «Совет», Марпла),
   фраза, цель, факт, ставка сейчас и потолок. Работающий (ставку правда меняют, и кампания идёт) — с зелёной точкой и обводкой, совет — синий, выключенный — спокойный.
   Ведёт Марпла — показаны её цель, потолок и фраза, а факт — наш замер по этой фразе */
const BDZ={search:'поиск',carousel:'карусель',catalog:'каталог'};
/* 14.11 Андрей: «у тебя биддер — там выбор места же ещё, надо уточни, как работает; и ещё там в таких есть общая ставка для всех помимо биддера».
   Как работает — по шапке bidder.py и карточке 22 «Учёт задач»; свёрнуто, раскрывается нажатием (раскрытое остаётся раскрытым при перерисовке).
   Рядом — общая ставка сейчас и сколько фраз кампании со своей ставкой (из данных фраз KL; не загружены — не пишем) */
let BDHO=false;
document.addEventListener('toggle',e=>{const x=e.target;if(x&&x.classList&&x.classList.contains('bdhow'))BDHO=x.open},true);
const bdHow=()=>`<details class="bdhow"${BDHO?' open':''}><summary>Как это работает</summary><ul>
  <li>Цель — место товара в поиске по выбранной фразе (не выбрана — по главному запросу кампании).</li>
  <li>Место — из нашего свежего замера выдачи (не старше часа с небольшим), нет замера — среднее место за день по данным ВБ.</li>
  <li>Хуже цели — ставка вверх на 8%, сильно хуже — на 15%; лучше цели — вниз на 8%. Не выше потолка и не ниже минимума ВБ.</li>
  <li>«Сам» — ставку меняет сервис, не чаще раза в час и не больше 10 раз в день. «Совет» только подсказывает.</li>
  <li>Биддер двигает <b>общую ставку</b> товара в кампании — она действует на все фразы. Свои ставки фраз (бывают только у кампаний «за показы» с ручной ставкой) он не трогает: фраза со своей ставкой живёт по ней.</li></ul></details>`;
/* сколько фраз кампании со своей ставкой; null — фразы не загружены */
const klOwnN=(id,nm)=>{const z=KL&&KL.kab&&KL.kab[S.kab]&&((KL.kab[S.kab].k||{})[id+'|'+nm]);return z&&Array.isArray(z.q)?z.q.filter(x=>x.b).length:null};
function bdKl(r,nm,cur){const n=klOwnN(r.id,nm),fr=n%10===1&&n%100!==11?'фразы':'фраз';
  return `<div class="bdkl"><span>Общая ставка сейчас</span><b class="num">${kop(cur)}</b>${n==null?'':`<span>Своя ставка</span><b>${n?'у '+n+' '+fr+' — биддер их не трогает':r.pay==='cpm'?'ни у одной фразы — общая на всех':'у кампаний «за клик» не бывает'}</b>`}</div>`}
function bdBlock(r,nm){const e=r.nm[nm]||{},b=e.bd;if(!e.b||(e.b.search==null&&e.b.combined==null))return '';
  const on=bdOn(b),ch=bdCh(b),own=on&&b.src==='svoi',MB=((r.mar&&r.mar.bid)||[]).filter(z=>z.nm==null||String(z.nm)===String(nm)),mb=MB.find(z=>z.zona==='search')||MB[0],go=rkSt(r).w;
  const pl=(b&&b.pl)||(e.b.search!=null?'search':'combined'),cur=e.b[pl];
  let h=`<div class="hrw"><h3>Биддер</h3><button class="lnk" type="button" data-act="bidder" data-rk="${r.id}|${nm}">${own?'настроить':mb?'включить свой':'включить'}</button></div>`;
  if(!own&&!mb)return h+'<div class="bdc"><div class="bdh"><i></i><div><b>Выключен</b><small>Задайте цель и потолок — сервис подскажет ставку или будет ставить её сам.</small></div></div>'+bdKl(r,nm,cur)+bdHow()+'</div>';
  const lead=mb?'mar':b.mode==='sam'?'sam':'sov',q=mb?(mb.kw||(b&&(b.q||b.qs))||''):(b.q||b.qs||''),cel=mb?mb.cel:b.cel,mx=mb?mb.max:b.max,nq=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase(),f=bdFact(nm,q,on&&(!q||nq(b.q||b.qs)===nq(q))?b:null);   // место из расчёта биддера берём, только если он считал по этой же фразе
  const busy=!!q&&typeof FR!=='undefined'&&FR.busy&&FR.busy.has(q);
  h+=`<div class="bdc ${lead}${go?' on':''}"><div class="bdh"><i></i><div><b>${lead==='mar'?'Ставку ведёт биддер Марплы':lead==='sam'?'Наш биддер сам ставит ставку':'Наш биддер: совет'}${go?'':' · кампания не идёт'}</b>
      <small>${lead==='mar'?'Отсюда он не выключается. Чтобы вёл наш — выключите его в Марпле и включите свой.'+(own?' Наш сейчас: '+(b.mode==='sam'?'«Сам»':'«Совет»')+', цель '+b.cel+', до '+kop(b.max)+'.':''):lead==='sam'?'Не выше потолка, не чаще раза в час.':'Только подсказывает, ставку не трогает.'}</small></div></div>
    <div class="bdq"><small>Фраза</small><b>${q?esc(q):'главный запрос кампании'}</b></div>
    <div class="bdg"><div><small>Цель</small><b class="num">${cel!=null?f0(cel)+' место':'—'}</b></div>
      <div class="${f.n==null||cel==null?'':f.n<=cel?'g':'r'}"><small>Факт</small><b class="num${f.n==null?' no':''}">${f.v}</b><em>${esc(f.s)}</em>${q?`<button class="lnk${UPR?'':' nolk'}" type="button" data-frm1="${r.id}|${nm}|${esc(q)}"${busy?' disabled':''}>${busy?'снимаю…':'снять сейчас'}</button>`:''}</div>
      <div><small>Общая ставка</small><b class="num">${kop(cur)}</b></div><div><small>Потолок</small><b class="num">${mx?kop(mx):'—'}</b></div></div>`;
  {const n=klOwnN(r.id,nm);if(n)h+=`<div class="bdw">Своя ставка у ${n} ${n%10===1&&n%100!==11?'фразы':'фраз'} — биддер их не трогает, остальные идут по общей.</div>`}
  const oth=MB.filter(z=>z!==mb&&z.cel!=null&&z.max>0);
  if(lead==='mar'&&oth.length)h+=`<div class="bdw">Ещё в Марпле: ${oth.map(z=>(BDZ[z.zona]||esc(z.zona))+' — цель '+f0(z.cel)+', до '+kop(z.max)).join('; ')}.</div>`;
  if(on&&b.kod&&b.cur!=null&&b.kod!=='pauza')h+=`<div class="bdr"><span>${lead==='sam'?'Поставит':lead==='mar'?'Наш биддер поставил бы':'Поставил бы'}</span><b class="num">${ch?kop(b.cur)+' → '+kop(b.new):(lead==='sam'?'оставит ':'оставил бы ')+kop(b.cur)}</b></div>`;
  if(on&&b.why)h+=`<div class="bdw${b.kod==='potolok'||b.kod==='min_potolok'?' w':''}">${esc(b.why)}${b.t&&b.kod?` Посчитано в ${esc(b.t)} МСК.`:''}</div>`;
