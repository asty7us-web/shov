<style>
/* «Реклама» — реклама ВБ обоих кабинетов (Андрей 13.11.2026: «статистика — главное, по РК и по всему товару; ключи как в Марпле, но не намешанная
   таблица; акции — вход только с подтверждением и только ценой; управление с телефона и с компьютера, качественно, как Эпл»).
   Данные — reklama_wb\sbor.py, команды — reklama_wb\worker.py. Шапка сервисов — servisy\svc.py. Страница собирается из src\ (make.py). */
:root{
  --bg:#f2f2f7;--card:#ffffff;--card2:#f7f7fa;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.07);
  --ink:#0b0b0f;--ink2:#55555e;--ink3:#8e8e96;--line:rgba(60,60,67,.12);--line2:rgba(60,60,67,.07);
  --hdr:rgba(246,246,250,.86);--acc:#0a6cff;--acc-soft:rgba(10,108,255,.11);--on-acc:#fff;
  --good:#16904a;--warn:#b86400;--bad:#d92d3a;--good-soft:rgba(31,157,85,.13);--warn-soft:rgba(217,119,6,.15);--bad-soft:rgba(229,56,59,.11);
  --wb:#a02bd6;--wb-soft:rgba(160,43,214,.1);--bar:#cfcfd8;--bar2:#b4b4bf;--thumb:#fff;
  --sh1:0 1px 1px rgba(0,0,0,.03),0 2px 8px rgba(0,0,0,.04);--sh2:0 2px 4px rgba(0,0,0,.04),0 18px 44px -12px rgba(0,0,0,.22);
  --r:20px;--ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.16,1,.3,1);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tabh:58px;color-scheme:light;
  --svc-card:var(--card);--svc-ink:var(--ink);--svc-ink2:var(--ink2);--svc-ink3:var(--ink3);--svc-line:var(--line);--svc-hover:var(--fill);--svc-acc:var(--acc);--svc-acc-soft:var(--acc-soft)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){

  --ink:#f5f5f7;--ink2:#b9b9c0;--ink3:#8e8e93;--line:rgba(255,255,255,.11);--line2:rgba(255,255,255,.07);

  --sh1:0 1px 1px rgba(0,0,0,.3);--sh2:0 2px 6px rgba(0,0,0,.35),0 22px 54px -16px rgba(0,0,0,.7);color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}

html{-webkit-text-size-adjust:100%}

/*SVC:CSS*/
/* выбор сервиса (servisy\svc.py — править там): кнопка «значок + название ⌄», под ней список трёх сервисов */
.svc{position:relative;flex:none;min-width:0}
/* шрифт задаю обёртке, кнопка его наследует (button{font:inherit} страниц) — так темы Юнитки (.brand) и Склеек (.brand b) по-прежнему перекрашивают название */
:where(.svc){font:700 18px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em}
.svc-btn{display:inline-flex;align-items:center;gap:9px;height:40px;margin:0 0 0 -6px;padding:0 9px 0 5px;border:0;border-radius:13px;background:transparent;color:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;transition:background-color .2s ease,transform .4s cubic-bezier(.34,1.56,.64,1)}
.svc-btn .svc-nm{font:inherit;letter-spacing:inherit}
/* подложка — в цвет текста шапки (в игровых темах шапка цветная, а название белое) */
@media (hover:hover){.svc-btn:hover{background:var(--svc-hover);background:color-mix(in srgb,currentColor 13%,transparent)}}
.svc-btn:active{transform:scale(.95);transition-duration:.12s}
.svc-btn[aria-expanded="true"]{background:var(--svc-hover);background:color-mix(in srgb,currentColor 13%,transparent)}
.svc-btn .svc-ic{width:30px;height:30px;border-radius:9px}
.svc-chev{width:16px;height:16px;flex:none;opacity:.55;margin-left:-3px;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.svc-btn[aria-expanded="true"] .svc-chev{transform:rotate(180deg)}
/* значок (12.11, Андрей: «значок панели крутой, сделай для остальных свои»): тёмная плитка своего оттенка, яркая линия своего цвета,
   жёлтая точка; блик сверху, цветное свечение; при наведении и открытии — лёгкий наклон */
.svc-ic{display:grid;place-items:center;flex:none;position:relative;overflow:hidden;color:#fff;font-style:normal;line-height:1;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),inset 0 -2px 4px rgba(0,0,0,.14),0 3px 9px -2px var(--svc-glow,rgba(0,0,0,.3));
  transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.svc-ic::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 75% at 28% 6%,rgba(255,255,255,.55),rgba(255,255,255,0) 58%)}
.svc-ic svg{position:relative;width:66%;height:66%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.svc-ic.u{--svc-glow:rgba(110,235,130,.5);background:linear-gradient(145deg,#4a6b55 0%,#1e3226 52%,#0a130d 100%)}
.svc-ic.s{--svc-glow:rgba(190,140,255,.5);background:linear-gradient(145deg,#655690 0%,#2b2247 52%,#100c1d 100%)}
.svc-ic.k{--svc-glow:rgba(255,160,70,.5);background:linear-gradient(145deg,#80603f 0%,#3b2b1c 52%,#170f08 100%)}
.svc-ic.z{--svc-glow:rgba(100,185,255,.5);background:linear-gradient(145deg,#456690 0%,#1d2d47 52%,#0a111d 100%)}
.svc-ic.p{--svc-glow:rgba(30,34,48,.6);background:linear-gradient(145deg,#5b6275 0%,#262a36 52%,#0c0d12 100%)}
.svc-ic.r{--svc-glow:rgba(255,120,160,.5);background:linear-gradient(145deg,#8a4a63 0%,#3e1c2b 52%,#190a11 100%)}
.svc-ic.c{--svc-glow:rgba(255,205,90,.5);background:linear-gradient(145deg,#7d6b34 0%,#362c12 52%,#141006 100%)}
@media (hover:hover){.svc-btn:hover .svc-ic,.svc-it:hover .svc-ic{transform:rotate(-8deg) scale(1.06)}}
.svc-btn[aria-expanded="true"] .svc-ic{transform:rotate(-8deg) scale(1.06)}
.svc-menu.on .svc-it .svc-ic{animation:svc-ico .6s cubic-bezier(.34,1.56,.64,1) both}
.svc-menu.on .svc-it:nth-child(3) .svc-ic{animation-delay:.05s}.svc-menu.on .svc-it:nth-child(4) .svc-ic{animation-delay:.1s}.svc-menu.on .svc-it:nth-child(5) .svc-ic{animation-delay:.15s}.svc-menu.on .svc-it:nth-child(6) .svc-ic{animation-delay:.2s}.svc-menu.on .svc-it:nth-child(7) .svc-ic{animation-delay:.25s}.svc-menu.on .svc-it:nth-child(8) .svc-ic{animation-delay:.3s}
@keyframes svc-ico{from{transform:scale(.6) rotate(-20deg);opacity:0}}
.svc-menu{position:absolute;z-index:300;top:calc(100% + 8px);left:-6px;width:min(318px,calc(100vw - 20px));padding:6px;border-radius:20px;
  background:var(--svc-card);color:var(--svc-ink);box-shadow:0 0 0 .5px var(--svc-line),0 18px 50px -12px rgba(0,0,0,.34),0 4px 12px -4px rgba(0,0,0,.12);
  transform-origin:24px -6px;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.92);pointer-events:none;
  transition:opacity .16s ease,transform .26s cubic-bezier(.4,0,.6,1),visibility 0s linear .26s}
.svc-menu.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .2s ease,transform .5s cubic-bezier(.22,1.3,.36,1),visibility 0s}
.svc-menu.gone{transition:none!important;opacity:0!important;visibility:hidden!important}
.svc-cap{padding:9px 12px 6px;font:700 11px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--svc-ink3)}
.svc-it[hidden]{display:none!important}
.svc-it{position:relative;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;color:inherit;text-decoration:none;
  -webkit-tap-highlight-color:transparent;transition:background-color .2s ease,transform .35s cubic-bezier(.34,1.56,.64,1)}
.svc-it .svc-ic{width:42px;height:42px;border-radius:12px}
.svc-tx{min-width:0;flex:1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.svc-tx b{display:block;font-size:15.5px;font-weight:650;line-height:1.2;letter-spacing:-.005em}
.svc-tx small{display:block;margin-top:2px;font-size:12.5px;line-height:1.3;color:var(--svc-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.svc-it:hover{background:var(--svc-hover)}}
.svc-it:active{transform:scale(.97);background:var(--svc-hover);transition-duration:.1s}
.svc-it[aria-current]{background:var(--svc-acc-soft)}
.svc-it[aria-current] b{color:var(--svc-acc)}
.svc-ok{width:20px;height:20px;flex:none;color:var(--svc-acc)}
.svc-sp{width:18px;height:18px;flex:none;border-radius:50%;border:2.2px solid var(--svc-line);border-top-color:var(--svc-acc);opacity:0;transition:opacity .2s}
.svc-it.go .svc-sp{opacity:1;animation:svc-spin .7s linear infinite}
@keyframes svc-spin{to{transform:rotate(360deg)}}
.svc-menu.on .svc-it{animation:svc-row .5s cubic-bezier(.22,1.2,.36,1) both}
.svc-menu.on .svc-it:nth-child(3){animation-delay:.035s}.svc-menu.on .svc-it:nth-child(4){animation-delay:.07s}.svc-menu.on .svc-it:nth-child(5){animation-delay:.105s}.svc-menu.on .svc-it:nth-child(6){animation-delay:.14s}.svc-menu.on .svc-it:nth-child(7){animation-delay:.175s}.svc-menu.on .svc-it:nth-child(8){animation-delay:.21s}
@keyframes svc-row{from{opacity:0;transform:translateY(-6px)}}
/* выбор темы — как в Юнитке (Андрей 29.10: «как в юнитке выбор везде тем формат»): кнопка «значок + название темы», под ней список
   с кружками и группами «Весёлые» / «Спокойные». Юнитка рисует свой (он образец), Склейки и Конкуренты — svcPicker() отсюда */
.svt{position:relative;flex:none}
.svt-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border:1px solid var(--svc-line);border-radius:10px;
  background:var(--svc-card);color:var(--svc-ink2);font:600 13.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;white-space:nowrap;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.svt-btn:active{transform:scale(.94)}
.svt-btn svg{width:18px;height:18px;flex:none;display:block}
@media (max-width:860px){.svt-btn span{display:none}}
.svt-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:300;min-width:220px;max-height:calc(100vh - 100px);overflow:auto;padding:6px;border-radius:12px;
  background:var(--svc-card);color:var(--svc-ink);border:1px solid var(--svc-line);box-shadow:0 8px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;
  font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transform-origin:top right;animation:svt-in .24s cubic-bezier(.22,1,.36,1)}
.svt-menu[hidden]{display:none}
@keyframes svt-in{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.svt-menu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;font:inherit;display:flex;align-items:center;gap:10px;color:inherit;cursor:pointer;white-space:nowrap}
@media (hover:hover){.svt-menu button:hover{background:var(--svc-hover)}}
.svt-menu button[aria-checked="true"]{background:var(--svc-acc-soft);color:var(--svc-acc)}
.svt-menu .sw{width:20px;height:20px;flex:none;display:block}
.svt-menu .tgrp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--svc-ink3);padding:8px 10px 2px;border-top:1px solid var(--svc-line);margin-top:4px}
/* переход между сервисами: шапка и кнопка сервиса остаются на месте, остальное мягко проявляется */
@view-transition{navigation:auto}
.svc-hdr{view-transition-name:svc-hdr}
#svcBtn{view-transition-name:svc-btn}
::view-transition-group(svc-hdr),::view-transition-group(svc-btn){animation-duration:.42s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
::view-transition-group(svc-hdr){overflow:clip}
::view-transition-old(svc-hdr),::view-transition-new(svc-hdr){animation-duration:.3s}
::view-transition-old(svc-btn),::view-transition-new(svc-btn){animation-duration:.32s;width:auto;height:auto}   /* название не растягивается, просто сменяется */
::view-transition-old(root){animation:svc-out .2s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:svc-in .42s cubic-bezier(.16,1,.3,1) both}
@keyframes svc-out{to{opacity:0}}
@keyframes svc-in{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){@keyframes svc-in{from{opacity:0}}}
/* 18.11 Андрей «во всех сервисах»: «потянуть вниз — обновить» как в айфоне (у «Рекламы» свой такой же, reklama_wb) */
html,body{overscroll-behavior-y:contain}
.svc-ptr{position:fixed;left:50%;top:0;z-index:150;width:40px;height:40px;margin-left:-20px;display:grid;place-items:center;pointer-events:none;
  color:var(--svc-ink2,#8a8a8e);opacity:0;transform:translate3d(0,var(--py,-46px),0) scale(var(--ps,1))}
.svc-ptr .pt{opacity:0;transition:opacity .12s ease}
.svc-ptr .pt.on{opacity:.9}
.svc-ptr.spin .pt.on{opacity:var(--o)}
.svc-ptr svg{transition:transform .2s cubic-bezier(.32,.72,0,1)}
.svc-ptr.rdy svg{transition:transform .25s cubic-bezier(.34,1.56,.64,1);transform:scale(1.08)}
.svc-ptr.go{transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .25s ease}
.svc-ptr.out{--ps:.55}
.svc-ptr.spin svg{animation:svc-rot .8s steps(8) infinite}
@keyframes svc-rot{to{transform:rotate(360deg)}}
html.svc-ptrout body>main{opacity:.4;transition:opacity .16s ease}
html.svc-ptrin body>main{animation:svc-ptrin .4s cubic-bezier(.32,.72,0,1) both}
@keyframes svc-ptrin{from{opacity:.55}}
:root[data-lite="1"] .svc-ptr,:root[data-lite="1"] .svc-ptr svg,:root[data-lite="1"] .svc-ptr .pt{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){.svc-ptr,.svc-ptr svg{transition:none!important;animation:none!important}html.svc-ptrin body>main{animation:none}}
/*/SVC:CSS*/
/* ── шапка ── */
.hdr{position:sticky;top:0;z-index:60;background:var(--hdr);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 6px) max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-right))}
.hrow{display:flex;align-items:center;gap:8px;height:44px;max-width:1240px;margin:0 auto}
.hsp{flex:1}
.ib{width:38px;height:38px;border:0;border-radius:12px;background:var(--fill2);display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.ib svg{width:20px;height:20px}
.ib.spin svg{animation:rot .9s linear infinite}

:root[data-theme="space"]{--bg:#04061a;--card:rgba(24,27,66,.62);--card2:rgba(34,38,88,.7);--fill:rgba(150,160,255,.17);--fill2:rgba(150,160,255,.1);

.abv .abim{display:block;aspect-ratio:3/4;border-radius:11px;background:var(--fill) center/cover no-repeat}
.abvh{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.abvh b{font:700 17px var(--fd);margin-right:2px}
.abtag{font-size:10.5px;font-weight:700;border-radius:7px;padding:2px 6px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.abtag.g{background:var(--good-soft);color:var(--good)}
.abtag.a{background:var(--acc-soft);color:var(--acc)}
.abkv{display:grid;grid-template-columns:1fr auto;gap:2px 6px;font-size:13px}
.abkv span{color:var(--ink3)}
.abkv b{font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.abvs{font-size:11px;color:var(--ink3);margin-top:-3px}
.abv .btn.sm{width:100%;height:36px;font-size:13.5px}
.abfun{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;background:var(--card2);border-radius:14px;padding:10px 12px;margin-top:10px}
.abfun small{display:block;font-size:11.5px;color:var(--ink3);font-weight:600}
.abfun b{font:700 18px var(--fd)}
.abfun span{flex-basis:100%;font-size:12px;color:var(--ink3)}
.abacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.abacts .btn{height:50px}
.abacts .full,.abacts .btn:only-child{grid-column:1/-1}
.btn.hl{background:var(--good);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 30%,transparent)}
.abrf svg{transition:transform .3s}
.abspin svg{animation:abrot .9s linear infinite}
@keyframes abrot{to{transform:rotate(360deg)}}
.abinf{font-size:12px;color:var(--ink3);line-height:1.4;margin:12px 2px 0}
details.abdt{margin-top:12px;background:var(--card2);border-radius:14px;padding:0 12px}
details.abdt>summary{min-height:48px;display:flex;align-items:center;font-weight:650;font-size:14.5px;cursor:pointer;list-style:none}
details.abdt>summary::-webkit-details-marker{display:none}
details.abdt>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s}
details.abdt[open]>summary::after{transform:rotate(-135deg)}
.ablog ul{list-style:none;margin:0;padding:0 0 8px}
.ablog li{display:grid;grid-template-columns:auto auto 1fr;gap:4px 8px;align-items:baseline;padding:7px 0;border-top:.5px solid var(--line);font-size:13px}
.ablog li span{color:var(--ink3)}
.ablog li small{color:var(--ink2);min-width:0;overflow-wrap:anywhere}
.abcmp b{white-space:normal;font-size:15.5px;line-height:1.25}
.abone{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:14px;padding:8px;margin-top:10px}
.abone i{flex:none;width:48px;height:64px;border-radius:9px;background:var(--fill) center/cover no-repeat}
.abone small{display:block;font-size:12.5px;color:var(--ink3)}
.abtwo{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.abtwo i{width:96px;height:128px;border-radius:12px;background:var(--fill) center/cover no-repeat;box-shadow:0 0 0 .5px var(--line)}
.abtwo span{font-size:22px;color:var(--ink3)}
/* мастер */
.absteps{display:flex;gap:6px;margin:4px 0 6px}
.absteps span{flex:1;min-width:0;text-align:center;font-size:12.5px;font-weight:650;color:var(--ink3);padding:8px 2px;border-radius:10px;background:var(--fill2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.absteps span.on{background:var(--acc);color:var(--on-acc)}
.absteps span.ok{color:var(--good)}
.absq{font-size:17px;font-weight:600}
.abpl{display:grid;gap:8px;margin-top:12px}
.abpi{display:flex;gap:11px;align-items:center;width:100%;min-height:68px;padding:8px 10px;border:0;border-radius:14px;background:var(--card2);text-align:left;color:inherit;font:inherit;cursor:pointer;min-width:0}
.abpi .tph{width:42px;height:56px}
.abpi div{min-width:0;flex:1}
.abpi b{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abpi small{display:block;font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abpi.dis{opacity:.6}
.abpi.sgw{box-shadow:0 0 0 2px var(--good)}
.abcnt{font-size:13px;color:var(--ink2);margin-top:12px;text-align:center}
.abtv{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:14px;padding:8px 10px;margin-top:8px}
.abtv .tph{width:36px;height:48px}
.abtv div{min-width:0;flex:1}
.abtv b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abtv small{display:block;font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abh{font:700 16px var(--fd);margin:18px 2px 8px}
.abh.sm{font-size:14px}
.abh .muted{font:500 12.5px var(--ff,inherit)}
.abrk{display:grid;gap:8px}
.abrkb{display:flex;gap:11px;align-items:center;width:100%;min-height:58px;padding:9px 12px;border:0;border-radius:14px;background:var(--card2);text-align:left;color:inherit;font:inherit;cursor:pointer;min-width:0}
.abrkb i{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink3)}
.abrkb[aria-pressed="true"]{box-shadow:0 0 0 2px var(--acc)}
.abrkb[aria-pressed="true"] i{box-shadow:inset 0 0 0 7px var(--acc)}
.abrkb div{min-width:0;flex:1}
.abrkb b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.abrkb small{display:block;font-size:12.5px;color:var(--ink3)}
.abg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:560px){.abg{grid-template-columns:repeat(4,minmax(0,1fr))}}
.abti{position:relative;display:block;aspect-ratio:3/4;border-radius:12px;border:0;padding:0;background:var(--fill) center/cover no-repeat;cursor:pointer;box-shadow:0 0 0 .5px var(--line);overflow:hidden;min-width:0;color:inherit}
.abti[aria-pressed="true"]{box-shadow:0 0 0 3px var(--acc)}
.abti.fix{cursor:default;box-shadow:0 0 0 3px var(--good)}
.abti .abk{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.3);border:2px solid #fff;color:#fff;font-size:13px;font-weight:800;line-height:20px;text-align:center}
.abti[aria-pressed="true"] .abk{background:var(--acc)}
.abti.fix .abk{background:var(--good)}
.abti .abl{position:absolute;left:4px;right:4px;bottom:4px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;border-radius:7px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.abti .abfn{position:absolute;inset:0;display:grid;place-items:center;padding:8px 6px 26px;font-size:11px;color:var(--ink3);overflow-wrap:anywhere;text-align:center}
.abupb{margin-top:12px;position:relative;overflow:hidden;height:52px}
.abupb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.abupb.busy{opacity:.7;pointer-events:none}
.abbig{height:54px!important;font-size:17px!important}
.abload{margin-top:16px}
.abstrip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 2px;margin-top:10px;scrollbar-width:none}
.abstrip>div{flex:none;width:64px;text-align:center;min-width:0}
.abstrip i{display:block;width:64px;height:85px;border-radius:10px;background:var(--fill) center/cover no-repeat;box-shadow:0 0 0 .5px var(--line)}
.abstrip b{display:block;font:700 14px var(--fd);margin-top:3px}
.abstrip small{display:block;font-size:10.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abset .fld{margin:0 0 12px}
.abdef{font-size:12px;margin:-4px 2px 12px}
.abwait{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--acc);background:var(--acc-soft);border-radius:10px;padding:6px 9px;line-height:1.3}
.abwait .sp{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:abrot .8s linear infinite}
.abwait.big{margin-top:8px;padding:10px 12px;font-size:14px}
.abwait.big small{display:block;font-size:12px;font-weight:500;color:var(--ink2)}

/* 18.11 «Когда работает реклама» (d_chasy.js): вывод фразой и таблица по частям дня */
.chv{font-size:15px;line-height:1.4;margin:2px 4px 10px;color:var(--ink)}
.chv b.good,.chq .pr.good{color:var(--good)}.chv b.bad,.chq .pr.bad{color:var(--bad)}
.chq{display:grid;grid-template-columns:minmax(0,1.55fr) repeat(4,minmax(0,1fr));background:var(--card);border-radius:14px;padding:4px 10px}
.chq>div{padding:8px 0;border-top:1px solid var(--line2);text-align:right;font-size:13.5px;line-height:1.2;align-self:stretch;display:flex;align-items:center;justify-content:flex-end;white-space:nowrap}
.chq>.h{border-top:0;color:var(--ink3);font-size:11px;font-weight:600}
.chq>.h:first-child,.chq>.t{justify-content:flex-start;text-align:left}
.chq>.t{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;white-space:normal}
.chq>.t b{font-weight:600;font-size:13px}.chq>.t span{font-size:11px;color:var(--ink3)}
.chq>.pr{font-weight:700}.chq>.f{font-weight:700}.chq>.t.f b{font-weight:700}

/* ───────── «Реклама»: добавочные стили помощника «Е» — стопка листов (шапка, плавность), листы действий, график показа, биддер, пополнение,
   сообщения о ходе команд (14.11, по замечаниям Андрея). Подключается после стилей a_head.html (make.py) и перекрывает их. Цвета — переменными темы ───────── */

/* ── шапка листа. 14.11 Андрей: «и крестик справа не надо, хватает назад и шторки» — крестик скрыт (остался в разметке для проверок),
   стрелка «назад» слева есть всегда и крупнее под палец; заголовок занял освободившееся место. За шапку лист тоже можно тянуть вниз ── */
.shh .x{display:none}
.shh{align-items:center;touch-action:none}
.shh .bk{position:relative;width:36px;height:36px;color:var(--ink)}
.shh .bk::after{content:"";position:absolute;inset:-6px}
.shh .tt b{overflow-wrap:anywhere}
.grab{padding:9px 0 3px;cursor:grab}
@media (min-width:900px){.shh{touch-action:auto}}

/* ── плавность. 14.11 Андрей: «назад плохо, резко срабатывает, надо придать большей плавности интерфейсу».
   Лист выезжает снизу за 0,28 с и уезжает за 0,24 с, затемнение проявляется и гаснет вместе с ним; при смене листа («вперёд», «назад»)
   новое содержимое въезжает сбоку (.shnf / .shnb ставит shNav в e_sheets.js), а высота листа доезжает тем же переходом.
   Под листом — запас того же цвета: когда новый лист ниже прежнего, снизу не мелькает страница ── */
.scrim{transition:opacity .22s var(--ease)}
.shw.on .scrim{transition:opacity .28s var(--out)}
.sheet{transition:transform .24s var(--ease)}
.shw.on .sheet{transition:transform .28s var(--out)}
@media (max-width:899px){.sheet::after{content:"";position:absolute;left:0;right:0;top:100%;height:70vh;background:inherit;pointer-events:none}}
@media (min-width:900px){
  .sheet.mid{transition:transform .22s var(--ease),opacity .18s}
  .shw.on .sheet.mid{transition:transform .28s var(--out),opacity .2s}
}
.sheet.shnf .shh .tt,.sheet.shnf>.sbody{animation:shInF .26s var(--out) backwards}
.sheet.shnb .shh .tt,.sheet.shnb>.sbody{animation:shInB .26s var(--out) backwards}
@keyframes shInF{from{opacity:0;transform:translateX(26px)}}
@keyframes shInB{from{opacity:0;transform:translateX(-26px)}}
/* компьютер без видеокарты и «меньше движения» — без переходов вовсе */
:root[data-lite="1"] :is(.sheet,.scrim,.runp){transition:none!important}
:root[data-lite="1"] .sheet :is(.tt,.sbody),:root[data-lite="1"] :is(.bdc .bdh i,.pill.lv i){animation:none!important}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.runp{transition:none!important}.sheet :is(.tt,.sbody),.bdc .bdh i,.pill.lv i{animation:none!important}}

/* ── короткая подсказка в листе действия вместо серой плашки (14.11 Андрей: «снизу куча текста не понятного» — одна-две строки мелко) ── */
.hint{font-size:12.5px;line-height:1.35;color:var(--ink3);margin:7px 2px 0}

/* ── фото товара в списках (14.11 Андрей: «когда товары в списках, картинки тоже надо везде») ── */
.rk .t .ph{width:34px;height:45px;border-radius:8px;background:var(--fill) center/cover no-repeat;flex:none;box-shadow:0 0 0 .5px var(--line)}
.akr .tph{display:block;flex:none;width:33px;height:44px;border-radius:8px;background:var(--fill) center/cover no-repeat}

/* ── работающий биддер в строке кампании — с живой точкой ── */
.pill.lv i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft);animation:bdPulse 2s ease-in-out infinite}
.pill.lv.mr i{background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.pill.lv.sv i{animation:none}

/* ── «держит Марпла»: кто сейчас ведёт лимит или график и что с этим делать (лист «Лимит дня», лист «График показа») ── */
.marb{display:grid;gap:8px;background:var(--warn-soft);border-radius:15px;padding:12px 13px;margin:4px 0 12px}
.marb b{font-size:15.5px;font-weight:700;line-height:1.25;color:var(--ink)}
.marb span{font-size:12.5px;line-height:1.38;color:var(--ink2)}
.marb .btn{width:100%;height:44px;font-size:15px;white-space:normal;line-height:1.15}

/* ── источники пополнения: счёт, баланс, бонусы — строками с остатком ── */
.srcs{display:grid;gap:6px}
.srcb{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 13px 8px 12px;border:0;border-radius:13px;background:var(--fill2);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.srcb i{width:19px;height:19px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--bar2);flex:none;transition:box-shadow .2s var(--ease)}
.srcb b{font-weight:650;font-size:15px}
.srcb small{font-size:12px;line-height:1.25;color:var(--ink3);min-width:0}
.srcb span{margin-left:auto;font-weight:700;font-size:15px;white-space:nowrap}
.srcb[aria-pressed="true"]{background:var(--acc-soft)}
.srcb[aria-pressed="true"] i{box-shadow:inset 0 0 0 6px var(--acc)}
.srcb:disabled{cursor:default}.srcb:disabled i{visibility:hidden}.srcb:disabled b,.srcb:disabled span{color:var(--ink2)}

/* ── биддер в листе кампании: открыт сразу, работающий светится (14.11 Андрей: «и если какой-то работает — светился», «фраза биддера, факт тоже надо») ── */
.bdc{display:grid;gap:9px;background:var(--card2);border-radius:16px;padding:12px;box-shadow:inset 0 0 0 .5px var(--line)}
.bdh{display:flex;align-items:flex-start;gap:10px}
.bdh>div{min-width:0}
.bdh i{width:10px;height:10px;border-radius:50%;background:var(--ink3);flex:none;margin:5px 2px 0 3px}
.bdh b{display:block;font-size:15.5px;font-weight:700;line-height:1.25}
.bdh small{display:block;font-size:12.5px;line-height:1.35;color:var(--ink3);margin-top:2px}
/* цвета — как у плиток настроек в листе кампании: наш работает — зелёный, ведёт Марпла — синий; кампания не идёт или биддер выключен — серый.
   .on — кампания идёт; свечение и живая точка — у того, кто правда меняет ставку (наш «Сам», Марпла); «Совет» — ровная зелёная точка */
.bdc.on.sov{box-shadow:inset 0 0 0 1px var(--good-soft)}
.bdc.on.sov .bdh i{background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
.bdc.on.sam{box-shadow:inset 0 0 0 1.5px var(--good),0 0 22px -8px var(--good)}
.bdc.on.sam .bdh i{background:var(--good);box-shadow:0 0 0 4px var(--good-soft);animation:bdPulse 2s ease-in-out infinite}
.bdc.on.sam .bdh b{color:var(--good)}
.bdc.on.mar{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 22px -8px var(--acc)}
.bdc.on.mar .bdh i{background:var(--acc);box-shadow:0 0 0 4px var(--acc-soft);animation:bdPulse 2s ease-in-out infinite}
.bdc.on.mar .bdh b{color:var(--acc)}
@keyframes bdPulse{50%{box-shadow:0 0 0 7px transparent}}
.bdq{display:flex;align-items:baseline;gap:8px;min-width:0}
.bdq small,.bdg small{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);flex:none}
.bdq b{font-size:15.5px;font-weight:700;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.bdg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bdg>div{background:var(--fill2);border-radius:12px;padding:8px 10px 9px;min-width:0}
.bdg small{display:block}
.bdg b{display:block;font:700 19px/1.2 var(--fd);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.bdg b.no{font-size:15px;line-height:1.5;color:var(--ink2);letter-spacing:0}
.bdg em{display:block;font-style:normal;font-size:11.5px;line-height:1.3;color:var(--ink3);margin-top:2px}
.bdg .lnk{display:block;padding:5px 0 0;font-size:13px}.bdg .lnk:disabled{opacity:.6;cursor:default}
.bdg .g{background:var(--good-soft)}.bdg .g b{color:var(--good)}
.bdg .r{background:var(--bad-soft)}.bdg .r b{color:var(--bad)}
.bdr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:14px}
.bdr span{color:var(--ink2)}.bdr b{font-weight:700;white-space:nowrap}
.bdw{font-size:12.5px;line-height:1.38;color:var(--ink3)}
.bdw.w{color:var(--warn)}
@media (min-width:560px){.bdg{grid-template-columns:repeat(4,minmax(0,1fr))}}
:root[data-lite="1"] .bdc.on.sam{box-shadow:inset 0 0 0 1.5px var(--good)}:root[data-lite="1"] .bdc.on.mar{box-shadow:inset 0 0 0 1.5px var(--acc)}

/* ── график показа. 14.11 Андрей: «график каждый день одинаково не очень, а по дням поуже сделать высоту».
   «Каждый день одинаково» — та же полоса, одна высокая строка «все дни» (34 px под палец); «по дням недели» — строки ниже (21 px вместо 30).
   .gbg осталась пустой обёрткой вокруг полосы — прежние клетки с цифрами (.gbc) больше не рисуются ── */
#gred .gbg{display:block;border-radius:0;overflow:visible;margin-top:0}
.gst.ed .gsc{height:21px}
.gst.ed button.gsd{height:21px}
.gst.ed .gsr+.gsr{margin-top:2px}
.gst.ed .gsh button{height:20px;line-height:20px}
.gst.ed.one .gsr{grid-template-columns:26px repeat(24,minmax(0,1fr))}
.gst.ed.one .gsc{height:34px}
.gst.ed.one .gsr .gsc:nth-child(2){border-radius:7px 0 0 7px}.gst.ed.one .gsr .gsc:last-child{border-radius:0 7px 7px 0}
.gst.ed.one button.gsd{height:34px;white-space:normal;font-size:10.5px;line-height:1.1;letter-spacing:-.02em}

/* ── сообщения о ходе команды. 14.11 Андрей: «нажал несколько запросов обновить вручную — долго крутится ещё, надо понятный поушн».
   В листе подтверждения — что делается, сколько обычно и сколько прошло; команды без своего листа видны плашкой внизу экрана, итог приходит туда же ── */
.prog{align-items:flex-start}
.prog .sp{margin-top:1px}
.prog .pgt{min-width:0;flex:1}
.prog .pgt b{display:block;font-weight:650;line-height:1.3}
.prog .pgt small{display:block;font-size:12.5px;font-weight:500;line-height:1.35;color:var(--ink3);margin-top:3px}
.runp{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,14px);z-index:190;display:flex;align-items:center;gap:9px;width:max-content;max-width:92vw;
  border:0;border-radius:999px;padding:9px 15px 9px 11px;background:var(--ink);color:var(--bg);font:600 13px/1.25 var(--f);text-align:left;cursor:pointer;
  box-shadow:var(--sh2);opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .28s var(--out)}
.runp.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.runp .sp{width:14px;height:14px;border-radius:50%;border:2px solid transparent;border-top-color:currentColor;border-right-color:currentColor;animation:rot .7s linear infinite;flex:none;opacity:.85}
.runp #runpt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.hasrunp .toast{bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 64px)}
/* сообщение внизу экрана занимало полширины и ломалось на три строки — пусть берёт ширину по тексту (до 92% экрана) */
.toast{width:max-content}
/* 14.11 (четвёртый заход) Андрей: «Пуши чтобы смахнуть мог надо» — показанное сообщение внизу ловит палец: нажатие или смахивание убирает (swOff, c_core.js) */
.toast.on{pointer-events:auto;cursor:pointer}
/* блок «График показа» в листе кампании: длинное «шаблон … · каждый день одинаково» на телефоне уезжало за край — переносим */
.kv.grk b{white-space:normal;min-width:0;overflow-wrap:anywhere}
.kv.grk{grid-template-columns:auto minmax(0,1fr)}

/* ── 14.11 Андрей (06:40): «ставку если не поставил… назад — выкидывает все товары». Лист действия поверх листа кампании не ниже его
   (min-height ставит drawSheet), на компьютере — обычный лист сбоку. Восстановление листа после обновления страницы — без движения ── */
:root[data-shnoa] :is(.sheet,.scrim){transition:none!important}
:root[data-shnoa] .sheet :is(.tt,.sbody){animation:none!important}

/* ── ход команды: «Отправлено → Сторож выполняет → Готово» и ответ сторожа крупно (14.11 Андрей: «если в процессе назад — непонятно, чем закончится») ── */
.rsteps{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin:14px 0 2px;font-size:12.5px;font-weight:600;color:var(--ink3)}
.rsteps>b{font-weight:400;color:var(--ink3);opacity:.6}
.rsteps span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.rsteps i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.6px currentColor;flex:none}
.rsteps .ok{color:var(--good)}.rsteps .ok i{background:var(--good);box-shadow:none}
.rsteps .cur{color:var(--acc)}.rsteps .cur i{background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);animation:bdPulse 1.6s ease-in-out infinite}
.rsteps .x{color:var(--bad)}.rsteps .x i{background:var(--bad);box-shadow:none}
.rsteps+.prog{margin-top:8px}
.rfact{border-radius:15px;padding:12px 14px;margin-top:10px;display:grid;gap:3px}
.rfact b{font-size:17px;font-weight:700;line-height:1.28;overflow-wrap:anywhere}
.rfact small{font-size:12px;color:var(--ink3);font-weight:500}
.rfact.g{background:var(--good-soft)}.rfact.g b{color:var(--good)}
.rfact.b{background:var(--bad-soft)}.rfact.b b{color:var(--bad)}
.rfact.w{background:var(--warn-soft)}.rfact.w b{color:var(--warn)}
.rfact+.acts{margin-top:12px}
/* итог вверху экрана — поверх листов, держится 6+ секунд; нажатие убирает */
.runres{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 10px);z-index:210;display:grid;gap:8px;justify-items:center;padding:0 16px;pointer-events:none}
.rres{display:flex;align-items:flex-start;gap:11px;width:min(520px,100%);border:0;border-radius:18px;padding:12px 15px 13px 12px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;
  box-shadow:var(--sh2),0 0 0 .5px var(--line);pointer-events:auto;opacity:0;transform:translateY(-14px);transition:opacity .22s var(--ease),transform .3s var(--out)}
.rres.on{opacity:1;transform:none}
.rres>div{min-width:0}
.rres i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 14px/1 var(--f);font-style:normal;color:#fff;background:var(--good)}
.rres.b i{background:var(--bad)}.rres.w i{background:var(--warn)}
.rres small{display:block;font-size:12px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rres b{display:block;font-size:15.5px;font-weight:700;line-height:1.3;margin-top:1px;overflow-wrap:anywhere}
.rres.g b{color:var(--good)}.rres.b b{color:var(--bad)}.rres.w b{color:var(--warn)}
:root[data-theme="kosmos"] .rres,:root[data-theme="space"] .rres{background:#0a0d2c}
:root[data-lite="1"] .rres{transition:none}
@media (prefers-reduced-motion:reduce){.rres{transition:none}.rsteps .cur i{animation:none}}

/* ── биддер: «Как это работает» (свёрнуто) и общая ставка (14.11 Андрей: «уточни, как работает… есть общая ставка для всех помимо биддера») ── */
.bdhow{border-radius:12px;background:var(--fill2);padding:0 12px}
.bdhow summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:40px;font-size:14px;font-weight:650;color:var(--acc)}
.bdhow summary::-webkit-details-marker{display:none}
.bdhow summary::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg);margin:-3px 0 0 auto;transition:transform .2s var(--ease)}
.bdhow[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.bdhow ul{margin:0;padding:0 0 11px 17px;display:grid;gap:5px;font-size:13px;line-height:1.4;color:var(--ink2)}
.bdhow li b{color:var(--ink);font-weight:700}
.sbody>.bdhow{margin-top:10px}
.bdkl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;font-size:13.5px;margin-top:10px}
.bdc .bdkl{margin-top:0}
.bdkl span{color:var(--ink3)}.bdkl b{font-weight:650;text-align:right;min-width:0;overflow-wrap:anywhere}

/* ── строка кампании (rkRow: лист товара «Работают» / «На паузе», лист склейки). 14.11 Андрей (08:37): «Это не нужно, лучше показатели крупнее, но не все
   светофоры, + возможность на паузу поставить». Плашек вида, мест и ставки нет; название с состоянием (точка) слева, кнопка «Пауза» / «Запустить» справа;
   четыре показателя крупно, цветом — только «ДРР от всего» (и траты красные без заказов). На 360 px строка не шире листа ── */
.rk.rkr .t{align-items:flex-start;gap:10px}
.rk.rkr .rkn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.rk.rkr .rkn b{flex:none;width:100%;font-size:15px}
.rkgo{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 11px;margin:-3px -4px 0 0;border-radius:999px;
  font:700 14px/1 var(--f);white-space:nowrap;cursor:pointer;transition:transform .3s var(--spring),background-color .2s}
.rkgo::after{content:"";position:absolute;inset:-7px -6px}
.rkgo svg{width:15px;height:15px;flex:none}
.rkgo.pz{background:var(--warn-soft);color:var(--warn)}
.rkgo.go{background:var(--good-soft);color:var(--good)}
.rkgo:active{transform:scale(.92);transition-duration:.1s}
.rk.rkr:has(.rkgo:active){transform:none}   /* нажали кнопку — строка не «проседает» вся */
.rk.rkr .m{margin-top:8px;gap:5px}
.rk.rkr .m .pill{height:20px;font-size:11.5px;padding:0 8px}
.rk.rkr .m .pill.nov{height:auto;min-height:20px;white-space:normal;line-height:1.25;padding:2px 8px}
.rk.rkr .k{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:11px}
.rk.rkr .k b{font:700 19px/1.15 var(--fd);letter-spacing:-.02em}
.rk.rkr .k b small{font-size:12.5px;font-weight:650;letter-spacing:0}
.rk.rkr .k b em{font-style:normal;font-size:15px;letter-spacing:-.01em}
.rk.rkr .k span{font-size:11.5px;margin-top:3px}
@media (max-width:379px){.rk.rkr .k b{font-size:17.5px}.rk.rkr .k b em{font-size:14px}.rk.rkr .k span{font-size:11px}.rkgo{padding:0 11px 0 9px;font-size:13.5px}}

/* ── «мин. ставка 3,10 ₽» (14.11 Андрей, 08:10: «ставка писать на минимуме не надо, просто мин. ставка такая-то, заметнее») ── */
.pill.mnp{color:var(--ink);background:var(--fill)}
.pill.mnp b{font-weight:800}
.pill.mnp.g{background:var(--good-soft);color:var(--good)}
.mnl{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin:2px 2px 10px;font-size:15px;font-weight:600;color:var(--ink2)}
.mnl b{font:800 20px/1.2 var(--fd);color:var(--ink);letter-spacing:-.02em}
.mnl span{font-size:12.5px;color:var(--ink3);font-weight:500}

/* ── новая кампания создана: кнопка «открыть» в листе подтверждения ── */
.rkngo{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:13px 15px;border:0;border-radius:15px;background:var(--acc);color:var(--on-acc);font:inherit;text-align:left;cursor:pointer}
.rkngo span{flex:1;min-width:0}
.rkngo b{display:block;font-size:16px;font-weight:700;line-height:1.25}
.rkngo small{display:block;font-size:12.5px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkngo em{font-style:normal;font-weight:700;font-size:15px;white-space:nowrap}

/* ── потянуть вниз — обновить (14.11 Андрей: «чтобы и в рк и в товаре можно подтянуть вниз и обновилась стр.», «вот надо обновление каждой страницы»).
   Круглая стрелка выезжает из-под шапки сайта или листа; синяя — «отпускайте». Браузерное «потянуть-обновить» (перезагрузка всей страницы) выключено:
   его место занимает наше ── */
html,body{overscroll-behavior-y:contain}
#sbody{overscroll-behavior-y:contain}
.ptr{position:fixed;left:50%;top:0;z-index:150;width:40px;height:40px;margin-left:-20px;display:grid;place-items:center;pointer-events:none;
  color:var(--ink2);opacity:0;transform:translate3d(0,var(--py,-46px),0) scale(var(--ps,1))}
/* 18.11 «как в Эпл»: чёрточки по кругу, бегут ступеньками; убирается — уменьшается и тает */
.ptr .pt{opacity:0;transition:opacity .12s ease}
.ptr .pt.on{opacity:.9}
.ptr.spin .pt.on{opacity:var(--o)}
.ptr.rdy svg{transition:transform .25s cubic-bezier(.34,1.56,.64,1);transform:scale(1.08)}
.ptr svg{transition:transform .2s cubic-bezier(.32,.72,0,1)}
.ptr.go{transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .25s ease}
.ptr.out{--ps:.55}
.ptr.spin svg{animation:rot .8s steps(8) infinite}
:root[data-lite="1"] .ptr{transition:none!important}:root[data-lite="1"] .ptr svg{transform:none;transition:none}:root[data-lite="1"] .ptr.spin svg{animation:none}:root[data-lite="1"] .ptr .pt{transition:none}
@media (prefers-reduced-motion:reduce){.ptr{transition:none!important}.ptr.spin svg{animation:none}}

/* 15.11: кнопки паузы / стопа в карточке раздела «Кампании» — справа в строке названия */
.rk.pg .t .rkgw{margin-left:auto;display:inline-flex;gap:6px;flex:none}
.rk.pg:has(.rkgo:active){transform:none}
/* две кнопки («Стоп» и «Запустить») — отдельной строкой под названием, чтобы не сжимать его */
.rk.pg .t:has(.rkgw .rkgo+.rkgo){flex-wrap:wrap}
.rk.pg .t .rkgw:has(.rkgo+.rkgo){flex-basis:100%;justify-content:flex-end;margin-top:6px}

/* 15.11 столбики часов в листе кампании (grBars) */
.gbl{font-size:13px;color:var(--ink2);margin:2px 0 8px}
.gbr{display:flex;align-items:flex-end;gap:2px;height:46px}
.gbr i{flex:1;min-width:0;border-radius:4px 4px 2px 2px;background:var(--fill)}
.gbr i.on{background:linear-gradient(180deg,color-mix(in srgb,var(--good) 78%,#fff),var(--good))}
.gbr i.nw{box-shadow:0 0 0 1.5px var(--ink)}
.gbx{display:flex;gap:2px;margin-top:3px;font-size:9.5px;line-height:13px;letter-spacing:-.05em;color:var(--ink3)}
.gbx span{flex:1;min-width:0;text-align:center}.gbx span.on{color:var(--good);font-weight:700}.gbx span.nw{color:var(--ink);font-weight:700}
.gbg{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-top:6px}
.gbg i{width:10px;height:10px;border-radius:3px;background:var(--fill);margin-left:6px}.gbg i:first-child{margin-left:0}
.gbg i.on{background:var(--good)}.gbg i.nw{background:none;box-shadow:inset 0 0 0 1.5px var(--ink)}

/* 14.11 Андрей в «К»: «тему космоса в рекламе не полноценно, ниче не движется, аффирмаций нет, надо как везде».
   «Космос» как в Склейках и Юнитке (код перенесён из skleykipp.html): по фону мерцают звёзды и пролетают метеоры (#spDeco),
   над разделами окошко #spCard — слайд-шоу аффирмаций (те же, что в Склейках/Юнитке, порядок один у всех раз в 2 дня),
   живые звёзды в окошке, картинка плывёт камерой, музыка Космоса из /shov/. В «Космос 3D» — окошко и музыка, фон — 3D-сцена.
   JS — d_kosmos.js. Картинки и музыка — общие файлы сайта /shov/ (выкладывает Склейки). */
:root{--sph:url("/shov/space-hero.webp");--sbh:clamp(250px,28vw,360px)}
#spDeco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#spDeco .kz{position:absolute;width:var(--z);height:var(--z);border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(200,215,255,.85);opacity:.15;animation:sp-tw var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes sp-tw{0%,100%{opacity:.12;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}
#spDeco .met{position:absolute;left:0;top:0;width:190px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(214,206,255,.7) 70%,#fff);box-shadow:0 0 8px rgba(190,180,255,.7);opacity:0}
#spWrap{max-width:1240px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
#spWrap:empty{display:none}
#spWrap:not(:empty)+main{padding-top:0}
#spCard{position:relative;height:var(--sbh);margin:0 0 14px;border-radius:22px;overflow:hidden;isolation:isolate;background:#050716;outline:none;
  box-shadow:0 0 0 1px rgba(190,180,255,.3),0 0 42px rgba(120,100,255,.24),0 18px 50px rgba(0,0,0,.55);-webkit-user-select:none;user-select:none}
#spCard:focus-visible{box-shadow:0 0 0 2px #cfc6ff,0 0 42px rgba(120,100,255,.4)}
#spCard .spimg{position:absolute;inset:-7%;background:var(--sph) 50% 50%/cover;transition:transform 2.6s cubic-bezier(.2,.7,.2,1);will-change:transform}
#spCard .spsh{position:absolute;inset:0;background:radial-gradient(ellipse 62% 60% at 50% 48%,rgba(4,6,20,.58),rgba(4,6,20,.18) 72%,transparent),linear-gradient(180deg,rgba(4,6,20,.6),transparent 26%,transparent 72%,rgba(4,6,20,.6))}
#spCard canvas.spst{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#spCard .spfl{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 30%,rgba(220,214,255,.16) 45%,rgba(255,255,255,.28) 50%,rgba(220,214,255,.16) 55%,transparent 70%)}
#spCard .sphud{position:absolute;z-index:2;inset:10px;pointer-events:none;border-radius:16px;border:1px solid rgba(200,190,255,.16)}
#spCard .sphud i{position:absolute;width:24px;height:24px;border:2px solid #d3cbff;filter:drop-shadow(0 0 5px rgba(164,147,255,.95))}
#spCard .sphud i:nth-child(1){left:-1px;top:-1px;border-right:0;border-bottom:0;border-top-left-radius:16px}
#spCard .sphud i:nth-child(2){right:-1px;top:-1px;border-left:0;border-bottom:0;border-top-right-radius:16px}
#spCard .sphud i:nth-child(3){left:-1px;bottom:-1px;border-right:0;border-top:0;border-bottom-left-radius:16px}
#spCard .sphud i:nth-child(4){right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:16px}
#spCard .sptop{position:absolute;z-index:3;left:26px;right:26px;top:22px;display:flex;align-items:center;gap:10px;pointer-events:none;font:700 11px/1 "Manrope",var(--f);letter-spacing:.16em;text-transform:uppercase;color:rgba(232,229,255,.85)}
#spCard .splogo{font:700 13px/1 "Unbounded","Manrope",var(--fd);letter-spacing:.26em;color:#fff;text-shadow:0 0 12px rgba(164,147,255,.95)}
#spCard .spch{padding:5px 10px;border-radius:999px;background:rgba(164,147,255,.16);border:1px solid rgba(200,190,255,.32)}
#spCard .spnum{margin-left:auto;font-variant-numeric:tabular-nums}
#spCard .spstage{position:absolute;z-index:2;inset:58px 78px 56px;display:grid;place-items:center;text-align:center;cursor:grab;touch-action:pan-y}
#spCard .spstage:active{cursor:grabbing}
#spCard .spq{grid-area:1/1;margin:0;max-width:21ch;font:800 clamp(25px,3.5vw,50px)/1.16 "Manrope","Manrope",var(--f);letter-spacing:-.022em;color:#fff;text-wrap:balance;text-shadow:0 2px 22px rgba(5,6,25,.85),0 0 40px rgba(130,110,255,.35)}
#spCard .spq span{display:inline-block}
#spCard .spq.drag{transition:none}
#spCard .spq.back{transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
#spCard .spnav{position:absolute;z-index:3;top:50%;width:46px;height:46px;margin-top:-23px;padding:0;border-radius:50%;border:1px solid rgba(220,215,255,.36);background:rgba(10,12,36,.42);color:#fff;display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .2s,background .2s}
#spCard .spnav:hover{background:rgba(164,147,255,.38);transform:scale(1.08)}
#spCard .spnav:active{transform:scale(.94)}
#spCard .spnav.prev{left:20px} #spCard .spnav.next{right:20px}
#spCard .spnav svg{width:20px;height:20px;display:block}
#spCard .spbar{position:absolute;z-index:3;left:26px;right:146px;bottom:20px;display:flex;gap:6px}
#spCard .spbar button{flex:1;min-width:0;height:16px;padding:6px 0;border:0;background:none;cursor:pointer}
#spCard .spbar button i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
#spCard .spbar button i b{display:block;height:100%;width:100%;background:#fff;transform:scaleX(0);transform-origin:0 50%}
#spCard .spbar button.done i b{transform:scaleX(1);background:rgba(255,255,255,.75)}
#spCard .spbar button.cur i b{animation:sp-fill 7s linear forwards;box-shadow:0 0 8px #b3a5ff}
#spCard:is(.hold,.stop) .spbar button.cur i b{animation-play-state:paused}
@keyframes sp-fill{to{transform:scaleX(1)}}
#spCard .spbtns{position:absolute;z-index:3;right:22px;bottom:10px;display:flex;gap:6px}
#spCard .spbtns button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(220,215,255,.36);background:rgba(10,12,36,.42);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
#spCard .spmenu{position:absolute;right:0;bottom:44px;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:16px;background:rgba(10,12,36,.86);border:1px solid rgba(220,215,255,.36)}
#spCard .spmenu[hidden]{display:none}

/* в «Космос 3D» фон рисует сцена — свои звёзды страницы не нужны */

/* 14.11 Андрей: блок кампаний в листе товара — «обведи красиво эффект перелива света… очень аккуратно мягко и подпиши Рекламные кампании».
   Рамка .rkbox (prodRk, d_novoe.js): тонкая линия цвета темы, по ней медленно (14 с) обходит мягкий блик; подпись сверху. Во всех темах; без видеокарты — блик медленнее, без свечения */
@property --rka{syntax:"<angle>";inherits:false;initial-value:0deg}
.rkbox{position:relative;margin:6px 0 14px;padding:12px 12px 10px;border-radius:calc(var(--r) + 6px);isolation:isolate}
.rkbox::before,.rkbox::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1.5px;
  background:conic-gradient(from var(--rka),color-mix(in srgb,var(--acc) 22%,transparent) 0deg,color-mix(in srgb,var(--acc) 22%,transparent) 210deg,
    color-mix(in srgb,var(--acc) 70%,transparent) 260deg,color-mix(in srgb,var(--acc) 35%,#fff) 288deg,color-mix(in srgb,var(--acc) 55%,transparent) 310deg,color-mix(in srgb,var(--acc) 22%,transparent) 350deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:rk-ring 14s linear infinite}
.rkbox::before{padding:4px;filter:blur(7px);opacity:.45}
@keyframes rk-ring{to{--rka:360deg}}
.rkbox .rkcap{font:700 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin:2px 2px 0}
.rkbox>.rkhd{margin-top:-4px}
:root[data-lite="1"] .rkbox::before{display:none}
:root[data-lite="1"] .rkbox::after{animation-duration:24s}
@media (prefers-reduced-motion:reduce){.rkbox::before,.rkbox::after{animation-duration:30s}}

/* 21.11 «Все площадки» на главной (d_mpv.js) */
.mpv{margin-bottom:10px}
.mpv .mpp{font-size:12px}
.mpv .mpg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);gap:8px;align-items:center;width:100%;text-align:right}
.mpv .mpg>span:first-child{text-align:left}
.mpv .mph{font-size:11px;padding:0 6px 4px}
.mpv .mprow{padding:8px 6px;border:0;border-top:1px solid color-mix(in srgb,currentColor 10%,transparent);background:none;color:inherit;font:inherit;border-radius:0}
.mpv button.mprow{cursor:pointer}
.mpv .mprow.on{background:color-mix(in srgb,currentColor 6%,transparent);border-radius:10px}
.mpv .mpt{font-weight:700;border-top:1px solid color-mix(in srgb,currentColor 25%,transparent)}
.mpv .mpl{display:flex;align-items:center;flex-wrap:wrap;gap:0 4px;min-width:0;font-weight:600}
.mpv .mpl small{flex-basis:100%;font-weight:400;font-size:10.5px}
.mpv .mps,.mpv .mpr,.mpv .mpd{font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.mpv .mpr small,.mpv .mpd small{font-size:11px;font-weight:500;opacity:.75}
.mpv .mpd.good{color:var(--good)}.mpv .mpd.bad{color:var(--bad)}
.mpv .mpn{font-size:11px;line-height:15px;margin-top:8px}
.mpb{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;margin-right:6px;flex:none;font:800 8px/1 var(--fd);font-style:normal;letter-spacing:-.02em}
.mpb.oz{color:#fff;background:#005bff}
.mpb.ym{color:#111;background:#fc0}
