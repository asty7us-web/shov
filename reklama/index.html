.wbl.ozl{background:var(--ozi) center/cover no-repeat;border-radius:22%}
.wbl.yml{background:var(--ymi) center/cover no-repeat;border-radius:22%}
.zch [data-seg="zmp"] .wbl{width:15px;height:15px;margin-right:5px;vertical-align:-2.5px}

/* 22.11 Андрей «значки именно селлер прилож»: ВБ Партнёры, Ozon Seller, Маркет для продавцов (skleyki\icons.json wbs/ozs/yms) */
.wbl.ozl{box-shadow:0 0 0 1px rgba(0,0,0,.12)}.wbl.yml{border-radius:22%;background-color:#ffd60a;background-size:84%}
.zlt .zlt2 b .wbl{width:14px;height:14px;margin-right:5px;vertical-align:-2px}

/* ───────── «Реклама»: добавочные стили помощника «Н» — листы товара и кампании, «Кампании», заметки, «Обновление» (14.11, по замечаниям Андрея).
   Подключается после стилей a_head.html (make.py) и перекрывает их. Цвета — переменными темы ───────── */
/* текст на цветной кнопке (зелёной, жёлтой): в светлой теме белый, в тёмных — тёмный, как у столбиков графика */
:root{--on-sig:#fff}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--on-sig:#0b1408}}
:root:is([data-theme="dark"],[data-theme="kosmos"],[data-theme="space"]){--on-sig:#0b1408}

/* ── период в листе: один, первой строкой, прилипает к верху (14.11 Андрей: «как на главной он в шапке»). Подложка — цвет листа: в «Космосе» лист
   непрозрачный (тот же цвет, что у .sheet в a_head.html). На 360 кнопки прокручиваются вбок внутри себя, лист не раздвигают ── */
.sheet{--shbg:var(--card)}
:root:is([data-theme="kosmos"],[data-theme="space"]) .sheet{--shbg:#0a0d2c}
#sbody .pseg{position:sticky;top:0;z-index:7;display:block;margin:0 -16px;padding:6px 16px 8px;background:var(--shbg);box-shadow:0 .5px 0 var(--line);font-size:12.5px}
:is(#sbody,.shh) .pseg .seg{display:flex;touch-action:pan-x;width:100%;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
:is(#sbody,.shh) .pseg .seg::-webkit-scrollbar{display:none}
:is(#sbody,.shh) .pseg .seg button{flex:1 0 auto;justify-content:center;padding:7px 6px;font-size:13px}
.psegl{font-size:12px;margin:7px 3px 0}
.psegl+.prh{margin-top:10px}
@media (min-width:900px){:is(#sbody,.shh) .pseg .seg button{padding:7px 10px}}

/* ── лист кампании: фото товара первым (нажатие — лист товара), ряд ссылок с кнопкой «Товар здесь» ── */
.rkh{display:flex;gap:12px;align-items:center;margin-top:12px}
.rkh .m{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.rkph{position:relative;flex:none;border:0;padding:0;background:none;cursor:pointer;border-radius:11px}
.rkph .ph{display:block;width:46px;height:60px;border-radius:11px;background:var(--fill) center/cover no-repeat;box-shadow:0 0 0 .5px var(--line)}
.rkph::after{content:"›";position:absolute;right:-6px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--on-acc);font:700 14px/19px var(--fd);text-align:center;box-shadow:0 0 0 2px var(--shbg,var(--card))}
/* 14.11 (четвёртый заход) Андрей: «Всегда картинка должна быть» — фото товара в шапке листа кампании (нажатие — товар) и листа товара */
.shh .shph{flex:none;position:relative;display:block;width:40px;height:52px;padding:0;margin:0;border:0;background:none;border-radius:10px}
.shh .shph .ph{display:block;width:100%;height:100%;border-radius:10px;background:var(--fill) center/cover no-repeat;box-shadow:0 0 0 .5px var(--line)}
.shh .shph.rkph::after{right:-5px;bottom:-4px;width:18px;height:18px;font-size:13px;line-height:17px}
@media (max-width:379px){.shh .shph{width:36px;height:47px}}
:is(.rkh,.psegl)+.wbln{gap:7px}
:is(.rkh,.psegl)+.wbln a,.wbln .totov{flex:1 1 auto;justify-content:center;min-height:38px}
.wbln .totov{display:inline-flex;align-items:center;gap:7px;width:auto;margin:0;padding:4px 11px 4px 5px;border:0;border-radius:11px;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
.wbln .totov .ph{width:23px;height:30px;border-radius:6px;background:var(--fill) center/cover no-repeat;flex:none}
@media (max-width:379px){:is(.rkh,.psegl)+.wbln{gap:5px}:is(.rkh,.psegl)+.wbln a,.wbln .totov{font-size:12.5px}:is(.rkh,.psegl)+.wbln a{padding:8px 7px}.wbln .totov{padding:4px 8px 4px 5px}}

/* ── блок управления кампанией: состояние + кнопка, плитки настроек (14.11 Андрей: «в 1 месте», «одно цветно + мелко», «нет кнопки поставить на паузу») ── */
.cts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:12px;padding:12px 12px 12px 14px;border-radius:18px;background:var(--card2)}
.cts .s{display:flex;align-items:center;gap:11px;flex:1 1 auto;min-width:0}
.cts .s>i{width:12px;height:12px;border-radius:50%;background:var(--ink3);flex:none}
.cts .s small{display:block;font-size:12px;line-height:1.2;font-weight:600;color:var(--ink3)}
.cts .s b{display:block;font:700 20px/1.2 var(--fd);letter-spacing:-.015em;white-space:nowrap}
.cts.on .s>i{background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}.cts.on .s b{color:var(--good)}
.cts.gr .s>i{background:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}.cts.gr .s b{color:var(--acc)}
.cts.off .s b{color:var(--ink2)}
.ctgo{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 auto;height:48px;padding:0 16px;border:0;border-radius:14px;font-weight:700;font-size:16px;white-space:nowrap;cursor:pointer;color:var(--on-sig)}
.ctgo svg{width:18px;height:18px;flex:none}
.ctgo.pz{background:var(--warn)}.ctgo.go{background:var(--good)}
.ctg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.ctg>:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:900px){.ctg{grid-template-columns:repeat(3,minmax(0,1fr))}.ctg>:last-child:nth-child(odd){grid-column:auto}}
.ctt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;border:0;border-radius:16px;padding:10px 24px 10px 12px;background:var(--card2);color:var(--ink);text-align:left;cursor:pointer}
.ctt::after{content:"›";position:absolute;right:10px;top:50%;margin-top:-10px;font:600 18px/20px var(--fd);color:var(--ink3)}
.ctt .l{display:flex;align-items:center;gap:6px;max-width:100%;font-size:12.5px;font-weight:600;color:var(--ink2)}
.ctt .l span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctt .l i{width:8px;height:8px;border-radius:50%;flex:none}
.ctt small em{font-style:normal;font-weight:700}
.ctt>b{max-width:100%;margin-top:3px;font:700 18px/1.2 var(--fd);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctt small{max-width:100%;font-size:12px;line-height:1.3;color:var(--ink3);overflow-wrap:anywhere}
.ctt.on{background:var(--good-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 45%,transparent)}
.ctt.on .l i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft),0 0 9px var(--good)}
.ctt.on .l,.ctt.on small em{color:var(--good)}
.ctt.mar{background:var(--acc-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 40%,transparent)}
.ctt.mar .l i{background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft),0 0 9px var(--acc)}
.ctt.mar .l,.ctt.mar small em{color:var(--acc)}
.ctt.low{background:var(--bad-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 45%,transparent)}
.ctt.low>b,.ctt.low small{color:var(--bad)}
.ctg+.rkupd{margin:8px 3px 0}

/* ── «Кампании»: фото товара у кампании в карточках; «Требуют внимания» ── */
.rk .t .ph{width:34px;height:45px;border-radius:8px;background:var(--fill) center/cover no-repeat;flex:none}
.vnm{display:grid;gap:7px;margin:0 0 12px}
.vnh{font:650 13px var(--f);letter-spacing:.03em;text-transform:uppercase;color:var(--ink3);margin:2px 3px 0}
.vnr{display:flex;align-items:center;gap:12px;width:100%;min-width:0;border:0;border-radius:16px;padding:10px 13px;background:var(--card);box-shadow:var(--sh1);color:var(--ink);text-align:left;cursor:pointer}
.vnr>b{flex:none;min-width:30px;text-align:center;font:700 24px/1 var(--fd);letter-spacing:-.02em}
.vnr.bud>b{color:var(--bad)}.vnr.zas>b{color:var(--warn)}.vnr.zsq>b{color:var(--good,#34c77b)}
.vnr span{flex:1;min-width:0}
.vnr span b{display:block;font-size:15px;font-weight:650;line-height:1.25}
.vnr span small{display:block;font-size:12.5px;line-height:1.3;color:var(--ink3)}
.vnr>i{flex:none;font-style:normal;font-size:17px;font-weight:600;color:var(--ink3)}
.vnr[aria-pressed="true"]{box-shadow:var(--sh1),inset 0 0 0 2px var(--acc)}.vnr[aria-pressed="true"]>i{color:var(--acc)}
@media (min-width:760px){.vnm{grid-template-columns:repeat(2,minmax(0,1fr))}.vnh{grid-column:1/-1}}

/* ── заметки: три кнопки отбора во всю ширину; пометка «заметка» в общем списке ── */
.ntf{margin-top:6px}
.ntf .seg{display:flex;width:100%}
.ntf .seg button{flex:1 1 0;min-width:0;justify-content:center;padding:8px 4px;font-size:13px}
.ntw{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px;background:var(--acc-soft);color:var(--acc)}
.sheet .ntrow{margin-top:4px}
.evrk .ev .w small.rkn{display:none}   /* лист кампании: её название под каждой правкой не повторяем */

/* ── таблица фраз: спокойная смена «Активные / Исключённые / Все» ── */
#rkkw>.chips{flex-wrap:nowrap;gap:6px}
#rkkw>.chips .chip{flex:0 1 auto;min-width:0;padding:0 11px;font-size:13px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:379px){#rkkw>.chips{gap:4px}#rkkw>.chips .chip{padding:0 8px;font-size:12px}}
@keyframes frin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#rkkw.frin>:not(.chips){animation:frin .3s var(--ease) both}
@media (prefers-reduced-motion:reduce){#rkkw.frin>:not(.chips){animation:none}}

/* ── ход замера мест — плашка внизу экрана, над сообщением ── */
#mprog{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;max-width:calc(100vw - 24px);bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 72px);z-index:199;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:14px;background:rgba(28,28,30,.94);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--sh2);pointer-events:auto;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;transition:opacity .2s}
#mprog.mini{bottom:auto;top:calc(env(safe-area-inset-top) + 6px);padding:5px 11px;gap:7px;font-size:12.5px;border-radius:999px;opacity:.92}
#mprog.mini .sp{width:12px;height:12px;border-width:2px}
body.mjob #runp{display:none}
#mprog .sp{width:16px;height:16px;border-radius:50%;border:2.4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:rot .7s linear infinite;flex:none}

/* ── лист «Обновление»: строка «когда собрано» и четыре кнопки — что обновится и сколько ждать ── */
.rfw{font-size:14.5px;line-height:1.4;color:var(--ink2);margin-top:2px}
.rfw b{font-weight:650;color:var(--ink)}.rfw.old b{color:var(--warn)}
.rfl{display:grid;gap:8px;margin-top:14px}
.rfr{display:flex;align-items:center;gap:12px;width:100%;min-width:0;border:0;border-radius:16px;padding:13px 12px 13px 14px;background:var(--card2);color:var(--ink);text-align:left;cursor:pointer}
.rfr svg{width:22px;height:22px;flex:none;color:var(--acc)}
.rfr span{flex:1;min-width:0}
.rfr span b{display:block;font-size:15.5px;font-weight:650;line-height:1.2}
.rfr span small{display:block;font-size:12.5px;line-height:1.3;color:var(--ink3);margin-top:2px}
.rfr em{flex:none;font-style:normal;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--fill);border-radius:999px;padding:4px 9px;white-space:nowrap}

/* ── 14.11: сводная запись «Что меняли» раскрывается списком (evX в d_novoe.js) ── */
.evx>.ev{position:relative;padding-right:24px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.evx>.ev::after{content:'›';position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:600;line-height:1;color:var(--acc);transition:transform .2s ease}
.evx.on>.ev::after{transform:translateY(-50%) rotate(90deg)}
.evx.on>.ev{border-bottom:0}
.evx .evd{display:none;margin:0 0 8px 56px;padding:6px 10px;border-radius:12px;background:var(--card2)}
.evx.on .evd{display:block}
.evx:last-child.on .evd{margin-bottom:0}
.evdr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:.5px solid var(--line);font-size:13.5px;line-height:1.3}
.evdr:last-child{border-bottom:0}
.evdr span{min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.evdr em{flex:none;font-style:normal;color:var(--ink3);white-space:nowrap}
.evdr em b{color:var(--ink);font-weight:650}
.evx .evd .tnote{margin:4px 0 0}
@media (max-width:400px){.evx .evd{margin-left:0}}

/* ── 14.11: «Последняя команда: … — готово / не выполнена» в блоке управления кампанией (lcLine) ── */
.lcmd{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--card2);font-size:13.5px;line-height:1.35;color:var(--ink2)}
.lcmd:empty{display:none}
.lcmd b{color:var(--ink);font-weight:650}
.lcmd>i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--ink3)}
.lcmd>i.g{background:var(--good)}.lcmd>i.w{background:var(--warn)}.lcmd>i.b{background:var(--bad)}
.lcmd .sp{flex:none;width:13px;height:13px;margin-top:2px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:rot .7s linear infinite}

/* ── 14.11: продажи по дням в листе товара — компактно, в один ряд; подсказка вместо мест по фразам ── */
.sal1{margin-top:2px}
.pmxh{margin-top:12px}

/* ── 14.11: «Акции ВБ» в листе товара — цена, ДРР, маржа панели; у акции — ниже на N ₽ и маржа по расчёту ── */
.akm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.akm>div{min-width:0;background:var(--card2);border-radius:14px;padding:9px 11px}
.akm small{display:block;font-size:12px;font-weight:600;color:var(--ink3)}
.akm b{display:block;font:700 18px var(--fd);line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.akm b.muted{color:var(--ink3)}
.akm em{display:block;font-style:normal;font-size:11.5px;line-height:1.25;color:var(--ink3);margin-top:2px}
.akr .pr{max-width:52%}
.akr .pr small i{display:block;font-style:normal;white-space:normal}
.akr .pr small i.good{color:var(--good)}.akr .pr small i.bad{color:var(--bad)}
@media (max-width:370px){.akm b{font-size:16px}.akm>div{padding:8px 9px}}

/* ── 14.11 Андрей 08:10 «пусть рк будет выше в товаре и заметнее»: заголовок кампаний товара крупно, число — плашкой; на паузе — свёрнутой строкой ── */
.hrw.rkhd{margin-top:22px}
.hrw.rkhd h3{display:flex;align-items:center;gap:8px;font:700 20px/1.2 var(--fd);letter-spacing:-.015em;text-transform:none;color:var(--ink)}
.hrw.rkhd h3 b{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:26px;padding:0 8px;border-radius:999px;background:var(--acc);color:var(--on-acc,#fff);font:700 15px/1 var(--fd)}
.hrw.rkhd>.muted{font-size:12.5px}
.pzr{display:flex;align-items:center;gap:10px;width:100%;min-width:0;margin-top:8px;border:0;border-radius:16px;padding:12px 14px;background:var(--card2);color:var(--ink);text-align:left;cursor:pointer}
.pzr span{flex:1;min-width:0}
.pzr span b{display:block;font-size:15.5px;font-weight:650;line-height:1.2}
.pzr span small{display:block;font-size:12.5px;line-height:1.3;color:var(--ink3);margin-top:2px}
.pzr>i{flex:none;font-style:normal;font:600 20px/1 var(--fd);color:var(--ink3)}
.hrw.pzh{margin-top:16px}

/* ── 14.11 Андрей 08:05 «над акции динамику цен»: «Цена по дням» — переключатель, низкая гистограмма с шкалой в рублях, подписи наибольшей и наименьшей ── */
.prch>.muted{font-size:12.5px}
.prc .prsg{display:flex;width:100%;margin:0 0 8px}
.prc .prsg button{flex:1 1 0;min-width:0;justify-content:center;padding:7px 4px;font-size:12.5px}
.prc .ch.ax .bars,.prc .ch.ax .xl{margin-left:34px}
.prc .bars .yt span{left:-35px;width:31px}
@media (max-width:639px){.prc .ch.ax .bars,.prc .ch.ax .xl{margin-left:32px}.prc .bars .yt span{left:-33px;width:30px}}
.prc .bars .col .tp{font-size:10px;letter-spacing:-.02em}
.prc .bars .col .tp .pca{display:block;color:var(--acc);font-size:9.5px;margin-bottom:1px}
.prc .bars .col .tp .e0{position:relative;left:5px}.prc .bars .col .tp .e1{position:relative;left:-5px}
.prc .pcc{color:var(--acc);font-weight:650;white-space:nowrap}
.prlg{margin-top:6px;gap:10px;font-size:11.5px;color:var(--ink3)}
.prlg .pcd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:5px;vertical-align:0}
.prc.frin>*{animation:frin .3s var(--ease) both}
@media (prefers-reduced-motion:reduce){.prc.frin>*{animation:none}}

/* ── 14.11 (четвёртый заход) Андрей 09:18 «выше динамика цен гистограмма чтобы я понимал реально войти в акцию»: линии плановых цен акций на «Цене по дням»
   (пунктир — не участвуем, зелёная — участвуем), подпись справа; строка «чтобы войти…» под графиком ── */
.bars .hl{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--ink2);opacity:.9;pointer-events:none;z-index:2}
.bars .hl.in{border-top:2px solid var(--good)}
.bars .hl span{position:absolute;left:0;bottom:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 5px;border-radius:6px;
  font-size:10.5px;font-weight:700;line-height:13px;color:var(--ink);background:color-mix(in srgb,var(--card) 88%,transparent)}
.bars .hl.in span{color:var(--good)}
.prlg .hlk{display:inline-block;width:14px;height:0;border-top:1.5px dashed var(--ink2);margin-right:5px;vertical-align:3px}
.prlg .hlk.in{border-top:2px solid var(--good)}
.prin{margin:8px 0 2px;padding:9px 12px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:13.5px;line-height:1.35}
.prin b{color:var(--warn);font-weight:750;white-space:nowrap}
.prin.g{background:var(--good-soft)}
.akh+.akst+.prc{margin-top:8px}
/* ── 14.11 (четвёртый заход) Андрей 09:18 «По панели маржу и дрр … это отдельно выше поставить лучше булочек»: блок «Показатели» — карточка-таблица ── */
.pnt{border-radius:16px;background:var(--card2);padding:4px 12px 9px}
.pnt table{width:100%;border-collapse:collapse;table-layout:fixed}
.pnt th,.pnt td{padding:8px 0;text-align:right;vertical-align:baseline;border-bottom:.5px solid var(--line);background:none!important;position:static!important;box-shadow:none!important}
.pnt tbody tr:last-child>*{border-bottom:0}
.pnt thead th{padding:6px 0 7px;font-size:12px;font-weight:650;color:var(--ink2);line-height:1.2}
.pnt thead th small{display:block;font-size:10.5px;font-weight:500;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnt thead th:first-child,.pnt tbody th{text-align:left;width:27%}
.pnt tbody th{font-size:13.5px;font-weight:600;color:var(--ink2)}
.pnt td b{font:700 17px/1.15 var(--fd);letter-spacing:-.02em}
.pnt td .muted{font-size:15px}
.pnt .pnn{margin-top:4px;font-size:11.5px;line-height:1.35;color:var(--ink3)}
@media (max-width:379px){.pnt{padding:3px 10px 8px}.pnt td b{font-size:15.5px}.pnt tbody th{font-size:12.5px}.pnt thead th{font-size:11.5px}}
:root:is([data-theme="kosmos"],[data-theme="space"]) .bars .hl span{background:rgba(10,13,44,.86)}

/* ── 14.11 Андрей 08:10 «ставка писать на минимуме не надо просто мин ставка такая то заметнее»: в плитке «Ставка» отдельной строкой ── */
.ctt small .ctmin{display:block;margin-top:3px;font-size:13.5px;font-weight:750;color:var(--acc);white-space:nowrap}
.ctt small .ctmin .sep{display:none}
/* 24.11 Андрей: ставки по местам в плитке «Ставка». Места бледные, ставка жирная, не больше трёх строк.
   На телефоне 360–390 плитка в две колонки: длинная строка обрезается, сетку не раздвигает */
.ctt[data-act=bid] small{min-width:0;max-width:100%}
.ctt small .ctrec{display:block;margin-top:3px;min-width:0;max-width:100%;font-size:11.5px;line-height:1.28;font-weight:650}
.ctt small .ctrec .ctr{display:block;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctt small .ctrec .ctrm{font-weight:600;color:var(--ink3)}
.ctt small .ctrec .ctrd{font-weight:500;color:var(--ink3);opacity:.7}
.ctt small .ctrec b{font-weight:800;color:var(--ink)}

/* ── 14.11: новая кампания, созданная с сайта (r.nov) — пометка в «Кампаниях» карточкой и в подзаголовке листа кампании ── */
.rk.pg .m .pill.nov{height:auto;min-height:20px;white-space:normal;line-height:1.25;padding:2px 8px}
.rknov{color:var(--acc);font-weight:650}
/* 24.11 Андрей «что за жесть» (крупная синяя строка в шапке новой кампании): теперь маленькая плашка под плашками шапки */
.rknovp{display:inline-flex;align-items:center;height:22px;font-size:12px;font-weight:650;margin-top:6px;white-space:nowrap}

/* ── 14.11 Андрей 08:10 «логика кластеры и фразы… не понял»: свёрнутое «Что такое кластер ›» над таблицей фраз ── */
.klhow{margin:0 0 10px;border-radius:14px;background:var(--card2)}
.klhow>summary{display:flex;align-items:center;gap:6px;padding:10px 13px;font-size:14px;font-weight:650;color:var(--acc);cursor:pointer;list-style:none;-webkit-tap-highlight-color:transparent}
.klhow>summary::-webkit-details-marker{display:none}
.klhow>summary i{font-style:normal;font-size:18px;line-height:1;transition:transform .2s ease}
.klhow[open]>summary i{transform:rotate(90deg)}
.klhb{padding:0 13px 11px;font-size:13.5px;line-height:1.42;color:var(--ink2)}
.klhb p{margin:0 0 6px}.klhb p:last-child{margin:0}
.klhb b{color:var(--ink);font-weight:650}

/* ── 14.11 Андрей 08:10 «Кластеры кликабельные как в марпле»: название кластера раскрывает под строкой его состав ── */
.fr .qn.klo{display:flex;align-items:center;gap:4px}
.fr .qn.klo .qt{flex:1;min-width:0}
.fr .qn .kla{flex:none;font-style:normal;font:600 17px/1 var(--fd);color:var(--acc);transition:transform .2s ease;padding:0 2px}
.fr .qn.klo.on .kla{transform:rotate(90deg)}
.fr tr.klop td{box-shadow:none}
.tws.frw{container-type:inline-size}
.sheet .tws.frw tr.klr>td,.fr tr.klr>td{position:static;max-width:none;overflow:visible;text-overflow:clip;padding:0 0 4px;text-align:left;background:var(--card2)}
.fr .kls{position:sticky;left:0;box-sizing:border-box;width:100cqw;max-width:100%;padding:4px 10px 8px 12px}
.fr .kls>*{white-space:normal}
.klh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 0 4px;font-size:12.5px}
.klh b{font-weight:650;color:var(--ink)}.klh span{color:var(--ink3);font-size:11.5px;white-space:nowrap}
.klq{border-radius:12px;background:var(--card);padding:2px 10px}
.klq>div{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:.5px solid var(--line);font-size:13px;line-height:1.3}
.klq>div:last-child{border-bottom:0}
.klq span{min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.klq em{flex:none;font-style:normal;font-weight:650;color:var(--ink2);white-space:nowrap}.klq em.z{color:var(--ink3);font-weight:500}
.kls .klm{display:block;margin:6px 2px 0;font-size:13px}
.kls .tnote{margin:6px 2px 0;font-size:11.5px}
.kls .klno{font-size:13px;line-height:1.4;color:var(--ink2);padding:4px 2px 2px}.kls .klno b{color:var(--ink)}
.kls .klgo{display:block;width:100%;margin-top:8px}
.fr tr.klr.klin .kls{animation:frin .25s var(--ease) both}
@media (prefers-reduced-motion:reduce){.fr tr.klr.klin .kls{animation:none}}
:root:is([data-theme="kosmos"],[data-theme="space"]) .sheet .tws.frw tr.klr>td{background:#1a1f52}
:root:is([data-theme="kosmos"],[data-theme="space"]) .klq{background:rgba(255,255,255,.06)}

/* 14.11 Андрей: «попадаешь на ВБ — запрос посмотреть выдачу» — значок выдачи ВБ у кластера и у фраз состава (wbq в d_novoe.js) */
.qw{display:flex;align-items:center;gap:4px}
.qw .qn{flex:1;min-width:0}
.wbq{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:1px;min-width:34px;height:30px;padding:0 5px;border-radius:9px;background:var(--fill2);color:var(--ink2);text-decoration:none;font-size:11px;font-weight:700}
.wbq i{font-style:normal;font-size:11px;margin-left:1px}
.wbq .wbl{margin:0}
.klr .wbq{height:24px;min-width:30px;margin-left:6px}

/* 14.11: остатки в листе товара — нажатие раскрывает гистограммы по дням */
.osbt{display:contents;font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.osbt .pill{cursor:pointer}
.osbt .osar{color:var(--acc);font-weight:600}
.osh{margin-top:6px;padding:4px 0 2px}

/* 14.11 23:08: «По панели» — компактная строка наверху листа товара, один период */
.pnq{margin-top:12px;padding:10px 14px 12px}
.pnqh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pnql{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.pnqs{display:inline-flex;background:var(--bar);border-radius:999px;padding:2px}
.pnqs button{font:600 12.5px/1 var(--fb,inherit);color:var(--ink2);background:none;border:0;border-radius:999px;padding:6px 11px;cursor:pointer}
.pnqs button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.pnqd{margin-left:auto;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.pnqv{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:9px}
.pnqv small{display:block;font-size:12px;color:var(--ink3);margin-bottom:2px}
.pnqv b{font:700 20px/1.15 var(--fd);letter-spacing:-.02em}

/* 15.11: плашки кампании в шапке листа под названием (rkHead в d_novoe.js) */
/* 15.11 Андрей «верни какая была тут» (кадр 03:28): плашки снова столбиком, как в 03:20 — строчный вид убран. Было: */
/* .shh .tt span.rkh.rkhs{display:flex;margin-top:6px}.shh .tt span.rkhs span.m{display:flex;flex-direction:row;flex-wrap:wrap;gap:5px;margin:0}.shh .tt span.rkhs .pill{display:inline-flex;width:auto;margin:0;height:20px;font-size:11.5px;padding:0 8px} */

/* 15.11: период в шапке листа (e_sheets drawSheet переносит .pseg в #shh) */
.shh{flex-wrap:wrap}.shh>.pseg{flex:1 0 100%;order:9;display:block;margin:2px 0 0;font-size:12.5px}
.shh>.pseg+.x{display:none}

/* 15.11 Андрей «сделай читабельно чётко»: шапка листа кампании — серая строка, плашки мелкие одной строкой, фото крупнее */
.shh .tt span.rkmeta{display:block;font-size:12.5px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shh .tt span.rkchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.shh .tt span.rkchips .pill{display:inline-flex;align-items:center;width:auto;margin:0;height:21px;padding:0 7px;font-size:11.5px;line-height:1;border-radius:7px;white-space:nowrap}
.shh .shph.rkph{width:54px;height:72px;align-self:flex-start;margin-top:2px}
@media (max-width:379px){.shh .shph.rkph{width:46px;height:61px}}

/* 15.11: «Зоны показа» в листе кампании (zonBlock в d_novoe.js) */
.zonw{overflow-x:auto;margin-top:6px}
table.zon{width:100%;border-collapse:collapse;font-size:13.5px}
table.zon th{font-weight:600;font-size:12px;color:var(--ink3);text-align:right;padding:6px 6px;white-space:nowrap}
table.zon td{text-align:right;padding:8px 6px;border-top:.5px solid var(--line);white-space:nowrap}
table.zon td:first-child,table.zon th:first-child{text-align:left;padding-left:0}
table.zon tr:last-child td{font-weight:700}

/* 15.11 Андрей «кнопку ВБ убери, стрелочку слева чуть дорисуй — понятно, что кликабельно»: стрелка кластера кружком */
.fr .qn .kla{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font:700 19px/1 var(--fd);padding:0 0 2px 1px;margin-left:4px}

/* 15.11 Андрей «ссылки перенеси выше, аккуратно»: «Кампания ↗» и «Товар ↗» — плашками в шапке листа кампании, рядом с плашками кампании */
.shh .tt span.rkchips a.rklk{display:inline-flex;align-items:center;gap:0;height:21px;padding:0 8px 0 6px;font-size:11.5px;font-weight:700;color:var(--ink);background:var(--card2,var(--fill));text-decoration:none;box-shadow:0 0 0 .5px var(--line)}
.shh .tt span.rkchips a.rklk .wbl{width:13px;height:13px;margin-right:4px;vertical-align:0;background:var(--wbi) center/contain no-repeat;border-radius:0;box-shadow:none;animation:none}
.shh .tt span.rkchips a.rklk{padding:0 7px 0 5px;gap:0}

/* 15.11: «Что меняли и заметки» одним списком — строка даты над каждым днём (chgNtBlock в d_novoe.js) */
.evday{font-size:12px;font-weight:700;color:var(--ink3);padding:10px 0 2px;letter-spacing:.02em}
.evday:first-child{padding-top:0}
.hrwb{white-space:nowrap}

/* 15.11 Андрей «значки которых не увидел»: значок ВБ на «Кампания ↗» / «Товар ↗» — свой элемент (у <i> в плашке правило .pill i рисовало белый кружок) */
.rkchips a.rklk .rkw{display:inline-block;width:13px;height:13px;margin-right:4px;flex:none;background:var(--wbi) center/contain no-repeat}

/* 15.11 «Отзывы» в листах товара и кампании: три плитки в один ряд */
.tiles.otz3{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.tiles.otz3 .tile .d{white-space:normal}

/* 15.11 Андрей «дёргается»: «порядок прежний · пересортировать» висит над нижним меню и не сдвигает страницу (раньше вставал строкой над списком, всё съезжало на ряд вниз) */
.chip.frz{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.28)}

/* 16.11 Андрей «помечай значком такое»: значок ВБ на кнопках-подсказках ставки от ВБ */
.chip .wbc{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-1.5px;flex:none;background:var(--wbi) center/contain no-repeat}

/* 17.11 Андрей «ВБ значок белый — это в РК, а обычный — на сайт»: у «Товар ↗» значок как вверху у «Каб 1» */
.rkchips a.rklk .rkw.rkw0{background-image:var(--wbi0)}

/* 17.11 Андрей «мин ставку чуть по-другому покрась»: кнопки от мин. ставки — своим цветом */
.chip.mnc{background:color-mix(in srgb,#34c77b 16%,transparent);color:#34c77b;box-shadow:inset 0 0 0 1px color-mix(in srgb,#34c77b 45%,transparent)}

/* 17.11 фильтр «Вхолостую» над таблицей кампаний — одна строка постоянной высоты */
.zasf{display:flex;align-items:center;gap:8px;margin-top:14px;height:36px;overflow-x:auto;scrollbar-width:none}
.zasf::-webkit-scrollbar{display:none}
.zasf .chip{flex:none;height:34px}
.zasf .zsl{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut,var(--ink));white-space:nowrap}
.zasf .zsl span{opacity:.75}
.zasf .ssel{height:34px;max-width:none;font-size:14px;font-weight:600}
/* 17.11 «Где показ»: переключатели Поиск / Полки (лист actZony), как у Марплы */
.ztgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ztg{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line,rgba(127,127,127,.25));background:transparent;color:inherit;font:inherit;cursor:pointer}
.ztg>i{flex:none;width:38px;height:22px;border-radius:11px;background:rgba(127,127,127,.35);position:relative;transition:background .2s}
.ztg>i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.ztg.on>i{background:var(--acc,#3b82f6)}.ztg.on>i::after{transform:translateX(16px)}
.ztg span{display:flex;flex-direction:column;min-width:0}.ztg b{font-size:15px}.ztg small{font-size:12px;opacity:.7}
.rkupd .lnk:first-of-type{margin-left:auto}.rkupd .lnk+.lnk{margin-left:6px}

/* 17.11 Андрей: кампания стоит и сама не запустится — работающие плитки зелёные, но приглушены */
.ctg.dim .ctt.on,.ctg.dim .ctt.mar{opacity:.5;filter:saturate(.55)}
.ctg.dim .ctt.on .l i,.ctg.dim .ctt.mar .l i{box-shadow:none}
.rncmp{display:grid;gap:3px;padding:12px 14px;border-radius:14px;background:var(--card2,rgba(127,127,127,.08));margin-top:10px}.rncmp small{opacity:.65;font-size:12px}.rncmp small+b{margin-bottom:6px}.rncmp b{font-size:15px;word-break:break-word}.rncmp #rnn{color:var(--acc,#3b82f6);margin-bottom:0}

/* 17.11 тип ставки и место показа под строкой «Сегодня» листа кампании */
.rktyp{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.rktyp .pill{display:inline-flex;align-items:center;width:auto;margin:0;height:24px;padding:0 9px;font-size:12.5px;border-radius:8px;white-space:nowrap}
/* 17.11 Андрей «артикул надо и копировать его при нажатии»: кнопки копирования в шапке листа кампании — как плашки ссылок */
.shh .tt span.rkchips button.rkcp{display:inline-flex;align-items:center;height:21px;padding:0 7px;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink);background:var(--card2,var(--fill));border:0;box-shadow:0 0 0 .5px var(--line);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 17.11 Андрей «скрытно, свёрнуто»: строка-переключатель блока управления наверху листа кампании */
.ctlt{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:12px 14px;border:0;border-radius:16px;background:var(--card2);color:var(--ink);font:600 15px/1.2 var(--fb,inherit);text-align:left;cursor:pointer}
.ctlt>i{width:10px;height:10px;border-radius:50%;background:var(--ink3);flex:none}
.ctlt.on>i{background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}.ctlt.on b{color:var(--good)}
.ctlt b .warnc{color:var(--warn)}   /* «⚠ без лимита» в зелёной строке «идёт» остаётся жёлтым */}
.ctlt.gr>i{background:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}.ctlt.gr b{color:var(--acc)}
.ctlt>span:first-of-type{color:var(--ink3)}.ctlt b{font-weight:700}.ctlt .ar{margin-left:auto;color:var(--ink3)}
.ctlt[aria-expanded=true]+.cts{margin-top:8px}
/* 17.11 ставка кластера прямо в таблице фраз (kbEdit) и одной ставкой для отмеченных (actFrBid) */
.fr td.kbt{min-width:74px}
.fr .kbe{display:flex;flex-direction:column;gap:4px;align-items:stretch;min-width:84px}
.fr .kbe .kbi{width:84px;box-sizing:border-box;border:1.5px solid var(--acc);border-radius:8px;padding:5px 6px;font:inherit;font-weight:650;font-size:16px;background:var(--bg);color:var(--ink);text-align:center}
.fr .kbe .kbb{display:flex;gap:4px}
.fr .kbe .kbb button{flex:1;border:0;border-radius:8px;padding:5px 0;font:inherit;font-weight:700;cursor:pointer}
.fr .kbe .kbok{background:var(--acc);color:#fff}.fr .kbe .kbx{background:var(--fill);color:var(--ink2)}
.fr .kbe small{font-size:10.5px;color:var(--ink3);white-space:nowrap}
.kbl{display:flex;flex-direction:column;gap:6px;margin:10px 0;max-height:40vh;overflow:auto}
.kbl>div{display:flex;justify-content:space-between;gap:10px;font-size:14px}.kbl>div span{min-width:0;overflow-wrap:anywhere}.kbl>div b{white-space:nowrap}
/* 17.11 корзины на графике трат по часам */
.bars .col .kzd{position:absolute;left:50%;transform:translate(-50%,50%);width:8px;height:8px;border-radius:50%;background:var(--good);z-index:3;pointer-events:none;box-shadow:0 0 0 2px var(--card,#fff)}
/* 18.11 лист товара: «Продажи по дням» и «По дням: ДРР и заказы» свёрнуты, каждый раскрывается своей строкой */
.gfd{margin-top:10px}
.gfd>summary.hrw{margin:0;min-height:44px;padding:8px 12px;border-radius:14px;background:var(--card2);cursor:pointer;list-style:none;flex-wrap:nowrap;-webkit-tap-highlight-color:transparent}
.gfd>summary::-webkit-details-marker{display:none}
.gfd>summary h3{min-width:0;overflow:hidden;text-overflow:ellipsis}
.gfd[open]>summary.hrw{margin-bottom:8px}
.gfc,.gfo{font-size:12.5px;white-space:nowrap}
.gfo{display:none}
.gfd[open] .gfo{display:inline}
.gfd[open] .gfc{display:none}
.gfa{font-style:normal;font-size:18px;line-height:1;color:var(--acc);transition:transform .2s ease}
.gfd[open] .gfa{transform:rotate(90deg)}

/* 22.11 «наша цена крупно» — под фото в шапке листа кампании (d_novoe.js rkphw) */
.shh .rkphw{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;align-self:flex-start}
.shh .rkphw .shph.rkph{margin-top:2px}
/* 24.11 Андрей (кадр листа товара Средство_яма, обвёл шапку): «этот блок надо сделать таким же как в рк» — фото товара в шапке без класса rkph (он рисует значок › «открыть товар»), размер тот же, что у фото кампании */
.shh .rkphw>.shph:not(.rkph){width:54px;height:72px;margin-top:2px}
@media (max-width:379px){.shh .rkphw>.shph:not(.rkph){width:46px;height:61px}}
.rkpr{font:700 17px/1.1 var(--fd);white-space:nowrap;letter-spacing:-.2px}

/* 24.11 Андрей: безопасная ставка по панели — рядом со ставкой в плитке и блоком в листе ставки */
.ctt[data-act=bid]>b{white-space:normal;overflow:visible;text-overflow:clip}
.ctt b .ctbz{display:table;margin:4px 0 0;padding:2px 7px;border-radius:8px;font-size:12.5px;font-weight:750;vertical-align:middle;white-space:nowrap;background:var(--fill);color:var(--ink2)}
.ctt b .ctbz.g{background:var(--good-soft);color:var(--good)}
.ctt b .ctbz.w{background:var(--warn-soft);color:var(--warn)}
.ctt b .ctbz.r{background:var(--bad-soft);color:var(--bad)}
.bzb{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--fill);display:flex;flex-direction:column;gap:8px}
.bzb.g{background:var(--good-soft)}.bzb.w{background:var(--warn-soft)}.bzb.r{background:var(--bad-soft)}
.bzb>span{font-size:12.5px;line-height:1.35;color:var(--ink2)}
.bzb .bzr{display:flex;gap:14px;flex-wrap:wrap}
.bzb .bzr small{display:block;font-size:11.5px;color:var(--ink3)}
.bzb .bzr b{font-size:17px;font-weight:800}
.bzb .bzr div:first-child b{color:var(--good)}
.bzb .btn{align-self:flex-start}

/* 24.11 Андрей: безопасная ставка в акциях — список под кнопкой «Поставить безопасную» */
.bzak{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.bzak>small{color:var(--muted)}
.bzar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bzar span{min-width:0;font-size:13px}.bzar i{display:block;font-style:normal;font-size:12px}
.bzar i.good{color:var(--good)}.bzar i.bad{color:var(--bad)}.bzar em{font-style:normal;color:var(--muted);font-size:12px;white-space:nowrap}

/* 24.11 цена — кнопка «Изменить цену»; история цены по заказам */
button.rkpr,.prbtn{border:0;background:none;color:inherit;padding:0;cursor:pointer;text-align:left}
.prbtn{font:inherit;font-weight:700;font-size:inherit}
.prh .pp .prbtn{display:block;font:700 22px var(--fd);letter-spacing:-.02em;color:var(--ink)}
button.rkpr i,.prbtn i{font-style:normal;font-size:.7em;opacity:.55}
.prak{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:2px 0 12px}.prak .pl1{color:var(--ink2);font-size:13px}.prak .prbtn{font:700 20px var(--fd);letter-spacing:-.02em;color:var(--ink)}.prak small{color:var(--ink3);font-size:12px}   /* 24.11 строка цены в «Акциях ВБ» */
.prpd>div{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line,rgba(127,127,127,.15))}
.prpd span{color:var(--ink2)}.prpd b{text-align:right}.prpd small{grid-column:1/-1;color:var(--ink3)}

/* 24.11 «у покупателя цена тут» — под нашей ценой в шапке листа кампании */
.shh .rkphw .rkby{font-size:12px;line-height:1.1;color:var(--ink2);white-space:nowrap;margin-top:-3px}
.shh .rkphw .rkby b{font-weight:750;color:var(--ink)}

/* 24.11 Андрей «карандашик и копия сразу после названия, только значки»: значки в конце названия листа кампании/товара */
.shh .tt b .tti{display:inline-flex;gap:4px;margin-left:6px;vertical-align:.12em;white-space:nowrap}
.shh .tt b .tti1{display:inline-flex;align-items:center;justify-content:center;width:28px;height:26px;padding:0;border:0;border-radius:8px;font:600 14px/1 var(--fb,inherit);color:var(--ink2,var(--ink));background:var(--card2,var(--fill));box-shadow:0 0 0 .5px var(--line);cursor:pointer}
.shh .tt b .tti1::before{content:'⧉'}.shh .tt b .tti1[data-act=rename]::before{content:'✎'}   /* значок рисуется стилем: в тексте названия его нет (копирование/проверки берут чистое название) */

/* 14.11 Андрей: «прожатие — кнопка заметная, как у Марплы, зелёным наливается по мере поступления данных, как в Эпл» — d_novoe.js mBtn */
.mbtn{position:relative;overflow:hidden;width:100%;height:50px;border:0;border-radius:14px;cursor:pointer;font:inherit;font-weight:700;font-size:16px;letter-spacing:-.01em;
  color:#fff;background:var(--good);box-shadow:0 6px 18px -8px rgba(22,144,74,.55);display:flex;align-items:center;justify-content:center;padding:0 16px;isolation:isolate}
.mbtn.sm{height:36px;width:auto;font-size:14px;border-radius:11px;padding:0 14px;box-shadow:none}
.mbtn .mbt{position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.mbtn .mbf{position:absolute;inset:0;z-index:0;background:var(--good);transform-origin:left center;transform:scaleX(0);transition:transform .7s cubic-bezier(.22,1,.36,1)}
.mbtn.run{background:var(--good-soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(31,157,85,.35);cursor:default}
.mbtn.run .mbf{transform:scaleX(var(--mp,0));background:rgba(31,157,85,.42)}
.mbtn.end .mbf{background:var(--good)}
.mbtn.run .mbf::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);background-size:200% 100%;animation:sk 1.6s linear infinite}
.mbtn.run.end .mbf::after{animation:none;background:none}
.mbtn.end .mbt{color:#fff}
.mbtn.end{background:var(--good);color:#fff}
.selbar .mbtn{flex:none}
/* ожидание места у фразы: мягко дышащая капсула вместо крутилки */
.plb .mwait{position:relative;overflow:hidden;width:34px;height:22px;border-radius:11px;background:var(--good-soft);display:inline-block}
.plb .mwait i{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(31,157,85,.38),transparent);background-size:200% 100%;animation:sk 1.3s ease-in-out infinite}
.plb .mwt{color:var(--good)!important;animation:mbreath 1.6s ease-in-out infinite}
@keyframes mbreath{50%{opacity:.45}}
.plb .mfresh{display:inline-block;animation:mfr .7s cubic-bezier(.22,1,.36,1) both}
@keyframes mfr{from{opacity:0;transform:scale(.7)}60%{opacity:1;transform:scale(1.08)}to{transform:none}}
:root[data-lite="1"] .mbtn .mbf{transition:none}:root[data-lite="1"] .mbtn .mbf::after,:root[data-lite="1"] .plb .mwait i,:root[data-lite="1"] .plb .mwt,:root[data-lite="1"] .plb .mfresh{animation:none}
@media (prefers-reduced-motion:reduce){.mbtn .mbf{transition:none}.mbtn .mbf::after,.plb .mwait i,.plb .mwt,.plb .mfresh{animation:none}}
.fr td small.mhm{display:block;text-align:center;margin-top:2px;font-size:10px;color:var(--ink3);font-weight:600;line-height:1}

/* 15.11 Андрей «неудобно с этими стрелками, размашисто всё»: лист «Столбцы» компактный — ручка ⠿ вместо стрелок, строки ниже, пояснение в одну строку, переключатель меньше */
.colr{gap:10px;padding:7px 0}
.colr b{font-size:14.5px}
.colr div span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colr .sw{width:44px;height:26px}
.colr .sw:after{width:22px;height:22px}
.colr .sw[aria-checked="true"]:after{transform:translateX(18px)}
.dh{flex:none;width:22px;font-style:normal;font-size:18px;line-height:1;color:var(--ink3);text-align:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;padding:6px 0}
.dh0{visibility:hidden}
.colr.drg{position:relative;z-index:5;background:var(--card,var(--bg));border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.28);transition:none}
.colr.drg .dh{cursor:grabbing;color:var(--ink)}

/* 15.11 Андрей «по панели ср. чек также покажи»: в «По панели» четыре цифры — маржа, ДРР, продажи, средний чек */
.pnqv{grid-template-columns:.85fr .85fr 1.15fr 1.1fr;gap:6px}
.pnqv b{font-size:18px}

/* 15.11 Андрей «на всю клетку и плавно»: тянется вся строка столбца — без выделения текста, поднятая строка чуть крупнее */
.colr[data-ck]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.colr.drg{scale:1.02;cursor:grabbing}

/* 15.11 Андрей «тускло, непонятно»: в «Цене по дням» цена дня — вертикально внутри столбика */
.prc .bars .col i{display:flex;align-items:flex-start;justify-content:center}
.prc .bars .col i em{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;padding:5px 0 0;line-height:1;white-space:nowrap}
.prc .bars .col .tp .in0{writing-mode:vertical-rl;transform:rotate(180deg);margin:0 auto 2px}

/* 24.11 ключи в названии и описании карточки (d_txk.js) */
.txk{font-weight:600}
small.txk{display:block;font-size:11px;margin-top:2px;opacity:.9}
.txk.ok{color:var(--good)}
.txk.sl{color:var(--warn)}
.txk.no{color:var(--bad)}
.txkt{width:100%;border-collapse:collapse;font-size:14px}
.txkt th{text-align:left;font-size:12px;font-weight:600;color:var(--ink3);padding:4px 6px}
.txkt td{padding:7px 6px;border-top:.5px solid var(--line);vertical-align:top}
.txkt td:first-child{width:52%}
.txkt td:not(:first-child){white-space:nowrap}
.txkt td:first-child{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;max-width:none}

/* «Реклама» — правки 14.11 по словам Андрея (главная, шапка, нижняя полоса, таблицы, «Баллы», «Акции», «Ещё»). Встаёт после стилей a_head.html и перекрывает их.
   Цвета — только переменными темы. */

/* ── 14.11 Андрей: «плоский график показал такой бесполезный», «ты гистограммы поменял на полоски зачем» — в карточке товара маленькая гистограмма:
   столбики от наибольшего дня товара, над самым высоким — его число, под столбиками — числа месяца (spark в c_core.js) ── */
.spark{grid-column:1/-1;height:auto;margin-top:0}
.spb{display:flex;align-items:flex-end;gap:3px;height:54px}   /* 40 — самый высокий столбик, сверху место под его число */
.spc{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.spc i{display:block;width:100%;border-radius:4px 4px 2px 2px}
.spc em{font-style:normal;font-size:10.5px;font-weight:700;line-height:1;color:var(--ink2);margin-bottom:3px;white-space:nowrap}
.spc em.l{align-self:flex-start}.spc em.r{align-self:flex-end}
.spc.dm i{opacity:.36}
/* столбиков много (14, 30 дней) — число стоит в верхней строке над своим столбиком: рядом с высокими соседями оно не ложится на них */
.spb.tp .spc{position:relative}.spb.tp .spc em{position:absolute;top:0;left:50%;transform:translateX(-50%);margin:0}
.spb.tp .spc em.l{left:0;transform:none}.spb.tp .spc em.r{left:auto;right:0;transform:none}
.spx{display:flex;gap:3px;margin-top:4px}
.spx span{flex:1;min-width:0;display:flex;justify-content:center;font-size:10px;font-weight:600;line-height:1;color:var(--ink3);white-space:nowrap}
.spb.many,.spx.many{gap:2px}.spb.many .spc i{border-radius:2.5px 2.5px 1px 1px}
/* подписи под цифрами карточки не наезжают друг на друга на 360 и 390: столбцы под длину чисел, длинное — второй строкой */
.pc .kpi{grid-template-columns:minmax(0,.86fr) minmax(0,1.12fr) minmax(0,1.02fr) minmax(0,1fr);align-items:start}
.pc .kpi span{line-height:1.25}
@media (max-width:385px){.pc .kpi{gap:4px}.pc .kpi b{font-size:14.5px}.pc .kpi span{font-size:10.5px}}
/* 25.11 Андрей «при смене срока картинка уходит резко»: мягкое появление только цифр при смене Сегодня/Вчера/… — фото (.ph) без анимации */
#view.perfade .kpi b,#view.perfade .kpi span,#view.perfade .tile .v,#view.perfade .tile small,#view.perfade .skc>.muted,#view.perfade .skpl{animation:perIn .28s ease-out both}
@keyframes perIn{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#view.perfade .kpi b,#view.perfade .kpi span,#view.perfade .tile .v,#view.perfade .tile small,#view.perfade .skc>.muted,#view.perfade .skpl{animation:none}}

/* ── 14.11 Андрей: «время обновл стоит а если 3 дня назад как» — кнопка обновления: давние данные — жёлтая, не сегодняшние — красная с датой ── */
.rfb.old{color:var(--warn);background:var(--warn-soft)}
.rfb.old2{color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1.5px var(--bad)}

/* ── 14.11 Андрей: «внизу раздел который выбран плохо виден» — выбранный раздел: плашка-подложка, жирная подпись, яркий цвет (в «Космосе» — белый) ── */
.tabs button{transition:color .2s,background-color .25s var(--ease)}
.tabs button[aria-current="true"]{color:var(--acc);font-weight:750;background:color-mix(in srgb,var(--acc) 15%,transparent)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .tabs button[aria-current="true"]{background:color-mix(in srgb,var(--acc) 28%,transparent)}}
:root[data-theme="dark"] .tabs button[aria-current="true"]{background:color-mix(in srgb,var(--acc) 28%,transparent)}
:root:is([data-theme="kosmos"],[data-theme="space"]) .tabs button[aria-current="true"]{color:var(--ink);background:color-mix(in srgb,var(--acc) 36%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent)}
:root:is([data-theme="kosmos"],[data-theme="space"]) .tabs button[aria-current="true"] svg{color:var(--acc)}
@media (max-width:899px){.tabs{padding-top:5px}.tabs button{border-radius:13px;padding:6px 0 5px}.tabs button[aria-current="true"]{letter-spacing:-.02em}}

/* ── 14.11 Андрей: «поиск… не надо раздел целый — вот можно кнопкой справа в шапке от периодов» — лупа #fsb в строке под шапкой.
   На телефоне: периоды занимают всю ширину и не листаются вбок, лупа справа; в разделах без периодов она с подписью и тянется, как поле поиска;
   старое поле .srch на телефоне скрыто. На широком экране поиск — прежнее поле, лупы нет ── */
.fsb{display:none}
@media (min-width:900px){.sub.only{display:none}}
@media (max-width:899px){
  .sub{flex-wrap:wrap;overflow:visible;gap:6px}
  .sub .srch{display:none}
  .fsb{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:none;width:38px;height:34px;padding:0;border:0;border-radius:11px;background:var(--fill);color:var(--ink);font-size:14.5px;font-weight:600;cursor:pointer}
  .fsb svg{width:18px;height:18px;flex:none}
  .fsb span{display:none}
  .sub:not(.wper) .fsb{flex:1 1 96px;width:auto;min-width:0;justify-content:flex-start;padding:0 12px;color:var(--ink3)}
  .sub:not(.wper) .fsb span{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub [data-seg="per"]{flex:1 1 0;min-width:0}
  .sub [data-seg="per"] button{flex:1 1 auto;min-width:0;justify-content:center;padding:6px 2px;font-size:13px}
  .sub [data-seg="rkf"]{order:3;flex:1 1 100%}
  .sub [data-seg="rkf"] button{flex:1 1 auto;justify-content:center}
}
@media (max-width:385px){.sub [data-seg="per"] button{font-size:12.5px;letter-spacing:-.01em}.fsb{width:36px}}

.wbl{display:inline-block;width:18px;height:18px;margin-right:6px;flex:none;border-radius:0;font-size:0;line-height:0;letter-spacing:0;vertical-align:-3.5px;background:var(--wbi) center/contain no-repeat}
#kabSeg .wbl{width:17px;height:17px;margin-right:5px}
.h3wb .wbl{transform:translateY(1px)}
.wbln .wbl{width:16px;height:16px;margin-right:5px}
@media (max-width:560px){#kabSeg .wbl{display:none}
  #kabSeg::before{content:"";display:block;align-self:center;flex:none;width:20px;height:20px;margin:0 3px 0 4px;border-radius:0;background:var(--wbi0) center/contain no-repeat}}
@media (max-width:385px){#kabSeg::before{width:18px;height:18px;margin:0 2px 0 3px}}

/* ── 14.11 Андрей: «когда товары в списках картинки тоже надо везде» — маленькое фото в первом столбце таблиц, в строках склеек и «Баллов» ── */
.tf{display:flex;align-items:center;gap:8px;min-width:0}
.tf>div{min-width:0;flex:1}
.tph{display:block;flex:none;width:30px;height:40px;border-radius:7px;background:var(--fill) center/cover no-repeat}
.tw[data-tbl] td.t1{min-width:190px}
@media (max-width:700px){.tw[data-tbl] td.t1{min-width:150px;max-width:44vw}.tw[data-tbl] th:first-child{max-width:44vw}.tw[data-tbl] .tf{gap:7px}.tw[data-tbl] .tph{width:27px;height:36px;border-radius:6px}}
/* вторая строка в числовой ячейке («мин. 3,62 ₽» под ставкой) — отдельной строкой, а не слитно с числом */
.tw[data-tbl] td.num small{display:block;font-size:11px;font-weight:500;color:var(--ink3);margin-top:1px}
.tw[data-tbl] td.num.warnc small,.tw[data-tbl] td.t1 small.warnc{color:var(--warn)}   /* «нет лимита» у идущей: жёлтый warnc не затирается серым small */}
.skt .tf{gap:7px}.skt .tph{width:24px;height:32px;border-radius:6px}
/* с фото название уже: длинное слово переносим по буквам, иначе таблица распирает карточку и страницу (на 390 — «самоклеящаяся») */
@media (max-width:640px){.skt td:first-child{overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto}}
@media (min-width:386px) and (max-width:640px){.skt th,.skt td{padding-left:3px;padding-right:3px}}
@media (max-width:385px){.skt .tf{gap:6px}.skt .tph{width:21px;height:28px;border-radius:5px}}
.akr .tph{width:33px;height:44px;border-radius:8px}

/* ── 14.11 Андрей: «снизу куча текста не понятного» — «Как считается» в «Ещё» свёрнуто: открывается нажатием, внутри — короткая таблица ── */
.dtl{padding:0}
.dtl summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;cursor:pointer;list-style:none}
.dtl summary::-webkit-details-marker{display:none}
.dtl summary h3{margin:0}
.dtl summary svg{transition:transform .25s var(--ease)}
.dtl[open] summary svg{transform:rotate(90deg)}
.kvt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;padding:0 16px 16px;font-size:13px;line-height:1.35}
.kvt b{font-weight:650;white-space:nowrap}.kvt span{color:var(--ink2)}

/* ── 14.11 Андрей 06:40: «…статистика табличного типа, как в Марпле» — таблица по дням под гистограммой (dayTbl в d_tabl.js): своя высота, листается внутри себя
   вбок и вниз, «Дата» закреплена слева, строка «За период» — выделена; страница и лист не раздвигаются ── */
.hrw.dth{margin-top:14px}
.tw.dtw{max-height:min(430px,62vh);max-width:100%}
.tw.dtw th{white-space:normal;line-height:1.15;vertical-align:bottom;max-width:86px;box-shadow:inset 0 -1px 0 var(--line)}
.tw.dtw td.t1{min-width:0;max-width:none}

.tw.dtw tr.dtot td{background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.sheet .tw.dtw tr.dtot td{background:color-mix(in srgb,var(--acc) 10%,var(--card2))}
@media (max-width:700px){.tw.dtw th,.tw.dtw td{padding:8px 7px}.tw.dtw td{font-size:13.5px}}
.sheet .tw.dtw{background:var(--card2);box-shadow:none;border-radius:16px}
.sheet .tw.dtw th,.sheet .tw.dtw td:first-child{background:var(--card2)}
/* «Космос»: полупрозрачные карточки — закреплённым ячейкам плотный фон, как у остальных таблиц листа (те же цвета, что в a_head.html) */
:root:is([data-theme="kosmos"],[data-theme="space"]) .sheet .tw.dtw,:root:is([data-theme="kosmos"],[data-theme="space"]) .sheet .tw.dtw th,:root:is([data-theme="kosmos"],[data-theme="space"]) .sheet .tw.dtw td:first-child{background:#1a1f52}

/* ── 14.11 Андрей 06:40: «цены акций, где участвуем, выделить зелёным и нашу цену больше» и «под каждым товаром в разделе акции гистограмма продаж как в ЛК ВБ,
   в 1 ряд… не размашисто» ── */
.akp{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 8px;margin-top:4px}
.akp b{font:700 21px/1.1 var(--fd);letter-spacing:-.02em;color:var(--ink)}
.akp span{font-size:12px;color:var(--ink3);font-weight:600}
.akr.akin{background:var(--good-soft);border-radius:12px;padding:10px 11px;margin:5px 0;border-bottom:0}
.akr.akin .pr{color:var(--good)}
.akr .akok{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:999px;box-shadow:inset 0 0 0 1.2px var(--good);color:var(--good);font-weight:700}
.akg{margin-top:10px;padding:8px 10px 6px;border-radius:12px;background:var(--fill2)}
.akgl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink3);font-weight:600;margin-bottom:2px}

/* компактная гистограмма заказов (sparkQ в c_core.js): столбики до 30 px + число над наибольшим = 40 px, даты под крайними */
.sq{min-width:0}

.sqc em.l{left:0;transform:none}.sqc em.r{left:auto;right:0;transform:none}

/* ── 14.11 Андрей 06:40: «раздел цены показать по каждому по панели данные» — карточки раздела «Цены» (vCeny в d_views.js) ── */
.pc.cnc{grid-template-columns:44px 1fr;gap:6px 11px;padding:12px 13px}
.pc.cnc .ph{width:44px;height:58px;border-radius:10px}

.cnp{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;margin-top:3px}
.cnp b{font:700 21px/1.1 var(--fd);letter-spacing:-.02em;color:var(--ink)}

/* панель: неделя и месяц — двумя столбцами рядом: период, маржа и ДРР, продажи */
.cnpn{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;padding-top:7px;border-top:.5px solid var(--line2)}
.cnpr{display:flex;flex-wrap:wrap;align-items:baseline;align-content:flex-start;gap:0 7px;font-size:12px;line-height:1.35;color:var(--ink2);min-width:0}
.cnpr .l{flex:0 0 100%;font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnpr b{font-weight:700}
.cnpr span:last-child{flex:0 0 100%}

/* ── 14.11: семь разделов в нижней полосе — подписи помещаются на 360 ── */
@media (max-width:899px){.tabs button span{max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap}}
@media (max-width:385px){.tabs button{font-size:9.5px;letter-spacing:-.03em}.tabs button svg{width:22px;height:22px}}

/* ── 14.11 Андрей 08:10: «а сверху это обновление мест именно?» — кнопка в шапке обновляет ДАННЫЕ: на телефоне три строки в той же ширине
   (значок, время сбора, мелко «данные»), на компьютере в ряд «⟳ Данные 08:38». Ширина кнопки прежняя — шапка на 360 не раздвигается ── */
.rfb{gap:1px}
.rfb svg{width:13px;height:13px}
.rfb #refT{line-height:1}
.rfb .rfd{display:block;font-size:9px;font-weight:650;line-height:1;letter-spacing:-.01em;color:inherit;opacity:.78;white-space:nowrap}
/* телефон: кнопка на 2 px выше (строка шапки и так 40 px — по блоку «Реклама»), значок 12 px — трём строкам хватает места и у красной рамки старых данных;
   точка предупреждений — в самом углу, не впритык к значку */
@media (max-width:699px){.rfb{height:40px;padding-bottom:2px}.rfb svg{width:12px;height:12px}.rfb .rfd{font-size:8.5px;letter-spacing:-.03em}.rfb .dot{top:3px;right:3px;width:7px;height:7px}}
@media (min-width:700px){
  .rfb{gap:6px}.rfb svg{width:17px;height:17px}
  .rfb .rfd{order:1;font-size:13px;font-weight:600;opacity:.8;letter-spacing:0;text-transform:capitalize}   /* «Данные 08:38»: подпись перед временем */
  .rfb #refT{order:2}
}

/* ── 14.11 Андрей 08:10: «…от 1000 показов какие» — вторая строка шапки столбца словами («за клик», «за 1000 показов»; sub в TBL, d_tabl.js) ── */
th .ths{display:block;margin-top:2px;font-size:10px;font-weight:600;letter-spacing:0;line-height:1.15;color:var(--ink3);opacity:.85;white-space:normal}

/* 15.11: день смешанной кампании раскрывается на поиск и рекомендации */
.tw.dtw tr.dex{cursor:pointer}
.tw.dtw .dar{font-style:normal;color:var(--acc);margin-right:5px;font-size:11px}
.tw.dtw tr.dsub td{font-size:13px;color:var(--ink3);background:color-mix(in srgb,var(--acc) 4%,transparent)}
.tw.dtw .dsl{padding-left:16px}

/* 15.11 Андрей: товары склейки свёрнуты, стрелка справа раскрывает; вторая строка общих — по панели */
.skc .skhw{display:flex;align-items:center;gap:4px}.skc .skhw .skh{flex:1;min-width:0}
.skc .skx{flex:none;display:grid;place-items:center;width:40px;height:40px;margin-right:-6px;border:0;border-radius:12px;background:var(--fill);cursor:pointer;color:var(--ink3)}
.skc .skx svg{transform:rotate(90deg);transition:transform .2s ease}.skc.skop .skx svg{transform:rotate(-90deg)}
.skc .skls{display:none}.skc.skop .skls{display:block}
.skc .kpi.skpn{margin-top:6px}.skc .skpl{font-size:12px;margin:4px 2px 2px}
/* 17.11 товары раскрытой склейки — общая таблица со своими столбцами и сортировкой (TBL.skc) */
.skbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 2px 6px;font-size:12px}
.tw.skw{max-height:none;background:var(--card2);box-shadow:none;border-radius:14px}
.tw.skw th{white-space:normal;line-height:1.15;vertical-align:bottom;max-width:86px;box-shadow:inset 0 -1px 0 var(--line);cursor:pointer}
.tw.skw th,.tw.skw td:first-child{background:var(--card2)}
:root:is([data-theme="kosmos"],[data-theme="space"]) .tw.skw,:root:is([data-theme="kosmos"],[data-theme="space"]) .tw.skw th,:root:is([data-theme="kosmos"],[data-theme="space"]) .tw.skw td:first-child{background:#1a1f52}
.tw.skw th,.tw.skw td{padding:8px 7px}
.tw.skw td.t1{min-width:140px;max-width:42vw;font-size:13.5px;line-height:1.25}
.tw.skw td.t1 small{display:block;font-size:11px;font-weight:500;color:var(--ink3);margin-top:1px}
.tw.skw .tf{gap:7px}.tw.skw .tph{width:24px;height:32px;border-radius:6px}
@keyframes skin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.skc.skan .skls{animation:skin .3s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.skc.skan .skls{animation:none}}
/* 17.11 Андрей «справа накладка»: в склейках длинная подпись («чистая маржа панели») переносится на вторую строку, а не наезжает на соседнюю «на 1 заказ» */
.skc .kpi span{white-space:normal;line-height:1.25;overflow-wrap:anywhere}
/* 17.11 Андрей «панель блок такой же короткий» — в «Акциях» строка панели высотой как прежний график заказов */
.akpn .pnq{margin-top:10px;padding:7px 10px 8px;border-radius:12px;background:var(--fill2);box-shadow:none}

.akpn .pnql{font-size:10.5px;letter-spacing:.03em}
.akpn .pnqs button{font-size:11.5px;padding:4px 8px}
.akpn .pnqd{font-size:10.5px}
.akpn .pnqv{margin-top:5px;gap:6px}
.akpn .pnqv small{font-size:10.5px;margin-bottom:0}
.akpn .pnqv b{font-size:15px}

/* 17.11 блок «Заказы | Выкупы» как на главной приложения ВБ (d_zch.js) */
.zch{margin-bottom:10px}
.zch .zdt{font-size:13px;margin-top:2px}
.zch .zbig{display:flex;gap:22px;flex-wrap:wrap;margin:4px 0 2px;min-height:57px}   /* 18.11: место под плашку сравнения есть всегда — без неё блок не сжимается */
.zch .zbig>div{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.zch .zbig b{font-size:26px;font-weight:700;line-height:1.1}
.zch .zpl{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600}
.zch .zpl.dn{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.zch .zpl.up{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.zch .zcm{font-size:11px;line-height:15px;min-height:15px;margin-bottom:6px}
.zch .zwr{position:relative;display:flex;gap:6px}

.zch .zb{height:140px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px dashed rgba(127,127,127,.35);background:linear-gradient(to top,transparent calc(50% - .5px),rgba(127,127,127,.18) 50%,transparent calc(50% + .5px))}
.zch .zb i{display:block;width:13px;border-radius:3px 3px 0 0}
.zch .zb i.g{background:var(--bar,#555);opacity:.8}

.zch .zc.sel span{opacity:1;font-weight:700}
.zch .zc.sel .zb{background-color:color-mix(in srgb,var(--acc) 9%,transparent);border-radius:6px 6px 0 0}

.zch .zy{position:absolute;right:0;transform:translateY(50%);font-size:11px;opacity:.7}
.zch .zrd{font-size:12px;line-height:17px;margin:8px 0 2px;min-height:34px}   /* 18.11 Андрей «при смене день/неделя окно меняет размер»: место под 2 строки — у «Недели» подпись длиннее и переносится */
.zch .zft{margin:8px 0 0;align-items:center;justify-content:space-between}
.zch .zft .muted{font-size:12px}

/* 18.11 «Лента заказов» как в приложении ВБ (d_zch.js zltBlock) */
.zlt{margin-bottom:10px}
.zlt .zlh{justify-content:space-between;align-items:center;margin-bottom:8px}
.zlt .zlh b{font-size:20px}
.zlt .zlseg{overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.zlt .zlseg::-webkit-scrollbar{display:none}

.zlt .zlsc{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.zlt .zlsc::-webkit-scrollbar{display:none}
.zlt .zlc{flex:0 0 86%;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px}

.zsg{position:relative;isolation:isolate}
.zsg>.zth{position:absolute;top:2px;bottom:2px;left:0;border-radius:9px;background:var(--thumb);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);z-index:-1;transition:transform .34s cubic-bezier(.32,.72,0,1),width .34s cubic-bezier(.32,.72,0,1);pointer-events:none}
.zsg>button,.zsg>button[aria-pressed="true"]{background:transparent!important;box-shadow:none!important;transition:color .25s}
.zch .zout,.zlt .zout{opacity:0;transform:translateY(3px);transition:opacity .13s ease,transform .13s ease}
.zch .zin,.zlt .zin{opacity:0;transform:translateY(-3px)}
.zch .zdt,.zch .zbig,.zch .zcm,.zch .zwr,.zch .zrd,.zlt .zlbody{transition:opacity .26s cubic-bezier(.32,.72,0,1),transform .26s cubic-bezier(.32,.72,0,1)}
@media (prefers-reduced-motion:reduce){.zsg>.zth{transition:none}}
.zch .zb i{transform-origin:50% 100%;transition:transform .38s cubic-bezier(.32,.72,0,1)}
.zch .zwr.zin .zb i{transform:scaleY(.35)}
@media (prefers-reduced-motion:reduce){.zch .zb i{transition:none}}

/* 18.11 Андрей «обновляет дёргано»: «потянуть — обновить» — старая страница гаснет, новая проявляется; столбики при этом не растут заново */
body.ptrout #view{opacity:.35;transition:opacity .16s ease}
#view.ptrin{animation:ptrIn .4s cubic-bezier(.32,.72,0,1) both}
#view.ptrin .zch *{animation:none!important;transition:none!important}
@keyframes ptrIn{from{opacity:.55}to{opacity:1}}   /* 18.11: обновление на месте — без гашения в пустоту */
@media (prefers-reduced-motion:reduce){#view.ptrin{animation:none}body.ptrout #view{transition:none}}

/* 18.11 плитки наших сервисов и баланс продавца (d_zch.js zsvBlock) — как на главной приложения ВБ */
.zsv{margin:0 0 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.zsv::-webkit-scrollbar{display:none}
.zsvr{display:flex;gap:8px;padding:0;width:max-content;min-width:100%;box-sizing:border-box}
.zsvt{flex:1 0 72px;display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:inherit}
.zsvi{display:flex;align-items:center;justify-content:center;width:100%;height:62px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.zsvi svg{width:30px;height:30px}
.zsvt b{font-size:12.5px;font-weight:500;color:var(--ink2,inherit);white-space:nowrap}
.zbal{margin-bottom:10px}
.zbal .zbr{display:flex;align-items:center;gap:10px}
.zbal .zbs{font-size:28px;letter-spacing:-.02em}
.zbal .zeye{border:0;background:none;color:inherit;padding:4px;width:34px;height:34px;cursor:pointer}
.zbal .zeye svg{width:24px;height:24px}
.zbal .zeye .x{display:none}
.zbal.hid .zeye .x{display:inline}

.zbal.hid .zbv{display:none}
.zbal.hid .zbm{display:inline}
.zbal .zbw{margin-top:4px;font-size:15px}
.zbal .zbft{margin-top:8px;font-size:12px}

/* 18.11 Андрей «сами принципы другие может»: главное время перехода — расчёт раскладки всего длинного списка. Как в приложении: телефон считает только строки на экране и рядом */
@supports (content-visibility:auto){#view .list>*{content-visibility:auto;contain-intrinsic-size:auto var(--lh,240px)}.view[data-v=tov]{--lh:256px}.view[data-v=ak]{--lh:560px}}

/* 22.11 «ВБ | Озон | Маркет» справа от «Заказы | Выкупы» (d_zch.js); у Озона и Маркета «Выкупы» скрыты */
.zch .zhd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* 22.11 Андрей (скрин, «не очень то что они прыгают туда сюда»): площадки — всегда своей строкой сверху на всю ширину, кнопки поровну;
   «Выкупы» у Озона/Маркета/«Все» не прячется, а бледнеет — ширина «Заказы | Выкупы» не меняется, ничего не переезжает */
.zch .zhd [data-seg="zmp"]{order:-1;flex:1 1 100%;display:flex;width:100%;max-width:480px}
.zch .zhd [data-seg="zmp"]>button{flex:1 1 0;min-width:0;justify-content:center;padding-left:4px;padding-right:4px;white-space:nowrap}
.zch.zmpn [data-seg="zcm"] button[data-v="v"]{opacity:.35;pointer-events:none}

/* 22.11 нажатый столбик — остальные гаснут (как в ВБ Партнёрах) */
.zch .zrow.pick .zc:not(.pk) .zb i{opacity:.32}.zch .zrow.pick .zc:not(.pk) .zb i.g{opacity:.25}.zch .zb i{transition:transform .38s cubic-bezier(.32,.72,0,1),opacity .2s}

<body>

const prerender=()=>{   // пока выбирают — соседние сервисы уже открываются в фоне (Chrome), переход мгновенный
  if(pre)return;pre=true;
  try{if(!(HTMLScriptElement.supports&&HTMLScriptElement.supports('speculationrules')))return;
    const s=document.createElement('script');s.type='speculationrules';

const open=on=>{m.classList.toggle('on',on);m.classList.remove('gone');b.setAttribute('aria-expanded',on?'true':'false');if(on)prerender()};
b.addEventListener('pointerdown',prerender,{passive:true});
b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();open(!m.classList.contains('on'))});

/* плавная пересортировка: до перерисовки запомнить, где была каждая строка таблицы id, после — довести строки с прежнего места на новое */
function tblFlip(id,fn){const key=r=>r.dataset.nm||r.dataset.nm2||r.dataset.id||'',pos=new Map();
  document.querySelectorAll(`[data-tbl="${id}"] tbody tr`).forEach((r,i)=>{const k=key(r);if(k&&i<400)pos.set(r.closest('[data-tbl]').dataset.grp+'|'+k,r.getBoundingClientRect().top)});
  fn();if(!pos.size||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll(`[data-tbl="${id}"] tbody tr`).forEach(r=>{const p=pos.get(r.closest('[data-tbl]').dataset.grp+'|'+key(r));if(p==null)return;const d=p-r.getBoundingClientRect().top;if(Math.abs(d)<1)return;
    r.style.transition='none';r.style.transform=`translateY(${d}px)`;r.getBoundingClientRect();r.style.transition='transform .32s cubic-bezier(.2,.8,.2,1)';r.style.transform='';
    setTimeout(()=>{r.style.transition=''},360)})}

/* ───────── 14.11 Андрей 06:40: «помимо представленности статистика в гистограммах надо ещё показать табличного типа как в Марпле, тоже там важны показатели —
   показы, клики, СПМ, СПС, ДРР РК, ДРР, затраты, заказы кол-во, корзины, и также выбор фильтров и прочее как делал» — таблица по дням под гистограммой:
   первая строка «За период» (итог), дальше день за днём, свежий сверху. Свои столбцы и сортировка — те же, что у общих таблиц (TBL, tblSt, openCols),
   запоминаются отдельно для каждого места: dayTbl(kind, ix, get) — kind 'kab' главная, 'skl' склейка, 'tov' лист товара, 'rk' лист кампании;
   ix — дни, как у гистограммы; get(i) → {v показы, c клики, a корзины, q заказы РК шт, s траты ₽, sp сумма заказов РК ₽, or заказы товара ₽, oq заказы товара шт},
   поля может не быть — тогда «—» ───────── */
const DFL=['v','c','a','q','s','sp','or','oq'];
function dRow(i,g){g=g||{};const x={i};for(const k of DFL)x[k]=typeof g[k]==='number'&&isFinite(g[k])?g[k]:null;
  const dv=(a,b,m)=>a==null||!b?null:m*a/b,dr=(s,o)=>s==null||o==null?null:o?100*s/o:(s>=1?Infinity:null);   // траты есть, заказов 0 — «нет зак.»
  x.ctr=dv(x.c,x.v,100);x.cpc=dv(x.s,x.c,1);x.cpm=dv(x.s,x.v,1000);x.drrk=dr(x.s,x.sp);x.drr=dr(x.s,x.or);return x}
const dNum=(k,l,o)=>Object.assign({k,l,v:x=>x[k],h:x=>x[k]==null?'—':f0(x[k])},o||{});

   двумя строками под ней (нажатие по строке); поиск — статистика кластеров, рекомендации — остальное, по расчёту */
function dayTbl(kind,ix,get,spl){const id='d_'+kind;if(!TBL[id])TBL[id]={sort:['d',-1],cols:DCOLS};
  const R=ix.map(i=>dRow(i,get(i))),tt={};
  for(const k of DFL){let s=null;for(const r of R)if(r[k]!=null)s=(s||0)+r[k];tt[k]=s}
  const tot=Object.assign(dRow(-1,tt),{tot:1,lab:ix.length?dm(D.days[ix[0]])+'–'+dm(D.days[ix[ix.length-1]]):''});
  let rows=[tot].concat(tblSort(id,R));
  /* 17.11 Андрей «зоны показа в каждой рк … как в марпла при нажатии на каждую дату»: spl(i) → {p: поиск, k: каталог, r: рекомендации} — зоны ВБ (zony.py);
     у spl.real нет — прежний расчёт (поиск по кластерам, рекомендации — остальное) */
  const ZL=[['p','поиск'],['k','каталог'],['r','рекомендации']];
  if(spl){const ex=S.dtx||(S.dtx=new Set()),ss=L=>{const o={};for(const s of L)if(s)for(const w in s){o[w]=o[w]||{};for(const k in s[w])if(s[w][k]!=null)o[w][k]=(o[w][k]||0)+s[w][k]}return o};
    rows=rows.flatMap(x=>{const s=x.tot?ss(ix.map(spl)):spl(x.i);if(!s||!ZL.some(([w])=>s[w]))return [x];const k=kind+'|'+(x.tot?-1:x.i);x.ex=k;x.op=ex.has(k);

    {const tn=FRZ.sklTop&&FRZ.sklTop.get(g.imt),tr=tn&&g.L.find(x=>x.t.nm===tn);g.top=tr?tr.t:g.L.reduce((m,x)=>x.a.or>m.a.or?x:m,g.L[0]).t}if(!fz)g.L=tblSort('skc',g.L);   // 17.11: внутри склейки — своя сортировка (шапка таблицы), фото склейки — товар с наибольшими заказами; 25.11 Андрей «картинка уходит»: при заморозке — прежний лидер на фото, иначе по заказам срока

/* ── перенос из Марплы (13.11 Андрей «нам нужно отказаться от их подписки»): её лимит дня и график → свои, тем же значением.
   Марпла остаётся включённой: пока её настройки не сняты, оба делают одно и то же. Сторож сверяет каждую строку с Марплой «сейчас». ── */
function marPer(){if(S.kab!=='kab1'||!K)return [];
  return K.rk.filter(r=>r.mar&&(r.st===9||r.st===11)).map(r=>{const m=r.mar,ol=ourLim(r),og=ourGr(r);
    const L=m.lim&&m.lim.max>=50&&!(ol&&ol.on&&Math.abs(ol.sum-m.lim.max)<0.5)?m.lim.max:0;
    const H=m.gr&&m.gr.w&&m.gr.w.length===7&&!(og&&og.on&&og.h&&og.h.join()===m.gr.w.join())?m.gr.w:null;
    return {r,L,H,ol,og}}).filter(x=>x.L||x.H).sort((a,b)=>(b.r.st===9)-(a.r.st===9)||(!!b.H)-(!!a.H)||String(a.r.name).localeCompare(b.r.name,'ru'))}
const grHex=w=>w.map(s=>parseInt(s,2).toString(16).padStart(6,'0')).join('');
function actPerenos(){if(!need())return;const L=marPer();if(!L.length){toast('Переносить нечего');return}
  const sel=new Set(L.map(x=>x.r.id));
  sheet(()=>{const n=L.filter(x=>sel.has(x.r.id)).length;
    const row=x=>{const r=x.r,m=r.mar,on=sel.has(r.id);
      const l=x.L?`<div class="s2 num" style="font-size:13.5px;margin-top:3px">Лимит дня: Марпла ${f0(x.L)} ₽ → свой ${f0(x.L)} ₽${x.ol&&x.ol.on?' (свой был '+f0(x.ol.sum)+' ₽)':''}</div>`:'';
      const g=x.H?`<div class="s2" style="font-size:13.5px;margin-top:3px">График «${esc(m.gr.name)}», ${grHours({h:x.H})} ч в неделю → свой, те же часы${x.og&&x.og.on?' (свой был '+grHours(x.og)+' ч в неделю)':''}</div>${grStrip(x.H)}`:'';
      return `<div class="opt" style="align-items:flex-start"><div style="min-width:0"><div style="font-weight:600">${esc(r.name)}</div><div class="muted" style="font-size:12.5px">${r.st===9?'идёт':'на паузе'}</div>${l}${g}</div><button class="sw" type="button" role="switch" data-per="${r.id}" aria-checked="${on}"></button></div>`};
    return {t:'Из Марплы к себе',s:'Каб 1 · '+L.length+' '+(L.length%10===1&&L.length%100!==11?'кампания':'кампаний'),h:`<div class="note pern"><b>Зачем.</b> Лимит трат на день и включение кампаний по часам сейчас делает Марпла. Закончится её подписка — лимиты и графики пропадут: кампании пойдут круглые сутки и без дневного потолка. Перенос заводит такие же лимиты и графики у нас.
      <b>Что произойдёт после кнопки «Перенести».</b> У каждой включённой ниже кампании в нашем сервисе появятся свой лимит дня и свой график — с теми же суммами и теми же часами, что стоят в Марпле. Следит за ними наш сервис, раз в 10 минут: траты дошли до лимита — пауза до полуночи; час не из графика — пауза; час показа — запуск.
      <b>Чего не произойдёт.</b> В Марпле ничего не выключится и не поменяется — её лимиты и графики продолжат работать, как сейчас. Ставки, бюджеты и сами кампании не трогаются, деньги не списываются. Выключить лимиты и графики в Марпле — отдельный шаг, только по вашему слову.
      <b>Как вернуть.</b> Свой лимит и свой график снимаются в листе кампании («Лимит дня», «График показа»).</div>
      <div class="note w pern"><b>Чем это может помешать.</b> Кампанию с перенесённым графиком наш сервис в час показа включит сам, даже если вы поставили её на паузу руками, — точно так же сейчас делает Марпла. Нужно, чтобы кампания стояла, — выключите её в списке ниже или снимите у неё график.
      Пока работают оба, паузу и запуск по часам делает тот, кто успел первым, — Марпла или наш сервис; в журнале правок это видно под кнопкой «Автоматика». Двойных трат от этого нет.</div>
      <div class="muted" style="font-size:12.5px;margin:10px 2px 2px">Перед записью сервис сверяет каждую строку с Марплой: если там что-то поменяли, пока лист был открыт, эту строку он пропустит. Выключатель справа — переносить эту кампанию или нет.</div>
      ${L.map(row).join('')}<div id="perr" class="bad" style="font-size:13px;min-height:18px;margin-top:8px"></div>${RUNBOX('Перенести · '+n)}`,
      after:()=>{document.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{const id=+b.dataset.per;if(sel.has(id))sel.delete(id);else sel.add(id);redraw()});
        $('#okBtn').disabled=!n;$('#okBtn').onclick=()=>perenosRun(L.filter(x=>sel.has(x.r.id)))}}},true)}
async function perenosRun(L){const box=$('#runbox');if(!box)return;const it=L.map(x=>{const o={c:x.r.id,n:+Object.keys(x.r.nm||{})[0]||0};if(x.L)o.l=x.L;if(x.H)o.h=grHex(x.H);return o});
  const parts=[];for(let i=0;i<it.length;i+=30)parts.push(it.slice(i,i+30));   // ntfy пропускает ~4 КБ — шлём частями
  const ok=[],bad=[];listen();
  for(let i=0;i<parts.length;i++){box.innerHTML=`<div class="prog"><span class="sp"></span><span>Часть ${i+1} из ${parts.length}: выполняется…</span></div>`;
    try{const cmd={k:'perenos',items:parts[i]},id=await send(cmd);
      const r=await new Promise((res,rej)=>{const pl=setInterval(pollRes,3500),to=setTimeout(()=>{clearInterval(pl);delete WAIT[id];rej(new Error('сервис не ответил за 3 минуты'))},180000);
        WAIT[id]=m=>{if(m.st==='work')return;clearTimeout(to);clearInterval(pl);delete WAIT[id];res(m)}});
      (r.st==='done'?ok:bad).push(r.msg||'')}catch(e){bad.push(e.message)}}
  box.innerHTML=(ok.length?`<div class="note g">✓ ${ok.map(esc).join('<br>')}</div>`:'')+(bad.length?`<div class="note b">${bad.map(esc).join('<br>')}</div>`:'')+
    '<div class="acts" style="grid-template-columns:1fr"><button class="btn gray press" type="button" id="perOk">Закрыть</button></div>';
  if(ok.length)toast('Перенесено');
  $('#perOk').onclick=()=>{closeAll();if(ok.length)reload().catch(()=>{})}}   // данные перечитываем после закрытия: ответ сторожа без подробностей (длинный)

/* ── товар: порядок как на листе маркетолога — цена и остатки, ДРР вчера и за период, дни, что меняли, кампании, места, скидка ВБ, цена, акции ── */
function openProd(nm,ctx){if(!TOV[nm])return;const i=ctx?ctx.indexOf(+nm):-1;
  /* 14.11 Андрей: «если находишся в рк или товаре нельзя обновить страницу» — лист запоминается (shMark пишет сосед в e_sheets.js) */
  if(typeof shMark==='function')shMark('tov',nm);

/* 14.11 Андрей: «кнопку открывается или просто блок… гистограмма 2 недели остатки на фбо динамика и фбс также, может лучше ниже блок открыв» —
   нажатие на остатки в листе товара раскрывает под ними две гистограммы за 14 дней: склады ВБ и свой склад (отчёт ВБ «История остатков по дням»;
   сегодня — свежий остаток, как в плашках) */
function ostHist(t){const od=K.oh_d||[],ix=[],at={};od.forEach((d,k)=>{const i=D.days.indexOf(d);if(i>=0){ix.push(i);at[i]=k}});if(!ix.length)return '';
  const v=(j,cur)=>i=>{const k=at[i];if(i===T&&cur!=null)return cur;return k==null?null:t.oh[j][k]};
  const one=(j,ttl,cur,col)=>{const f=v(j,cur),fs=ix.map(f).filter(x=>x!=null),a=fs[0],b=fs[fs.length-1],dd=b-a;
    return `<div class="hrw"><h3>${ttl}, шт</h3><span class="muted num" style="font-size:12.5px">${fs.length?`сейчас ${f0(b)} · за 2 недели ${dd>0?'▲ +'+f0(dd):dd<0?'▼ '+f0(dd):'без изменений'}`:''}</span></div><div class="sal1">`
      +chart({ix,h:96,val:f,col:i=>f(i)?col:'var(--bad,#e5484d)',top:i=>{const x=f(i);return x==null?'':x>=1e4?(x/1e3).toFixed(0)+'к':x>=1e3?(x/1e3).toFixed(1).replace('.0','')+'к':x},
        read:i=>`<b>${dlab(i)}${i===T?' (сейчас)':''}</b> · ${ttl==='Склады ВБ'?'склады ВБ':'свой склад'}: <b>${f0(f(i)||0)} шт</b>`})+'</div>'};
