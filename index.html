/* Склейки: закреплённая шапка с выбором магазина, холст разделов, листы снизу. Токены: страница (fg) и панели (ink) раздельно — для игровой темы. */
:root{
  --bg:#f2f4f9; --fg:#0d1430; --fg2:#4b5476; --fg3:#8c93ad;
  --solid:#ffffff; --ink:#0d1430; --ink2:#4b5476; --ink3:#8c93ad; --sunk:#eef1f7; --line:rgba(16,26,58,.10); --sheet:#f2f4f9;
  --hdr:rgba(246,248,252,.88); --hdr-fg:#0d1430;
  --accent:#2445dc; --accent-ink:#ffffff; --accent-soft:rgba(36,69,220,.10);
  --good:#0f9d68; --warn:#d9820a; --bad:#de3550; --good-soft:rgba(15,157,104,.12); --warn-soft:rgba(217,130,10,.13); --bad-soft:rgba(222,53,80,.11);
  --r1:#5a54f2; --r2:#0db2a4; --r3:#ff9500; --r4:#ff3b6b;
  --c-wb1:#c41fd6; --c-wb2:#7d3fe0; --c-oz:#1f63ff; --c-ym:#f0a500;
  --vl:.64; --vc:.16; --glow1:rgba(36,69,220,.10); --glow2:rgba(13,178,164,.08);
  --bw:1px; --shadow:0 1px 2px rgba(13,20,48,.05),0 10px 30px -8px rgba(13,20,48,.12); --shadow-lg:0 30px 80px -20px rgba(13,20,48,.35);
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-num:var(--f-display);
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.45,.64,1); --rad:22px; --hh:112px;
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hh) + 12px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100vh}
html.morph body,html.morph body *{transition:background-color .55s var(--ease),color .55s var(--ease),border-color .55s var(--ease)!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.mono{font-family:"Martian Mono",ui-monospace,monospace;font-size:.78em}
.bgfx{position:fixed;inset:-20vmax;z-index:-3;pointer-events:none;background:radial-gradient(40vmax 34vmax at 18% 12%,var(--glow1),transparent 70%),radial-gradient(44vmax 36vmax at 88% 78%,var(--glow2),transparent 70%)}
:root[data-skin="aurora"] .bgfx{animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{50%{transform:translate3d(4vmax,-3vmax,0) rotate(8deg)}100%{transform:translate3d(-3vmax,2vmax,0) rotate(-6deg)}}

/* ---------- шапка: закреплена всегда ---------- */
.hdr{position:fixed;z-index:40;top:0;left:0;right:0;padding-top:env(safe-area-inset-top,0px);background:var(--hdr);color:var(--hdr-fg);backdrop-filter:saturate(1.7) blur(20px);-webkit-backdrop-filter:saturate(1.7) blur(20px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:1440px;margin:0 auto}
.hdr-2{padding-top:0;padding-bottom:10px}
.tnav{display:none;gap:4px;margin-left:10px}
.tnav button{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:12px;font-weight:600;font-size:14px;opacity:.75;transition:background .25s,opacity .25s,transform .3s var(--spring)}
.tnav button svg{width:18px;height:18px}
.tnav button:hover{opacity:1;background:var(--accent-soft)}
.tnav button.on{opacity:1;background:var(--solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tnav .cnt{font-size:11.5px;opacity:.7}
.hsp{flex:1}
.mini{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.trial{position:relative;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:12px;font-weight:700;font-size:14px;color:#fff;overflow:hidden;background:#3a3f55;flex:none;transition:transform .3s var(--spring)}
.trial::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,#ff8a00,#ff2e7e 55%,#7b3cff);transform-origin:right;transform:scaleX(var(--tg,1));transition:transform .6s var(--ease)}
.trial>*{position:relative}
.trial:active{transform:scale(.94)}
.trial svg{width:16px;height:16px}
/* выбор сервиса — общий с Юниткой и Конкурентами (servisy\svc.py): название «Склейки» = кнопка, под ней список сервисов. Раздел на телефоне виден в нижней панели */
:root{--svc-card:var(--solid);--svc-ink:var(--ink);--svc-ink2:var(--ink2);--svc-ink3:var(--ink3);--svc-line:var(--line);--svc-hover:var(--sunk);--svc-acc:var(--accent);--svc-acc-soft:var(--accent-soft)}
:root[data-skin="aurora"],:root[data-skin="space"]{--svc-card:var(--sheet)}
/*SVC:CSS*/
/* выбор сервиса (servisy\svc.py — править там): кнопка «значок + название ⌄», под ней список трёх сервисов */
.svc{position:relative;flex:none;min-width:0}
/* шрифт задаю обёртке, кнопка его наследует (button{font:inherit} страниц) — так темы Юнитки (.brand) и Склеек (.brand b) по-прежнему перекрашивают название */
:where(.svc){font:700 18px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em}
.svc-btn{display:inline-flex;align-items:center;gap:9px;height:40px;margin:0 0 0 -6px;padding:0 9px 0 5px;border:0;border-radius:13px;background:transparent;color:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;transition:background-color .2s ease,transform .4s cubic-bezier(.34,1.56,.64,1)}
.svc-btn .svc-nm{font:inherit;letter-spacing:inherit}
/* подложка — в цвет текста шапки (в игровых темах шапка цветная, а название белое) */
@media (hover:hover){.svc-btn:hover{background:var(--svc-hover);background:color-mix(in srgb,currentColor 13%,transparent)}}
.svc-btn:active{transform:scale(.95);transition-duration:.12s}
.svc-btn[aria-expanded="true"]{background:var(--svc-hover);background:color-mix(in srgb,currentColor 13%,transparent)}
.svc-btn .svc-ic{width:30px;height:30px;border-radius:9px}
.svc-chev{width:16px;height:16px;flex:none;opacity:.55;margin-left:-3px;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.svc-btn[aria-expanded="true"] .svc-chev{transform:rotate(180deg)}
/* значок: свой цвет у сервиса, блик сверху, цветное свечение; при наведении и открытии — лёгкий наклон */
.svc-ic{display:grid;place-items:center;flex:none;position:relative;overflow:hidden;color:#fff;font-style:normal;line-height:1;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),inset 0 -2px 4px rgba(0,0,0,.14),0 3px 9px -2px var(--svc-glow,rgba(0,0,0,.3));
  transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.svc-ic::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 75% at 28% 6%,rgba(255,255,255,.55),rgba(255,255,255,0) 58%)}
.svc-ic svg{position:relative;width:66%;height:66%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.svc-ic.u{--svc-glow:rgba(16,185,129,.55);background:linear-gradient(145deg,#4ff0b4 0%,#10b981 48%,#0a7d70 100%)}
.svc-ic.s{--svc-glow:rgba(168,85,247,.55);background:linear-gradient(145deg,#d8a4ff 0%,#a855f7 46%,#e0338f 100%)}
.svc-ic.k{--svc-glow:rgba(255,112,48,.55);background:linear-gradient(145deg,#ffd166 0%,#ff8a2b 46%,#ee3a52 100%)}
@media (hover:hover){.svc-btn:hover .svc-ic,.svc-it:hover .svc-ic{transform:rotate(-8deg) scale(1.06)}}
.svc-btn[aria-expanded="true"] .svc-ic{transform:rotate(-8deg) scale(1.06)}
.svc-menu.on .svc-it .svc-ic{animation:svc-ico .6s cubic-bezier(.34,1.56,.64,1) both}
.svc-menu.on .svc-it:nth-child(3) .svc-ic{animation-delay:.05s}.svc-menu.on .svc-it:nth-child(4) .svc-ic{animation-delay:.1s}
@keyframes svc-ico{from{transform:scale(.6) rotate(-20deg);opacity:0}}
.svc-menu{position:absolute;z-index:300;top:calc(100% + 8px);left:-6px;width:min(318px,calc(100vw - 20px));padding:6px;border-radius:20px;
  background:var(--svc-card);color:var(--svc-ink);box-shadow:0 0 0 .5px var(--svc-line),0 18px 50px -12px rgba(0,0,0,.34),0 4px 12px -4px rgba(0,0,0,.12);
  transform-origin:24px -6px;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.92);pointer-events:none;
  transition:opacity .16s ease,transform .26s cubic-bezier(.4,0,.6,1),visibility 0s linear .26s}
.svc-menu.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .2s ease,transform .5s cubic-bezier(.22,1.3,.36,1),visibility 0s}
.svc-menu.gone{transition:none!important;opacity:0!important;visibility:hidden!important}
.svc-cap{padding:9px 12px 6px;font:700 11px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--svc-ink3)}
.svc-it{position:relative;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;color:inherit;text-decoration:none;
  -webkit-tap-highlight-color:transparent;transition:background-color .2s ease,transform .35s cubic-bezier(.34,1.56,.64,1)}
.svc-it .svc-ic{width:42px;height:42px;border-radius:12px}
.svc-tx{min-width:0;flex:1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.svc-tx b{display:block;font-size:15.5px;font-weight:650;line-height:1.2;letter-spacing:-.005em}
.svc-tx small{display:block;margin-top:2px;font-size:12.5px;line-height:1.3;color:var(--svc-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.svc-it:hover{background:var(--svc-hover)}}
.svc-it:active{transform:scale(.97);background:var(--svc-hover);transition-duration:.1s}
.svc-it[aria-current]{background:var(--svc-acc-soft)}
.svc-it[aria-current] b{color:var(--svc-acc)}
.svc-ok{width:20px;height:20px;flex:none;color:var(--svc-acc)}
.svc-sp{width:18px;height:18px;flex:none;border-radius:50%;border:2.2px solid var(--svc-line);border-top-color:var(--svc-acc);opacity:0;transition:opacity .2s}
.svc-it.go .svc-sp{opacity:1;animation:svc-spin .7s linear infinite}
@keyframes svc-spin{to{transform:rotate(360deg)}}
.svc-menu.on .svc-it{animation:svc-row .5s cubic-bezier(.22,1.2,.36,1) both}
.svc-menu.on .svc-it:nth-child(3){animation-delay:.035s}.svc-menu.on .svc-it:nth-child(4){animation-delay:.07s}
@keyframes svc-row{from{opacity:0;transform:translateY(-6px)}}
/* выбор темы — как в Юнитке (Андрей 29.10: «как в юнитке выбор везде тем формат»): кнопка «значок + название темы», под ней список
   с кружками и группами «Весёлые» / «Спокойные». Юнитка рисует свой (он образец), Склейки и Конкуренты — svcPicker() отсюда */
.svt{position:relative;flex:none}
.svt-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border:1px solid var(--svc-line);border-radius:10px;
  background:var(--svc-card);color:var(--svc-ink2);font:600 13.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;white-space:nowrap;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.svt-btn:active{transform:scale(.94)}
.svt-btn svg{width:18px;height:18px;flex:none;display:block}
@media (max-width:860px){.svt-btn span{display:none}}
.svt-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:300;min-width:220px;max-height:calc(100vh - 100px);overflow:auto;padding:6px;border-radius:12px;
  background:var(--svc-card);color:var(--svc-ink);border:1px solid var(--svc-line);box-shadow:0 8px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;
  font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transform-origin:top right;animation:svt-in .24s cubic-bezier(.22,1,.36,1)}
.svt-menu[hidden]{display:none}
@keyframes svt-in{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.svt-menu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;font:inherit;display:flex;align-items:center;gap:10px;color:inherit;cursor:pointer;white-space:nowrap}
@media (hover:hover){.svt-menu button:hover{background:var(--svc-hover)}}
.svt-menu button[aria-checked="true"]{background:var(--svc-acc-soft);color:var(--svc-acc)}
.svt-menu .sw{width:20px;height:20px;flex:none;display:block}
.svt-menu .tgrp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--svc-ink3);padding:8px 10px 2px;border-top:1px solid var(--svc-line);margin-top:4px}
/* переход между сервисами: шапка и кнопка сервиса остаются на месте, остальное мягко проявляется */
@view-transition{navigation:auto}
.svc-hdr{view-transition-name:svc-hdr}
#svcBtn{view-transition-name:svc-btn}
::view-transition-group(svc-hdr),::view-transition-group(svc-btn){animation-duration:.42s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
::view-transition-group(svc-hdr){overflow:clip}
::view-transition-old(svc-hdr),::view-transition-new(svc-hdr){animation-duration:.3s}
::view-transition-old(svc-btn),::view-transition-new(svc-btn){animation-duration:.32s;width:auto;height:auto}   /* название не растягивается, просто сменяется */
::view-transition-old(root){animation:svc-out .2s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:svc-in .42s cubic-bezier(.16,1,.3,1) both}
@keyframes svc-out{to{opacity:0}}
@keyframes svc-in{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){@keyframes svc-in{from{opacity:0}}}
/*/SVC:CSS*/

/* ---------- холст ---------- */
.main{padding:calc(var(--hh) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(160px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:1440px;margin:0 auto;min-width:0}

  content-visibility:auto;contain-intrinsic-size:auto 230px}
/* 28.10: въезжают только первые плитки — 60 плиток и ~340 полосок разом грузили телефон на секунды после входа в раздел */
.ggrid .gt:nth-child(n+11) .fp i{animation:none}
.gt .glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.35),transparent 55%);opacity:0;transition:opacity .3s}

@keyframes rise{from{opacity:0;transform:translateY(22px) rotateX(-12deg)}}
.fan{position:relative;height:132px}

.fan .f:nth-child(3){z-index:2;transform:translateX(18px) rotate(8deg) scale(.93)}
.fan .f:nth-child(4){z-index:1;transform:translateY(-6px) scale(.86)}
.gt:hover .fan .f:nth-child(2){transform:translateX(-30px) rotate(-15deg) scale(.93)}
.gt:hover .fan .f:nth-child(3){transform:translateX(30px) rotate(15deg) scale(.93)}
.crown{position:absolute;z-index:6;left:12px;top:2px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:linear-gradient(120deg,#ffcf3f,#ff9500);color:#3a2300;box-shadow:0 3px 10px -3px rgba(255,149,0,.7)}
.fan .n{position:absolute;z-index:5;right:4px;bottom:0;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--ink);color:var(--solid)}
.gt .body{display:flex;flex-direction:column;gap:7px;min-width:0}
.gt .hdr2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gt .ttl{font-weight:700;font-size:16.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gt .meta{font-size:13px;color:var(--ink2)}
.gt .lead{font-size:13px;color:var(--ink);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.warns{display:flex;flex-wrap:wrap;gap:6px}
.fp{display:flex;height:9px;border-radius:99px;overflow:hidden;gap:2px;background:var(--sunk)}
.fp i{display:block;height:100%;transform-origin:left;animation:fpin .9s var(--ease) both}
@keyframes fpin{from{transform:scaleX(0)}}
.fp-l{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink3)}

/* ---------- 3D-сцена перелива ---------- */
.story{padding:18px;display:grid;gap:12px;position:relative;overflow:hidden}
.story .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.story .hd .tt{font-weight:700;font-size:16px;margin-top:4px}
.st3{position:relative;height:360px;border-radius:18px;overflow:hidden;background:radial-gradient(120% 90% at 50% 100%,var(--accent-soft),transparent 70%),var(--sunk);touch-action:pan-y;cursor:grab;user-select:none}
.st3:active{cursor:grabbing}
.st3-cam{position:absolute;inset:0;perspective:1000px;perspective-origin:50% 20%}
.st3-world{position:absolute;left:50%;top:64%;width:600px;height:340px;margin:-170px 0 0 -300px;transform-style:preserve-3d;transform:scale(var(--sc,1)) rotateX(var(--rx,52deg)) rotateZ(var(--rz,0deg))}
.st3-floor{position:absolute;inset:0;border-radius:28px;background:repeating-linear-gradient(0deg,transparent 0 39px,var(--line) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,var(--line) 39px 40px);box-shadow:inset 0 0 80px var(--sunk)}
.st3-floor .fl{position:absolute;top:8px;font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.st3-floor .fl.l{left:30px}.st3-floor .fl.r{right:30px}
.st3-card{position:absolute;width:72px;transform-origin:50% 100%;transform-style:preserve-3d;transition:filter .3s,opacity .3s}
.st3-card .ph3{width:72px;height:92px;border-radius:12px;overflow:hidden;background:var(--solid);box-shadow:0 14px 26px -12px rgba(0,0,0,.6);border:2px solid var(--solid)}
.st3-card .ph3 img{width:100%;height:100%;object-fit:cover}
.st3-card .lb{margin-top:4px;padding:3px 6px;border-radius:8px;background:var(--solid);color:var(--ink);font-size:11px;font-weight:700;line-height:1.2;text-align:center;box-shadow:0 4px 10px -6px rgba(0,0,0,.4)}
.st3-card .lb b{display:block;font-size:14px}
.st3-cv{position:absolute;z-index:1;inset:0;width:100%;height:100%;pointer-events:none}
.st3-spin{position:absolute;inset:0;transform-style:preserve-3d}   /* медленно качается сама (анимация браузера, не код) */
.st3-cw,.st3-cb{transform-origin:50% 100%;transform-style:preserve-3d}
.st3.hl .st3-card{opacity:.4}.st3.hl .st3-card.on{opacity:1}
.st3-hint{position:absolute;right:12px;bottom:10px;font-size:11.5px;color:var(--ink3);pointer-events:none}
.say{font-size:15px;line-height:1.55}
.adv{display:grid;gap:8px;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:14px;line-height:1.55}
.adv>div:first-child{display:flex;justify-content:space-between;gap:8px;align-items:center}

/* ---------- лист ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,8,20,.42);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
html.sheet-open .scrim{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;margin:0 auto;max-width:1060px;height:calc(100% - 22px - env(safe-area-inset-top,0px));background:var(--sheet);color:var(--ink);border-radius:28px 28px 0 0;box-shadow:var(--shadow-lg);transform:translateY(105%);visibility:hidden;transition:transform .55s var(--ease),visibility 0s linear .55s;display:flex;flex-direction:column;overflow:hidden;border:var(--bw) solid var(--line);border-bottom:0}
html.sheet-open .sheet{transform:translateY(0);visibility:visible;transition:transform .55s var(--ease),visibility 0s}
.sheet.drag{transition:none}
.stop{flex:none;position:relative;display:flex;align-items:center;gap:12px;padding:18px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);touch-action:none;cursor:grab;background:var(--sheet)}
.stop .bar{position:absolute;left:50%;top:6px;width:40px;height:5px;margin-left:-20px;border-radius:99px;background:var(--ink3);opacity:.45}
.stop .who{min-width:0;flex:1}
.stop .who .k{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2)}
.stop .who .t{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.sheet .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink2);flex:none}
.sheet .x svg{width:16px;height:16px}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.sbody{padding-left:34px;padding-right:34px}.stop{padding-left:30px;padding-right:22px}}
.sheet .h2{color:var(--ink)}
.links{display:inline-flex;flex-wrap:wrap;gap:8px}
.lnk{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 7px;border-radius:11px;background:var(--solid);border:var(--bw) solid var(--line);font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;transition:transform .3s var(--spring)}
.lnk:hover{transform:translateY(-2px)} .lnk:active{transform:scale(.95)}
.lnk small{font-weight:600;color:var(--ink3)}
.car{position:relative;height:320px;perspective:1000px;perspective-origin:50% 40%;touch-action:pan-y;user-select:none;cursor:grab;overflow:hidden}
.car-ring{position:absolute;left:50%;top:16px;width:150px;height:230px;margin-left:-75px;transform-style:preserve-3d}
.cc{position:absolute;inset:0;border-radius:18px;background:var(--solid);border:var(--bw) solid var(--line);box-shadow:0 22px 40px -20px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column;transition:transform .7s var(--ease),opacity .5s,filter .5s;-webkit-box-reflect:below 8px linear-gradient(transparent 72%,rgba(255,255,255,.22));cursor:pointer}
.car.dragging .cc{transition:none}
.cc img,.cc .ph{width:100%;height:160px;object-fit:cover}
.cc .b{padding:8px 10px;display:grid;gap:3px}
.cc .b b{font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .b small{font-size:12px;color:var(--ink2)}
.cc .crown{left:8px;top:8px}
.car-nav{display:flex;justify-content:center;gap:10px;align-items:center;font-size:13px;color:var(--ink2)}
.car-nav button{width:34px;height:34px;border-radius:50%;background:var(--solid);border:var(--bw) solid var(--line);display:grid;place-items:center}
.car-nav button svg{width:16px;height:16px}
.car-cap{text-align:center;min-height:62px;font-size:14px;display:grid;gap:8px;justify-items:center}
.summary{font-size:15.5px;line-height:1.6;max-width:86ch}
.score-blk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;padding:20px 22px}
.score-blk .big{font-family:var(--f-num);font-weight:700;font-size:44px;letter-spacing:-.04em;line-height:1}
.mx{overflow-x:auto;border-radius:16px;border:var(--bw) solid var(--line);background:var(--solid)}
.mx table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;min-width:720px}
.mx th{position:sticky;top:0;text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);padding:10px 12px;background:var(--sunk);white-space:nowrap}
.mx td{padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--solid);z-index:1}
.mx th:first-child{background:var(--sunk)}
.mx .art{display:flex;align-items:center;gap:10px;text-align:left}
.mx .art img,.mx .art .ph{width:30px;height:40px;border-radius:7px;object-fit:cover}
.mx .art b{font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;display:block}
.mx tr.dup td,.mx tr.dup td:first-child{background:var(--bad-soft)}
.mx .links{flex-wrap:nowrap}
.xmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.xm{padding:14px 16px;display:grid;gap:8px}
.warnbox{display:grid;gap:10px;padding:16px 18px;border-radius:18px;background:var(--bad-soft);border:var(--bw) solid var(--line)}
.acc{border-radius:18px;background:var(--solid);border:var(--bw) solid var(--line);overflow:hidden}
.acc+.acc{margin-top:10px}
.acc>button{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;text-align:left}
.acc>button img,.acc>button .ph{width:42px;height:56px;border-radius:9px;object-fit:cover}
.acc .a{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .n{font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chev{width:18px;height:18px;color:var(--ink3);transition:transform .4s var(--spring);flex:none}
.open>button .chev,.open>.th .chev{transform:rotate(90deg)}
.in{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.open>.in{grid-template-rows:1fr}
.in>div{overflow:hidden;min-height:0}
.fxr{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px 12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line);font-size:14px}
.fxr .w{font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center;line-height:1.35}
.fxr .ch2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;grid-column:2;font-size:13.5px}
.fxr .now{color:var(--ink2)} .fxr .arr{color:var(--ink3)} .fxr .fix{font-weight:600}
.why{grid-column:2;display:grid;gap:6px;font-size:13.5px;line-height:1.5;color:var(--ink2);padding:10px 12px;border-radius:12px;background:var(--sunk)}
.why b{color:var(--ink);font-weight:700}
.why .gen{font-size:12px;color:var(--ink3)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:2px 7px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.tag.a{background:var(--good-soft);color:var(--good)} .tag.m{background:var(--sunk);color:var(--ink3)} .tag.t{background:linear-gradient(110deg,rgba(255,138,0,.2),rgba(123,60,255,.2));color:var(--ink)}
.tag.w{background:var(--warn-soft);color:var(--warn)} .tag.d{background:var(--good);color:#fff}
.k-cons{color:var(--r1)} .k-comp{color:var(--r2)} .k-comm{color:var(--r3)} .k-rep{color:var(--r4)}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--ink3);display:grid;place-items:center;transition:all .35s var(--spring);flex:none;background:var(--solid);cursor:pointer}
.ck svg{width:15px;height:15px;opacity:0;transform:scale(.3) rotate(-20deg);transition:all .4s var(--spring);color:var(--accent-ink)}
.ck.on{background:var(--accent);border-color:var(--accent)} .ck.on svg{opacity:1;transform:none}
.ck.done{background:var(--good);border-color:var(--good)} .ck.done svg{opacity:1;transform:none;color:#fff}
.ck.lock{opacity:.6;cursor:default}
.ck.pop{animation:tick .7s var(--spring)}
@keyframes tick{0%{transform:scale(.5)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.isdone .w{text-decoration:line-through;opacity:.6}

/* предложения аналитика и пересклейки */
.task{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px 12px;padding:14px 16px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .tt{font-weight:800;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.arts{display:flex;gap:6px;flex-wrap:wrap}
.arts span{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 2px;border-radius:9px;background:var(--sunk);font-size:12.5px;font-weight:600}
.arts img,.arts .ph{width:22px;height:29px;border-radius:5px;object-fit:cover;flex:none}
.task ol{margin:4px 0 0;padding-left:20px;display:grid;gap:3px;font-size:13.5px;color:var(--ink2)}
.task .body{grid-column:2;display:grid;gap:6px;font-size:14px;line-height:1.5}
.rg-act{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:7px;background:var(--accent);color:var(--accent-ink)}

/* что сделать */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:4px 0 22px;counter-reset:st}
.stp{padding:14px;border-radius:16px;background:var(--solid);color:var(--ink);border:var(--bw) solid var(--line);font-size:13.5px;line-height:1.4}
.stp b{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:4px}
.stp b::before{counter-increment:st;content:counter(st);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:12px;flex:none}
.stp span{color:var(--ink2)}
.chs{margin-top:24px}
.chs>h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:19px;font-weight:800}
.chs>h3 small{font-weight:600;color:var(--fg3);font-size:13px}
.ty{margin-top:10px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 130px}
.ty .th{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:14px 16px;cursor:pointer}
.ty .th:hover{background:var(--sunk)}
.ty .th .nm{font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ty .th .ds{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.45;max-width:92ch}
.ty.open .th .ds{display:none}
.ty .th .rt{display:flex;align-items:center;gap:10px}
.ty .th .cnt{font-family:var(--f-num);font-weight:700;font-size:22px}
.thumbs{display:flex;margin-top:8px}
.thumbs span{width:26px;height:34px;border-radius:6px;overflow:hidden;border:2px solid var(--solid);margin-right:-8px;background:var(--sunk)}
.thumbs span img{width:100%;height:100%;object-fit:cover}
.selall{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);padding:7px 11px;border-radius:10px;background:var(--sunk);cursor:pointer}
.prow{display:grid;grid-template-columns:30px 38px minmax(0,1fr) minmax(0,1.3fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:13.5px}
.prow img,.prow .ph{width:38px;height:50px;border-radius:8px;object-fit:cover}
.prow .a{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.prow .s{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .v{overflow-wrap:anywhere;line-height:1.4}
.prow .v .arr{color:var(--ink3);margin:0 4px}
.prow .v .fix{font-weight:600}
.prow .v .wy{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}
.prow .item{text-align:left;min-width:0;cursor:pointer}
.prow .item:hover .a{text-decoration:underline}
.prow.isdone{opacity:.55}
.more-rows{padding:10px 16px;border-top:1px solid var(--line);text-align:center}
.more-rows button{color:var(--accent);font-weight:700;font-size:14px}
@media (max-width:700px){.prow{grid-template-columns:30px 38px minmax(0,1fr)}.prow .v,.prow .st{grid-column:3}.steps{grid-template-columns:1fr 1fr}}

/* корзина и «Решить» */
.selbar{position:fixed;z-index:45;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,240%);visibility:hidden;width:min(760px,calc(100vw - 24px));display:flex;align-items:center;gap:10px;padding:10px 10px 10px 18px;border-radius:20px;background:var(--ink);color:var(--solid);box-shadow:var(--shadow-lg);transition:transform .55s var(--spring),visibility 0s linear .55s}

.selbar .c{flex:1;min-width:0;font-size:14px;line-height:1.3}
.selbar .c b{font-size:16px}
.selbar .c small{display:block;opacity:.7;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selbar .clr{padding:9px 10px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:.75}
.selbar .go{padding:11px 16px;border-radius:14px;font-weight:800;font-size:15px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px}
@media (min-width:980px){.selbar{bottom:24px}}
.cart-g{margin-top:14px}
.cart-h{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.cart-h img,.cart-h .ph{width:44px;height:58px;border-radius:9px;object-fit:cover}
.cart-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.cart-i .t{font-weight:800}
.cart-i .x2{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--ink2)}
.cart-i .x2 svg{width:13px;height:13px}
.cart-i .why{grid-column:1/-1}
.confirm{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--warn-soft);font-size:14.5px;line-height:1.5;margin-top:20px;cursor:pointer}
.stage{display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 14px;position:relative;padding-bottom:22px}
.stage::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.stage:last-child::before{display:none}
.stage .dot2{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink3);font-weight:800}
.stage.on .dot2{background:var(--accent);color:var(--accent-ink);animation:pulse 1.2s ease-in-out infinite}
.stage.ok .dot2{background:var(--good);color:#fff} .stage.bad .dot2{background:var(--bad);color:#fff}
.stage .tt{font-weight:700;padding-top:9px}
.stage .dd{grid-column:2;font-size:13.5px;color:var(--ink2)}
.rs-row{display:grid;grid-template-columns:30px 36px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}

.confetti{position:fixed;inset:0;z-index:90;pointer-events:none}

/* пересклейки */
.chain{display:flex;align-items:center;flex-wrap:wrap;row-gap:10px}
.chain .c{width:58px;height:77px;border-radius:12px;overflow:hidden;background:var(--sunk);box-shadow:0 4px 12px -6px rgba(0,0,0,.35);flex:none}

@keyframes stitch{to{background-position:9px 0}}
.mcard{padding:16px;display:grid;gap:12px}
.mcard .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* нижние вкладки */
.tabbar{position:fixed;z-index:42;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:var(--hdr);color:var(--hdr-fg);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px);border-top:1px solid var(--line)}
.tab{position:relative;display:grid;justify-items:center;gap:3px;padding:6px 0 4px;font-size:10.5px;font-weight:700;opacity:.6;transition:opacity .25s,transform .3s var(--spring)}
.tab svg{width:24px;height:24px}
.tab.on{opacity:1;color:var(--accent)}
.tab:active{transform:scale(.88)}
.tab .bdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;line-height:17px;font-weight:800}
@media (min-width:980px){.tnav{display:flex}.tabbar{display:none}.mini{display:none}.main{padding-bottom:110px}}

/* темы, тост, замок, тур */
.pop{position:fixed;z-index:70;top:calc(var(--hh) - 40px);right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 32px));padding:14px;border-radius:24px;background:var(--solid);color:var(--ink);border:var(--bw) solid var(--line);box-shadow:var(--shadow-lg);transform-origin:top right;transform:scale(.85);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .25s}
.pop.open{transform:none;opacity:1;pointer-events:auto}

.skins{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.skin{border-radius:16px;padding:9px;text-align:left;border:2px solid transparent;transition:transform .35s var(--spring),border-color .25s}
.skin:active{transform:scale(.95)}
.skin.on{border-color:var(--accent)}
.skin .pv{height:58px;border-radius:11px;display:flex;align-items:flex-end;justify-content:space-between;padding:7px 9px;font-size:21px;line-height:1;overflow:hidden;background-size:cover}

.toast{position:fixed;z-index:95;left:50%;bottom:calc(176px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--solid);font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);transition:transform .5s var(--spring),opacity .3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}

.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:var(--bg)}

/* загрузка — заготовки блоков под шапкой, а не отдельный экран со спиннером: при переходе из Юнитки и Конкурентов шапка уже на месте (28.10) */
.boot{position:fixed;inset:0;z-index:39;overflow:hidden;background:var(--bg);color:var(--fg2);transition:opacity .4s;
  padding:calc(var(--hh) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}

/* триал — как «Показать фишки» в Юнитке: затемнение ловит нажатия, страница под ним не нажимается */

.tour-tip{position:fixed;z-index:110;width:min(420px,calc(100vw - 24px));padding:18px 18px 14px;border-radius:20px;background:var(--solid);color:var(--ink);border:var(--bw) solid var(--line);box-shadow:var(--shadow-lg);transition:top .3s var(--ease),left .3s var(--ease)}

:root[data-skin="jim"] .panel,:root[data-skin="jim"] .gt,:root[data-skin="jim"] .acc,:root[data-skin="jim"] .stp,:root[data-skin="jim"] .mx{background-image:radial-gradient(rgba(27,11,46,.09) 1.2px,transparent 1.4px);background-size:9px 9px}
:root[data-skin="jim"] .gt:hover,:root[data-skin="jim"] .clk:hover{transform:rotate(-1deg) scale(1.02);box-shadow:8px 8px 0 #1b0b2e}
:root[data-skin="jim"] .btn,:root[data-skin="jim"] .pill.on,:root[data-skin="jim"] .selbar .go{border:3px solid #1b0b2e;box-shadow:3px 3px 0 #1b0b2e}

/* «Космос» (28.10, Андрей: «добавь в конкуренты и склейки космос») — как в Отклике / Юнитке: фон — глубокий космос (space-bg*.webp),
   мерцают звёзды и пролетают метеоры (#spDeco); панели — тёмное стекло; над разделами окошко #spCard — слайд-шоу аффирмаций (SP_AFF):
   стрелки / свайп / тап по краю / ← →, сами каждые 7 с, пауза, во весь экран; музыка space-music.mp3 с первого нажатия, звук — кнопка в шапке.
   Картинки и музыка — из Юнитки (Код\unitka\site\space-*), deploy.py кладёт их рядом со страницей. */
:root[data-skin="space"]{
  --bg:#060818; --fg:#eef0ff; --fg2:#b6bbe0; --fg3:#8a90ba; --solid:rgba(14,18,42,.74); --ink:#eef0ff; --ink2:#b6bbe0; --ink3:#8a90ba; --sunk:rgba(255,255,255,.06); --line:rgba(200,190,255,.13); --sheet:#0b0e26;
  --hdr:rgba(7,9,26,.9); --hdr-fg:#eef0ff; --accent:#a493ff; --accent-ink:#0b0a26; --accent-soft:rgba(164,147,255,.2);
  --good:#7fe0a6; --warn:#ffd27a; --bad:#ff8f9e; --good-soft:rgba(127,224,166,.13); --warn-soft:rgba(255,210,122,.13); --bad-soft:rgba(255,143,158,.14);
  --r1:#a493ff; --r2:#8fb4ff; --r3:#ffd27a; --r4:#ff8f9e; --vl:.76; --vc:.14; --glow1:transparent; --glow2:transparent;
  --shadow:0 0 0 1px rgba(200,190,255,.06) inset,0 18px 40px -12px rgba(0,0,10,.7); --shadow-lg:0 30px 90px -10px rgba(0,0,0,.85);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif; --f-body:"Manrope","Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --spbg:url("space-bg.webp"); --sph:url("space-hero.webp"); --sbh:clamp(270px,31vw,400px); color-scheme:dark}
:root[data-skin="space"] body{background:#060818}
:root[data-skin="space"] body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(180deg,rgba(6,8,24,.2),rgba(6,8,24,.5)),var(--spbg) center/cover}
:root[data-skin="space"] :is(.panel,.acc,.stp){backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
:root[data-skin="space"] .pop{background:#11152f}
:root[data-skin="space"] :is(.tipbox,.selbar,.toast){color:#0b0e26}
:root[data-skin="space"] .btn{background:linear-gradient(135deg,#c2b6ff,#806cff);color:#0b0a26}
:root[data-skin="space"] .brand b{font-weight:700;letter-spacing:.04em}
.skins .sgrp{grid-column:1/-1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:6px 4px 0}
#sndbtn .off,#sndbtn[aria-pressed="true"] .on{display:none}
#sndbtn[aria-pressed="true"] .off{display:block}
#spDeco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#spDeco .tw{position:absolute;width:var(--z);height:var(--z);border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(200,215,255,.85);opacity:.15;animation:sp-tw var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes sp-tw{0%,100%{opacity:.12;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}
#spDeco .met{position:absolute;left:0;top:0;width:190px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(214,206,255,.7) 70%,#fff);box-shadow:0 0 8px rgba(190,180,255,.7);opacity:0}
#spWrap{max-width:1440px;margin:0 auto;padding:calc(var(--hh) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#spWrap:empty{display:none}
#spWrap:not(:empty)+.main{padding-top:10px}
#spCard{position:relative;height:var(--sbh);margin:0 0 14px;border-radius:22px;overflow:hidden;isolation:isolate;background:#050716;outline:none;
  box-shadow:0 0 0 1px rgba(190,180,255,.3),0 0 42px rgba(120,100,255,.24),0 18px 50px rgba(0,0,0,.55);-webkit-user-select:none;user-select:none}
#spCard:focus-visible{box-shadow:0 0 0 2px #cfc6ff,0 0 42px rgba(120,100,255,.4)}
#spCard .spimg{position:absolute;inset:-7%;background:var(--sph) 50% 50%/cover;transition:transform 2.6s cubic-bezier(.2,.7,.2,1);will-change:transform}

const prerender=()=>{   // пока выбирают — соседние сервисы уже открываются в фоне (Chrome), переход мгновенный
  if(pre)return;pre=true;
  try{if(!(HTMLScriptElement.supports&&HTMLScriptElement.supports('speculationrules')))return;
    const s=document.createElement('script');s.type='speculationrules';
    s.textContent=JSON.stringify({prerender:[{source:'list',urls:[...m.querySelectorAll('a.svc-it:not([aria-current])')].map(a=>a.href),eagerness:'immediate'}]});
    document.head.appendChild(s)}catch(e){}};
const open=on=>{m.classList.toggle('on',on);m.classList.remove('gone');b.setAttribute('aria-expanded',on?'true':'false');if(on)prerender()};
b.addEventListener('pointerdown',prerender,{passive:true});
b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();open(!m.classList.contains('on'))});
document.addEventListener('pointerdown',e=>{if(m.classList.contains('on')&&!e.target.closest('.svc'))open(false)},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&m.classList.contains('on')){open(false);b.focus()}});
m.addEventListener('click',e=>{const a=e.target.closest('a.svc-it');if(!a)return;e.stopPropagation();
  if(a.hasAttribute('aria-current')){e.preventDefault();open(false);return}
  a.classList.add('go');if(!('onpageswap' in window))setTimeout(()=>m.classList.add('gone'),60)});
addEventListener('pageswap',()=>m.classList.add('gone'));   // снимок для перехода — без открытого списка
addEventListener('pageshow',e=>{if(!e.persisted)return;open(false);m.querySelectorAll('.go').forEach(x=>x.classList.remove('go'))});
/* общая тема: выбрали тему, у которой есть пара в других сервисах, — она и там (Юнитка, Склейки, Конкуренты) */
const TH=[['auto','auto','auto'],['light',null,'light'],['dark','graphite','dark'],['space','space','space'],['jim','jim',null],
  ['farcry','farcry','farcry'],['sonic','sonic','sonic'],['solitaire','solitaire','solitaire'],['birds','birds','birds']],
  KEYS=['unitka.theme','shov.skin','konk.theme'];
window.svcTheme=(i,v)=>{const r=TH.find(x=>x[i]===v);if(!r)return;r.forEach((t,j)=>{if(j!==i&&t)try{localStorage.setItem(KEYS[j],JSON.stringify(t))}catch(e){}})};

  aurora:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 15c3-6 6-8 9-4s6 2 9-4"/><path d="M3 19c3-4 6-5 9-2s6 1 9-3" opacity=".6"/><path d="M17 3.5v2.4M15.8 4.7h2.4"/></svg>',
  space:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="5.2"/><path d="M6.6 14.4C3.4 16.6 2 18.6 2.7 19.6c1.1 1.6 6.4-.6 11.7-4.9s8.6-9.1 7.5-10.6c-.7-1-3.1-.4-6.1 1.4"/><path d="M19 2.5v2.6M17.7 3.8h2.6" stroke-width="1.5"/></svg>'};
const SW={auto:'<svg class="sw" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="#fcfcfb"/><path d="M10 1.4a8.6 8.6 0 0 1 0 17.2Z" fill="#1a1a19"/><circle cx="10" cy="10" r="8.6" fill="none" stroke="#8a8a85" stroke-width="1.2"/></svg>',
  light:'<svg class="sw" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="#fcfcfb" stroke="#8a8a85" stroke-width="1.2"/></svg>',
  dark:'<svg class="sw" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="#1a1a19" stroke="#8a8a85" stroke-width="1.2"/></svg>',
  farcry:'<svg class="sw" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="#2a1d12" stroke="#c8241d" stroke-width="1.6"/><path d="M10 4.6a4.2 4.2 0 0 0-4.2 4.2c0 1.4.7 2.6 1.8 3.2v1.6h1v1.2h2.8V14h1v-1.6c1.1-.6 1.8-1.8 1.8-3.2A4.2 4.2 0 0 0 10 4.6Z" fill="#efe2c0"/><circle cx="8.4" cy="9.2" r=".9" fill="#2a1d12"/><circle cx="11.6" cy="9.2" r=".9" fill="#2a1d12"/></svg>',
  jim:'<svg class="sw" viewBox="0 0 20 20"><defs><linearGradient id="swJim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1263"/><stop offset=".62" stop-color="#d9532c"/><stop offset=".62" stop-color="#7ad321"/></linearGradient></defs><circle cx="10" cy="10" r="8.4" fill="url(#swJim)" stroke="#1a1022" stroke-width="1.6"/><circle cx="8.3" cy="7.6" r="2" fill="#fff" stroke="#1a1022" stroke-width=".8"/><circle cx="11.9" cy="7.6" r="2" fill="#fff" stroke="#1a1022" stroke-width=".8"/><circle cx="8.7" cy="7.8" r=".7" fill="#1a1022"/><circle cx="12.3" cy="7.8" r=".7" fill="#1a1022"/></svg>',
  sonic:'<svg class="sw" viewBox="0 0 20 20"><defs><linearGradient id="swSon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f6efa"/><stop offset=".66" stop-color="#5fb0ff"/><stop offset=".66" stop-color="#3fbf1c"/><stop offset=".76" stop-color="#3fbf1c"/><stop offset=".76" stop-color="#cf6b16"/></linearGradient></defs><circle cx="10" cy="10" r="8.4" fill="url(#swSon)" stroke="#0a1a4a" stroke-width="1.6"/><circle cx="10" cy="8" r="3.4" fill="none" stroke="#ffc81e" stroke-width="1.9"/></svg>',
  solitaire:'<svg class="sw" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="#0b2e1e" stroke="#e8c260" stroke-width="1.4"/><rect x="6.2" y="4.6" width="7.6" height="10.8" rx="1.4" fill="#fffdf6" transform="rotate(-8 10 10)"/><path d="M10 13.2c-.6-.6-2.3-1.6-2.3-2.8 0-.9 1.1-1.4 2.3-.4 1.2-1 2.3-.5 2.3.4 0 1.2-1.7 2.2-2.3 2.8Z" fill="#c41230"/></svg>',

window.svcPicker=o=>{
  const b=document.querySelector(o.btn);if(!b)return null;
  const w=document.createElement('div');w.className='svt';b.replaceWith(w);w.appendChild(b);b.classList.add('svt-btn');
  b.setAttribute('aria-haspopup','menu');b.setAttribute('aria-expanded','false');
  const m=document.createElement('div');m.className='svt-menu';m.setAttribute('role','menu');m.hidden=true;w.appendChild(m);
  let cur=o.cur;
  const draw=()=>{const it=o.list.find(x=>x[0]===cur)||o.list[0],ic=it[3]||it[0];
    b.innerHTML=(IC[ic]||IC.auto)+'<span>'+it[1]+'</span>';b.title='Тема: '+it[1].toLowerCase();
    let g='';m.innerHTML=o.list.map(([k,n,grp,base])=>((grp||'')!==g?(g=grp||'','<div class="tgrp">'+g+'</div>'):'')+
      '<button type="button" role="menuitemradio" aria-checked="'+(k===cur)+'" data-svt="'+k+'">'+((o.sw&&o.sw[k])||SW[base||k]||SW.auto)+n+'</button>').join('')};
  const show=on=>{m.hidden=!on;b.setAttribute('aria-expanded',on?'true':'false')};
  b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();show(m.hidden)});
  m.addEventListener('click',e=>{const x=e.target.closest('[data-svt]');if(!x)return;e.stopPropagation();cur=x.dataset.svt;show(false);draw();o.onPick(cur)});
  document.addEventListener('pointerdown',e=>{if(!m.hidden&&!e.target.closest('.svt'))show(false)},true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!m.hidden){show(false);b.focus()}});
  draw();
  return {set(k){cur=k;draw()},close(){show(false)}};
};
})();

/* данные: расшифровка паролем Юнитки */
// base64 → байты: встроенным fromBase64, где он есть, иначе простым циклом (28.10: Uint8Array.from с функцией на каждый из 3,5 млн знаков — ~1,4 с на телефоне при открытии)
const b64u8=s=>{if(Uint8Array.fromBase64)return Uint8Array.fromBase64(s);const b=atob(s),n=b.length,u=new Uint8Array(n);for(let i=0;i<n;i++)u[i]=b.charCodeAt(i);return u};
let KEY=null,SALT=null;
async function deriveKey(pass,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64u8(salt),iterations:iter},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function decryptFile(name,pass){
  const res=await fetch(name,{cache:'no-cache'});   // сверка с сервером по ETag: не изменились — 3,5 МБ не качаются заново (было ?t= + no-store)
  if(res.status===404)return null;
  if(!res.ok)throw new Error('Данные не загрузились ('+res.status+')');
  const enc=await res.json();
  if(!KEY||SALT!==enc.salt){
    const kc=LS.get('kc',null);
    if(!pass&&kc&&kc.salt===enc.salt)KEY=await crypto.subtle.importKey('raw',b64u8(kc.k),'AES-GCM',false,['decrypt']);
    else{let p=pass||LS.get('pass','');if(!p){try{p=JSON.parse(localStorage.getItem('unitka.pass')||'""')}catch(e){p=''}}if(!p)throw new Error('NEED_PASS');KEY=await deriveKey(p,enc.salt,enc.iter);pass=p}
    SALT=enc.salt;
  }
  let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(enc.iv)},KEY,b64u8(enc.ct))}catch(e){KEY=null;LS.del('kc');throw new Error('BAD_PASS')}
  if(pass){LS.set('pass',pass);try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',KEY));let bin='';raw.forEach(x=>bin+=String.fromCharCode(x));LS.set('kc',{salt:enc.salt,k:btoa(bin)})}catch(e){}}
  return JSON.parse(new TextDecoder().decode(plain));
}

  FIX=new Map();D.items.forEach(it=>it.issues.forEach(x=>FIX.set(x.id,{it,x})));
  ADVFIX=new Map();TASKS=new Map();
  for(const [key,a] of Object.entries(ADV)){const ch=chOfKey(key);
    for(const [fid,v] of Object.entries(a.fixes||{}))ADVFIX.set(fid,v);
    (a.tasks||[]).forEach(t=>{if(t.id)TASKS.set(t.id,{id:t.id,key,ch,kind:'task',t})});
    (a.regroup||[]).forEach(r=>{if(r.id)TASKS.set(r.id,{id:r.id,key,ch,kind:'regroup',t:r})});}
  for(const f of [...S.sel])if(!FIX.has(f)&&!TASKS.has(f))S.sel.delete(f);
}

function ring(score,size=46,sw=5,fs=13){const r=(size-sw)/2,c=2*Math.PI*r,k=cls(score),v=score==null?0:Math.max(0,Math.min(100,score));return `<span class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle class="tr" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}"/><circle class="${k}-s" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-to="${c*(1-v/100)}"/></svg><span class="v ${k}-c" style="font-size:${fs}px">${score==null?'—':Math.round(score)}</span></span>`}
function rings4(subs,size=172){const sw=size*.085,gap=size*.022;let out='',r=size/2-sw/2;for(const k of ['cons','comp','comm','rep']){const v=subs[k],c=2*Math.PI*r;out+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}" style="stroke:${KC[k]};opacity:.16"/>`;if(v!=null)out+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}" stroke-linecap="round" style="stroke:${KC[k]}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-to="${c*(1-Math.max(.005,v/100))}"/>`;r-=sw+gap}return `<span class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}">${out}</svg></span>`}
function animRings(root){const els=$$('circle[data-to]',root);if(RM){els.forEach(e=>e.style.strokeDashoffset=e.dataset.to);return}requestAnimationFrame(()=>requestAnimationFrame(()=>els.forEach((e,i)=>{e.style.transitionDelay=Math.min(i,12)*40+'ms';e.style.strokeDashoffset=e.dataset.to})))}
function animCounts(root){$$('[data-count]',root).forEach(el=>{const to=+el.dataset.count,dec=+(el.dataset.dec||0),f=v=>dec?v.toFixed(dec).replace('.',','):fmt(v);if(RM||!to){el.textContent=f(to);return}const t0=performance.now(),step=t=>{const p=Math.min(1,(t-t0)/1100),e=1-Math.pow(2,-10*p);el.textContent=f(to*(p>=1?1:e));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}

function clustersOf(g){const m=new Map();g.its.forEach(it=>{const k=it.kc||0;if(!m.has(k))m.set(k,[]);m.get(k).push(it)});return [...m.entries()].map(([k,its])=>({k,its,label:(g.kinds&&g.kinds[k]&&g.kinds[k].label)||''}))}
function storyOf(g,cl){
  const its=cl.its;if(its.length<2)return null;const V=sum(its,i=>i.views),O=sum(its,i=>i.orders);if(!V||V<100||O<5)return null;
  const rows=its.map(it=>({it,sv:(it.views||0)/V,so:(it.orders||0)/O}));
  const tv=.5*rows.reduce((a,r)=>a+Math.abs(r.sv-r.so),0);
  const don=rows.filter(r=>r.sv-r.so>.02).sort((a,b)=>(b.sv-b.so)-(a.sv-a.so)).slice(0,3);
  const rec=rows.filter(r=>r.so-r.sv>.02).sort((a,b)=>(b.so-b.sv)-(a.so-a.sv)).slice(0,3);
  const F=sum(rec,r=>r.so-r.sv),flows=[];don.forEach(d=>rec.forEach(r=>{const f=(d.sv-d.so)*(r.so-r.sv)/(F||1);if(f>=.01)flows.push({d,r,f})}));
  return {g,cl,V,O,rows,tv,don,rec,flows};
}
function allStories(gs){const out=[];gs.forEach(g=>clustersOf(g).forEach(cl=>{const s=storyOf(g,cl);if(s&&s.tv>=.06&&s.don.length&&s.rec.length)out.push(s)}));return out.sort((a,b)=>b.tv-a.tv)}

  for(const j of Object.values(S.rjobs||{})){if(j.res&&j.res[fid]){const r=String(j.res[fid]);if(r==='done')return {s:'done'};if(r==='manual')return {s:'manual'};if(r==='agent')return {s:'agent'};if(r.startsWith('stale'))return {s:'stale'};if(r.startsWith('fail'))return {s:'fail',why:r.split(':').slice(1).join(':')}}if(j.status==='applying'&&(j.fixes||[]).includes(fid))return {s:'work'}}
  for(const j of Object.values(S.jobs)){if(j.fixes.includes(fid)&&!['done','rejected'].includes(j.status))return {s:'wait'}}
  return {s:S.sel.has(fid)?'sel':'none'};
}

function tzText(id,es){
  const now=new Date(),dd=String(now.getDate()).padStart(2,'0')+'.'+String(now.getMonth()+1).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const auto=es.filter(e=>e.type==='fix'&&e.x.auto),agent=es.filter(e=>(e.type==='fix'&&!e.x.auto&&isAgent(e.x))||(e.type==='task'&&/сам/i.test(e.T.t.who||''))),rg=es.filter(e=>e.type==='regroup'),people=es.filter(e=>!auto.includes(e)&&!agent.includes(e)&&!rg.includes(e));
  const code='код: shov1 '+id+' '+es.map(e=>e.id).join(' ');
  const L=e=>e.type==='fix'?`• ${CHN[e.ch]} · ${e.it.art} — ${e.x.code==='nb'?'«'+e.x.t+'»: '+e.x.fix:e.x.t+(e.x.fix?': '+e.x.fix:'')}`:`• ${CHN[e.ch]} — ${e.type==='regroup'?({split:'расклеить',merge:'склеить',move:'перенести'}[e.T.t.action]||e.T.t.action)+': '+(e.T.t.arts||[]).join(', ')+(e.T.t.to?' → '+e.T.t.to:''):e.T.t.title}`;
  const head=[`🧵 Склейки · ТЗ №${id} на согласование`,`С сайта ${dd} · пунктов: ${es.length}`];
  const tail=['','После «Согласовать»: правки «внесу сам» — с копией карточки и перепроверкой; задачи для «К» — передам ему; остальное — списком людям. Итог пришлю сюда.','',code];
  const budget=3900-head.join('\n').length-tail.join('\n').length,body=[];let used=0,cut=0;
  const push=(arr,title)=>{if(!arr.length)return;const t='\n'+title;if(used+t.length<budget){body.push(t);used+=t.length+1}arr.forEach(e=>{const l=L(e);if(used+l.length+1<budget){body.push(l);used+=l.length+1}else cut++})};
  push(auto,`✅ Внесу сам (${auto.length}):`);push(agent,`🧠 Сделает «К» (${agent.length}):`);push(rg,`🧵 Пересклейки (${rg.length}):`);push(people,`✋ Нужен человек (${people.length}):`);
  if(cut)body.push(`…и ещё ${cut} — полный список на сайте`);
  return head.concat(body,tail).join('\n');
}

function burst(n){if(RM)return;const cv=$('#confetti'),c=cv.getContext('2d');cv.hidden=false;cv.width=innerWidth;cv.height=innerHeight;const cs=getComputedStyle(document.documentElement),cols=['--r1','--r2','--r3','--r4','--accent'].map(v=>cs.getPropertyValue(v).trim()||'#f0a');const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.62,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));let t0=performance.now();const step=t=>{const dt=Math.min(32,t-t0)/16;t0=t;c.clearRect(0,0,cv.width,cv.height);let alive=0;ps.forEach(p=>{p.vy+=.45*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.y<cv.height+20){alive++;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);c.restore()}});if(alive)requestAnimationFrame(step);else cv.hidden=true};requestAnimationFrame(step)}

const RINGX={cons:'<b>Согласованность</b> — склейка собрана правильно: в ней один и тот же товар, у вариантов общий бренд и категория, и покупатель может отличить варианты (цвет, размер, объём). Падает от чужого товара, одинаковых вариантов и опечаток в общих полях.',comp:'<b>Комплектность</b> — карточки заполнены: характеристики, фото, описание, а на Ozon и Маркете — их собственный рейтинг контента.',comm:'<b>Коммерция</b> — склейка продаёт: есть остаток, цены продавца в ряду, в корзину и в заказ идут не хуже соседей, товар на витрине.',rep:'<b>Репутация</b> — средний рейтинг по отзывам с учётом заказов. WB и Маркет отдают отзывы, а Ozon — только по подписке Premium Plus, поэтому у Ozon кольцо пустое. У 24fosfor Ozon и Маркета нет вовсе.'};

 {v:'obzor',sel:'.ins',t:'Главное сейчас',d:'Сюда выношу то, что стоит денег сегодня: предложения аналитика, склейки с чужими товарами, закончившиеся продающие варианты, правки, которые внесу сам. Каждая карточка открывает ровно то место, где это разбирать.'},
 {v:'obzor',sel:'#sankey',t:'Откуда заказы',d:'Слева магазины, справа склейки с фото того, кто в них тащит продажи. Чем шире лента, тем больше заказов за 30 дней. Нажмите на склейку справа — откроется её разбор.'},
 {v:'skleyki',sel:'.ggrid .gt',t:'Плитка склейки',d:'Спереди — фото лидера, рядом написано, сколько заказов он даёт и сколько его осталось. Метки «разные товары», «без остатка», «склеено по-разному» и «предложения аналитика» сразу показывают, где беда. Цветная полоска — как делятся заказы между вариантами.'},
 {v:'skleyki',open:true,sel:'#car',t:'Варианты в 3D',d:'Лидер в центре, остальные по продажам слева и справа. Листайте пальцем или стрелками. Под каждым вариантом — цена продавца, остаток как в кабинете и две кнопки со значками: <b>Витрина</b> и <b>Кабинет</b> — сразу внутрь карточки в ЛК.'},
 {v:'skleyki',open:true,sel:'#sbody .panel',t:'Разбор аналитика',d:'По каждой склейке модель Opus 5.5 с максимальным усилием прочитала цифры, характеристики и все отзывы и написала простыми словами: кто тащит и почему, в чём главная беда и что делать первым. Это не шаблон — у каждой склейки свой текст.'},
 {v:'skleyki',open:true,sel:'.st3',t:'Живой перелив',d:'Слева стоят варианты, которые смотрят, справа — которые покупают. Светящиеся точки — покупатели, они летят туда, где в итоге покупают. Потяните сцену, чтобы повернуть, наведите на карточку — подсвечу её потоки. «Перелив N п.п.» с вопросиком объясняет цифру.'},
 {v:'skleyki',open:true,sel:'.mx',t:'Таблица вариантов',d:'Чем варианты отличаются (ячейка, длина, цвет), цена продавца, остаток, конверсия, отзывы. Красная строка — покупатель не отличит этот вариант от соседа.'},
 {v:'skleyki',open:true,sel:'.acc',t:'Что поправить — с объяснением',d:'У каждой правки четыре строки: <b>почему</b> это важно именно здесь, <b>на что смотреть</b> перед согласием, <b>что даст</b> и <b>что сделаю</b>. Метки: «внесу сам» — впишу через кабинет; «сделает К» — слайды, тексты, характеристики; «нужен человек» — поставки и цены.'},
 {v:'perelivy',close:true,sel:'.story',t:'Переливы',d:'Все склейки, где спрос заметно перетекает между вариантами, — с 3D-сценой и выводом аналитика: на какой вариант давать рекламу и чьё фото ставить главным. Разные товары между собой не сравниваю.'},
 {v:'sdelat',sel:'.steps',t:'Что сделать — пульт',d:'Сначала предложения аналитика, потом все замечания по магазинам и по смыслу. Отмечайте всё сразу, целый тип или по одной правке на товар.'},
 {v:'sdelat',sel:'.chs .ty',t:'Предложения аналитика',d:'Задачи, которые не сводятся к одному полю: «срочно довезти 4х4», «слайды в NeuralBox против жалобы «тонкий металл»», «переписать описание». У каждой — почему, план по шагам и кто сделает.'},
 {v:'sdelat',sel:'#selbar',demo:true,t:'Корзина',d:'Как только что-то отмечено, внизу появляется корзина. В ней видно всё выбранное по товарам, и рядом снова написано, почему, — чтобы перечитать. Лишнее убирается крестиком.'},
 {v:'sdelat',sel:'#selbar',demo:true,t:'Решить',d:'В корзине ставите галочку <b>«Я изучил каждый пункт»</b> и жмёте «Решить». ТЗ приходит вам в «К» с кнопками «Согласовать» и «Отменить». После «Согласовать» вношу правки с копией карточки, проверяю, отдаю задачи «К» — а галочки здесь встают сами, с анимацией.'},
 {v:'skleit',sel:'.hint',t:'Пересклейки',d:'Что склеить, расклеить или перенести — с обоснованием и риском. Тут же видно, где на площадках склеено по-разному и какие одиночки похожи на варианты одного товара.'},
 {v:'skleit',sel:'#skinbtn',t:'Темы',d:'Как в системе, Графит; весёлые — <b>Far Cry 3</b>, <b>Червяк Джим</b>, <b>Соник</b>, <b>Пасьянс</b> и <b>Angry Birds</b> с играми на баннере, как в Юнитке; спокойные — Аврора и <b>Космос</b> с аффирмациями и музыкой. Тема переносится в Юнитку и Конкуренты, где есть такая же.'},
 {v:'obzor',t:'Готово!',d:'Начните с «Главное сейчас» на обзоре — там самое дорогое. Триал всегда можно пройти снова кнопкой «Триал»: её цвет уходит по мере прохождения.'}
];
let TR=null,tourDemo=false;
function tourStart(){tourEnd(true);TR={i:-1};const dim=document.createElement('div');dim.className='tour-dim';const spot=document.createElement('div');spot.className='tour-spot';const tip=document.createElement('div');tip.className='tour-tip';document.body.append(dim,spot,tip);TR.nodes={dim,spot,tip};
  tip.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!TR)return;const a=b.dataset.tour;if(a==='next')tourGo(TR.i+1,1);if(a==='prev')tourGo(TR.i-1,-1);if(a==='end')tourEnd()});tourGo(0,1)}
function tourGo(i,dir){
  if(!TR)return;if(i<0)i=0;if(i>=TOUR.length){tourMark(1);tourEnd();toast('Триал пройден. Его всегда можно открыть снова.');return}
  const s=TOUR[i];TR.i=i;
  if(s.close&&sheetCtx)closeSheet();
  if(s.v&&S.view!==s.v){if(sheetCtx)closeSheet();S.view=s.v;render();window.scrollTo(0,0)}
  if(s.open&&!sheetCtx){const g=filterGroups()[0];if(g)openGroup(g.key)}
  if(!s.open&&sheetCtx&&!s.close&&s.v!=='skleyki')closeSheet();
  if(s.demo&&!S.sel.size){const f=[...FIX.values()].find(r=>r.x.auto&&inMp(r.it));if(f){S.sel.add(f.x.id);tourDemo=true;renderSelbar()}}
  setTimeout(()=>{if(!TR)return;TR.el=s.sel?$$(s.sel).find(el=>el.getClientRects().length):null;tourShow(s)},s.open||s.v?450:80);
}
function tourShow(s){const n=TOUR.length,i=TR.i,{tip}=TR.nodes;tip.innerHTML=`<button class="tour-x" data-tour="end" aria-label="Закрыть">✕</button><div class="tn">Триал · ${i+1} из ${n}</div><h4>${s.t}</h4><p>${s.d}</p><div class="tbar"><i style="width:${((i+1)/n*100).toFixed(1)}%"></i></div><div class="tf">${i>0?'<button class="btn ghost" data-tour="prev">Назад</button>':''}<button class="btn" data-tour="next">${i===n-1?'Готово':'Далее'}</button></div>`;
  tourMark((i+1)/n);if(TR.el&&!TR.el.closest('.hdr,.selbar'))TR.el.scrollIntoView({block:'center',behavior:'instant'});tourPlace();setTimeout(tourPlace,150);setTimeout(tourPlace,450)}
function tourPlace(){if(!TR||!TR.nodes)return;const {spot,tip}=TR.nodes,vw=innerWidth,vh=innerHeight,w=tip.offsetWidth,h=tip.offsetHeight;
  if(!TR.el){spot.style.cssText='top:50%;left:50%;width:0;height:0';tip.style.left=Math.round((vw-w)/2)+'px';tip.style.top=Math.round(Math.max(20,(vh-h)/2))+'px';return}
  const r=TR.el.getBoundingClientRect(),p=6,top=Math.max(4,r.top-p),left=Math.max(4,r.left-p),bottom=Math.min(vh-4,r.bottom+p),right=Math.min(vw-4,r.right+p);
  spot.style.cssText=`top:${top}px;left:${left}px;width:${right-left}px;height:${Math.max(10,bottom-top)}px`;
  let ty=bottom+12;if(ty+h>vh-8){ty=top-12-h;if(ty<8)ty=Math.max(8,vh-h-12)}tip.style.top=Math.round(ty)+'px';tip.style.left=Math.round(Math.min(Math.max(12,(left+right)/2-w/2),vw-w-12))+'px'}
function tourEnd(silent){if(!TR)return;Object.values(TR.nodes||{}).forEach(n=>n.remove());TR=null;if(tourDemo){S.sel.clear();saveSel();tourDemo=false;renderSelbar()}}
function tourMark(p){if(p>LS.get('tourMax',0))LS.set('tourMax',p);tourPaint()}
function tourPaint(){const done=Math.min(1,LS.get('tourMax',0));$('#trialbtn').style.setProperty('--tg',(1-done).toFixed(3));$('#trialbtn').title=done<1?`Триал пройден на ${Math.round(done*100)}%`:'Триал пройден'}
addEventListener('resize',()=>TR&&tourPlace());addEventListener('scroll',()=>TR&&tourPlace(),true);

/* тост */
let tt;function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}

/* события */
document.addEventListener('pointerdown',e=>{
  if($('#pop').classList.contains('open')&&!e.target.closest('#pop,#skinbtn'))togglePop(false);  // всплывашки закрываются нажатием в сторону
  if(tipOwner&&!e.target.closest('[data-tip],#tipbox'))hideTip();
},true);
document.addEventListener('change',e=>{if(e.target.id==='iread'){const b=$('[data-send]');if(b)b.disabled=!e.target.checked}});
document.addEventListener('click',e=>{
  if(TR&&!e.target.closest('.tour-tip'))return;
  if(e.target.closest('.st3')&&!e.target.closest('[data-tip]'))return;  // 3D-сцену крутят, а не открывают
  const t=e.target.closest('[data-tip],[data-go],[data-open],[data-item],[data-seg],[data-sort],[data-gf],[data-pf],[data-sel],[data-unsel],[data-selall],[data-acc],[data-tyt],[data-more],.skin[data-skin],[data-mp],[data-ins],[data-ring],[data-resolve],[data-clr],[data-send],[data-close],[data-car],[data-trial],[data-introhide],#jobpill,.lk,.nd');
  if(!t)return;
  if(t.dataset.tip!=null){e.stopPropagation();e.preventDefault();tipOwner===t?hideTip():showTip(t);return}
  if(t.dataset.sel!=null){e.stopPropagation();if(t.dataset.locked){toast('Этот пункт уже в работе или сделан');return}toggleSel(t.dataset.sel);t.classList.toggle('on',S.sel.has(t.dataset.sel));t.classList.add('pop');setTimeout(()=>t.classList.remove('pop'),700);buzz();renderSelbar();renderChrome();return}
  if(t.dataset.unsel!=null){S.sel.delete(t.dataset.unsel);saveSel();refreshSheet();refreshMarks();if(!S.sel.size)closeSheet();return}
  if(t.dataset.selall!=null){selAll(t.dataset.selall);return}
  if(t.dataset.go){closeSheet();togglePop(false);go(t.dataset.go);return}
  if(t.dataset.open){openGroup(t.dataset.open);return}
  if(t.dataset.item){openItem(t.dataset.item);return}
  if(t.dataset.seg){S.mp=t.dataset.seg;LS.set('mp',S.mp);$$('#seg button').forEach(b=>b.classList.toggle('on',b===t));moveThumb();buzz();requestAnimationFrame(()=>render());return}
  if(t.dataset.mp){S.mp=t.dataset.mp;LS.set('mp',S.mp);go('skleyki');return}
  if(t.dataset.sort){S.sort=t.dataset.sort;render();return}
  if(t.dataset.gf){S.gf=t.dataset.gf;render();return}
  if(t.dataset.pf){S.pf=t.dataset.pf;render();return}
  if(t.dataset.ins){const c=JSON.parse(t.dataset.ins);if(c.gf)S.gf=c.gf;if(c.pf)S.pf=c.pf;if(c.focus)S.focus=c.focus;go(c.go);return}
  if(t.dataset.acc!=null){t.parentElement.classList.toggle('open');buzz();return}
  if(t.dataset.tyt){const k=t.dataset.tyt;S.openTy.has(k)?S.openTy.delete(k):S.openTy.add(k);t.closest('.ty').classList.toggle('open');buzz();return}
  if(t.dataset.more){S.lim[t.dataset.more]=(S.lim[t.dataset.more]||10)+30;S.openTy.add(t.dataset.more);rerenderView();return}
  if(t.dataset.ring){t.dataset.tip=RINGX[t.dataset.ring];showTip(t);return}
  if(t.dataset.resolve!=null){openResolve();return}
  if(t.dataset.clr!=null){S.sel.clear();saveSel();refreshMarks();if(S.view==='sdelat')rerenderView();return}
  if(t.dataset.send!=null){sendJob();return}
  if(t.dataset.close!=null){closeSheet();return}
  if(t.dataset.car){const sb=$('#sbody');sb._car&&sb._car(+t.dataset.car);return}
  if(t.dataset.trial!=null){tourStart();return}
  if(t.dataset.introhide!=null){LS.set('introHide',true);$('#intro')?.remove();return}
  if(t.id==='jobpill'){const id=t.dataset.job;openSheet('<div class="k">ТЗ №'+id+'</div><div class="t">Статус</div>',vJob(id),{job:id});return}
  if(t.classList.contains('lk')||t.classList.contains('nd')){const k=t.dataset.t;if(k&&GK.has(k))openGroup(k);return}
},true);
function selAll(scope){
  let ids=[];
  if(scope==='all'){ids=rowsFor().map(r=>r.x.id);if(S.pf==='all'||S.pf==='tasks')CHS.filter(c=>S.mp==='all'||c===S.mp).forEach(c=>tasksFor(c).forEach(T=>ids.push(T.id)))}
  else ids=rowsFor().filter(r=>(r.it.ch+':'+r.x.code)===scope).map(r=>r.x.id);
  const free=ids.filter(id=>['none','sel'].includes(fixState(id).s)),on=!free.every(id=>S.sel.has(id));free.forEach(id=>toggleSel(id,on));buzz();rerenderView();refreshMarks();toast(on?`В корзине +${free.length}`:'Выбор снят');
}
function rerenderView(){const y=scrollY;render();window.scrollTo({top:y})}
$('#sheetx').innerHTML=ICON.x;
PICK=svcPicker({btn:'#skinbtn',list:SKINS,cur:S.skin,sw:SKIN_SW,onPick:k=>{applySkin(k,true);buzz();svcTheme(1,k);if(S.view==='obzor'&&D)rerenderView()}});
$('#trialbtn').addEventListener('click',()=>tourStart());
$('#sheetx').addEventListener('click',closeSheet);$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(TR){if(e.key==='Escape')tourEnd();else if(e.key==='ArrowRight')tourGo(TR.i+1,1);else if(e.key==='ArrowLeft')tourGo(TR.i-1,-1);return}if(e.key==='Escape'){if($('#pop').classList.contains('open'))togglePop(false);else if(tipOwner)hideTip();else closeSheet()}});
let qt;document.addEventListener('input',e=>{if(e.target.id!=='q')return;S.q=e.target.value;clearTimeout(qt);qt=setTimeout(()=>{const pos=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}},220)});
let rt,lastW=innerWidth;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{hh();moveThumb(false);if(innerWidth===lastW)return;lastW=innerWidth;const sk=$('#sankey');if(sk){sankeyOverview(sk);$('svg',sk)&&($('svg',sk).style.animation='none')}},150)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Object.values(S.jobs).some(j=>!['done','rejected'].includes(j.status)))pollJobs()});
new ResizeObserver(hh).observe($('#hdr'));

/* запуск */
function showLock(msg){const l=$('#lock');l.hidden=false;$('#boot').style.opacity=0;setTimeout(()=>$('#boot').hidden=true,500);
  l.innerHTML=`<div class="panel"><div style="display:flex;justify-content:center">${ICON.logo.replace('width="30" height="30"','width="54" height="54"')}</div><h2 class="h2">Склейки</h2><p style="margin:0;color:var(--ink2)">Введите пароль — тот же, что в Юнитке.</p><input id="pw" type="password" autocomplete="current-password" placeholder="пароль"><button class="btn" id="pwgo">Открыть</button><div class="err" id="pwerr">${msg==='BAD_PASS'?'Пароль не подошёл':''}</div></div>`;
  const tryIt=async()=>{const p=$('#pw').value.trim();if(!p)return;$('#pwerr').textContent='Открываю…';try{const d=await decryptFile('data.enc.json',p);l.hidden=true;start(d)}catch(e){$('#pwerr').textContent=e.message==='BAD_PASS'?'Пароль не подошёл':e.message}};
  $('#pwgo').onclick=tryIt;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryIt()});setTimeout(()=>$('#pw').focus(),100)}
function start(d){prepare(d);applySkin(S.skin,false);const h=(location.hash||'').slice(1);S.view=VIEWS.some(v=>v[0]===h)?h:'obzor';render();hh();tourPaint();
  const b=$('#boot');b.style.opacity=0;setTimeout(()=>b.hidden=true,500);pollJobs();
  if(LS.get('tourMax',0)<1&&!LS.get('introHide',false))setTimeout(()=>toast('Впервые здесь? Нажмите «Триал» — покажу всё за 2 минуты'),1400);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{moveThumb(false);hh()})}
(async()=>{applySkin(S.skin,false);hh();tourPaint();try{const d=await decryptFile('data.enc.json');if(!d)throw new Error('Данные ещё не выложены');start(d)}catch(e){if(e.message==='NEED_PASS'||e.message==='BAD_PASS')showLock(e.message);else $('#boot').innerHTML='<div style="text-align:center;max-width:360px;padding:20px;margin:40px auto">Не удалось открыть данные: '+esc(e.message)+'<br><br><button class="btn" onclick="location.reload()">Обновить</button></div>'}})();
})();
</script>
